<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="חלון העבודה של קישוטי שוקולד: שוקולד מטומפר נוזלי פורסים, מזלפים ומסרקים; כשהוא עמום ויבש למגע מגלגלים, חותכים, עוטפים ומגרדים מניפות; כשהוא קשה לגמרי מקלפים את האצטט ומאחסנים, ומגוש קשה מוציאים שבבים במקלף">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">חלון העבודה: מה עושים בכל שלב של השוקולד</text>
  <text x="380" y="58" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">שוקולד מטומפר, שכבה של 1-3 מ"מ, חדר של 18-22°C. בחדר חם יותר כל החלונות מתארכים, ובחום של 26°C ומעלה השוקולד כמעט לא מתקשה</text>

  <!-- time arrow, right to left -->
  <line x1="720" y1="96" x2="48" y2="96" stroke="#222222" stroke-width="2.5"/>
  <polygon points="40,96 54,89 54,103" fill="#222222"/>
  <text x="712" y="86" font-size="13" fill="#222222" text-anchor="end" direction="rtl">פורסים</text>
  <text x="56" y="86" font-size="13" fill="#222222" text-anchor="start" direction="rtl">הזמן עובר</text>

  <!-- stage 1 (right): liquid -->
  <rect x="512" y="116" width="216" height="300" rx="10" fill="#fdf3e6" stroke="#5a3214" stroke-width="2.5"/>
  <text x="620" y="146" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">1. נוזלי ומבריק</text>
  <text x="620" y="168" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">0-2 דקות</text>
  <path d="M540 196 Q580 186 620 196 T700 196 L700 214 L540 214 Z" fill="#5a3214"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="620" y="246">פורסים בספטולה</text>
    <text x="620" y="268">מזלפים בקורנט</text>
    <text x="620" y="290">מעבירים מסרק</text>
    <text x="620" y="312">מניחים טרנספר</text>
  </g>
  <g font-size="12" fill="#8a1f11" text-anchor="middle" direction="rtl">
    <text x="620" y="352">לא חותכים ולא מגלגלים:</text>
    <text x="620" y="370">השוקולד זורם ונסגר אחרי הסכין</text>
  </g>

  <!-- stage 2 (middle): matte, touch dry -->
  <rect x="272" y="116" width="216" height="300" rx="10" fill="#fff8d6" stroke="#1f4e79" stroke-width="3.5"/>
  <text x="380" y="146" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">2. עמום ויבש למגע</text>
  <text x="380" y="168" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">בערך 2-5 דקות</text>
  <rect x="300" y="196" width="160" height="18" fill="#7a4a26"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl" font-weight="bold">
    <text x="380" y="246">החלון של המודול הזה</text>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="380" y="270">מגלגלים ספירלות על אצטט</text>
    <text x="380" y="292">חותכים פסים וצורות</text>
    <text x="380" y="314">עוטפים צווארון סביב עוגה</text>
    <text x="380" y="336">מגרדים מניפות וסיגריות</text>
  </g>
  <g font-size="12" fill="#1f4e79" text-anchor="middle" direction="rtl">
    <text x="380" y="372">בדיקה: האצבע לא נדבקת,</text>
    <text x="380" y="390">והשוקולד מתכופף בלי להישבר</text>
  </g>

  <!-- stage 3 (left): fully set -->
  <rect x="32" y="116" width="216" height="300" rx="10" fill="#eef1f4" stroke="#222222" stroke-width="2.5"/>
  <text x="140" y="146" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">3. קשה לגמרי</text>
  <text x="140" y="168" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">אחרי 20-30 דקות</text>
  <rect x="60" y="196" width="160" height="18" fill="#3b2010"/>
  <polyline points="120,196 128,206 122,214" fill="none" stroke="#ffffff" stroke-width="2"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="140" y="246">מקלפים את האצטט</text>
    <text x="140" y="268">שוברים שברים</text>
    <text x="140" y="290">מאחסנים בקופסה סגורה</text>
    <text x="140" y="312">שבבים במקלף מגוש</text>
  </g>
  <g font-size="12" fill="#8a1f11" text-anchor="middle" direction="rtl">
    <text x="140" y="352">לא מגלגלים ולא חותכים:</text>
    <text x="140" y="370">השוקולד שביר ונסדק</text>
  </g>

  <text x="380" y="444" font-size="12" fill="#333333" text-anchor="middle" direction="rtl">פספסתם את החלון? מחממים מעט (כף יד, שנייה של מייבש שיער) או ממיסים, מטמפרים שוב ומתחילים מחדש</text>
</svg>
