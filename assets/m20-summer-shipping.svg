<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, 'Noto Sans Hebrew', sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" direction="rtl" font-size="23" font-weight="bold" fill="#1a1a1a">כלל הקיץ של הקורס: איך יוצא מארז שוקולד מוצק</text>
  <text x="450" y="60" text-anchor="middle" direction="rtl" font-size="14" fill="#333333">לפי הטמפרטורה המרבית בתחזית, במקום החם מבין נקודת היציאה והיעד. כלל אצבע של הקורס, לא נתון של יצרן.</text>

  <!-- header row -->
  <rect x="20" y="80" width="860" height="44" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="790" y="108" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1a1a1a">תחזית מרבית</text>
  <text x="620" y="108" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1a1a1a">איסוף עצמי</text>
  <text x="455" y="100" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1a1a1a">אזור א: אתם מוסרים</text>
  <text x="455" y="118" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">ברכב ממוזג, עד 30 דקות</text>
  <text x="290" y="100" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1a1a1a">אזור ב: שליח</text>
  <text x="290" y="118" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">באותו יום</text>
  <text x="120" y="100" text-anchor="middle" direction="rtl" font-size="15" font-weight="bold" fill="#1a1a1a">אזור ג: חבילה</text>
  <text x="120" y="118" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">יום עסקים או יותר</text>

  <!-- green row -->
  <rect x="20" y="124" width="860" height="110" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="710" y="124" width="170" height="110" fill="#e3f1e3" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="795" y="165" text-anchor="middle" direction="rtl" font-size="17" font-weight="bold" fill="#1b5e20">ירוק</text>
  <text x="795" y="190" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">מתחת ל־25°C</text>
  <text x="795" y="210" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">בדרך כלל נובמבר-מרץ</text>
  <text x="620" y="175" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן</text>
  <text x="455" y="175" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן, קרטון רגיל</text>
  <text x="290" y="175" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן, קרטון רגיל</text>
  <text x="120" y="165" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן, קרטון רגיל</text>
  <text x="120" y="187" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">לא שולחים ביום חמישי</text>
  <text x="120" y="205" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">או לפני חג</text>

  <!-- yellow row -->
  <rect x="20" y="234" width="860" height="120" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="710" y="234" width="170" height="120" fill="#fff3cd" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="795" y="275" text-anchor="middle" direction="rtl" font-size="17" font-weight="bold" fill="#7a5a00">צהוב</text>
  <text x="795" y="300" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">25-32°C</text>
  <text x="795" y="320" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">וכל אפריל-אוקטובר</text>
  <text x="620" y="285" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן, מוסרים</text>
  <text x="620" y="305" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">מהחדר הקריר</text>
  <text x="455" y="285" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">קופסה מבודדת</text>
  <text x="455" y="305" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">וקרחון עטוף</text>
  <text x="290" y="280" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">קופסה מבודדת וקרחון</text>
  <text x="290" y="300" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">איסוף בבוקר,</text>
  <text x="290" y="320" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">מסירה עד הצהריים</text>
  <text x="120" y="295" text-anchor="middle" direction="rtl" font-size="16" font-weight="bold" fill="#8b1a1a">לא שולחים</text>

  <!-- red row -->
  <rect x="20" y="354" width="860" height="110" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="710" y="354" width="170" height="110" fill="#f8d7da" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="795" y="395" text-anchor="middle" direction="rtl" font-size="17" font-weight="bold" fill="#8b1a1a">אדום</text>
  <text x="795" y="420" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">33°C ומעלה, שרב</text>
  <text x="795" y="440" text-anchor="middle" direction="rtl" font-size="12" fill="#1a1a1a">צורה V נמסה ב־33.8°C</text>
  <text x="620" y="400" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">כן, בתיאום,</text>
  <text x="620" y="420" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">לרכב ממוזג</text>
  <text x="455" y="400" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">רק לפני 10:00,</text>
  <text x="455" y="420" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">קופסה מבודדת וקרחון</text>
  <text x="290" y="405" text-anchor="middle" direction="rtl" font-size="16" font-weight="bold" fill="#8b1a1a">דוחים</text>
  <text x="120" y="405" text-anchor="middle" direction="rtl" font-size="16" font-weight="bold" fill="#8b1a1a">לא שולחים</text>

  <!-- column lines -->
  <line x1="710" y1="80" x2="710" y2="464" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="535" y1="80" x2="535" y2="464" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="375" y1="80" x2="375" y2="464" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="80" x2="210" y2="464" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- footer -->
  <rect x="20" y="482" width="860" height="62" rx="8" fill="#eef2f7" stroke="#1d3f7a" stroke-width="2"/>
  <text x="450" y="507" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#1d3f7a">מוצרים עם שמנת או פרי טרי (קבוצה ג), כל השנה: רק איסוף עצמי או מסירה ביד</text>
  <text x="450" y="530" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">בצידנית עם קרחון עטוף, עד שעתיים מחוץ למקרר בסך הכול (שעה מעל 32°C). לא בשליח ולא בחבילה.</text>
</svg>
