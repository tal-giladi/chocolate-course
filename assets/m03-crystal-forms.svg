<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="שש צורות הקריסטל של חמאת קקאו ונקודות ההתכה שלהן">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="32" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">שש צורות הקריסטל של חמאת קקאו: נקודת התכה</text>
  <text x="360" y="54" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">ערכים לפי Wille ו־Lutton (1966); במחקרים אחרים 1-3°C פחות</text>
  <!-- working band 28-32 C : x(t)=60+(t-15)*24.8 -->
  <rect x="382" y="70" width="99" height="230" fill="#e3f1df" stroke="#2f6b2f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="431" y="88" font-size="13" font-weight="bold" fill="#1f4d1f" text-anchor="middle" direction="rtl">טווח עבודה</text>
  <text x="431" y="104" font-size="13" fill="#1f4d1f" text-anchor="middle" direction="rtl">28-32°C</text>
  <!-- axis -->
  <line x1="60" y1="300" x2="680" y2="300" stroke="#222222" stroke-width="2"/>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <line x1="60" y1="300" x2="60" y2="306" stroke="#222222"/><text x="60" y="322">15</text>
    <line x1="184" y1="300" x2="184" y2="306" stroke="#222222"/><text x="184" y="322">20</text>
    <line x1="308" y1="300" x2="308" y2="306" stroke="#222222"/><text x="308" y="322">25</text>
    <line x1="432" y1="300" x2="432" y2="306" stroke="#222222"/><text x="432" y="322">30</text>
    <line x1="556" y1="300" x2="556" y2="306" stroke="#222222"/><text x="556" y="322">35</text>
    <line x1="680" y1="300" x2="680" y2="306" stroke="#222222"/><text x="680" y="322">40</text>
  </g>
  <text x="370" y="342" font-size="13" fill="#222222" text-anchor="middle" direction="rtl">טמפרטורה (°C)</text>
  <!-- forms: bars, height grows with stability -->
  <g stroke="#222222" stroke-width="1.5">
    <rect x="107" y="260" width="20" height="40" fill="#cfcfcf"/>
    <rect x="256" y="245" width="20" height="55" fill="#cfcfcf"/>
    <rect x="310" y="230" width="20" height="70" fill="#cfcfcf"/>
    <rect x="360" y="215" width="20" height="85" fill="#cfcfcf"/>
    <rect x="516" y="160" width="20" height="140" fill="#c8862a"/>
    <rect x="578" y="140" width="20" height="160" fill="#7a4a1e"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="117" y="252">I · 17.3°</text>
    <text x="266" y="237">II · 23.3°</text>
    <text x="320" y="222" dx="-6">III · 25.5°</text>
    <text x="370" y="207" dx="4">IV · 27.5°</text>
    <text x="526" y="152" font-weight="bold">V · 33.8°</text>
    <text x="588" y="132">VI · 36.3°</text>
  </g>
  <!-- legend -->
  <g font-size="13" fill="#111111" text-anchor="end" direction="rtl">
    <rect x="670" y="360" width="14" height="14" fill="#cfcfcf" stroke="#222222"/>
    <text x="662" y="372">I-IV: לא יציבות. שוקולד רך, עמום, נמס ביד</text>
    <rect x="670" y="380" width="14" height="14" fill="#c8862a" stroke="#222222"/>
    <text x="662" y="392">V: המטרה. ברק, סנאפ, יוצא מהתבנית</text>
    <rect x="300" y="360" width="14" height="14" fill="#7a4a1e" stroke="#222222"/>
    <text x="292" y="372">VI: נוצרת לאט באחסון</text>
    <text x="292" y="392">וקשורה לפריחת שומן</text>
  </g>
</svg>
