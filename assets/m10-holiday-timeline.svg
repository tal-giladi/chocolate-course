<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="לוח זמנים לפני כל חג: חנוכה מתחילה שמונה שבועות לפני בהזמנת תבנית, פסח חמישה עד שישה שבועות לפני בקניית חומרי גלם כשרים לפסח, אירוע ארבעה שבועות לפני בטעימה, ושאר החגים שבועיים עד שלושה לפני; הייצור עצמו בשבוע האחרון">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">מתי מתחילים: שבועות לפני כל חג</text>
  <text x="400" y="58" font-size="13" fill="#333333" text-anchor="middle" direction="rtl">הזמן זורם מימין לשמאל, עד החג. רצועה בהירה: קנייה ותכנון. רצועה כהה: ייצור ואריזה</text>

  <!-- grid: x = 110 + weeks * 71.25 -->
  <g stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4">
    <line x1="680" y1="80" x2="680" y2="452"/>
    <line x1="537.5" y1="80" x2="537.5" y2="452"/>
    <line x1="395" y1="80" x2="395" y2="452"/>
    <line x1="252.5" y1="80" x2="252.5" y2="452"/>
    <line x1="181.25" y1="80" x2="181.25" y2="452"/>
  </g>
  <line x1="110" y1="80" x2="110" y2="452" stroke="#8a1f11" stroke-width="3"/>

  <!-- row labels -->
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="745" y="124">חנוכה</text>
    <text x="745" y="182">ט״ו בשבט</text>
    <text x="745" y="240">פורים</text>
    <text x="745" y="298">פסח</text>
    <text x="745" y="356">ראש השנה</text>
    <text x="745" y="414">אירוע</text>
  </g>

  <!-- bars -->
  <g stroke="#3b2210" stroke-width="1.5">
    <rect x="573" y="110" width="107" height="18" fill="#f3dfc6"/>
    <rect x="181.25" y="110" width="142.5" height="18" fill="#7a4a24"/>
    <rect x="110" y="110" width="71.25" height="18" fill="#3b2210"/>

    <rect x="181.25" y="168" width="71.25" height="18" fill="#f3dfc6"/>
    <rect x="110" y="168" width="42.75" height="18" fill="#3b2210"/>

    <rect x="252.5" y="226" width="71.25" height="18" fill="#f3dfc6"/>
    <rect x="117" y="226" width="64.25" height="18" fill="#3b2210"/>

    <rect x="323.75" y="284" width="213.75" height="18" fill="#f3dfc6"/>
    <rect x="110" y="284" width="71.25" height="18" fill="#3b2210"/>

    <rect x="252.5" y="342" width="71.25" height="18" fill="#f3dfc6"/>
    <rect x="131" y="342" width="50.25" height="18" fill="#3b2210"/>

    <rect x="323.75" y="400" width="71.25" height="18" fill="#f3dfc6"/>
    <rect x="217" y="400" width="35.5" height="18" fill="#f3dfc6"/>
    <rect x="117" y="400" width="43" height="18" fill="#3b2210"/>
  </g>

  <!-- bar labels (above bars) -->
  <g font-size="12" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="626" y="104">תבנית סביבון מחו״ל</text>
    <text x="252" y="104">מטבעות, חנוכייה</text>
    <text x="146" y="104">סביבונים, אריזה</text>

    <text x="217" y="162">חומרי גלם, טבלה</text>
    <text x="131" y="162">תמרים</text>

    <text x="288" y="220">תכנון ותוויות</text>
    <text x="149" y="220">ייצור, אריזה</text>

    <text x="430" y="278">חומרי גלם כשרים לפסח</text>
    <text x="146" y="278">ייצור במטבח מוכן</text>

    <text x="288" y="336">חומרי גלם</text>
    <text x="156" y="336">בונבונים</text>

    <text x="359" y="394">טעימה עם המזמינים</text>
    <text x="235" y="394">הזמנה</text>
    <text x="139" y="394">ייצור</text>
  </g>

  <!-- axis -->
  <line x1="110" y1="452" x2="690" y2="452" stroke="#222222" stroke-width="2"/>
  <g font-size="13" fill="#222222" text-anchor="middle" direction="rtl">
    <text x="680" y="472">8</text>
    <text x="537.5" y="472">6</text>
    <text x="395" y="472">4</text>
    <text x="252.5" y="472">2</text>
    <text x="181.25" y="472">1</text>
    <text x="110" y="472" font-weight="bold" fill="#8a1f11">החג</text>
    <text x="400" y="500">שבועות לפני החג (שוקולד מוצק מחזיק שבועות; מילויים רכים ופירות רק בימים האחרונים)</text>
  </g>
</svg>
