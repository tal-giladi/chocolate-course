<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="סוכר ואנרגיה ב־100 גרם שוקולד לפי USDA: שוקולד חלב 51.5 גרם סוכר ו־535 קילוקלוריות, מריר 45-59% 47.9 גרם ו־546, מריר 60-69% 36.7 גרם ו־579, מריר 70-85% 24 גרם ו־598. כל הסוגים מעל סף הסמל האדום של 10 גרם סוכר ל־100 גרם. ככל שאחוז הקקאו עולה הסוכר יורד, אבל האנרגיה והשומן הרווי עולים">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="32" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">סוכר ב־100 גרם שוקולד: מה אחוז הקקאו משנה</text>
  <text x="360" y="56" font-size="13" fill="#444444" text-anchor="middle" direction="rtl">נתוני USDA FoodData Central (ממוצעים, לא מוצר מסוים). התווית על המוצר שלכם קודמת.</text>

  <!-- scale: bar grows leftwards from x=520; 1 g = 8 px -->
  <!-- threshold 10 g at x=440 -->
  <line x1="440" y1="78" x2="440" y2="352" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="372" font-size="12" fill="#b3261e" text-anchor="middle" direction="rtl">סף הסמל האדום: 10 גרם סוכרים ל־100 גרם</text>

  <!-- row 1: milk -->
  <text x="620" y="102" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">שוקולד חלב</text>
  <text x="620" y="121" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">535 קק"ל · שומן רווי 18.5 ג'</text>
  <rect x="108" y="88" width="412" height="34" fill="#c98f2e" stroke="#4a2f08"/>
  <text x="160" y="110" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">51.5 ג'</text>

  <!-- row 2: dark 45-59 -->
  <text x="620" y="167" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">מריר 45-59%</text>
  <text x="620" y="186" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">546 קק"ל · שומן רווי 18.5 ג'</text>
  <rect x="137" y="153" width="383" height="34" fill="#9c6420" stroke="#4a2f08"/>
  <text x="190" y="175" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">47.9 ג'</text>

  <!-- row 3: dark 60-69 -->
  <text x="620" y="232" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">מריר 60-69%</text>
  <text x="620" y="251" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">579 קק"ל · שומן רווי 22.0 ג'</text>
  <rect x="226" y="218" width="294" height="34" fill="#6e4214" stroke="#2b1a05"/>
  <text x="278" y="240" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">36.7 ג'</text>

  <!-- row 4: dark 70-85 -->
  <text x="620" y="297" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">מריר 70-85%</text>
  <text x="620" y="316" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">598 קק"ל · שומן רווי 24.5 ג'</text>
  <rect x="328" y="283" width="192" height="34" fill="#46290a" stroke="#1a0f02"/>
  <text x="380" y="305" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">24.0 ג'</text>

  <!-- axis -->
  <line x1="40" y1="340" x2="520" y2="340" stroke="#222222" stroke-width="1.5"/>
  <g font-size="11" fill="#222222" text-anchor="middle">
    <text x="520" y="354">0</text><text x="360" y="354">20</text><text x="200" y="354">40</text><text x="40" y="354">60 גרם</text>
  </g>

  <!-- takeaway box -->
  <rect x="40" y="390" width="640" height="64" fill="#f4efe6" stroke="#4a2f08"/>
  <text x="360" y="414" font-size="14" fill="#111111" text-anchor="middle" direction="rtl">אחוז קקאו גבוה יותר = פחות סוכר, אבל יותר שומן ויותר קלוריות.</text>
  <text x="360" y="438" font-size="14" fill="#111111" text-anchor="middle" direction="rtl">מה שמוריד הכול ביחד הוא מנה קטנה יותר: 10 גרם במקום 20.</text>
</svg>
