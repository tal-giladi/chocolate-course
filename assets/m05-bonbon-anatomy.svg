<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="חתך של בונבון בתוך תבנית פוליקרבונט: שכבת צבע מחמאת קקאו צמודה לתבנית, קליפת שוקולד של 1-2 מילימטר, מילוי עד 1.5-2 מילימטר מתחת לשפה, ומכסה שוקולד שנצמד לשפה הנקייה">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="34" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">חתך של בונבון בתבנית (לפני שהופכים)</text>

  <!-- mould block -->
  <path d="M120 110 L250 110 Q250 330 360 330 Q470 330 470 110 L600 110 L600 380 L120 380 Z" fill="#dbe7f3" stroke="#1f4e79" stroke-width="3"/>
  <text x="185" y="360" font-size="13" fill="#1f4e79" text-anchor="middle" direction="rtl">תבנית פוליקרבונט</text>

  <!-- colour layer (thin, touching mould) -->
  <path d="M250 110 Q250 330 360 330 Q470 330 470 110" fill="none" stroke="#c0392b" stroke-width="5"/>
  <!-- shell -->
  <path d="M256 110 Q256 322 360 322 Q464 322 464 110" fill="none" stroke="#5a3214" stroke-width="12"/>
  <!-- filling -->
  <path d="M268 122 Q268 312 360 312 Q452 312 452 122 Z" fill="#d9a066"/>
  <!-- gap line -->
  <line x1="268" y1="122" x2="452" y2="122" stroke="#ffffff" stroke-width="2"/>
  <!-- cap -->
  <rect x="250" y="100" width="220" height="12" fill="#3b1f0b"/>
  <!-- mould surface line -->
  <line x1="110" y1="110" x2="610" y2="110" stroke="#1f4e79" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- labels with leader lines (right side, RTL) -->
  <g font-size="14" fill="#111111" direction="rtl" text-anchor="start">
    <line x1="470" y1="106" x2="620" y2="72" stroke="#222222" stroke-width="1.5"/>
    <text x="700" y="66" text-anchor="end">מכסה: שוקולד מטומפר, נצמד לשפה</text>

    <line x1="452" y1="200" x2="620" y2="170" stroke="#222222" stroke-width="1.5"/>
    <text x="700" y="164" text-anchor="end">מילוי: עד 25-28°C כשמזלפים</text>
    <text x="700" y="182" text-anchor="end">נח כ־12 שעות לפני הסגירה</text>

    <line x1="462" y1="260" x2="620" y2="250" stroke="#222222" stroke-width="1.5"/>
    <text x="700" y="246" text-anchor="end">קליפה: כ־1-2 מ"מ, אחידה</text>

    <line x1="440" y1="300" x2="620" y2="300" stroke="#c0392b" stroke-width="1.5"/>
    <text x="700" y="296" text-anchor="end" fill="#8e1d12">צבע (חמאת קקאו):</text>
    <text x="700" y="314" text-anchor="end" fill="#8e1d12">השכבה הראשונה בתבנית</text>
  </g>

  <!-- gap callout on left -->
  <g font-size="14" fill="#111111" direction="rtl">
    <line x1="268" y1="118" x2="100" y2="80" stroke="#222222" stroke-width="1.5"/>
    <text x="230" y="66" text-anchor="end">רווח של 1.5-2 מ"מ</text>
    <text x="230" y="84" text-anchor="end">בין המילוי לשפה</text>
  </g>

  <text x="360" y="420" font-size="14" fill="#111111" text-anchor="middle" direction="rtl">אחרי שהופכים: המכסה הוא הבסיס, ושכבת הצבע היא הצד העליון והמבריק</text>
  <text x="360" y="442" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">מקורות: Callebaut (רווח 1-1.5 מ"מ, מילוי עד 28°C), Cacao Barry (רווח 2 מ"מ, מילוי עד 25°C, 12 שעות ב־17°C)</text>
</svg>
