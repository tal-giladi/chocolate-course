<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Arial, 'Noto Sans Hebrew', sans-serif">
  <rect x="0" y="0" width="900" height="590" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" direction="rtl" font-size="24" font-weight="bold" fill="#1a1a1a">טבעוני ופרווה: שתי שאלות שונות</text>
  <text x="450" y="64" text-anchor="middle" direction="rtl" font-size="15" fill="#333333">טבעוני = מה יש ברכיבים. פרווה = מה כתוב בהכשר. מוצר יכול לענות על אחת, על שתיהן, או על אף אחת.</text>

  <circle cx="560" cy="300" r="215" fill="#e8f4ea" fill-opacity="0.6" stroke="#1f5d2c" stroke-width="3"/>
  <circle cx="340" cy="300" r="215" fill="#e6eefa" fill-opacity="0.6" stroke="#1d3f7a" stroke-width="3"/>

  <text x="640" y="118" text-anchor="middle" direction="rtl" font-size="20" font-weight="bold" fill="#1f5d2c">טבעוני (לפי הרכיבים)</text>
  <text x="260" y="118" text-anchor="middle" direction="rtl" font-size="20" font-weight="bold" fill="#1d3f7a">פרווה (לפי ההכשר)</text>

  <text x="665" y="215" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">מריר בלי חלב ברכיבים</text>
  <text x="665" y="235" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">שמסומן "חלבי" או "ציוד חלבי"</text>
  <text x="665" y="275" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">שוקולד "טבעוני" מיובא</text>
  <text x="665" y="295" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">בלי הכשר פרווה</text>
  <text x="665" y="335" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">משקה צמחי בלי הכשר</text>

  <text x="235" y="205" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">סוכריות עם שלאק (E904)</text>
  <text x="235" y="240" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">צבע אדום עם קרמין (E120)</text>
  <text x="235" y="275" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">ג'לטין דגים</text>
  <text x="235" y="310" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">ביצים, דבש, שעוות דבורים</text>
  <text x="235" y="345" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">נוגט וקישוטי מרנג</text>

  <text x="450" y="240" text-anchor="middle" direction="rtl" font-size="16" font-weight="bold" fill="#1a1a1a">שניהם</text>
  <text x="450" y="268" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">מריר מסומן פרווה,</text>
  <text x="450" y="286" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">בלי חלב ברכיבים</text>
  <text x="450" y="314" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">קרם קוקוס פרווה</text>
  <text x="450" y="342" text-anchor="middle" direction="rtl" font-size="14" fill="#1a1a1a">פרלינה פרווה</text>

  <rect x="90" y="530" width="720" height="40" rx="8" fill="#fff4e0" stroke="#8a5a00" stroke-width="2"/>
  <text x="450" y="556" text-anchor="middle" direction="rtl" font-size="15" fill="#1a1a1a">שאלה שלישית, לכל המוצרים: "עלול להכיל חלב" חשוב לאלרגיים לחלב, גם כשהמוצר טבעוני וגם כשהוא פרווה.</text>
</svg>
