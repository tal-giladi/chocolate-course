<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="עקומת טמפרור לשוקולד מריר: המסה, קירור וחימום חוזר">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="32" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">עקומת טמפרור: שוקולד מריר</text>
  <!-- axes: y(t)=320-(t-20)*7.5 -->
  <line x1="70" y1="320" x2="680" y2="320" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="50" x2="70" y2="320" stroke="#222222" stroke-width="2"/>
  <g font-size="12" fill="#222222" text-anchor="end">
    <text x="62" y="324">20</text>
    <text x="62" y="249">30</text>
    <text x="62" y="174">40</text>
    <text x="62" y="99">50</text>
  </g>
  <text x="30" y="185" font-size="13" fill="#222222" text-anchor="middle" transform="rotate(-90 30 185)">°C</text>
  <text x="375" y="345" font-size="13" fill="#222222" text-anchor="middle" direction="rtl">זמן</text>
  <!-- reference lines -->
  <line x1="70" y1="216" x2="680" y2="216" stroke="#8a3b12" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="676" y="210" font-size="12" fill="#8a3b12" text-anchor="end" direction="rtl">33.8°C: מעל זה גם צורה V נמסה</text>
  <line x1="70" y1="264" x2="680" y2="264" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="676" y="282" font-size="12" fill="#444444" text-anchor="end" direction="rtl">27.5°C: צורה IV נמסה</text>
  <!-- curve -->
  <polyline points="80,320 140,99 220,99 400,260 470,260 520,234 660,234" fill="none" stroke="#5a3214" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="180" cy="99" r="6" fill="#5a3214"/>
  <circle cx="435" cy="260" r="6" fill="#5a3214"/>
  <circle cx="590" cy="234" r="6" fill="#5a3214"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="190" y="72" font-weight="bold">1. המסה 45-55°C</text>
    <text x="190" y="89">כל הקריסטלים נמסים</text>
    <text x="410" y="298" font-weight="bold">2. קירור ל־27-29°C</text>
    <text x="410" y="314">נוצרים קריסטלים, גם לא יציבים</text>
    <text x="590" y="176" font-weight="bold">3. חימום ל־31-32°C</text>
    <text x="590" y="193">הלא יציבים נמסים, V נשאר</text>
  </g>
  <g font-size="13" fill="#222222" text-anchor="middle" direction="rtl">
    <text x="375" y="372">חלב: עבודה ב־29-30°C · לבן: עבודה ב־28-29°C · העקומה של היצרן קודמת</text>
    <text x="375" y="396">בהזרעה ובחמאת קקאו באבקה לא יורדים ל־27°C: מוסיפים קריסטלי V מוכנים</text>
  </g>
</svg>
