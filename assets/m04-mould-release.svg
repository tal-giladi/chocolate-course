<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="השוואה בין תבנית פוליקרבונט לתבנית סיליקון: בפוליקרבונט השוקולד המטומפר מתכווץ ומשתחרר לבד עם צד מבריק, בסיליקון מקלפים את התבנית והצד פחות מבריק">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="32" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">איך הטבלה יוצאת מהתבנית</text>

  <!-- right panel: polycarbonate (RTL: first on the right) -->
  <text x="540" y="66" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">פוליקרבונט (קשיח, חלק)</text>
  <!-- mould cross-section -->
  <path d="M420 100 L420 190 L660 190 L660 100" fill="none" stroke="#1f4e79" stroke-width="6"/>
  <!-- chocolate after contraction: small gap -->
  <rect x="432" y="112" width="216" height="70" fill="#5a3214"/>
  <line x1="432" y1="182" x2="648" y2="182" stroke="#d9a066" stroke-width="2"/>
  <g font-size="12" fill="#222222" text-anchor="middle" direction="rtl">
    <text x="540" y="212">מרווח זעיר: השוקולד המטומפר מתכווץ</text>
    <text x="540" y="228">והתבנית הקשיחה לא זזה איתו</text>
  </g>
  <!-- arrow down -->
  <line x1="540" y1="240" x2="540" y2="278" stroke="#222222" stroke-width="2"/>
  <polygon points="533,272 547,272 540,286" fill="#222222"/>
  <text x="600" y="266" font-size="12" fill="#222222" text-anchor="middle" direction="rtl">הופכים</text>
  <!-- released bar -->
  <rect x="440" y="296" width="200" height="40" fill="#5a3214"/>
  <line x1="446" y1="333" x2="634" y2="333" stroke="#ffffff" stroke-width="3"/>
  <line x1="470" y1="326" x2="520" y2="326" stroke="#ffffff" stroke-width="2"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="540" y="362" font-weight="bold">נופלת לבד, צד התבנית מבריק כמו מראה</text>
    <text x="540" y="380">התבנית מעתיקה את החלקות שלה לשוקולד</text>
    <text x="540" y="398">דורש טמפרור: בלי צורה V אין התכווצות</text>
  </g>

  <!-- divider -->
  <line x1="360" y1="56" x2="360" y2="410" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- left panel: silicone -->
  <text x="180" y="66" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">סיליקון (גמיש, רך)</text>
  <path d="M60 100 Q58 150 62 190 L298 190 Q302 150 300 100" fill="none" stroke="#8a3b12" stroke-width="10" stroke-linejoin="round"/>
  <rect x="68" y="108" width="224" height="78" fill="#5a3214"/>
  <g font-size="12" fill="#222222" text-anchor="middle" direction="rtl">
    <text x="180" y="212">אין מרווח: הסיליקון צמוד לשוקולד</text>
    <text x="180" y="228">ומשחרר רק כשמקלפים אותו</text>
  </g>
  <line x1="180" y1="240" x2="180" y2="278" stroke="#222222" stroke-width="2"/>
  <polygon points="173,272 187,272 180,286" fill="#222222"/>
  <text x="240" y="266" font-size="12" fill="#222222" text-anchor="middle" direction="rtl">מקלפים</text>
  <path d="M80 296 L280 296 L280 336 L80 336 Z" fill="#6b4226"/>
  <line x1="86" y1="333" x2="274" y2="333" stroke="#c8a585" stroke-width="2" stroke-dasharray="3 3"/>
  <g font-size="13" fill="#111111" text-anchor="middle" direction="rtl">
    <text x="180" y="362" font-weight="bold">יוצאת גם בלי התכווצות, ברק סאטן או עמום</text>
    <text x="180" y="380">קל להוציא צורות מסובכות</text>
    <text x="180" y="398">גם כאן צריך טמפרור לסנאפ ולברק</text>
  </g>
  <text x="360" y="428" font-size="11" fill="#444444" text-anchor="middle" direction="rtl">לפי Callebaut: פוליקרבונט נותן את הברק הטוב ביותר ומתכווץ לאט יותר מהשוקולד, ולכן קל להוציא ממנו</text>
</svg>
