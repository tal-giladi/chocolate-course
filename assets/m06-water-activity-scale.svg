<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="סרגל פעילות מים מ־0.55 עד 1: שמנת ליד 0.99, גנאש ביתי 1:1 ב־0.88, גנאש 1.4:1 ב־0.85, ריבה 0.75-0.80, סירופ גלוקוזה 0.68-0.72, דבש 0.60-0.65; רוב החיידקים צריכים 0.90, סטפילוקוקוס 0.86, רוב העובשים 0.80-0.87, ומתחת ל־0.60 אין התרבות; ומעל הסרגל טווחי חיי מדף לבונבונים מקצועיים">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="30" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle" direction="rtl">פעילות מים (aw): איפה הגנאש יושב</text>
  <!-- scale: x(aw) = 60 + (aw-0.55)*1333.3 -->

  <!-- shelf-life bands (Barry Callebaut UK Academy / Keylink) -->
  <text x="660" y="56" font-size="12" fill="#444444" text-anchor="end" direction="rtl">חיי מדף משוערים לבונבונים בייצור מקצועי (Barry Callebaut / Keylink):</text>
  <rect x="60" y="64" width="67" height="30" fill="#cfe3c6" stroke="#2f5d23"/>
  <text x="93" y="84" font-size="11" fill="#111111" text-anchor="middle" direction="rtl">יציב</text>
  <rect x="193" y="64" width="67" height="30" fill="#dfeccf" stroke="#2f5d23"/>
  <text x="227" y="84" font-size="11" fill="#111111" text-anchor="middle" direction="rtl">6-9 חודשים</text>
  <rect x="260" y="64" width="200" height="30" fill="#f6e7b8" stroke="#8a5a12"/>
  <text x="360" y="84" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">עד 3 חודשים</text>
  <rect x="460" y="64" width="200" height="30" fill="#f3c9b0" stroke="#8a3b12"/>
  <text x="560" y="84" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">עד 3 שבועות</text>

  <!-- foods above the axis -->
  <g stroke="#222222" stroke-width="1.5">
    <line x1="647" y1="120" x2="647" y2="250"/>
    <line x1="500" y1="150" x2="500" y2="250"/>
    <line x1="460" y1="185" x2="460" y2="250"/>
  </g>
  <text x="652" y="116" font-size="12" fill="#111111" text-anchor="end" direction="rtl">שמנת וחלב ~0.99</text>
  <text x="505" y="146" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">גנאש ביתי ~1:1 → 0.88</text>
  <text x="440" y="181" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">גנאש ~1.4:1 → 0.85</text>
  <!-- ranges -->
  <rect x="327" y="205" width="67" height="12" fill="#c98f2e" stroke="#4a2f08"/>
  <text x="360" y="200" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">ריבה 0.75-0.80</text>
  <rect x="233" y="228" width="53" height="12" fill="#c98f2e" stroke="#4a2f08"/>
  <text x="225" y="222" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">סירופ גלוקוזה 0.68-0.72</text>
  <rect x="127" y="205" width="67" height="12" fill="#c98f2e" stroke="#4a2f08"/>
  <text x="160" y="200" font-size="12" fill="#111111" text-anchor="middle" direction="rtl">דבש 0.60-0.65</text>

  <!-- axis -->
  <line x1="60" y1="250" x2="660" y2="250" stroke="#222222" stroke-width="2"/>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <text x="60" y="268">0.55</text><text x="127" y="268">0.60</text><text x="193" y="268">0.65</text><text x="260" y="268">0.70</text>
    <text x="327" y="268">0.75</text><text x="393" y="268">0.80</text><text x="460" y="268">0.85</text><text x="527" y="268">0.90</text>
    <text x="593" y="268">0.95</text><text x="660" y="268">1.00</text>
  </g>
  <g stroke="#222222" stroke-width="1">
    <line x1="60" y1="250" x2="60" y2="256"/><line x1="127" y1="250" x2="127" y2="256"/><line x1="193" y1="250" x2="193" y2="256"/>
    <line x1="260" y1="250" x2="260" y2="256"/><line x1="327" y1="250" x2="327" y2="256"/><line x1="393" y1="250" x2="393" y2="256"/>
    <line x1="460" y1="250" x2="460" y2="256"/><line x1="527" y1="250" x2="527" y2="256"/><line x1="593" y1="250" x2="593" y2="256"/>
    <line x1="660" y1="250" x2="660" y2="256"/>
  </g>
  <text x="360" y="288" font-size="12" fill="#444444" text-anchor="middle" direction="rtl">יבש יותר ← → יותר מים זמינים</text>

  <!-- microbes below the axis -->
  <g stroke="#8a3b12" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="527" y1="296" x2="527" y2="330"/>
    <line x1="473" y1="296" x2="473" y2="365"/>
    <line x1="141" y1="296" x2="141" y2="400"/>
  </g>
  <rect x="393" y="372" width="94" height="12" fill="#f3c9b0" stroke="#8a3b12"/>
  <text x="532" y="344" font-size="12" fill="#8a3b12" text-anchor="middle" direction="rtl">רוב החיידקים: ~0.90</text>
  <text x="560" y="365" font-size="12" fill="#8a3b12" text-anchor="middle" direction="rtl">סטפילוקוקוס (עם אוויר): 0.86</text>
  <text x="446" y="400" font-size="12" fill="#8a3b12" text-anchor="middle" direction="rtl">רוב העובשים: 0.80-0.87</text>
  <text x="146" y="416" font-size="12" fill="#8a3b12" text-anchor="start" direction="rtl">עובשים ושמרים עמידים: ~0.61</text>

  <text x="360" y="450" font-size="11" fill="#444444" text-anchor="middle" direction="rtl">מקורות: Kansas State University (גנאש, ריבה, דבש, חיידקים ועובשים), Callebaut (שמנת, גלוקוזה), Barry Callebaut UK Academy ו־Keylink (טווחי חיי מדף)</text>
</svg>
