- id: q1
  question: >-
    יולי, המזגן במטבח מקולקל ובחדר 29°C. יצקתם קליפות, והן נשארות רכות ומבריקות־רטובות גם אחרי
    10 דקות, ולא מתכווצות בתבנית. בדיקת הסכין עברה בבוקר בחדר אחר. מה הצעד הכי נכון?
  options:
    - >-
      להכניס את התבנית ללילה במקרר, כדי שהקליפות יתקשו לאט ויתכווצו בלי להיסדק.
    - >-
      לעבור לחדר ממוזג, לבדוק שוב את הטמפר בבדיקת סכין שם, ורק אז להמשיך לצקת.
    - >-
      להוסיף לשוקולד עוד זרעים בכל יציקה, כי בחום צריך פי שניים זרעים כדי שיתקשה.
    - >-
      לצקת שכבה שנייה מיד על הראשונה, כדי שהקליפה העבה תחזיק חום ותתקשה מבפנים.
  correct: 1
  explanation: >-
    בחדר חם השוקולד מתקשה לאט והבדיקה מטעה, וקליפה דקה רגישה לזה במיוחד. CakeFlix ממליצים על חדר
    עבודה של 18-20°C. בודקים טמפר בתנאים שבהם עובדים, ולא סומכים על בדיקה מחדר אחר.
- id: q2
  question: >-
    הכנתם גנאש, ובגלל שמיהרתם לאסוף את הילדים זילפתם אותו לקליפות ב־38°C. מה הכי סביר שתראו מחר?
  options:
    - >-
      הגנאש ייפרד בתוך הקליפה, אבל הקליפות עצמן יישארו מבריקות וייצאו מהתבנית כרגיל.
    - >-
      שום בעיה מיוחדת, כי הקליפות כבר התקשו לגמרי לפני שהגנאש החם נכנס לתוכן.
    - >-
      הגנאש יתקשה מהר יותר בזכות החום, ולכן אפשר יהיה לסגור כבר אחרי שעה במקום לילה.
    - >-
      בונבונים שלא יוצאים מהתבנית או יוצאים עם כתמים, כי החום הוציא את הקליפה מטמפר.
  correct: 3
  explanation: >-
    גבישי V בקליפה הדקה נמסים מעל כ־34°C. לכן Callebaut מגבילים מילוי ל־28°C ו־Cacao Barry ל־25°C.
    קליפה שאיבדה טמפר נדבקת ומאפירה.
- id: q3
  question: >-
    חברה מבקשת 24 בונבוני גנאש שמנת לאירוע בעוד שלושה שבועות, ורוצה להכין אותם כבר עכשיו כדי "להתפנות".
    מה הכי נכון לייעץ לה, לפי מה שלמדתם?
  options:
    - >-
      להכין את הקליפות עכשיו ולשמור אותן עטופות, ולמלא בגנאש ולסגור כמה ימים לפני האירוע.
    - >-
      להכין עכשיו את כל הבונבונים ולשמור אותם במקפיא, ולהפשיר אותם על השיש בבוקר של האירוע.
    - >-
      להכין עכשיו את כל הבונבונים, כי גנאש בתוך קליפה סגורה מחזיק כמה חודשים בכל טמפרטורה.
    - >-
      להכין עכשיו ולשמור במקרר בקופסה פתוחה, כדי שהלחות תצא מהגנאש והוא יחזיק יותר זמן.
  correct: 0
  explanation: >-
    לפי CakeFlix, קליפות יצוקות נשמרות שבועות עטופות בחדר קריר. גנאש פשוט עם שמנת מחזיק בערך שבועיים
    במקום קריר, ו־Callebaut מדגישים שרק ניסוי לאורך זמן קובע חיי מדף. מקפיא ומקרר פתוח מביאים עיבוי
    ופריחה.
- id: q4
  question: >-
    המכסים של הבונבונים שלכם מתקלפים בקלות, ובבסיס רואים פס דק של מילוי בין הקליפה למכסה. מה שתי
    הסיבות הכי סבירות?
  options:
    - >-
      קליפה עבה מדי ושוקולד סגירה מטומפר מדי, שלא מתמזג עם הקליפה כי שניהם כבר מגובשים.
    - >-
      מילוי עם יותר מדי סוכר, וסגירה שנעשתה בחדר ממוזג במקום בחדר חם.
    - >-
      מילוי שהגיע עד השפה או נמרח עליה, ושפות קרות או מלוכלכות שהמכסה לא התמזג איתן.
    - >-
      שקית זילוף עם פתח רחב מדי, ומנוחה ארוכה מדי שבה המילוי התייבש והתכווץ.
  correct: 2
  explanation: >-
    Callebaut: בונבונים לא נסגרים בגלל מילוי יתר, ומשאירים 1-1.5 מ"מ. המכסה מתמזג רק עם שפה נקייה שאינה
    קרה, ולכן Cacao Barry מחממים את פני התבנית לרגע לפני הסגירה.
- id: q5
  question: >-
    הכנתם חמאת קקאו אדומה מאבקה מסיסת שומן, חיממתם ל־40°C וצבעתם מיד. הצבע נשאר בתבנית והבונבונים יצאו
    חומים. בפעם הבאה מה משנים?
  options:
    - >-
      מחממים את התבנית אחרי הצביעה, כדי שהצבע יתמזג עם השוקולד ויצא איתו מהתבנית.
    - >-
      מקררים את הצבע תוך ערבוב או ניעור עד כ־28°C ובודקים טיפה על אצטט לפני הצביעה.
    - >-
      מחליפים לצבע ג'ל על בסיס מים, כי הוא לא נדבק לפוליקרבונט כמו צבע על בסיס שומן.
    - >-
      מוסיפים יותר אבקת צבע, כי צבע מרוכז נצמד לשוקולד יותר מאשר לתבנית החלקה.
  correct: 1
  explanation: >-
    ב־40°C אין בחמאת הקקאו גבישי V, וחמאה לא מטומפרת נדבקת לתבנית (Guichon, RCI). מורידים ל־28°C תוך
    ניעור, מחממים מעט לעבודה, ובודקים על אצטט. צבע על בסיס מים לא מתערבב בשומן.
- id: q6
  question: >-
    לקוחה שאלה אם אפשר לשים על בונבון "אבקת זהב" שקנתה בחנות יצירה. על הצנצנת כתוב "Non-toxic, for
    decorative use", ואין רשימת רכיבים. מה עונים?
  options:
    - >-
      לא. בלי "אכיל" ובלי רשימת רכיבים, ועם "לקישוט", היא לא הולכת על מזון לפי ה־FDA.
    - >-
      כן, אם מורחים מעט ורק על הצד העליון, כי כמות קטנה של חומר לא רעיל לא מזיקה.
    - >-
      כן, אם מערבבים אותה בחמאת קקאו, כי השומן עוטף את החלקיקים והם לא נספגים בגוף.
    - >-
      רק אם הבונבון מיועד למבוגרים, כי האזהרה "לקישוט" נועדה בעיקר להגן על ילדים.
  correct: 0
  explanation: >-
    "לא רעיל" אינו "אכיל". FDA: אבקה אכילה כותבת edible ויש עליה רשימת רכיבים; אם כתוב רק non-toxic או
    "לקישוט בלבד" בלי רשימת רכיבים, לא משתמשים בה ישירות על מזון. מבונבון אי אפשר להסיר אותה.
- id: q7
  question: >-
    אתם מתכננים מארזים לחברה עם סניף בגרמניה. האבקה שאתם אוהבים, מתוצרת ארה"ב, מסומנת "Edible" וברכיבים
    כתוב titanium dioxide. מה המידע הרלוונטי?
  options:
    - >-
      טיטניום דיאוקסיד אסור גם בארה"ב, ולכן הכיתוב Edible על האריזה כנראה שגוי.
    - >-
      אין בעיה, כי מה שמותר בארה"ב מותר אוטומטית בכל מדינות האיחוד האירופי.
    - >-
      אין בעיה, כי E171 מותר באיחוד האירופי בכל מוצר שמסומן "לשימוש חיצוני".
    - >-
      E171 אסור כתוסף מזון באיחוד האירופי מ־7 באוגוסט 2022, ולכן בוחרים אבקה בלי E171.
  correct: 3
  explanation: >-
    EFSA קבעה ב־2021 שאין להחשיב את E171 בטוח כתוסף מזון, ותקנה (EU) 2022/63 הוציאה אותו מהשימוש;
    מזון חדש לא יכול להכיל אותו מאז 7 באוגוסט 2022 (FSAI). בארה"ב פיגמנט מיקה עם טיטניום דיאוקסיד
    מותר בממתקים.
- id: q8
  question: >-
    בונבונים יצאו עם קליפה של 4 מ"מ בתחתית. ביומן: השוקולד עמד 25 דקות בקערה לפני היציקה, התבנית
    חוממה ל־26°C, והריקון נמשך 5 שניות. מה המשתנה הראשון שהכי כדאי לשנות?
  options:
    - >-
      לחמם את התבנית ל־35°C, כדי שהשוקולד יישאר נוזלי יותר זמן בזמן הריקון.
    - >-
      להחליף לתבנית סיליקון, כי בה הקליפה מתנקזת טוב יותר ויוצאת דקה ואחידה.
    - >-
      להאריך את הריקון ל־20-30 שניות עם הקשות, ולחמם את השוקולד במעלה אחת לפני היציקה.
    - >-
      לקצר את הקירור במקרר, כי קירור ארוך הוא שגורם לשוקולד להתעבות בתחתית השקע.
  correct: 2
  explanation: >-
    שוקולד שעמד הסמיך (התגבשות יתר), וריקון של 5 שניות משאיר שלולית. 26°C בתבנית תקין (Callebaut:
    26-27°C, לא חם מהשוקולד). תבנית של 35°C ממיסה את גבישי V. בפועל משנים אחד מהשניים בכל סבב.
- id: q9
  question: >-
    בסבב שבו הבונבונים נסדקו השתמשתם במקפיא לחצי שעה, ובמילוי פרלינה שהיה במקרר. בסבב הבא אתם רוצים
    לבדוק מה גרם לסדקים. מה עושים?
  options:
    - >-
      מוותרים על המקפיא וגם מוציאים את הפרלינה מהמקרר, כדי לפתור את הבעיה בבת אחת.
    - >-
      משאירים את הפרלינה הקרה ומחליפים רק את המקפיא ב־10-15 דקות במקרר, ורושמים מה קרה.
    - >-
      מחליפים לגנאש, כי פרלינה היא מילוי קשה שתמיד גורם לסדקים בקליפה דקה.
    - >-
      מוסיפים שכבה שנייה לקליפה, כי קליפה עבה לא נסדקת גם במקפיא וגם עם מילוי קר.
  correct: 1
  explanation: >-
    כדי לדעת מה גרם לסדקים משנים משתנה אחד בכל סבב. שני החשודים הם הלם קירור והפרש טמפרטורה בין מילוי
    קר לקליפה (CakeFlix). שינוי של שניהם יחד יפתור, אבל לא ילמד אתכם מה היה הגורם.
- id: q10
  question: >-
    כתבתם על פתק למארז מתנה של בונבוני גנאש עם שמנת חלב ופרלינה לוז. מה חייב להופיע בו, לפי המודול?
  options:
    - >-
      אלרגנים (חלב, לוז, סויה), תאריך הכנה, ושמירה במקום קריר עד כשבועיים.
    - >-
      רק שם המילוי וצבע הבונבון, כי פרטי אלרגנים נדרשים רק כשמוכרים בחנות עם רישיון.
    - >-
      הכיתוב "פרווה", כי הבונבונים מכילים אגוזים ושוקולד מריר ולא בשר.
    - >-
      ההוראה לשמור במקפיא עד ההגשה, כדי שהגנאש יחזיק כמה חודשים בלי להתקלקל.
  correct: 0
  explanation: >-
    כל מתכון בקורס מציין אלרגנים, ומי שמקבל מתנה צריך לדעת מה יש בה. שמנת חלב הופכת את הבונבון לחלבי,
    ולא כותבים "פרווה". לגנאש פשוט: מקום קריר ואכילה תוך כשבועיים.
