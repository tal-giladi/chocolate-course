- id: q1
  question: >-
    הכנתם 5 בונבונים מבריקים, וארזתם אותם בשקית צלופן שקופה עם סרט הדוק סביב הבונבונים. למחרת יש עליהם
    סימנים עמומים בדיוק איפה שהסרט לחץ. מה הלקח?
  options:
    - >-
      שבונבונים צריכים קירור במקרר אחרי האריזה, כדי שהקליפה תתקשה ולא תיפגע מלחץ.
    - >-
      שצלופן אמיתי מגיב עם חמאת קקאו, ולכן צריך לבחור רק שקיות פלסטיק אטומות לחלוטין.
    - >-
      שפריט מבריק צריך תחתית או קופסה שמחזיקה אותו, ואת הסרט קושרים על השקית מעל, לא סביב השוקולד.
    - >-
      שבונבונים מבריקים לא אורזים בשקית בכלל, אלא רק בקופסה עם חלון שקוף ובלי מכסה.
  correct: 2
  explanation: >-
    לחץ וחיכוך פוגעים בברק. בשקית מניחים את הפריט על תחתית או כוסית, ומקפלים את הפתח לפני הסרט. מקרר רק
    מוסיף לחות ועיבוי.
- id: q2
  question: >-
    שכנה מבקשת מארז 16 ליום הולדת של אמה בעוד שבוע. אתם רוצים לשים בו גם 4 טראפלס של שוקולד ושמנת. מה
    משנה התוספת הזאת בתוכנית?
  options:
    - >-
      כל המארז הופך למארז למקרר עם תאריך של הטראפלס, ולכן מכינים אותו קרוב למסירה.
    - >-
      רק הטראפלס צריכים מקרר, אז מוסרים אותם בשקית נפרדת ואת שאר המארז שומרים בחוץ.
    - >-
      אין שינוי, כי במארז סגור הטראפלס מקבלים את חיי המדף של שאר הבונבונים שאיתם.
    - >-
      צריך להקפיא את כל המארז עד יום המסירה, כי זו הדרך היחידה לשמור טראפלס שבוע.
  correct: 0
  explanation: >-
    מארז שומר כמו הפריט הרגיש ביותר בו. טראפלס של שוקולד ושמנת דורשים מקרר וזמן קצר (06.4), ולכן כל המארז
    מתוכנן למקרר ומוכן קרוב למסירה, או שמוותרים על הטראפלס.
- id: q3
  question: >-
    חם, 33°C, ואתם צריכים למסור מארז של סביבונים ומטבעות (שוקולד מוצק בלבד) לחברה שגרה 40 דקות נסיעה.
    מה מתאים?
  options:
    - >-
      צידנית עם קרחון קפוא שמונח ישירות על הקופסה, כדי שהשוקולד יישאר קר כמו במקרר.
    - >-
      לקרר את המארז במקרר לילה לפני, ולפתוח אותו ברכב כשמגיעים כדי לבדוק שלא נמס.
    - >-
      תיק רגיל על המושב הקדמי, כי שוקולד מוצק בלי שמנת לא מתקלקל ולא צריך שום הגנה.
    - >-
      שקית מבודדת עם קרחון עטוף וקרטון ביניהם, ברכב ממוזג, והמארז יוצא איתכם בכל עצירה.
  correct: 3
  explanation: >-
    שוקולד מוצק לא מתקלקל, אבל נמס ומלבין מעל 34°C. המטרה היא לא לקרר אלא לא לחמם: קרחון עטוף, בלי מגע
    ישיר שיוצר עיבוי, ורכב ממוזג.
- id: q4
  question: >-
    הנמען כותב לכם: "הכנסתי את מארז הסביבונים למקרר, ועכשיו כשפתחתי הם מכוסים בשכבה לבנה ויבשה". מה קרה ומה
    עונים?
  options:
    - >-
      פריחת שומן, כי המקרר החם מדי המיס את השוקולד, ועונים שאסור לאכול ממנו יותר.
    - >-
      פריחת סוכר מעיבוי כשהקופסה נפתחה קרה; בטוח לאכילה, ובפעם הבאה מוציאים סגור או לא מקררים.
    - >-
      עובש מהלחות במקרר, ולכן מבקשים ממנו לזרוק את כל המארז ולהחליף אותו במארז חדש.
    - >-
      סוכריות הקישוט נמסו מהקור, והצבע שלהן נמרח על הסביבונים כשכבה לבנה ויבשה.
  correct: 1
  explanation: >-
    שוקולד קר שנפתח באוויר חם מושך עיבוי, והמים ממיסים סוכר שמתגבש לשכבה לבנה ויבשה. זה בטוח. הוראת אחסון
    של שורה אחת בפתק מונעת את זה: 18-20°C, לא במקרר.
- id: q5
  question: >-
    בתכנון מארז 9 יצא: בונבונים 8.10 ₪, קופסה מחולקת 6 ₪, מדבקה וסרט 1.13 ₪, צבע 0.50 ₪. מה עלות המארז
    לפי התבנית, עם פחת של 12%?
  options:
    - >-
      15.73 ₪, כי פחת מחשבים רק על חומרי הגלם שנכנסו לבונבונים ולא על שום דבר אחר.
    - >-
      כ־17.6 ₪, כי מוסיפים 12% על הסכום של חומרי הגלם והאריזה ביחד.
    - >-
      כ־9.6 ₪, כלומר הבונבונים והצבע עם פחת, כי האריזה היא הוצאה שהנמען לא רואה.
    - >-
      כ־19.5 ₪, כי מוסיפים 12% על כל רכיב בנפרד ואז עוד 12% על הסכום הכולל.
  correct: 1
  explanation: >-
    15.73 ₪ חומרי גלם ואריזה, ועוד 12% (1.89 ₪), הם כ־17.6 ₪. פחת חל גם על אריזות שנפגעות, ומחשבים אותו
    פעם אחת על הסכום.
- id: q6
  question: >-
    אתם מתלבטים בין מארז 5 למארז 16 לאותו סוג בונבון. בחישוב, העלות ליחידה במארז 5 גבוהה בהרבה. למה?
  options:
    - >-
      כי במארז קטן משתמשים בשוקולד יקר יותר, כדי שהמתנה הקטנה תיראה מכובדת יותר.
    - >-
      כי במארז קטן הפחת גבוה יותר, ותמיד מחשבים בו פחת של 30% במקום 12%.
    - >-
      כי במארז 16 הבונבונים קטנים יותר ושוקלים פחות, ולכן כל אחד עולה פחות שוקולד.
    - >-
      כי הקופסה, המדבקה והסרט מתחלקים על 5 יחידות בלבד, ולכן חלק האריזה ליחידה גדול.
  correct: 3
  explanation: >-
    עלות האריזה כמעט קבועה למארז, ולכן היא מתחלקת על פחות יחידות במארז קטן. בדוגמה בשיעור, מארז 5 יצא כ־3 ₪
    ליחידה ו־16 כ־1.8 ₪.
- id: q7
  question: >-
    קניתם בשוק קופסאות קרטון ממוחזר מודפסות, זולות, בלי סימון למזון. מה עושים כדי להשתמש בהן למארז?
  options:
    - >-
      מרפדים בנייר פרגמנט או מכניסים כל פריט לכוסית נייר למזון, כך שהשוקולד לא נוגע בקרטון.
    - >-
      שוטפים את הקופסאות במים חמים ומייבשים, כדי להוריד את הדיו לפני שמכניסים שוקולד.
    - >-
      משתמשים בהן רק לשוקולד מריר, כי בשוקולד מריר אין שומן שסופג חומרים מהקרטון.
    - >-
      מקררים בהן את השוקולד, כי בקור שום חומר לא עובר מהקרטון אל המזון שבתוכו.
  correct: 0
  explanation: >-
    קרטון ממוחזר ודיו של הדפסה יכולים להעביר חומרים למזון, ולכן שוקולד שוכב על תחתית או כוסית שמיועדות
    למזון. שטיפה מרסקת קרטון, וכל שוקולד מכיל שומן.
- id: q8
  question: >-
    במארז יש שלושה בונבוני פרלינה עם אגוזי לוז ושישה בונבונים בלי אגוזים. מה כותבים בפתק?
  options:
    - >-
      שרק הבונבונים בשורה העליונה מכילים אגוזים, ושאר המארז בטוח לאלרגיים לאגוזים.
    - >-
      שהמארז מכיל חלב בלבד, כי אגוזים כותבים רק כשהם יותר מחצי ממשקל המארז.
    - >-
      שהמארז מכיל אגוזי לוז, ושכל שאר הבונבונים עלולים להכיל אגוזים, כי הם באותה קופסה.
    - >-
      כלום על אגוזים, כי מי שאלרגי יזהה לפי הסימן החיצוני על הבונבונים שיש בהם פרלינה.
  correct: 2
  explanation: >-
    פריט עם אגוזים שנוגע בפריטים אחרים באותה קופסה הופך את כל המארז ל"עלול להכיל". כותבים את זה בפתק,
    ולמשפחה עם אלרגיה מכינים מארז בלי אגוזים מההתחלה.
- id: q9
  question: >-
    משאירים את מארז הסביבונים לרגע על הדשבורד, ביום של 28°C, "כי זה רק חמש דקות". מה צפוי לפי המחקר על רכבים
    חונים?
  options:
    - >-
      בטמפרטורה של 28°C בחוץ הרכב לא יכול להגיע ל־34°C, ולכן הסביבונים לא ייפגעו.
    - >-
      הסביבונים יתרככו רק אם החלונות סגורים לגמרי; חלון פתוח מעט שומר על הרכב קריר.
    - >-
      שום דבר, כי שוקולד מטומפר עמיד לחום עד 40°C בזכות הקריסטלים מצורה V.
    - >-
      רכב חונה מתחמם מהר, והדשבורד בשמש חם עוד יותר; הסביבונים עלולים להתרכך ולהלבין.
  correct: 3
  explanation: >-
    במחקר של McLaren ועמיתיו רכב חונה הגיע לכ־47°C גם ביום הקריר ביותר, וחלון פתוח מעט לא עזר. קריסטלי V
    נמסים ב־33.8°C, ומשטח בשמש ישירה חם יותר מהאוויר.
- id: q10
  question: >-
    מארז עם טראפלס של שמנת התעכב, ועמד שעתיים וחצי בחדר של 26°C אצל הנמען לפני שהוכנס למקרר. מה ההמלצה?
  options:
    - >-
      לא לאכול את הטראפלס, כי עברו יותר משעתיים מחוץ למקרר; שוקולד מוצק אפשר.
    - >-
      לאכול הכול, כי הקליפה המטומפרת של הטראפלס הגנה על הגנאש מחיידקים בזמן הזה.
    - >-
      לקרר את הטראפלס שעה במקרר, ואז הם חוזרים להיות בטוחים כמו שהיו לפני העיכוב.
    - >-
      להמיס את הטראפלס ולטמפר מחדש, כי חום הטמפרור הורג את כל מה שהתפתח בחדר.
  correct: 0
  explanation: >-
    לפי כלל השעתיים, מזון רגיש שהיה בחוץ יותר משעתיים לא אוכלים, וזה המקרה היחיד בקורס שבו זורקים. קירור
    לא מתקן, ושוקולד מוצק בלי שמנת לא בסיכון הזה.
