- id: q1
  question: >-
    קניתם באתר "תבנית טבלה לשוקולד" ב־25 ₪. כשהגיעה, היא שקופה, דקה ומתכופפת בקלות ביד. הטבלאות הראשונות
    יצאו מבריקות. מה כדאי לדעת עליה?
  options:
    - >-
      זו תבנית פוליקרבונט רגילה, והגמישות שלה היא מה שמקל על ההוצאה של טבלאות עבות.
    - >-
      זו תבנית סיליקון שקופה, ולכן היא תיתן ברק סאטן בלבד גם אם השוקולד מטומפר היטב.
    - >-
      זו תבנית פלסטיק דק: מבריקה כשהיא חדשה, אבל נשחקת ומתעקמת מהר יותר מפוליקרבונט.
    - >-
      זו תבנית שמתאימה רק לשוקולד ציפוי, כי שוקולד מטומפר מתכווץ ונסדק בתבנית גמישה.
  correct: 2
  explanation: >-
    פוליקרבונט קשיח ועבה ולא מתכופף ביד. תבנית שקופה, דקה וגמישה היא פלסטיק דק: זולה וטובה להתחלה, אבל
    מתעקמת ונשחקת אחרי כמה מאות שימושים. בחנויות הן מופיעות לפעמים באותה קטגוריה.
- id: q2
  question: >-
    הכנתם 4 טבלאות להפתעת יום הולדת. שלוש יצאו מתבנית הפוליקרבונט כשהפכתם אותה, והרביעית נשארה דבוקה
    גם אחרי 10 דקות נוספות במקרר. היא נוצקה אחרונה, אחרי שחיממתם את הקערה במיקרוגל ל־35°C. מה ההסבר?
  options:
    - >-
      החימום ל־35°C המיס את גבישי צורה V, השוקולד כבר לא היה מטומפר ולכן לא התכווץ.
    - >-
      הטבלה האחרונה הייתה עבה יותר, וטבלה עבה תמיד צריכה לילה שלם במקרר כדי לצאת.
    - >-
      השקע הרביעי לא לוטש בצמר גפן, ופוליקרבונט לא מלוטש לא משחרר שוקולד בכלל.
    - >-
      השוקולד היה בקערה זמן רב והתגבש יותר מדי, ולכן הוא נדבק לתבנית במקום להתכווץ.
  correct: 0
  explanation: >-
    מעל כ־34°C במריר גם גבישי V נמסים, והטמפר נשבר. אחרי כל חימום מודדים, ואם עברתם את 32°C בודקים שוב
    בבדיקת סכין או מוסיפים זרעים. שוקולד שהתגבש יותר מדי דווקא סמיך ומטומפר.
- id: q3
  question: >-
    חבר מראה לכם טבלה מתבנית סיליקון: יצאה בקלות, אבל עמומה, רכה, ועם פסים אפורים אחרי יום. "אבל היא
    יצאה מהתבנית, אז הטמפר הצליח", הוא אומר. מה עונים?
  options:
    - >-
      נכון, ופסים אפורים בסיליקון באים מהחומר של התבנית, שמשאיר שכבה דקה על השוקולד.
    - >-
      נכון, אבל סיליקון מוריד את הסנאפ, ולכן כל טבלה מסיליקון רכה גם כשהיא מטומפרת.
    - >-
      לא, טבלה שיוצאת בקלות מסיליקון היא סימן שהשוקולד חם מדי, ולכן הוא תמיד יפרח.
    - >-
      לא, מסיליקון מקלפים גם שוקולד שלא טומפר. רכות ופסים אומרים שהטמפר נכשל.
  correct: 3
  explanation: >-
    בתבנית קשיחה רק שוקולד מטומפר משתחרר, ולכן השחרור הוא בדיקה. סיליקון משחרר בקילוף כל שוקולד, ולכן
    בודקים בבדיקת סכין, בסנאפ ובברק. סאטן קל הוא צפוי בסיליקון; פסים ורכות לא.
- id: q4
  question: >-
    בטבלה ממולאת, הסגירה נראתה טוב, אבל יום אחרי יש כתם שמן מתחת לטבלה וסדק לאורך השפה. מילאתם את הפרלינה
    "עד הסוף, כדי שיהיה הרבה מילוי". מה משנים?
  options:
    - >-
      מזלפים את המילוי חם יותר, כ־35°C, כדי שיתיישר לבד ולא יגיע לשפה.
    - >-
      ממלאים עד 1-1.5 מ"מ מתחת לשפה ושומרים על השפה נקייה, כדי שהסגירה תידבק לקליפה.
    - >-
      סוגרים בשוקולד שלא טומפר, כי הוא גמיש יותר ונדבק טוב יותר למילוי השומני.
    - >-
      מקררים את הטבלה במקפיא אחרי הסגירה, כדי שהשמן לא יספיק לזלוג מהמילוי.
  correct: 1
  explanation: >-
    Callebaut מורים להשאיר 1-1.5 מ"מ ולא למלא עד השפה. מילוי על השפה מונע מהסגירה להתחבר לקליפה, ונשאר
    סדק. מילוי חם מ־28°C ממיס את הקליפה, וסגירה לא מטומפרת לא משתחררת מהתבנית.
- id: q5
  question: >-
    הכנתם 10 טבלאות ממולאות פרלינה לבזאר בית ספר בעוד שבועיים. במטבח שלכם בקיץ 26-28°C. מה הכי ישמור עליהן
    מבריקות עד הבזאר?
  options:
    - >-
      מקרר רגיל באריזה פתוחה, כדי שהטבלאות יתקררו מהר ויישארו קשות עד הבזאר.
    - >-
      ארון במטבח, עטופות בנייר כסף, כי נייר כסף מחזיר חום ושומר על השוקולד קר.
    - >-
      מקום קבוע של 18-20°C, סגורות, ומילוי שהוקשה בשוקולד, כי פרלינה מאיצה פריחת שומן.
    - >-
      מקפיא בקופסה אטומה, ומוציאים אותן לחדר בבוקר הבזאר כדי שיתפשרו בזמן המכירה.
  correct: 2
  explanation: >-
    לפי Callebaut מילויי אגוזים מאיצים פריחת שומן, ומוצרים מוגמרים שומרים בטמפרטורה קבועה של 18-20°C.
    מקרר פתוח ומקפיא גורמים לעיבוי ולפריחת סוכר. אם אין ברירה אלא מקרר, אורזים סגור ומוציאים סגור (03.5).
- id: q6
  question: >-
    קילפתם דף טרנספר מעיגולי שוקולד לבן, ורק חצי מהדוגמה עברה. החצי השני נשאר על הדף. השוקולד היה ב־26°C
    כשפרסתם אותו, והוא היה סמיך. מה כנראה קרה?
  options:
    - >-
      השוקולד הלבן היה חם מדי, וחמאת הקקאו שבהדפס נמסה ונשארה על האצטט.
    - >-
      דפי טרנספר לא מתאימים לשוקולד לבן, כי אין בו מספיק חמאת קקאו כדי למשוך את הדוגמה.
    - >-
      העיגולים היו עבים מדי, ושוקולד עבה מתכווץ מהר מדי וקורע את ההדפס באמצע.
    - >-
      השוקולד היה קר מדי ולא נדבק להדפס; מחממים לטמפרטורת העבודה (לבן 28-29°C) ובודקים.
  correct: 3
  explanation: >-
    שוקולד קר מדי לא נדבק להדפס, והדוגמה יוצאת חלקית. שוקולד חם מדי דווקא מורח את הדוגמה. בלבן עובדים
    ב־28-29°C, ומקלפים רק אחרי התגבשות מלאה.
- id: q7
  question: >-
    שוקולטיירית מתחילה מכינה 30 ריבועי שוקולד עם טרנספר לחתונה. אחרי הקירור כל הריבועים מעוקלים בקצוות
    ולא עומדים ישר על העוגיות. מה הייתה הטעות?
  options:
    - >-
      לא הונח נייר אפייה ומגש שטוח מעל השוקולד עד שהתקשה, ולכן הוא התעקם כשהתכווץ.
    - >-
      השוקולד היה מטומפר מדי, ושוקולד עם יותר מדי גבישים תמיד מתעקם על אצטט.
    - >-
      היא חתכה את הריבועים בשלב העמום, ושוקולד רך מתעקם כשחותכים אותו בסכין.
    - >-
      היא קילפה את הדף אחרי שהשוקולד התקשה לגמרי, ומשיכת הדף כופפה את הקצוות.
  correct: 0
  explanation: >-
    שוקולד דק מתכווץ בעיקר בצד אחד ולכן מתעקם. משקולת שטוחה מעליו עד שהתקשה שומרת אותו ישר. חיתוך בשלב
    העמום הוא בדיוק הזמן הנכון, וקילוף אחרי התגבשות מלאה הוא הדרך הנכונה.
- id: q8
  question: >-
    ילדה בת 5 קיבלה מכם לוליפופ, ואחרי דקה השוקולד נפל מהמקל לרצפה. הלוליפופ הוכן חופשי על דף גיטרה.
    איך מונעים את זה בהזמנה הבאה?
  options:
    - >-
      משתמשים במקלות ארוכים יותר, כי מקל ארוך מפזר את המשקל ומחזיק את השוקולד טוב יותר.
    - >-
      מכניסים את קצה המקל 2-3 ס"מ לתוך השוקולד הנוזלי, מסובבים ומזלפים מעליו עוד שוקולד.
    - >-
      מכינים את הלוליפופ משוקולד ציפוי, כי הוא רך יותר ונצמד חזק יותר למקל מנייר.
    - >-
      מקררים את הלוליפופ במקפיא חצי שעה, כדי שהשוקולד יתכווץ סביב המקל ויינעל עליו.
  correct: 1
  explanation: >-
    השוקולד מחזיק את המקל רק כשהוא עוטף אותו מכל הצדדים לאורך כמה ס"מ. מקל ארוך יותר לא עוזר אם הקצה רק
    מונח על השוקולד. וגם עם מקל יציב, ילד קטן אוכל לוליפופ בהשגחה.
- id: q9
  question: >-
    גננת מזמינה 40 מטבעות שוקולד לחנוכה ומבקשת "שיהיו זהובים ונוצצים". בבית יש לכם אבקת נצנצים שכתוב עליה
    "לקישוט בלבד". מה התשובה המקצועית?
  options:
    - >-
      מפזרים מעט נצנצים רק על חלק מהמטבעות, ומסמנים לגננת אילו מהם לא לתת לילדים.
    - >-
      מערבבים את הנצנצים בשוקולד המותך, כי כך הם מכוסים בשוקולד ולא נוגעים ישירות בפה.
    - >-
      עוטפים את המטבעות בנייר זהב לשוקולד, ולא שמים על השוקולד אבקה שאינה מאכל.
    - >-
      משתמשים בנצנצים כרגיל, כי מטבעות שוקולד בחנויות תמיד מכוסים באבקות כאלה.
  correct: 2
  explanation: >-
    "לקישוט בלבד" אינו מאכל ולא נוגע בשוקולד שאוכלים, בשום כמות ובשום צורה. עטיפה בנייר זהב היא הדרך
    המסורתית למטבעות, והיא לא נאכלת. אבקה אכילה מותרת רק אם כתוב עליה במפורש שהיא מאכל (05.4).
- id: q10
  question: >-
    לקוחה שומרת כשרות מבקשת טבלה ממולאת "פרווה". השוקולד שלכם מסומן פרווה, ובמילוי יש פרלינה מסומנת פרווה
    וקורנפלקס. על דף הטרנספר שבחרתם לא כתוב שום הכשר. מה עושים?
  options:
    - >-
      מוכרים כפרווה, כי דף הטרנספר הוא רק קישוט ולכן לא משנה את הכשרות של הטבלה.
    - >-
      בודקים את ההכשר של הקורנפלקס, ומחליפים את דף הטרנספר בדף עם הכשר מתאים או בלי טרנספר.
    - >-
      כותבים על התווית "פרווה" ומוסיפים "ייתכן שמכיל חלב", וכך כל האפשרויות מכוסות.
    - >-
      מחליטים בעצמכם שהדף פרווה, כי רוב דפי הטרנספר עשויים מחמאת קקאו בלבד.
  correct: 1
  explanation: >-
    כל רכיב שנאכל קובע, וגם ההדפס של דף הטרנספר נאכל. בודקים מה כתוב על האריזה של כל רכיב, ואם לא כתוב,
    מחליפים או שואלים. הקורס לא פוסק הלכה: אם יש ספק, שואלים את הרב.
