- id: q1
  question: >-
    שעה לפני שהאורחים מגיעים, הגנאש לטראפלס (מריר 72%, 150 גרם שוקולד ו־45 גרם שמנת) יצא שמנוני
    וגרגרי. מה עושים?
  options:
    - >-
      מוסיפים עוד 50 גרם שוקולד מומס, כדי שהשומן העודף ייקשר בשוקולד הנוסף.
    - >-
      מכניסים לרבע שעה למקפיא, כדי שהשומן יתקשה בתוך הגנאש ולא יצוף.
    - >-
      מוסיפים כפית מים פושרים ומקציפים, וחוזרים עד שהגנאש חלק ומבריק.
    - >-
      מוותרים על הטראפלס ומגישים את הגנאש כרוטב, כי גנאש שנפרד לא חוזר.
  correct: 2
  explanation: >-
    45 גרם שמנת הם 30% מהשוקולד, פחות מ־33%, ובמריר 72% יש מעט סוכר שנמס במים. חסר נוזל, ולכן King
    Arthur מוסיפים מים פושרים בכפיות. עוד שוקולד מחמיר, וקור לא מחזיר אמולסיה.
- id: q2
  question: >-
    הבת שלכם רוצה טראפלס משוקולד לבן. היא שוקלת 100 גרם שוקולד לבן ו־50 גרם שמנת, כמו במתכון
    המריר. מה תגידו לה?
  options:
    - >-
      שבשוקולד לבן צריך יותר שוקולד, בערך 150 גרם על 50 גרם שמנת, אחרת לא יתגלגל.
    - >-
      שהיחס בסדר, אבל צריך לחמם את השמנת לרתיחה מלאה כדי שהלבן יימס עד הסוף.
    - >-
      שהיחס בסדר, כי מה שקובע את המרקם הוא רק אחוז השומן שיש בשמנת שקנתה.
    - >-
      שצריך פחות שוקולד, בערך 70 גרם, כי שוקולד לבן מתקשה הרבה יותר ממריר.
  correct: 0
  explanation: >-
    בלבן אין מוצקי קקאו שמקשים, והסוכר ואבקת החלב מרככים (McGill ו־Hartel). לכן לטראפלס לבן מתחילים
    ב־3:1, ו־Valrhona שמים פי 2.3 יותר שוקולד לבן ממריר על אותה שמנת. שמנת ללבן: 60-65°C, לא רתיחה.
- id: q3
  question: >-
    יום שישי באוגוסט, במטבח 29°C ואין מזגן. הגנאש מתגלגל רע ונמרח על הכפפות. מה התוכנית הסבירה?
  options:
    - >-
      להוסיף לגנאש 2 כפות אבקת קקאו, כדי שהוא יתייבש ויתגלגל בקלות גם בחום.
    - >-
      לעבור לגלגול בידיים חשופות, כי כפפות מחממות את הידיים ומרככות את הגנאש.
    - >-
      לחמם את הגנאש ל־35°C ולגלגל אותו נוזלי, כי בחום ממילא הוא לא יתקשה.
    - >-
      לחלק לגושים, לקרר 10 דקות, לגלגל במנות קטנות ולהחזיר את המגש למקרר כל פעם.
  correct: 3
  explanation: >-
    חמאת קקאו נמסה מתחת לחום היד ובחדר חם הגנאש מתרכך מהר. עובדים במנות, ומחזירים למקרר בכל פעם
    שהוא נמרח. קקאו בגנאש משנה את היחס, וידיים חשופות מחממות יותר ופחות היגייניות.
- id: q4
  question: >-
    לקוחה שואלת אם הטראפלס שהכנתם (שוקולד ושמנת בלבד, מצופים בקקאו) יכולים לחכות לה שבוע בקופסה
    על השיש. מה עונים?
  options:
    - >-
      שכן, כי בשוקולד יש מספיק סוכר שמשמר את השמנת שבתוך הטראפלס.
    - >-
      שלא: גנאש כזה נמדד ב־aw של 0.85-0.88, ושומרים אותו במקרר עד כשבועיים.
    - >-
      שכן, אם הקופסה סגורה היטב, כי בלי אוויר עובשים לא יכולים לגדול.
    - >-
      שלא, כי אחרי יומיים הקקאו מתייבש, אבל מבחינת בטיחות אין בעיה.
  correct: 1
  explanation: >-
    Kansas State מדדו גנאש ביתי ב־0.85-0.88, טווח שבו רוב העובשים וסטפילוקוקוס עוד גדלים, וקבעו
    שהוא צריך קירור. קופסה סגורה לא מונעת גדילה. Keylink: גנאש מריר וחלב עד שבועיים במקרר.
- id: q5
  question: >-
    אתם מכינים טראפלס הל לחנוכה. חלטתם 30 גרם שמנת עם הל, ואחרי הסינון נשארו 22 גרם. במתכון 20 גרם
    שמנת על 50 גרם שוקולד חלב. מה הצעד הבא?
  options:
    - >-
      שופכים את כל 22 הגרם, כי יותר שמנת עם הל פירושה יותר טעם בטראפלס.
    - >-
      מוסיפים 8 גרם שמנת טרייה, כדי לחזור למשקל שהתחלתם איתו בחליטה.
    - >-
      שוקלים 20 גרם, מחממים ל־60-65°C ושופכים על השוקולד שנמס חלקית.
    - >-
      שופכים את השמנת הקרה על שוקולד מומס חם, כדי שההל לא ימשיך לחלוט.
  correct: 2
  explanation: >-
    שומרים על היחס של המתכון. ההל סופח שמנת, ולכן חולטים עם עודף ושוקלים אחרי הסינון. לשוקולד חלב
    מחממים ל־60-65°C. שמנת קרה על גנאש חם היא אחת הסיבות להיפרדות.
- id: q6
  question: >-
    לקוח שומר כשרות מזמין טראפלס עם קוניאק. יש לכם בקבוק קוניאק שקיבלתם מחו"ל, בלי הכשר. מה
    עושים?
  options:
    - >-
      משתמשים בו, כי הגנאש עם שמנת ממילא חלבי, והקוניאק לא משנה את זה.
    - >-
      משתמשים בו, אבל מחממים אותו עם השמנת כדי שהאלכוהול יתנדף לגמרי.
    - >-
      משתמשים בו, כי משקאות מזוקקים לא צריכים הכשר, רק יין שלא זוקק.
    - >-
      קונים בקבוק עם הכשר שהלקוח סומך עליו, או מציעים טעם בלי אלכוהול.
  correct: 3
  explanation: >-
    קוניאק הוא ברנדי מענבים, ו־OU מסבירים שהכשרות שלו תלויה ביין, בחביות ובפיקוח. Star-K מונים
    קוניאק וכל הליקרים כמשקאות שצריכים הכשר. חימום לא משנה כשרות. אם יש ספק, שואלים את הרב.
- id: q7
  question: >-
    הוספתם 25 גרם טחינה לגנאש של 50 גרם שוקולד חלב ו־20 גרם שמנת, והוא נעשה שמנוני. למה, ומה
    עושים?
  options:
    - >-
      בטחינה כמחצית שומן ומעט מים. מוסיפים כפית מים פושרים, ובפעם הבאה פחות טחינה.
    - >-
      בטחינה הרבה מים שגרמו לשוקולד להיתפס. מחממים ל־60°C עד שהמים מתאדים.
    - >-
      הטחינה קיררה את הגנאש מתחת ל־20°C. מקררים עוד במקרר עד שהוא מתקשה.
    - >-
      הטחינה חומצית ופירקה את השמנת. מוסיפים סודה לשתייה כדי לנטרל אותה.
  correct: 0
  explanation: >-
    לפי USDA בטחינה כ־54% שומן וכ־3% מים. 25 גרם הם חצי ממשקל השוקולד, ואין מספיק נוזל לכל השומן.
    כפית מים פושרים מחזירה את האיזון; בפעם הבאה עד כ־20% ממשקל השוקולד, בסוף, ב־35-40°C.
- id: q8
  question: >-
    טבלתם טראפלס שיצאו ישר מהמקפיא בשוקולד מטומפר. אחרי שעה הקליפות מלאות סדקים. מה הסיבה?
  options:
    - >-
      השוקולד היה מטומפר יותר מדי, ולכן התקשה מהר מדי ונשבר מעצמו.
    - >-
      הגנאש הקפוא התרחב כשהתחמם, ושבר את הקליפה הדקה שכבר התקשתה.
    - >-
      הקקאו על הטראפלס ספג לחות מהמקפיא, והמים פוררו את קליפת השוקולד.
    - >-
      השוקולד לא היה מטומפר, ולכן הוא מתכווץ ונסדק כשהוא מתקשה בחדר.
  correct: 1
  explanation: >-
    גנאש קפוא מתרחב כשהוא מתחמם, והקליפה הדקה כבר קשה ולא נמתחת. טובלים טראפלס מהמקרר (4-8°C),
    ועושים ציפוי ראשון דק ביד. שוקולד לא מטומפר נשאר רך, לא נסדק.
- id: q9
  question: >-
    אתם מתכננים לשלוח טראפלס ללקוחות ורוצים שיחזיקו יותר. מה השינוי הנכון במתכון, ומה עוד צריך
    לפני שכותבים תאריך ארוך?
  options:
    - >-
      להוסיף עוד שמנת 38%, כי השומן מגן על הגנאש, ולכתוב 3 שבועות.
    - >-
      לטבול בשוקולד מטומפר, כי הקליפה מורידה את פעילות המים, ולכתוב חודש.
    - >-
      להוסיף כף אלכוהול לכל גנאש, כי אלכוהול לבדו מספיק, ולכתוב חודשיים.
    - >-
      להוסיף גלוקוזה וחמאה במקום חלק מהשמנת, ואז למדוד aw ולעשות ניסוי מלא.
  correct: 3
  explanation: >-
    גלוקוזה קושרת מים, וחמאה מכילה כ־16% מים מול כ־58% בשמנת. אבל Callebaut כותבים שאף מדידה לא
    חוזה חיי מדף לבד, ומבטיחים תאריך רק אחרי ניסוי באורך המלא. קליפה לא משנה את ה־aw של הגנאש.
- id: q10
  question: >-
    אחרי 10 ימים במקרר, על טראפלס אחד בקופסה יש נקודה לבנה צמרירית, והשאר נראים תקינים. מה עושים?
  options:
    - >-
      זורקים את כל הקופסה, ובפעם הבאה בודקים כפפות, ניקיון ותאריך קצר יותר.
    - >-
      מגרדים את הנקודה ומגישים, כי עובש על שוקולד הוא כמו פריחת סוכר.
    - >-
      זורקים רק את הטראפלס הזה, ואת השאר אוכלים באותו יום ליתר ביטחון.
    - >-
      ממיסים את כל הטראפלס לשוקו חם, כי החום יהרוג את כל מה שגדל עליהם.
  correct: 0
  explanation: >-
    נקודה צמרירית היא עובש, לא פריחה (פריחה חלקה ואחידה, 03.5). עובש יכול להתפשט בתוך מזון רך
    ולשאר הטראפלס באותה קופסה. זה המקרה היחיד בקורס שבו זורקים, ולא מצילים לשוקו.
