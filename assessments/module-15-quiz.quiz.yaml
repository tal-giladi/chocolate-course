- id: q1
  question: >-
    דנה מוכרת מארזי חג ללקוחות פרטיים. משרד מציע לה הזמנה של 50 מארזים לראש השנה, למסירה ביום אחד.
    מארז לוקח לה 30 דקות, ובשבועיים שלפני החג יש לה 20 שעות פנויות שכבר חלקן תפוסות בהזמנות פרטיות.
    מה הצעד הראשון?
  options:
    - >-
      לקבל מיד, כי הזמנה של חברה היא הכנסה בטוחה, ואת הזמן אפשר תמיד למצוא בלילות.
    - >-
      לבדוק כמה עולה מארז דומה בגיפטוש ולתמחר את ההזמנה לפי המחיר שמוצג שם.
    - >-
      לחשב: 50 × 30 דקות הן 25 שעות, ולבדוק מול השעות שנשארו אחרי ההזמנות הפרטיות.
    - >-
      לבקש מהמשרד לפצל את ההזמנה לשני חגים, כדי שהעבודה תתחלק על פני השנה.
  correct: 2
  explanation: >-
    הזמנה של חברה היא הרבה מאותו דבר במועד אחד, באותם שבועות שבהם גם הלקוחות הפרטיים מזמינים (15.1).
    קודם בודקים שעות מול זמן פנוי, ורק אחר כך עלות ומחיר. מחיר של מתחרה לא קובע את המחיר שלכם.
- id: q2
  question: >-
    יוסי פתח עוסק פטור. ועד עובדים מבקש ממנו מתנות לפסח ו"חשבונית מס כמו תמיד". מה נכון לפי מה
    שלמדנו?
  options:
    - >-
      עוסק פטור אינו רשאי להוציא חשבונית מס, ולכן יוסי שואל רואה חשבון לפני שהוא מתחייב.
    - >-
      עוסק פטור מוציא חשבונית מס רגילה, אלא שהמע"מ בה הוא אפס, וזה מספיק לוועד.
    - >-
      ועד עובדים פטור ממע"מ, ולכן אין משמעות לסוג המסמך שיוסי ישלח בסוף ההזמנה.
    - >-
      יוסי יכול להוציא חשבונית מס רק אם ההזמנה מעל 5,000 ₪ ויש לה מספר הקצאה.
  correct: 0
  explanation: >-
    לפי כל זכות, עוסק פטור אינו גובה מע"מ ואינו רשאי להוציא חשבונית מס. מספר הקצאה נדרש בחשבונית מס
    מעל 5,000 ₪ לפני מע"מ, וזה לא הופך עוסק פטור לעוסק שמוציא חשבונית מס. זו שאלה לרואה חשבון.
- id: q3
  question: >-
    רונית בונה מחקר שוק. מתחרה מוכר מארז 6 פרלינים ב־40 ₪, ואחר מארז 24 ב־220 ₪. היא כותבת בטבלה
    "השני יקר מאוד". מה צריך להיות כתוב?
  options:
    - >-
      "השני יקר מאוד", כי זו מסקנה חשובה שעוזרת לה להבין איפה כדאי לה למקם את עצמה.
    - >-
      רק את המחיר הזול, כי המחקר נועד למצוא את המחיר הנמוך ביותר למוצר הזה בשוק.
    - >-
      את מחירי המארזים בלבד, כי ₪ ליחידה רלוונטי רק למוצרים שנמכרים לפי משקל בגרמים.
    - >-
      מחיר, יחידות ו־₪ ליחידה (6.67 מול 9.17), עם תאריך בדיקה, בלי שם תואר על העסק.
  correct: 3
  explanation: >-
    מחקר שוק רושם עובדות עם תאריך ומשווה ₪ ליחידה (40 ÷ 6, 220 ÷ 24). "יקר" הוא דעה, לא מידע, וגם
    לא הוגן כלפי עסק אחר. מתחרים הם דוגמה ניטרלית (15.2).
- id: q4
  question: >-
    מארז בונבונים של מתחרה מוצג ב־118 ₪. המשלוח לעיר שלכם עולה 30 ₪, ומעל 299 ₪ הוא בחינם. מה רושמים
    בטבלת המחקר?
  options:
    - >-
      148 ₪ בעמודת המחיר, כי זה מה שהלקוח משלם בפועל, והמשלוח הוא חלק מהמחיר.
    - >-
      118 ₪ בעמודת המחיר, ובעמודת המשלוח "30 ₪ לעיר שלי, חינם מ־299 ₪", עם תאריך.
    - >-
      118 ₪ בלבד, כי משלוח הוא עניין לוגיסטי שלא קשור למחקר מחירים של מוצרים.
    - >-
      100 ₪, כלומר המחיר בלי מע"מ, כי כך משווים בין עסקים שאולי לא גובים מע"מ.
  correct: 1
  explanation: >-
    מחיר ומשלוח רושמים בעמודות נפרדות, ואז אפשר לחשב גם "מחיר עד הדלת" לעיר שלכם. המחיר שמוצג לצרכן
    כולל מע"מ לפי החוק, ולכן משווים אותו כמו שהוא (15.2).
- id: q5
  question: >-
    שירה מכינה מחקר באמצע נובמבר. בדף של עסק בירושלים עדיין מופיעה קטגוריה של "שנה טובה", ובאתר
    מתנות כבר יש קטגוריה של חנוכה. מה הכי נכון לעשות עם זה?
  options:
    - >-
      להתעלם, כי קטגוריות באתרים הן עניין של עיצוב ולא אומרות דבר על הביקוש.
    - >-
      לרשום כעובדה עם תאריך, ולהשתמש בזה כבדיקה של טבלת העונתיות כשחוזרים לדפים לפני החג.
    - >-
      להסיק שבירושלים הביקוש לראש השנה נמשך עד חנוכה, ולתכנן מוצרי ראש השנה לנובמבר.
    - >-
      לכתוב לעסק בירושלים שהקטגוריה ישנה, כדי ליצור קשר טוב עם מתחרה פוטנציאלי.
  correct: 1
  explanation: >-
    מה שרואים בדף רושמים כעובדה עם תאריך, בלי להסיק ממנו יותר ממה שהוא אומר. חזרה לאותם דפים לפני כל
    חג היא דרך פשוטה לבדוק את הערכת העונתיות שלכם (15.2).
- id: q6
  question: >-
    מיכל רוצה נישה של "כשר למהדרין". כל חומרי הגלם שלה בהכשר מהדרין, אבל אין לה תעודת הכשר למטבח. מה
    היא יכולה לכתוב בדף המוצר?
  options:
    - >-
      "כשר למהדרין", כי מה שקובע הוא הכשר הרכיבים, והמטבח שלה שומר כשרות.
    - >-
      "כשר למהדרין (לפי הרכיבים)", כי ההסבר בסוגריים מבהיר ללקוח מה בדיוק נבדק.
    - >-
      "כשר" בלי "מהדרין", כי רק "מהדרין" דורש תעודה ואילו "כשר" רגיל לא דורש.
    - >-
      שום טענה של "כשר"; אם בכלל, תיאור של חומרי הגלם בלי המילה, ולשאול על תעודה.
  correct: 3
  explanation: >-
    לפי חוק איסור הונאה בכשרות, יצרן לא יציין שמוצר כשר בלי תעודת הכשר. לפי פסיקה שמתוארת במקורות,
    מותר לתאר סטנדרטים בלי המילה "כשר", אבל זה לא תחליף לתעודה. נישה בלי הוכחה מחכה (15.3, מודול 17).
- id: q7
  question: >-
    אבי מוכר מארז "ללא סוכר" ממותק במלטיטול. לקוח שואל: "זה מתאים לאבא שלי, שיש לו סוכרת?" מה אבי
    עונה?
  options:
    - >-
      שהמארז ממותק במלטיטול, שבכמות הוא עלול לגרום לשלשול, ושעל סוכרת שואלים רופא.
    - >-
      שכן, כי "ללא סוכר" אומר שהמוצר לא משפיע על הסוכר בדם, ולכן הוא מתאים לסוכרתיים.
    - >-
      שכן, אבל רק מריר 70% ומעלה, כי באחוז קקאו גבוה אין השפעה על רמת הסוכר בדם.
    - >-
      שלא, כי מלטיטול אסור לסוכרתיים לפי החוק, ולכן אסור למכור להם את המארז הזה.
  correct: 0
  explanation: >-
    אסור לייחס למזון ריפוי או מניעת מחלה, ולכן העסק לא קובע מה מתאים לסוכרתי. אומרים מה במוצר, נותנים
    את אזהרת המלטיטול (13.2), ומפנים לרופא. הנישה היא "בלי תוספת סוכר", לא "בריא" (15.3).
- id: q8
  question: >-
    נועה בוחרת נישה. "ללא אגוזים" קיבלה הכי הרבה נקודות בביקוש, אבל היא מכינה גם פרלינה באותו מטבח.
    מה ההחלטה הנכונה?
  options:
    - >-
      לבחור בה, ולכתוב "ללא אגוזים" על המארזים שבהם אין פרלינה, גם אם הם מאותו מטבח.
    - >-
      לבחור בה, ולנקות היטב את הכלים אחרי כל הכנה של פרלינה, וכך ההבטחה תהיה נכונה.
    - >-
      לא לבחור בה עכשיו: "ללא" הוא הבטחה שדורשת בקרה שאין לה, ולרשום מה חסר.
    - >-
      לבחור בה רק לאירועים, כי שם האורחים יודעים לשאול על אלרגנים לפני שהם אוכלים.
  correct: 2
  explanation: >-
    "ללא" הוא הבטחה, לא תיאור, והוא דורש בקרה מחמירה שאין במטבח ביתי משותף (14.3). נישה עם ציון 1
    בהוכחה לא נבחרת עכשיו, גם עם ביקוש. רושמים מה חסר ומתחילים מההפרדה של מודול 14.
- id: q9
  question: >-
    תמר בחרה מארזי חג לבית כמודל ראשי, ומתלבטת על מודל משני. היא עובדת שכירה ורוצה הכנסה גם בחודשים
    השקטים. מה הכי מתאים לפי התרשים בשיעור?
  options:
    - >-
      מתנות לחברות, כי הן מגיעות באותם חגים, וכך אפשר לקנות חומרי גלם לשני המודלים יחד.
    - >-
      מארזי חג גם לט"ו באב ולוולנטיין, כי כך כל החגים בשנה מכוסים במודל אחד.
    - >-
      סדנאות לחברות בחנוכה, כי בחנוכה יש חופשה ואז גם הביקוש לסדנאות הכי גבוה.
    - >-
      מנוי חודשי קטן או אירועים, כי הם מתפזרים על השנה ולא נופלים על שבועות החג.
  correct: 3
  explanation: >-
    מארזי חג ומתנות לחברות מתנגשים על אותם שבועות. מנוי ואירועים מפזרים עבודה על פני השנה, ולכן הם
    משלימים מודל עונתי. במנוי צריך לתכנן את יולי ואוגוסט בגלל החום (15.1).
- id: q10
  question: >-
    עמית שוקל סדנאות שוקולד בבית. לפי כתבה שיווקית מ־2020, סדנה בבית או באירוע תומחרה 100-200 ₪
    למשתתף. איך הוא משתמש במספר הזה?
  options:
    - >-
      כסדר גודל ישן בלבד: בודק מחירים עדכניים במחקר שוק, ורושם שאלות על מקום, ביטוח ורישוי.
    - >-
      כמחיר שלו, באמצע הטווח, כי מחיר שפורסם בעיתון הוא מחיר שהשוק כבר קיבל.
    - >-
      כהוכחה שסדנאות רווחיות, כי חומרי הגלם למשתתף עולים רק כמה שקלים בכל סדנה.
    - >-
      כמחיר מינימום, כי מאז 2020 המחירים רק עלו, ולכן אפשר להתחיל מ־200 ₪ ומעלה.
  correct: 0
  explanation: >-
    נתון ישן ממקור שיווקי הוא הקשר, לא מחיר ולא תחזית. בודקים מחירים עדכניים (15.2), ורושמים שאלות
    פתוחות על מקום לקבוצה, ביטוח ורישוי (מודול 16) לפני שמחליטים (15.1).
