- id: q1
  question: >-
    לקוחה בחנות האונליין שלכם כותבת: "אני סוכרתית, תגידו לי איזה מהשוקולדים שלכם מתאים לי". מה
    עונים לה?
  options:
    - >-
      ממליצים על המריר 85%, כי בו הכי מעט סוכר ולכן הוא מתאים לסוכרתיים בכל כמות.
    - >-
      ממליצים על הגרסה עם המלטיטול, כי ממתיק לא מעלה סוכר בדם ולכן היא בטוחה לגמרי עבורה.
    - >-
      שולחים עובדות לכל מוצר (סוכר ליחידה, הממתיק, משקל), ומציעים לה לבדוק את ההתאמה עם הרופא.
    - >-
      לא עונים בכלל, כי לפי החוק אסור לעסק לכתוב ללקוח שום מידע תזונתי על המוצרים.
  correct: 2
  explanation: >-
    "מתאים לסוכרתיים" מייחס למזון השפעה על מחלה, וסעיף 13 לחוק המזון אוסר זאת בסימון ובפרסום.
    עובדות כמו סוכר ליחידה והממתיק בשמו מותרות, וההחלטה הרפואית היא של הלקוחה והרופא שלה.
- id: q2
  question: >-
    בבר מצווה הנחתם מגש דיסקיות "ללא תוספת סוכר" עם מלטיטול, וקבוצת ילדים מתחילה לאכול מהן בחופשיות.
    מה הכי נכון לעשות?
  options:
    - >-
      להעביר את המגש למבוגרים, ולומר להורים שיש בדיסקיות מלטיטול שבכמות גורם לגזים ולשלשול.
    - >-
      להשאיר את המגש, כי שוקולד בלי סוכר בטוח לילדים יותר משוקולד רגיל בכל כמות.
    - >-
      להחליף בשוקולד חלב רגיל, ולזרוק את דיסקיות המלטיטול שכבר נגעו בהן ידיים.
    - >-
      להגיד לילדים לשתות הרבה מים, כי מים מבטלים את ההשפעה של מלטיטול על מערכת העיכול.
  correct: 0
  explanation: >-
    מלטיטול גורם לגזים ולשלשול בכמות ולא מתאים לילדים בכמויות. במחקר של Storey, כבר 40 גרם בבת
    אחת אצל צעירים נתנו תסמינים, וילד שוקל הרבה פחות. מגבילים מנה ואומרים מה יש בשוקולד.
- id: q3
  question: >-
    אתם רוצים להחליף את מארז הדיסקיות של 20 גרם שוקולד חלב בגרסה "קלה יותר" באותו מחיר. איזו החלפה
    מורידה גם סוכר וגם קלוריות ליחידה?
  options:
    - >-
      דיסקיות של 20 גרם ממריר 80%, כי לפי USDA יש בו חצי סוכר וחצי קלוריות לעומת חלב.
    - >-
      דיסקיות של 20 גרם עם 40% אגוזים, כי אגוזים מורידים את הקלוריות בכל ביס בחצי.
    - >-
      דיסקיות של 20 גרם חלב עם מלטיטול, כי ממתיק מוריד את הקלוריות ואת השומן הרווי ביחד.
    - >-
      דיסקיות של 10 גרם ממריר 70-85%, כי מנה קטנה מורידה הכול, והמריר מוריד עוד סוכר.
  correct: 3
  explanation: >-
    לפי USDA, בחלב כ־51.5 גרם סוכר ו־535 קק"ל ל־100 גרם, ובמריר 70-85% כ־24 גרם ו־598 קק"ל.
    המריר מוריד סוכר אבל לא קלוריות; רק מנה קטנה מורידה את כל הערכים יחד.
- id: q4
  question: >-
    בטעימה עיוורת של שלושה ריבועים, טועמת אומרת שאחד מהם "מקרר את הפה כמו מנטה" וקצת גרגירי. מה
    כנראה יש בו, ואיך מתקנים במוצר מסחרי?
  options:
    - >-
      אלולוזה, ומתקנים בחימום חוזר של השוקולד מעל 50°C כדי להמיס את הגבישים שלה.
    - >-
      אריתריטול לא מומס, ומאזנים בתערובת עם אינולין או פולידקסטרוז ובטחינה דקה יותר.
    - >-
      מלטיטול, ומתקנים בהוספת עוד חמאת קקאו כדי לעטוף את הגבישים ולמנוע קירור.
    - >-
      סטיביה, ומתקנים בהגדלת הכמות שלה כדי שהמתיקות תסתיר את תחושת הקור בפה.
  correct: 1
  explanation: >-
    אריתריטול סופג חום כשהוא מתמוסס בפה, ולכן מרגישים קירור, בעיקר כשהוא לא מומס מראש כמו בטבלה.
    מוצרים מסחריים מאזנים אותו עם רכיבים כמו אינולין או פולידקסטרוז.
- id: q5
  question: >-
    ספק מציע לכם "אבקת קקאו גולמית, לא עברה חום מעל 42°C" לכדורי אנרגיה שתמכרו. מה שואלים לפני
    שמזמינים?
  options:
    - >-
      רק מה הכשרות שלה, כי שאלות של בטיחות מזון באבקה יבשה רלוונטיות רק לשוקולד מוצק.
    - >-
      רק מה אחוז השומן שלה, כי אבקה עם יותר שומן מגינה טוב יותר מפני חיידקים.
    - >-
      האם יש בתהליך שלב מאומת להפחתת סלמונלה או בדיקה לכל אצווה, כי היא לא נקלתה.
    - >-
      רק מה תאריך התפוגה, כי באבקה יבשה חיידקים מתים מעצמם תוך כמה שבועות על המדף.
  correct: 2
  explanation: >-
    לפי ה־NCA, קלייה היא הדרך העיקרית להשמיד חיידקים בקקאו, וקקאו גולמי נחשב מזוהם בפוטנציה.
    סלמונלה שורדת במזון יבש חודשים, ולכן שואלים על תהליך מאומת או בדיקות אצווה.
- id: q6
  question: >-
    המסתם 150 גרם מריר להכנת טבלה, והוספתם 20 גרם סילאן כדי להמתיק. השוקולד הפך לגוש מט. מה עושים
    עכשיו?
  options:
    - >-
      מוסיפים בהדרגה שמנת חמה או קרם קוקוס חם עד שמתקבל רוטב או גנאש חלק.
    - >-
      ממשיכים לחמם עד 60°C, כדי שהמים שבסילאן יתאדו והשוקולד יחזור לטמפרור.
    - >-
      מוסיפים כף חמאת קקאו מומסת, כי השומן הנוסף עוטף את הסילאן ומחזיר ברק.
    - >-
      זורקים, כי שוקולד שנתפס ממים לא מתאים יותר לשום שימוש במטבח.
  correct: 0
  explanation: >-
    סילאן מביא מים, ומעט מים תופסים שוקולד (02.1). הרבה נוזל מציל אותו כאמולסיה, כלומר רוטב או
    גנאש. סילאן נכנס לשוקולד רק דרך נוזל או מילוי, לא בערבוב לשוקולד מומס.
- id: q7
  question: >-
    הכנתם 30 כדורי תמרים, טחינה וקקאו לדוכן בשוק ביום שישי, ושואלים אתכם מה לכתוב על המדבקה. מה
    נכון?
  options:
    - >-
      "ללא תוספת סוכר, מומלץ לאכול עד חודש מהיום", כי לא נוסף סוכר לבן ובתמרים יש מעט מים.
    - >-
      "טבעי ובריא, בלי סוכר", כי סוכר מפירות לא נספר כסוכר ואין צורך לפרט רכיבים.
    - >-
      "ללא סוכר, לשמור בחוץ", כי טחינה וקקאו מונעים עובש גם בטמפרטורת החדר.
    - >-
      "ממותק בתמרים, מכיל שומשום, לשמור במקרר ולאכול תוך שבוע", ותאריך ההכנה.
  correct: 3
  explanation: >-
    תמרים הם "מזון שמשמש למתיקות", ולכן לא "ללא תוספת סוכר" לפי ההגדרה האירופית, ו"בריא" אסור.
    פירות יבשים יושבים קרוב לגבול שבו עובשים גדלים, ולכן בלי מדידה: מקרר ושבוע. טחינה = שומשום.
- id: q8
  question: >-
    החטיפים עם שקדים קלויים ופטל מיובש בהקפאה יצאו יפים, אבל אחרי שבוע במטבח בקיץ הפטל רך והחטיפים
    מנומרים בלבן. מה משנים בפעם הבאה?
  options:
    - >-
      מאחסנים במקרר פתוח, כדי שהקור יחזיר את הפריכות לפטל וימנע את הכתמים.
    - >-
      מוותרים על טמפרור, כי בחטיף עם אגוזים הוא ממילא לא מחזיק יותר מכמה ימים.
    - >-
      לוחצים את הפטל לתוך השוקולד, אורזים בקופסה אטומה, ושומרים ב־18-20°C קבוע.
    - >-
      מוסיפים יותר פטל מיובש, כי הוא סופג את הלחות ומגן על שאר החטיף מפני פריחה.
  correct: 2
  explanation: >-
    פירות מיובשים בהקפאה סופגים לחות מהאוויר, ולכן מכסים אותם בשוקולד וסוגרים. Callebaut כותבים
    שמילויים על בסיס שומן, כמו אגוזים, מקדימים פריחת שומן, וממליצים על 18-20°C קבוע.
- id: q9
  question: >-
    אתם ממלאים טבלה תזונתית לטבלת מריר עם מלטיטול. השותף רוצה לכתוב את המלטיטול בשורת הסוכרים "כדי
    להיות שקופים". מה נכון?
  options:
    - >-
      הוא צודק, כי כל רכיב מתוק נכנס לשורת הסוכרים לפי תקנות הסימון התזונתי בישראל.
    - >-
      המלטיטול נכנס לשורה נפרדת "רב כהליים", שכלולה בפחמימות אבל לא בסוכרים.
    - >-
      המלטיטול לא מופיע בטבלה בכלל, כי הוא תוסף מזון ונכתב רק ברשימת הרכיבים.
    - >-
      המלטיטול נכנס לשורת הסיבים התזונתיים, כי רובו מגיע למעי הגס כמו סיב.
  correct: 1
  explanation: >-
    לפי תקנות הסימון התזונתי, "סוכרים" לא כוללים רב־כוהלים, אבל "פחמימות" כן; רב־כוהלים בשורה
    נפרדת מ־0.5 גרם ל־100 גרם, 2.4 קק"ל לגרם (אריתריטול 0). שקיפות היא שורה נכונה ואזהרה.
- id: q10
  question: >-
    לפני הדפסת 500 מדבקות לטבלאות עם מלטיטול, בדקתם ולא מצאתם תקנה ישראלית שמחייבת אזהרה על שוקולד.
    מה עושים?
  options:
    - >-
      מדפיסים עם אזהרת אפקט משלשל, ומבררים בלשכת הבריאות את הכלל הנוכחי לפני ההדפסה הבאה.
    - >-
      מדפיסים בלי אזהרה, כי מה שלא מחויב במפורש אסור להוסיף לתווית של מזון ארוז.
    - >-
      מדפיסים "מתאים לכל המשפחה" במקום אזהרה, כדי שהלקוחות לא יירתעו מהמוצר החדש.
    - >-
      מחכים עם כל המכירות עד 2028, כי עד שהסימון האירופי יחול אי אפשר למכור מוצר עם ממתיק.
  correct: 0
  explanation: >-
    באיחוד האירופי מזון עם יותר מ־10% רב־כוהלים מוספים חייב באזהרה, וטיוטה ישראלית מ־2026 מאמצת
    את כללי הסימון האירופיים מ־2028. אזהרה מוגזמת לא מזיקה, והבירור מול הרשות סוגר את השאלה.
