- id: q1
  question: >-
    היום 20 בנובמבר. הזמנתם תבנית סביבון מחו"ל, והחנות כותבת שהמשלוח יגיע "בעוד 3-5 שבועות". חנוכה
    מתחיל ב־4 בדצמבר. מה התוכנית הסבירה?
  options:
    - >-
      לחכות לתבנית ולדחות את כל ייצור החנוכה עד שהיא תגיע, גם אם זה יהיה באמצע החג.
    - >-
      לבטל את ההזמנה ולהכין רק מטבעות, כי סביבון בלי תבנית לא ייראה כמו סביבון.
    - >-
      להכין עכשיו מטבעות וחנוכיות, ולתכנן סביבונים מחלקים כמו ב־08.2; אם התבנית תגיע בזמן, בונוס.
    - >-
      להכין את כל המארזים כבר השבוע, כולל סביבונים, ולשמור אותם במקרר עד שהתבנית תגיע.
  correct: 2
  explanation: >-
    שוקולד מוצק מחזיק שבועות ב־18-20°C, ולכן מכינים מה שאפשר מוקדם. סביבון מחלקים לא תלוי בתבנית. מקרר
    לא מאריך חיי מדף של שוקולד מוצק ומוסיף עיבוי.
- id: q2
  question: >-
    בבוקר ט"ו בשבט אתם מוציאים מהמקרר תמרים ממולאים בשקד וטובלים אותם מיד. אחרי שעה השוקולד מנוקד
    בטיפות ובכתמים לבנים. מה היה צריך לעשות?
  options:
    - >-
      להוציא את התמרים שעה לפני ולייבש אותם בנייר, כדי שלא יזיעו מתחת לשוקולד.
    - >-
      לחמם את השוקולד ל־40°C בזמן הטבילה, כדי שהתמר הקר לא יקרר אותו.
    - >-
      לטבול את התמרים קפואים, כי שוקולד מתקשה עליהם מהר יותר ולא מספיק להיפגע.
    - >-
      לצפות את התמרים בשכבת אבקת סוכר לפני הטבילה, כדי לספוג את הלחות.
  correct: 0
  explanation: >-
    פרי קר שיוצא לחדר מעבה לחות; מים על שוקולד גורמים להיתפסות ולפריחת סוכר. שוקולד ב־40°C איבד טמפר,
    ותמר קפוא מזיע עוד יותר.
- id: q3
  question: >-
    שכנה מכינה 30 משלוחי מנות: בכל אחד תפוז, בקבוק מיץ, עוגיות מהתנור ושלושה טראפלס שמנת, והילדים
    יחלקו עד הצהריים. מה הייתם משנים קודם?
  options:
    - >-
      את הבקבוק, כי משקל המיץ מועך את הטראפלס, ושום דבר אחר במשלוח לא בעייתי.
    - >-
      את התפוז, כי פרי הדר משחרר שמנים שהופכים את השוקולד למר.
    - >-
      את העוגיות, כי עוגיות עם גלוטן אסור לשים ליד שוקולד במשלוח אחד.
    - >-
      את הטראפלס: מזון רגיש שלא מחזיק חצי יום בחוץ; במקומם מוצר מוצק בשקית פנימית.
  correct: 3
  explanation: >-
    טראפלס שמנת הוא מזון רגיש, שעתיים בחוץ לכל היותר, וזה החשש הבטיחותי. בנוסף, עוגיות שמתקררות בשקית
    ותפוז מוסיפים לחות, ולכן שוקולד מוצק נארז בשקית פנימית סגורה.
- id: q4
  question: >-
    לקוח שואל אם מצה בטופי ושוקולד שהכנתם "כשרה לפסח". כל הרכיבים מסומנים כשר לפסח, והשוקולד "כשר לפסח
    לאוכלי קטניות". מה עונים?
  options:
    - >-
      "כן, הכול כשר לפסח", כי מי שלא אוכל קטניות כבר יודע לבדוק את זה לבד.
    - >-
      מפרטים מה כתוב על כל רכיב, כולל "לאוכלי קטניות" בשוקולד, ומי שנוהג אחרת שואל את הרב.
    - >-
      "לא", כי מוצר ביתי לעולם לא יכול להיות כשר לפסח בלי משגיח קבוע במטבח.
    - >-
      "כן", ומוסיפים במדבקה "כשר לפסח למהדרין" כדי שגם המקפידים יהיו רגועים.
  correct: 1
  explanation: >-
    הקורס לא פוסק: מעבירים בדיוק את מה שכתוב על האריזות, כולל ההבחנה בקטניות. לכתוב "כשר" או "למהדרין"
    בלי תעודה אסור (מודול 17), וההחלטה ההלכתית היא של הלקוח ושל הרב שלו.
- id: q5
  question: >-
    באמצע בישול טופי לפסח, בלי גלוקוזה, הסירופ התחיל להתגבש בשוליים אחרי שערבבתם בכוח. מה עושים?
  options:
    - >-
      מוסיפים כף מים, ממיסים מחדש על אש נמוכה, ומבשלים שוב בלי לערבב, עם מעט מיץ לימון.
    - >-
      מוסיפים כף קורנפלור כדי לקשור את הגבישים, וממשיכים לבשל עד הצבע הרצוי.
    - >-
      מעלים את האש לגבוהה, כדי שהגבישים יימסו מהר לפני שהם מתפשטים לכל הסיר.
    - >-
      מוסיפים גלוקוזה רגילה בכמות קטנה, כי בכמות כזו היא לא משנה את הכשרות לפסח.
  correct: 0
  explanation: >-
    מים מחזירים את הגבישים לסירופ, וחומצה מפרקת חלק מהסוכר לסוכרים שמפריעים להתגבשות. קורנפלור הוא
    קטניות, גלוקוזה רגילה אינה כשרה לפסח, ואש גבוהה שורפת.
- id: q6
  question: >-
    אתם רוצים להכין בונבוני "תפוח בדבש" לראש השנה, ומתלבטים מה לשים בגנאש בשביל טעם התפוח. מה הבחירה
    הנכונה ולמה?
  options:
    - >-
      תפוח טרי מגורר, כי הוא נותן הכי הרבה טעם, והקליפה הסגורה מגינה עליו כמו קופסה.
    - >-
      מיץ תפוחים במקום חלק מהשמנת, כי הוא נוזל כמו שמנת ולכן לא ישנה את האמולסיה.
    - >-
      תפוח מיובש קצוץ דק או אבקת תפוח מיובש בהקפאה, כי הם נותנים טעם בלי להוסיף מים חופשיים.
    - >-
      ריבת תפוחים מהסופר, כי הסוכר בריבה מוריד את פעילות המים לרמה של שוקולד מוצק.
  correct: 2
  explanation: >-
    פרי טרי ומיץ מוסיפים מים חופשיים ומקצרים את חיי המדף לימים. ריבה רכה עדיין בטווח aw של 0.75-0.80,
    הרבה מעל שוקולד. תפוח מיובש נותן טעם ומרקם בלי להוסיף מים.
- id: q7
  question: >-
    משפחה מבקשת לראש השנה מארז עם בונבונים וטבלת שוקולד עם גרגרי רימון טריים, ואתם מוסרים ביום חמישי.
    מה עושים עם הרימון?
  options:
    - >-
      מפזרים את הגרגרים על הטבלה ביום רביעי בערב, כדי שהשוקולד יתקשה עליהם היטב עד המסירה.
    - >-
      טובלים את הגרגרים בשוקולד מטומפר אחד־אחד, כך שהשוקולד סוגר אותם מהאוויר לשבוע.
    - >-
      מקפיאים את הטבלה עם הגרגרים, ומוסרים אותה קפואה כדי שתפשיר בדיוק בערב החג.
    - >-
      לא אורזים פרי טרי; נותנים בונבונים בצבע רימון, ומסבירים איך מכינים טבלת רימונים ביום ההגשה.
  correct: 3
  explanation: >-
    גרגרי רימון טריים רטובים ומזון רגיש: על שוקולד הם משאירים מיץ ופריחת סוכר, ובחוץ מחזיקים שעתיים.
    הקפאה מוסיפה עיבוי בהפשרה. הצבע בבונבון מחזיק כמו הבונבון עצמו.
- id: q8
  question: >-
    בר מצווה של 70 אורחים, שולחן מתוקים עם עוגות, ומזכרת לכל משפחה (כ־30). כמה תכננו?
  options:
    - >-
      70 יחידות לשולחן ו־70 מזכרות, אחת לכל אורח, בלי רזרבה כדי לא לבזבז.
    - >-
      כ־230 יחידות לשולחן (70 × 3 ועוד 10%) וכ־33 מזכרות, וחומר גלם בכ־20% יותר ממשקל המוצר.
    - >-
      350 יחידות לשולחן, חמש לאורח, כי שוקולד נגמר ראשון בכל אירוע, ו־30 מזכרות.
    - >-
      140 יחידות לשולחן ו־30 מזכרות, וחומר גלם בדיוק לפי משקל המוצר, כי שאריות חוזרות לקערה.
  correct: 1
  explanation: >-
    לצד קינוחים אחרים 2-3 יחידות לאורח, ועוד 10% רזרבה; מזכרת לפי מה שהמזמינים בחרו (כאן משפחות), עם
    רזרבה. בקערה ובתבניות תמיד נשאר שוקולד, ולכן מזמינים יותר חומר גלם.
- id: q9
  question: >-
    באירוע בגינה ביולי, השוקולד שעל השולחן מתחיל להימרח ולהלבין אחרי 20 דקות. מה התגובה הנכונה?
  options:
    - >-
      להעביר את כל השוקולד למקרר של המטבח ולהוציא אותו שוב קר כל שעה, כך שהוא יתקשה מחדש.
    - >-
      להשאיר הכול על השולחן, כי שוקולד מוצק לא מתקלקל, והאורחים לא שמים לב למראה בערב.
    - >-
      להוריד את המגש לקופסה המבודדת בצל, ולהגיש גלים קטנים שנגמרים תוך פחות מ־20 דקות, על מגש בהיר.
    - >-
      לכסות את המגש בניילון נצמד, כדי שהחום לא יגיע לשוקולד ואפשר יהיה להשאיר אותו עד הסוף.
  correct: 2
  explanation: >-
    שוקולד מוצק לא מסוכן בחום, אבל נמס ומלבין. גלים קצרים מהזמן שהוא שורד במקום, צל ומגש בהיר שומרים על
    המראה. מקרר ויציאה חוזרת מוסיפים עיבוי, וניילון לא מקרר.
- id: q10
  question: >-
    מזמינה של חתונה רוצה מזכרות משוקולד חלב עם השם של הזוג. הארוחה בשרית, באולם עם תעודת כשרות. מה
    הצעד הראשון?
  options:
    - >-
      לברר עם המשפחה ועם האולם אם מותר להכניס מוצרים מבחוץ, ולהציע מריר פרווה שמתאים לארוחה.
    - >-
      לייצר משוקולד חלב, כי מזכרת ארוזה נלקחת הביתה ולכן לא קשורה לארוחה הבשרית.
    - >-
      להחליף לשוקולד לבן, כי בלי מוצקי קקאו הוא לא נחשב חלבי לעניין ארוחה בשרית.
    - >-
      לכתוב על המדבקה "כשר" בלי לציין הכשר, כדי שהמשגיח יאשר בכניסה בלי לפתוח.
  correct: 0
  explanation: >-
    שואלים לפני שמתחילים לייצר, לא ביום החתונה: האולם עשוי להגביל מוצרים מבחוץ, ומוצר חלבי לא מתאים
    לארוחה בשרית. שוקולד לבן מכיל חלב, ו"כשר" בלי תעודה אסור לכתוב.
