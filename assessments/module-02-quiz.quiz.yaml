- id: q1
  question: >-
    ערב חג, אתם ממיסים 300 גרם שוקולד חלב בבן־מארי, ובמקביל רותח סיר מרק על הכיריים. השוקולד הסמיך
    פתאום והתגרען, והמדחום מראה 39°C. מה הכי סביר, ומה עושים עם השוקולד?
  options:
    - >-
      הוא התחמם יותר מדי, ולכן מוסיפים חתיכות שוקולד מוצק כדי לקרר אותו ולהחזיר לו את המרקם.
    - >-
      הוא התקרר והתחיל להתגבש, ולכן מחזירים לבן־מארי עם מכסה עד שהוא שוב נוזלי.
    - >-
      אדים מהמטבח או מהסיר נכנסו והוא נתפס. לא טובלים בו; מוסיפים חלב חם ומקבלים שוקו.
    - >-
      שוקולד חלב תמיד מתגרען בבן־מארי, ולכן מעבירים אותו למיקרוגל וממשיכים לטבול.
  correct: 2
  explanation: >-
    ב־39°C שוקולד חלב לא נשרף, ומרקם מגורען אחרי בן־מארי במטבח מלא אדים הוא סימן של מים. שוקולד שנתפס
    לא חוזר לטיבול, אבל עם הרבה חלב חם הוא שוקו. מכסה רק מוסיף טיפות.
- id: q2
  question: >-
    חברה שאלה למה התותים שלה בשוקולד "הזיעו" והתכסו בשכבה לבנה ויבשה כשהוציאה אותם מהמקרר לסלון
    חם, וחזרה והכניסה אותם פעמיים. מה עונים?
  options:
    - >-
      עיבוי המיס סוכר על השוקולד והוא התגבש מחדש. מוציאים מהמקרר פעם אחת, לפני ההגשה.
    - >-
      השוקולד התקלקל במקרר ואסור לאכול אותו, ולכן בפעם הבאה שומרים את התותים בחדר.
    - >-
      זו פריחת שומן מטמפרור חלקי, ולכן היא צריכה ללמוד לטמפר לפני שהיא טובלת תותים.
    - >-
      התותים שחררו סוכר דרך השוקולד, וזה סימן שהם היו בשלים מדי בזמן הטבילה.
  correct: 0
  explanation: >-
    שכבה לבנה, יבשה ומחוספסת אחרי מעבר ממקרר לחדר חם היא פריחת סוכר מעיבוי. היא בטוחה לאכילה. כל
    הוצאה והחזרה מוסיפה עיבוי; נייר מגבת בקופסה ויציאה אחת לפני ההגשה עוזרים.
- id: q3
  question: >-
    אתם מתכננים מגש לברית בחצר ביוני, 34°C, ההגשה ב־11:00 והאירוע עד 14:00. מה התוכנית לתותים
    המטובלים?
  options:
    - >-
      טובלים בערב שלפני ושומרים בחדר ממוזג, כדי שלא יקבלו עיבוי מהמקרר בבוקר.
    - >-
      מגישים מ־11:00 עד 14:00 על מגש מעל קרח, כי הקרח מספיק כדי שהם יישארו טריים.
    - >-
      טובלים בבוקר ומגישים ב־11:00 עד סוף האירוע, כי שוקולד ציפוי מגן על הפרי מחום.
    - >-
      טובלים בבוקר, במקרר עד 11:00, ואחרי שעה בחוץ מחזירים או מחליפים במנה שהייתה במקרר.
  correct: 3
  explanation: >-
    מעל 32°C מזון רגיש לא נשאר בחוץ יותר משעה. השוקולד לא מגן על התות. מגישים במנות ומחליפים. תותים
    שנטבלו בערב שלפני ועמדו בחדר כבר מתחילים לשחרר מיץ.
- id: q4
  question: >-
    לקוחה מבקשת 20 שקיות מנדיאנטים לחלוקה בכנס בעוד עשרה ימים, באולם בלי מיזוג חזק. עוד לא למדתם
    לטמפר. מה מציעים לה?
  options:
    - >-
      קוברטורה מרירה בלי טמפרור, כי הטעם עדיף ואנשים לא שמים לב למראה של שקית סגורה.
    - >-
      מנדיאנטים משוקולד ציפוי, ארוזים בצלופן עם תווית אלרגנים, שמורים במקום קריר ויבש עד הכנס.
    - >-
      מנדיאנטים מקוברטורה בלי טמפרור ששמורים במקפיא, ומוציאים אותם בבוקר הכנס לשולחן.
    - >-
      מנדיאנטים מטבלאות מהסופר, כי הן כבר מטומפרות ושומרות על הטמפר גם אחרי ההמסה.
  correct: 1
  explanation: >-
    קוברטורה שנמסה מאבדת את הטמפר של היצרן, ובלי טמפרור היא עמומה, רכה ומקבלת פסים, בעיקר בחום. שוקולד
    ציפוי נשאר מבריק בלי טמפרור. מקפיא מוסיף עיבוי וסדקים.
- id: q5
  question: >-
    המסתם שוקולד לבן במיקרוגל בעוצמה מלאה דקה וחצי ברצף. הוא עבה, מגורען, ויש ריח קלוי. מה נכון?
  options:
    - >-
      מוסיפים כפית מים חמים ומערבבים, כי מים מדללים שוקולד שהתחמם יותר מדי.
    - >-
      מוסיפים שוקולד לבן חדש ומוצק, והוא יחזיר את המרקם לשוקולד כולו.
    - >-
      הוא התחמם הרבה מעבר ל־40-45°C. מה שעוד חלק עובר לקערה אחרת, והשאר לשוקו או לאפייה.
    - >-
      זה מצב רגיל בשוקולד לבן, ואחרי חמש דקות של ערבוב הוא יחזור להיות חלק.
  correct: 2
  explanation: >-
    בשוקולד לבן יש אבקת חלב וסוכר שנפגעים מעל 40-45°C. חימום ארוך בעוצמה מלאה יוצר נקודות חמות. כפית מים
    רק גורמת לו להיתפס. בפעם הבאה: עוצמה 50%, פולסים קצרים וערבוב.
- id: q6
  question: >-
    בן הזוג טובל תותים, ואחרי שישה תותים השוקולד בכוס התחיל להסמיך ולהתגרען, אף שהטמפרטורה בסדר. מה
    בודקים קודם?
  options:
    - >-
      אם הכוס צרה מדי, כי בכוס צרה השוקולד מתקרר מהר ומתגבש מוקדם מדי.
    - >-
      אם השוקולד היה זול, כי שוקולד ציפוי זול לא מתאים לטיבול של פירות טריים.
    - >-
      אם התותים בשלים מדי, כי סוכר הפרי מתערבב בשוקולד ומסמיך אותו.
    - >-
      אם התותים יובשו עד הסוף, כולל בבסיס העלים: טיפות מכל תות מצטברות בכוס.
  correct: 3
  explanation: >-
    כל תות רטוב מכניס עוד טיפה, עד שהשוקולד בכוס נתפס. מייבשים בנייר מגבת ומשאירים 30-60 דקות בחדר.
    כוס צרה דווקא עוזרת: שוקולד עמוק יותר בפחות כמות.
- id: q7
  question: >-
    הכנתם מקלות שוקו מקוברטורה בלי טמפרור. אחרי שבוע במקרר יש עליהם פסים אפורים. אורחת שואלת אם הם
    עדיין טובים לכוס שוקו. מה עונים?
  options:
    - >-
      כן. אלה פסים של חמאת קקאו, זה פוגע רק במראה, והמקל נמס בכוס בדיוק אותו דבר.
    - >-
      לא. פסים אפורים הם סימן לעובש, ולכן זורקים אותם ומכינים חדשים.
    - >-
      כן, אבל רק אם ממיסים אותם קודם ומטמפרים מחדש, אחרת הם לא יימסו בחלב.
    - >-
      לא. פסים אומרים שנכנסו מים במקרר, והשוקולד ייתפס כשמכניסים אותו לחלב.
  correct: 0
  explanation: >-
    קוברטורה בלי טמפרור נוטה לפריחת שומן, גם באחסון טוב. זה בטוח לאכילה. בכוס יש 200 מ"ל, הרבה מעל מה
    שגורם לשוקולד להיתפס, והמקל נמס לחלק.
- id: q8
  question: >-
    אתם מכינים יום לפני אירוח: מנדיאנטים, טבלה, פירות יבשים מטובלים ומקלות שוקו. מה מכל אלה עדיף
    להשאיר ליום האירוח עצמו?
  options:
    - >-
      את המנדיאנטים, כי התוספות מתרככות בלילה ונופלות מהדיסקיות עד הבוקר.
    - >-
      את המקלות, כי שוקולד שמחכה יום שלם מאבד את הטעם שלו בכוס.
    - >-
      שום דבר מהרשימה: רק תותים טריים טובלים ביום האירוח עצמו.
    - >-
      את הפירות היבשים, כי גם הם פרי, וכל פרי מטובל נאכל רק באותו יום.
  correct: 2
  explanation: >-
    בפירות יבשים, במנדיאנטים ובמקלות אין פרי טרי, והם נשמרים בקופסה סגורה (מקלות מקוברטורה במקרר).
    רק פרי טרי מטובל קובע תאריך אכילה של אותו יום.
- id: q9
  question: >-
    אורח מספר שהוא אלרגי לשומשום. על המגש: מנדיאנטים עם פיסטוק, טבלה עם פירורי חלבה, ותותים בשוקולד
    לבן. מה עושים?
  options:
    - >-
      אומרים לו שאפשר לאכול הכול חוץ מהטבלה, כי רק בה יש שומשום ברכיבים.
    - >-
      מגישים את המגש כרגיל, כי בכמויות קטנות שומשום כמעט לא גורם לתגובה.
    - >-
      מורידים את פירורי החלבה מהטבלה, ואז כל המגש מתאים לו בלי בדיקה נוספת.
    - >-
      מראים לו את פתק האלרגנים ואת האריזות, כולל "עלול להכיל", ונותנים לו להחליט.
  correct: 3
  explanation: >-
    חלבה עשויה משומשום, אבל גם שוקולד ותוספות יכולים להיות מסומנים "עלול להכיל" שומשום, ופירורים
    עוברים בין פריטים במגש. פתק מלא ואריזות מאפשרים לאורח להחליט. לא מבטיחים לאלרגי שמשהו בטוח.
- id: q10
  question: >-
    מכינים מגש פרווה שיוגש אחרי ארוחה בשרית, עם תותים, מנדיאנטים וזילוף לבן. מה בודקים?
  options:
    - >-
      שהשוקולד המריר מסומן פרווה; הזילוף הלבן קטן מדי כדי שיהיה צריך לבדוק אותו.
    - >-
      שכל שוקולד, כולל הלבן לזילוף, וכל תוספת מסומנים פרווה בהכשר שסומכים עליו.
    - >-
      שאין חלב ברשימת הרכיבים, כי זה מה שקובע אם מוצר נחשב פרווה מבחינת כשרות.
    - >-
      שהשוקולד טבעוני, כי כל מוצר טבעוני מסומן גם פרווה בכל ההכשרים.
  correct: 1
  explanation: >-
    שוקולד לבן רובו חלבי, ומוצר בלי חלב ברכיבים יכול להיות מסומן חלבי או "ציוד חלבי". קובע מה שכתוב על
    האריזה וההכשר. טבעוני לא בהכרח מסומן פרווה. הקורס לא פוסק: אם יש ספק, שואלים את הרב.
