- id: q1
  question: >-
    נועה אופה פרלינים בדירה בחיפה ומוכרת בקבוצת וואטסאפ. לקוחה כותבת: "את כשרה? כל השוקולד שלך הרי
    בהכשר בד"ץ". אין לנועה תעודה. מה התשובה הנכונה?
  options:
    - >-
      "כן, כל חומרי הגלם בהכשר בד"ץ, ולכן גם הפרלינים כשרים באותה רמה בדיוק."
    - >-
      "אין לי תעודת כשרות. אלה הרכיבים והאלרגנים, ואם חשוב לך הכשר, כדאי לשאול את הרב שלך."
    - >-
      "כן, אבל בלי תעודה רשמית, כי תעודה היא רק עניין בירוקרטי שלא משנה את המוצר."
    - >-
      "לא יכולה לענות על זה בכתב, תתקשרי ואסביר לך בטלפון מה ההכשר שלי."
  correct: 1
  explanation: >-
    בלי תעודה לא מציגים מוצר ככשר, גם בוואטסאפ, שהוא פרסום. ההכשר של חומרי הגלם הוא תנאי, לא תעודה
    למוצר. תשובה כנה עם רכיבים ואלרגנים היא "מצג אמת" ולא מצג כשרות.
- id: q2
  question: >-
    איתי מתמחר מארזים לחברות ורוצה לכלול עלות של תעודת כשרות. הוא מצא באינטרנט "49 ₪ לשעת השגחה".
    מה נכון לעשות עם המספר הזה?
  options:
    - >-
      להשתמש בו כתעריף, כי זה התעריף שנקבע בחוק לכל המועצות הדתיות בישראל.
    - >-
      להתעלם מעלות הכשרות, כי בעסק קטן היא מתחלקת על הרבה מארזים ולכן זניחה.
    - >-
      להכפיל אותו ב־2 ליתר ביטחון ולהכניס לגיליון כעלות סופית, בלי לשאול את המועצה.
    - >-
      לרשום אותו כממוצע מ־2019 בלבד, ולבקש בכתב מהמועצה הדתית את האגרה, השעות והתעריף.
  correct: 3
  explanation: >-
    49 ₪ הוא ממוצע ממדגם של 81 מועצות ב־2019 (המכון הישראלי לדמוקרטיה), והתעריף משתנה בין מועצות. אגרה,
    שעות ותעריף מקבלים בכתב ורק אז מכניסים לתמחור כעלות קבועה.
- id: q3
  question: >-
    מיכל רוצה קו פרלינים פרווה. בטבלת הספקים שלה: מריר "חלבי, לאוכלי אבקת חלב נכרי", בלי חלב ברכיבים.
    מה הצעד הנכון?
  options:
    - >-
      לעבור למריר שכתוב עליו "פרווה" בהכשר שהגוף שלה מקבל, ולהשאיר את החלבי למוצרים חלביים.
    - >-
      להשאיר אותו, כי "לאוכלי אבקת חלב נכרי" אומר שהבעיה היא רק באבקת החלב ואין כאן אבקה.
    - >-
      להשאיר אותו ולכתוב על התווית "ציוד חלבי", כי אין חלב ברכיבים ולכן זה בדיוק DE.
    - >-
      להשאיר אותו ולהוסיף לאלרגנים "עלול להכיל חלב", ואז מותר לסמן את הפרלינים פרווה.
  correct: 0
  explanation: >-
    לפי OK, מריר מקו חלבי מוגדר בדרך כלל חלבי, ו־DE רק כשאין שארית. הסטטוס בא מהאריזה ומהגוף המכשיר,
    לא מהרכיבים, ו"עלול להכיל" הוא הערת אלרגנים, לא סטטוס.
- id: q4
  question: >-
    יוסי קנה פרלינת לוז שנארזה מחדש בחנות: "באריזה המקורית בד"ץ העדה החרדית; נארז בהשגחת הרבנות
    אשקלון". הגוף המכשיר שלו עוד לא ענה אם הוא מקבל את זה. מה עושים?
  options:
    - >-
      קונים 5 ק"ג לחנוכה, כי שני הכשרים על אותה שקית הם תמיד יותר טובים מאחד.
    - >-
      משתמשים, כי ההכשר של האריזה המקורית נשאר בתוקף גם אחרי שהחנות פתחה את השק.
    - >-
      רושמים "לא ידוע", שואלים בכתב ולא קונים כמות גדולה עד התשובה, או קונים אריזה מקורית.
    - >-
      מוחקים את השורה בטבלה, כי מוצר שנארז מחדש אסור לשימוש בעסק עם תעודה בכל מקרה.
  correct: 2
  explanation: >-
    אריזה מחדש מוסיפה השגחה מקומית, ולא כל גוף מקבל אותה. ההחלטה של הגוף המכשיר, ולכן "לא ידוע"
    ושאלה בכתב, או אריזה מקורית.
- id: q5
  question: >-
    דנה הכינה טראפלס קוקוס טבעוניים. אין לה תעודה. בתווית כתוב "פרווה", ואין בלוק אלרגנים, כי "פרווה
    אומר בלי חלב". מה צריך לתקן?
  options:
    - >-
      רק להוסיף ליד "פרווה" את שם הגוף שמכשיר את השוקולד, כדי שהלקוח ידע על מי סומכים.
    - >-
      למחוק "פרווה", כי בלי תעודה אין סטטוס, ולהוסיף בלוק אלרגנים עם "מכיל" ו"עלול להכיל".
    - >-
      שום דבר, כי במוצר טבעוני אין חלב, ולכן "פרווה" ממילא נכון גם לכשרות וגם לאלרגיה.
    - >-
      להחליף "פרווה" ב"טבעוני ולכן כשר", כי טבעוני הוא מושג רחב יותר שכולל את הפרווה.
  correct: 1
  explanation: >-
    "פרווה" הוא מונח כשרות שנכתב רק לפי תעודה, ובלוק האלרגנים חובה בכל מקרה. ב־2025 נאסף מארז שסומן
    פרווה כי ייתכן שהכיל חלב. "טבעוני" מותר כשהוא נכון, אבל הוא לא הכשר.
- id: q6
  question: >-
    לעסק של רונית יש תעודה, חלבית, לכל השנה. לקראת פסח היא רוצה לכתוב "כשר לפסח" על מארז מחומרי גלם
    כשרים לפסח. מה נכון?
  options:
    - >-
      מותר, כי התעודה בתוקף כל השנה, ופסח הוא חלק מהשנה העברית שהתעודה מכסה.
    - >-
      מותר, אם כל חומרי הגלם מסומנים "כשר לפסח" ומצלמים אותם לתיק הספקים.
    - >-
      אסור לגמרי, כי עסק קטן לא יכול לקבל אישור לפסח בשום מקרה ובשום מועצה.
    - >-
      רק אם הגוף המכשיר אישר את הייצור לפסח, כי תעודה יכולה לא לחול על פסח.
  correct: 3
  explanation: >-
    לפי סעיף 2ח, אפשר לקבוע שתעודה אינה תקפה לפסח. "כשר לפסח" נכתב רק עם אישור לפסח מהגוף המכשיר,
    וחומרי גלם לפסח הם תנאי, לא אישור.
- id: q7
  question: >-
    בעסק של עמית מכינים באותם כלים גנאש עם שמנת ופרלינים מריר בלי חלב. יש לו תעודה, והוא רוצה לסמן את
    הפרלינים פרווה. מה הצעד הראשון?
  options:
    - >-
      לשאול את הגוף המכשיר מה נדרש כדי לסמן פרווה בציוד משותף, ולשלוח לו את הנוסח לפני הדפסה.
    - >-
      לסמן פרווה, כי המתכון של הפרלינים בלי חלב, והכלים נשטפים היטב בין האצוות.
    - >-
      לסמן "ציוד חלבי", כי זה הסימון שמתאים תמיד למוצר בלי חלב שנעשה בכלים משותפים.
    - >-
      לסמן פרווה ולהוסיף "לשאול את הרב" על התווית, כדי שכל לקוח יחליט לפי המנהג שלו.
  correct: 0
  explanation: >-
    הסטטוס תלוי גם בציוד, והגוף המכשיר קובע אותו: הוא עשוי לדרוש הפרדה או להגדיר חלבי. שואלים אותו
    ושולחים את הנוסח לאישור לפני הדפסה.
- id: q8
  question: >-
    ליאת עשתה ביקורת על התווית ומחקה "כשר". באינסטגרם נשאר פוסט מ־2025 עם תמונה של שק השוקולד עם סמל
    ההכשר, וההאשטאג #כשר. מה דינו?
  options:
    - >-
      בסדר, כי פוסט ישן לא נחשב לפרסום אחרי שעבר יותר משנה מהיום שפורסם.
    - >-
      בסדר, כי הסמל שייך לספק השוקולד ולא לעסק שלה, ולכן הוא לא מצג של כשרות.
    - >-
      צריך לתקן: פוסט פתוח הוא פרסום, ולכן מחליפים תמונה ומוחקים את ההאשטאג.
    - >-
      צריך למחוק את כל חשבון האינסטגרם ולפתוח חדש, כי אי אפשר לערוך פוסטים ישנים.
  correct: 2
  explanation: >-
    סעיף 4 אוסר להציג מוצר ככשר גם בפרסום, ופוסט פתוח הוא פרסום. לא מציגים את הסמל של הספק, ועורכים את
    הפוסט: תמונה אחרת ובלי ההאשטאג.
- id: q9
  question: >-
    שירה נמצאת בפיקוח של גוף פרטי ואין לה תעודת רבנות. היא רוצה להדפיס על המארז את הלוגו של הגוף
    ו"בפיקוח פרטי". מה נכון לפי הדיווחים על חוות הדעת מ־2018?
  options:
    - >-
      מותר, כי פסיקת גיני מ־2017 התירה לעסקים בפיקוח פרטי להציג את הלוגו של הגוף.
    - >-
      מותר רק אם הלוגו קטן מהלוגו של העסק, כדי שהלקוח לא יחשוב שהגוף הוא היצרן.
    - >-
      אסור לגמרי לומר שיש פיקוח פרטי, בשום צורה ובשום מקום, גם לא בעל פה ללקוח.
    - >-
      אסור להציג לוגו או תעודה של הגוף; תיאור אמת של הפיקוח בודקים עם עורך דין.
  correct: 3
  explanation: >-
    לפי כיפה וסרוגים (12.7.2018), אסור להציג לוגו או תעודה של הגוף, ועל העסק לציין שאינו בפיקוח הרבנות.
    ההחלטות עסקו בבתי אוכל ויש מחלוקת על שם הגוף, ולכן נוסח על אריזה בודקים עם עורך דין.
- id: q10
  question: >-
    אבי מוכר מארזים בחנוכה. בטבלת הספקים שלו כל השוקולד חלב נכרי, ולקוחה מבקשת 30 מארזים בחלב ישראל
    לבית כנסת. מה הצעד הסביר?
  options:
    - >-
      לקבל את ההזמנה ולהשתמש בשוקולד הקיים, כי חלב נכרי וחלב ישראל הם אותו שוקולד.
    - >-
      לענות בכנות מה יש לו, ולהציע חלופה: מוצר פרווה, או ספק חלב ישראל שייבדק מראש.
    - >-
      לכתוב על המארזים "חלב ישראל", כי את רוב הרכיבים הוא קונה ממילא בחנויות מהדרין.
    - >-
      להסביר ללקוחה ש"לאוכלי אבקת חלב נכרי" הוא אותו דבר כמו חלב ישראל לרוב האנשים.
  correct: 1
  explanation: >-
    "לאוכלי אבקת חלב נכרי" מודיע רק על אבקת החלב, וחלב ישראל צריך להיות כתוב על האריזה. כותבים רק מה
    שנכון ומה שהתעודה מכסה, ומחליפים ספק רק אחרי בדיקה בטמפרור ואישור הגוף המכשיר.
