  options:
    - >-
      מוציאים אותן במזלג ושומרים לפעם הבאה, ובודקים טמפר בבדיקת סכין.
    - >-
      מחממים במיקרוגל 20 שניות כדי שיימסו, ואז ממשיכים ליציקה כרגיל.
    - >-
      ממשיכים לערבב עד שיימסו, גם אם המדחום ירד בינתיים ל־27-28°C.
    - >-
      יוצקים כמו שזה. הטבליות יימסו בתוך התבנית ויתנו לטבלה מרקם מעניין.
  correct: 0
  explanation: >-
    השוקולד כבר בטווח העבודה. הטבליות שנשארו מטומפרות, ואפשר להוציא ולשמור אותן. 20 שניות במיקרוגל
    עלולות לעבור את 34°C, וערבוב עד 27°C מסמיך את השוקולד יותר מדי.
- id: q7
  question: >-
    שלחתם מארז טבלאות במשלוח ביוני. המקבלת שמה אותו במקרר בלי קופסה, הוציאה לאירוח בסלון חם, ולמחרת
    יש על הטבלאות שכבה לבנה, יבשה ומחוספסת. מה תגידו לה בפעם הבאה?
  options:
    - >-
      לשמור במקפיא במקום במקרר, כי בטמפרטורה נמוכה מאוד הסוכר לא יכול להתגבש.
    - >-
      להוציא מהמקרר מוקדם ולפתוח את העטיפה, כדי שהשוקולד יתחמם מהר יותר בחדר.
    - >-
      שהמארז היה מטומפר לא טוב, ובפעם הבאה תטמפרו אותו בטמפרטורה גבוהה יותר.
    - >-
      לשמור סגור במקום קריר וקבוע, ואם במקרר, להוציא את הקופסה סגורה ולחכות.
  correct: 3
  explanation: >-
    שכבה יבשה ומחוספסת היא פריחת סוכר מעיבוי, כשאוויר חם ולח פוגש שוקולד קר. Callebaut ממליצים לתת
    למוצרים להסתגל בתוך האריזה. מקפיא מחמיר את הבעיה.
- id: q8
  question: >-
    במטבח ממוזג (21°C) עשיתם בדיקת סכין לשוקולד מריר ב־31.5°C. אחרי 4 דקות השכבה קשה, מבריקה ובלי
