- id: q1
  question: >-
    אחותכם המיסה 300 גרם שוקולד חלב במיקרוגל בבת אחת, שתי דקות ברצף. המדחום מראה 58°C, והשוקולד סמיך,
    מגורען ומשחתי. היא שואלת אם להמשיך לטמפר. מה עונים?
  options:
    - >-
      כן, מוסיפים זרעים כרגיל, כי הם יקררו את השוקולד ויחזירו לו את המרקם החלק.
    - >-
      לא כדאי. החום פגע בחלב ובסוכר, ומשתמשים בשוקולד הזה לשוקו חם או לאפייה.
    - >-
      כן, אבל קודם מקררים אותו במקרר עד 30°C, ואז מערבבים חזק עד שהוא מתרכך.
    - >-
      לא, וזורקים אותו, כי שוקולד שהתחמם יותר מדי כבר לא בטוח לאכילה.
  correct: 1
  explanation: >-
    שוקולד חלב ממיסים עד 40-45°C. ב־58°C אבקת החלב והסוכר נפגעים, והשוקולד מסמיך ומתגרען, כך שזרעים לא
    יחזירו אותו. הוא בטוח לאכילה ומתאים לשוקו חם, לבראוניז או לרוטב.
- id: q2
  question: >-
    יום שישי ביולי, אין מזגן, במטבח 29°C. אתם רוצים להכין 8 טבלאות קטנות ליום הולדת מחר. מה התוכנית
    הכי סבירה?
  options:
    - >-
      לטמפר על משטח השיש כרגיל, כי השיש תמיד קר יותר מהאוויר שבחדר.
    - >-
      לטמפר בשעה הכי חמה ולהכניס את התבנית ישר למקפיא, כדי שהשוקולד יתקשה מהר.
    - >-
      לוותר על טמפרור ולהכין את הטבלאות משוקולד מותך, כי בחום אף שיטה לא עובדת.
    - >-
      לטמפר בהזרעה בבוקר המוקדם או בחדר ממוזג, ולבדוק בבדיקת סכין לפני יציקה.
  correct: 3
  explanation: >-
    בחדר של 29°C השוקולד מתקשה לאט והמשטח חמים כמעט כמו יעד הקירור. הזרעה בשעה או בחדר קרירים היא
    הבטוחה ביותר. מקפיא גורם לסדקים ולעיבוי, ושוקולד לא מטומפר יוצא אפור.
- id: q3
  question: >-
    שכנה טעמה טבלה שהכנתם אתמול ושאלה למה יש עליה פסים אפורים, למרות שהיא עדיין טעימה. במדחום ראיתם
    33-34°C בזמן היציקה. מה ההסבר?
  options:
    - >-
      טמפר חלקי. ב־33-34°C חלק מגבישי V נמסו, והשוקולד התגבש בחלקו בצורות לא יציבות.
    - >-
      פריחת סוכר. השוקולד ספג לחות מהאוויר בזמן שהוא התקשה על השיש של המטבח.
    - >-
      השוקולד התגבש יותר מדי בקערה, ולכן נוצרו בו גושים שמופיעים עכשיו כפסים.
    - >-
      שוקולד מריר תמיד מקבל פסים ביום הראשון, והם נעלמים אחרי יומיים של אחסון.
  correct: 0
  explanation: >-
    צורה V נמסה בכ־33.8°C. יציקה ב־33-34°C משאירה מעט מדי זרעים, והתוצאה מפוספסת. השוקולד בטוח לאכילה,
    ומטמפרים אותו מחדש בפעם הבאה.
- id: q4
  question: >-
    טמפרתם על משטח. קיררתם 200 גרם מריר ל־27°C, החזרתם לקערה וערבבתם, והמדחום מראה 30°C. השוקולד
    סמיך מאוד. מה עושים?
  options:
    - >-
      מוסיפים עוד 100 גרם שוקולד מותך ב־45°C, כדי לדלל ולחמם בבת אחת את כל המסה.
    - >-
      ממיסים הכול מחדש, כי שוקולד שירד מתחת ל־31°C כבר לא יכול להיות מטומפר.
    - >-
      מחממים בעדינות במייבש שיער או בפולס קצר, ומערבבים עד 31-32°C.
    - >-
      יוצקים מיד, כי שוקולד סמיך נותן טבלה חזקה יותר ובלי בועות אוויר.
  correct: 2
  explanation: >-
    השוקולד מלא גבישים, רק קר וסמיך מדי. חימום של מעלה־שתיים מחזיר אותו לטווח העבודה. תוספת של
    שוקולד ב־45°C עלולה להעלות את המסה מעל 34°C ולהמיס את הזרעים.
- id: q5
  question: >-
    אתם מכינים 1.2 ק"ג שוקולד מריר לבונבונים לחנוכה, עם חמאת קקאו באבקה. כמה אבקה, ומתי?
  options:
    - >-
      120 גרם, כשהשוקולד ב־45°C, כדי שהאבקה תימס ותתפזר באופן אחיד בכל המסה.
    - >-
      12 גרם, כשהשוקולד ב־27°C, ואז מחממים חזרה ל־31-32°C כמו בשיטת המשטח.
    - >-
      12 גרם, אחרי שהשוקולד התקרר ל־34-35°C, ואז מערבבים עד 31-32°C.
    - >-
      3 גרם, כמו בתרגול, כי הכמות של האבקה לא תלויה במשקל השוקולד.
  correct: 2
  explanation: >-
    1% ממשקל השוקולד: 12 גרם ל־1.2 ק"ג. לפי Cacao Barry מוסיפים במריר ב־34-35°C ועובדים ב־31-32°C.
    בשוקולד של 45°C האבקה נמסה ולא מזריעה.
- id: q6
  question: >-
    טמפרתם 300 גרם מריר בהזרעה. המדחום מראה 31.5°C, אבל בקערה עדיין צפות כמה טבליות שלא נמסו. מה
