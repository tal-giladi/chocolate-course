  options:
    - >-
      לחכות עוד 10 דקות ולבדוק שוב, כי בדיקה אחת לא מספיקה לפני יציקה.
    - >-
      ליצוק לתבנית. השוקולד מטומפר, ושומרים עליו בין 31 ל־32°C בזמן העבודה.
    - >-
      לחמם ל־34°C כדי שיהיה נוזלי יותר, כי השוקולד כבר הוכח כמטומפר.
    - >-
      להוסיף עוד זרעים ליתר ביטחון, כדי שהטמפר יחזיק לאורך כל היציקה.
  correct: 1
  explanation: >-
    התקשות תוך 3-5 דקות בחדר של 18-22°C, עם ברק ובלי פסים, היא סימן לטמפר טוב. ב־34°C הגבישים נמסים
    ומאבדים את הטמפר, ותוספת זרעים בשלב הזה רק מסמיכה.
- id: q9
  question: >-
    חברה ששומרת על פרווה ביקשה טבלה. טמפרתם קוברטורה מריר שמסומנת פרווה, אבל הזרעים היו משקית אחרת
    שמסומנת חלבי. מה נכון לעשות?
  options:
    - >-
      לספר לה מה היה בטבלה ולהכין לה טבלה חדשה, שגם השוקולד וגם הזרעים בה מסומנים פרווה.
    - >-
      לתת לה את הטבלה, כי הזרעים הם פחות משליש מהשוקולד ולכן זה לא משנה את הכשרות.
    - >-
      לתת לה את הטבלה בלי לספר, כי בשוקולד מריר אין חלב גם כשהשקית מסומנת חלבי.
    - >-
      לכתוב על הטבלה "פרווה", כי רוב השוקולד בה פרווה והסימון הזה הוא המדויק ביותר.
  correct: 0
  explanation: >-
    הקורס לא פוסק הלכה. מה שיודעים הוא מה שכתוב על האריזות, ושקית אחת מסומנת חלבי. אומרים לה מה יש
    בטבלה, ומכינים טבלה שכל רכיביה מסומנים פרווה. שאלות הלכה שואלים את הרב.
- id: q10
  question: >-
    נשארו לכם 150 גרם מריר ו־150 גרם חלב, ואתם רוצים לטמפר אותם יחד לטבלת שיש. לאיזו טמפרטורת עבודה
