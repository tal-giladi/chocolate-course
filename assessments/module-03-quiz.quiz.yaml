    - >-
      29-30°C, לפי שוקולד חלב, כי שומן החלב מוריד את טמפרטורת ההתגבשות.
    - >-
      27-28°C, כי תערובת של שני סוגים מתגבשת לאט ודורשת קירור עמוק יותר.
  correct: 2
  explanation: >-
    Callebaut ממליצים לעבוד בתערובת של חלב ומריר לפי הטמפרטורות של שוקולד חלב. שומן החלב מרכך את כל
    חמאת הקקאו בתערובת, ובטמפרטורה של מריר הזרעים עלולים להימס.
