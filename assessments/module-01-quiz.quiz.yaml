- id: q1
  question: >-
    אתם רוצים להכין טבלת שוקולד למסיבת יום הולדת מחר, אין לכם מדחום טוב, ומעולם לא טמפרתם. איזה
    שוקולד הכי מתאים?
  options:
    - >-
      קוברטורה מריר 70%, כי האחוז הגבוה מבטיח שהטבלה תתקשה מבריקה גם בלי שום טיפול.
    - >-
      שוקולד ציפוי ("צימקאו"), כי השומן הצמחי מתקשה ומבריק בלי טמפרור.
    - >-
      טבלאות מריר מהסופר, כי הן כבר מטומפרות, והטמפר נשמר גם אחרי שממיסים אותן.
    - >-
      שוקולד רובי, כי הצבע שלו טבעי והוא לא צריך טמפרור כמו שוקולד ציפוי.
  correct: 1
  explanation: >-
    שוקולד ציפוי לא צריך טמפרור, ולכן הוא מתאים למתחילים ולזמן קצר. קוברטורה, טבלאות מהסופר ורובי הם
    שוקולד אמיתי, ואחרי המסה צריך לטמפר אותם.
- id: q2
  question: >-
    לקוחה שואלת למה המטבעות "מריר 55%" ב־39 ₪ לקילו זולים בהרבה מ"קוברטורה מריר 54.5%" ב־90 ₪ לקילו.
    ברשימת הרכיבים של הזולים כתוב "שומן צמחי (דקל)". מה עונים?
  options:
    - >-
      ההבדל רק במותג ובאריזה, כי האחוז כמעט זהה, ולכן התוצאה בבונבונים תהיה אותו דבר.
    - >-
      הזולים טובים יותר לטמפרור, כי שומן צמחי מתגבש מהר יותר מחמאת קקאו בצורה V.
    - >-
      ההבדל הוא באחוז הסוכר: בזולים יש יותר סוכר, וזה מה שמוריד את המחיר.
    - >-
      בזולים חלק מחמאת הקקאו הוחלף בשומן צמחי; הם לא מתנהגים כמו קוברטורה ולא מטמפרים אותם.
  correct: 3
  explanation: >-
    שומן צמחי ברכיבים מסמן שוקולד ציפוי או תחליף שוקולד. האחוז לבדו לא מספר את זה; רשימת הרכיבים כן.
    התוצאה שונה בטעם, במרקם ובעבודה.
- id: q3
  question: >-
    המדחום החדש שלכם מראה 1°C במי קרח. אתם ממיסים שוקולד ציפוי, והמדחום מראה 51°C. מה המצב בפועל ומה
    עושים?
  options:
    - >-
      השוקולד בערך ב־50°C, על הגבול; מוסיפים מעט שוקולד ציפוי מוצק ומערבבים כדי לקרר.
    - >-
      השוקולד ב־52°C, כי צריך להוסיף את הסטייה; זורקים אותו כי הוא נחרך.
    - >-
      הסטייה לא רלוונטית מעל 30°C, ולכן ממשיכים לחמם עד שהכול נוזלי לגמרי.
    - >-
      המדחום לא אמין בכלל, ולכן עוברים לבדיקה ביד: אם חם לאצבע, השוקולד מוכן.
  correct: 0
  explanation: >-
    מדחום שמראה 1°C במים של 0°C מראה מעלה אחת יותר מהאמת, ולכן 51°C הם בערך 50°C. שוקולד מוצק מקרר
    את המסה בלי לקלקל אותה.
- id: q4
  question: >-
    הזמנתם באתר קוברטורה שסומנה "במלאי" שבוע לפני חנוכה, ויומיים אחר כך החנות הודיעה שאזלה. מה היה עדיף
    לעשות?
  options:
    - >-
      להזמין מראש מחנות אחת גדולה, כי בחנויות גדולות המלאי באתר תמיד אמין לפני חגים.
    - >-
      לחכות לאחרי החג ולהכין את המארזים משוקולד ציפוי, כי קוברטורה תמיד אוזלת בחגים.
    - >-
      להחזיק רשימה עם 2-3 חנויות לכל פריט, ולפני חג להתקשר או לשלוח וואטסאפ לפני התשלום.
    - >-
      לקנות תמיד לפי מק"ט מדויק, כי חיפוש לפי תיאור כללי מראה מוצרים שכבר לא קיימים.
  correct: 2
  explanation: >-
    הרבה אתרים מציגים "במלאי" גם כשהפריט אזל. כמה חנויות לכל פריט ובירור ישיר בעונה עמוסה מונעים
    הפתעות.
- id: q5
  question: >-
    שקית "קוברטורה מריר 1 ק"ג" מחנות אפייה נושאת מדבקה של רבנות העיר, "חלבי, לאוכלי אבקת חלב נכרי", ואין
    עליה את ההכשר של היצרן. אתם מקפידים על בד"ץ מסוים ורוצים מריר פרווה. מה עושים?
  options:
    - >-
      קונים, כי מריר בלי חלב ברכיבים הוא תמיד פרווה, ומה שכתוב על המדבקה הוא טעות.
    - >-
      קונים, כי "לאוכלי אבקת חלב נכרי" פירושו שהמוצר פרווה למי שלא מקפיד על חלב ישראל.
    - >-
      מחפשים אריזה מקורית של היצרן עם ההכשר שלכם, וכשמתלבטים שואלים את הרב.
    - >-
      קונים ושוטפים את המטבעות במים חמים, כי כך מורידים את שאריות החלב מקו הייצור.
  correct: 2
  explanation: >-
    מריר יכול להיות חלבי בגלל קו הייצור, ואריזה מחדש מוסיפה השגחה מקומית. מי שמקפיד קונה אריזה מקורית
    בהכשר שלו, ובספק שואל את הרב.
- id: q6
  question: >-
    אורחת אלרגית לחלב רואה על מארז פרלינים בסופר "פרווה" ושואלת אם אפשר לאכול. מה התשובה הנכונה?
  options:
    - >-
      פרווה הוא סטטוס הלכתי ולא הצהרת אלרגנים; בודקים רכיבים ו"עלול להכיל", והיו ריקולים על כך.
    - >-
      כן, כי מוצר פרווה עבר בדיקת מעבדה לאלרגנים כחלק מתהליך ההכשר של הגוף המכשיר.
    - >-
      כן, אם יש עליו גם הכשר של הרבנות הראשית, כי היא בודקת גם אלרגנים וגופים פרטיים לא.
    - >-
      לא, כי כל פרלין מכיל חלב בכמות כלשהי, ולכן הסימון פרווה לא אומר כלום על תוכן.
  correct: 0
  explanation: >-
    ב־2025 נאסף מארז פרלינים שסומן פרווה בגלל חלב לא מסומן. לאלרגיה קוראים את רשימת הרכיבים ואת שורת
    האלרגנים, לא רק את ההכשר.
- id: q7
  question: >-
    הכנתם ביום שישי שתי טבלאות: אחת עם חלבה ואחת "בלי שומשום" לנכדה אלרגית. אחרי החלבה ניגבתם את המרית
    במגבת ושטפתם ידיים בג'ל. מה המסקנה?
  options:
    - >-
      אין בעיה, כי חום השוקולד המותך מפרק את חלבוני השומשום שנשארו על המרית.
    - >-
      אין בעיה, כי ג'ל אלכוהול מנטרל אלרגנים כמו שהוא מנטרל חיידקים על הידיים.
    - >-
      הבעיה רק בטעם, ולכן מספיק לגרד את השכבה העליונה של הטבלה לפני ההגשה.
    - >-
      הטבלה "בלי שומשום" לא בטוחה לנכדה; בפעם הבאה מכינים אותה ראשונה, ומנקים בסבון ומים.
  correct: 3
  explanation: >-
    חימום לא מוריד אלרגן, וג'ל או ניגוב לא מורידים אותו. סבון ומים מורידים, והסדר הנכון הוא קודם
    המוצר בלי האלרגן.
- id: q8
  question: >-
    באוגוסט, בדירה של 29°C, אתם רוצים לשמור טבלאות שוקולד שבוע עד שתתנו אותן במתנה. איפה ואיך?
  options:
    - >-
      על השיש בצלחת פתוחה, כדי שהשוקולד "ינשום" ולא יצבור לחות בתוך קופסה.
    - >-
      בקופסה אטומה במקרר, ומוציאים אותה סגורה חצי שעה לפני שפותחים.
    - >-
      במקפיא בשקית פתוחה, ומוציאים ישר לשולחן, כי קור חזק שומר על הברק.
    - >-
      במקרר בלי קופסה, ליד הגבינות, כי שם הטמפרטורה הכי יציבה במקרר.
  correct: 1
  explanation: >-
    האידיאל הוא 14-20°C; בבית חם, מקרר בקופסה סגורה עדיף. יציאה הדרגתית בקופסה סגורה מונעת עיבוי
    ופריחת סוכר, והקופסה שומרת מריחות.
- id: q9
  question: >-
    בבדיקת יומיים של הטבלה מהפרויקט יש עליה שכבה לבנה מחוספסת, שלא נעלמת כשמשפשפים. היא יצאה כמה פעמים
    מהמקרר לסלון הלח. מה זה ומה עושים?
  options:
    - >-
      פריחת סוכר מעיבוי; בטוח לאכילה, ממיסים מחדש, ובפעם הבאה מוציאים בקופסה סגורה.
    - >-
      פריחת שומן מחום; מחזירים למקרר ליום, והשכבה תחזור לתוך השוקולד מעצמה.
    - >-
      עובש מהתוספות; זורקים את כל הטבלה ואת התוספות שנשארו באותה שקית.
    - >-
      סוכר שנשרף בהמסה; זה סימן שחיממתם מעל 50°C, והטעם יהיה מר מעכשיו.
  correct: 0
  explanation: >-
    שכבה מחוספסת שלא נעלמת במגע היא פריחת סוכר מלחות ועיבוי. היא בטוחה; השוקולד חוזר לשקית "להמסה".
- id: q10
  question: >-
    בטעימה עיוורת חבר מתעקש ששתי הדגימות "אותו דבר". שתיהן מבריקות ונשברות בקליק. מה הדרך הטובה ביותר
    להבחין ביניהן?
  options:
    - >-
      לשים את שתיהן במקרר רבע שעה, כי רק שוקולד אמיתי ממשיך להבריק אחרי קירור.
    - >-
      לבדוק צבע על מפית לבנה, כי שוקולד ציפוי תמיד בהיר יותר משוקולד אמיתי.
    - >-
      לתת לכל אחת להימס על הלשון בלי ללעוס ולשאוף אוויר: המסה, שעוות וארומה מבדילות ביניהן.
    - >-
      ללעוס מהר ולבלוע, כי ההבדל בין שוקולד ציפוי לשוקולד אמיתי מורגש רק בסיומת.
  correct: 2
  explanation: >-
    שוקולד ציפוי יכול להיראות ולהישמע טוב, אבל בפה הוא נמס אחרת, לעתים שעוותי, עם פחות ארומה. לכן
    טועמים לאט ובלי ללעוס.
