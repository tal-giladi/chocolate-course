- id: q1
  question: >-
    יצקתם ביצת שוקולד של 12 ס"מ בשכבה אחת. בהוצאה הקליפה נסדקה, וחלקים נשארו בתבנית, אף שבדיקת הסכין
    עברה והקירור היה מלא. מה עושים בביצה הבאה?
  options:
    - >-
      מחממים את התבנית עד שהיא חמה מהשוקולד, כדי שהשוקולד לא יתקשה עליה מהר מדי ויישבר.
    - >-
      מוסיפים לשוקולד חמאת קקאו כדי שיהיה נוזלי יותר, וכך הקליפה תתפזר אחיד ולא תיסדק.
    - >-
      בונים שתיים־שלוש שכבות לפני ההוצאה, כי צורה גדולה צריכה קליפה עבה כדי להתכווץ ולהשתחרר.
    - >-
      מוציאים את הביצה מהתבנית מיד אחרי היציקה, לפני שהקליפה מתקשה ונעשית שבירה.
  correct: 2
  explanation: >-
    לפי Callebaut, ככל שהתבנית גדולה יותר הקליפה צריכה להיות עבה יותר, וקליפה דקה לא מתכווצת מספיק
    ונשברת בהוצאה. שוקולד נוזלי יותר נותן קליפה דקה עוד יותר, ותבנית חמה מהשוקולד ממיסה את גבישי V.
- id: q2
  question: >-
    שבועיים לפני חנוכה, לקוחה של מאפייה ביתית מבקשת 20 סביבונים לגן. בחנויות בישראל אין תבנית סביבון,
    ותבנית מחו"ל לא תגיע בזמן. מה הפתרון המעשי?
  options:
    - >-
      להרכיב סביבונים מחלקים: קובייה משתי קליפות ריבוע, חוד מקונוס נייר וידית מזולפת, בדבק מטומפר.
    - >-
      להדפיס תבנית סביבון מ־PLA במדפסת ביתית וליצוק בה שוקולד ישירות, כי זה הכי מהיר.
    - >-
      לצקת קובייה מלאה של שוקולד לא מטומפר ולהדביק עליה ידית, כי שוקולד לא מטומפר מדביק טוב יותר.
    - >-
      להזמין משלוח אקספרס מחו"ל בכל מחיר, כי סביבון מחלקים לא יחזיק את הדרך לגן.
  correct: 0
  explanation: >-
    הרכבה מחלקים עובדת עם מה שנמכר בישראל, וחיבורים בשוקולד מטומפר מחזיקים כשמרימים בידית. הדפסת PLA
    לא נוגעת בשוקולד ישירות, ושוקולד לא מטומפר נשאר רך בחיבור.
- id: q3
  question: >-
    חיברתם חצאי כדור על מחבת. התפר יצא עם "מדרגה", כי חצי אחד נמס יותר מהשני והתקצר. מה הסיבה
    הסבירה?
  options:
    - >-
      המחבת הייתה קרה מדי, ולכן השפה של חצי אחד לא נמסה בכלל והחצאים לא התיישרו.
    - >-
      השוקולד לא טומפר, ולכן חצי אחד היה רך יותר ונמס מהר יותר מהשני על המחבת.
    - >-
      השפות היו רחבות מדי, ושפה רחבה תמיד נמסה בצורה לא אחידה על משטח חם.
    - >-
      המחבת הייתה חמה מדי או שהחצי עמד עליה זמן רב; נוגעים שנייה־שתיים במחבת חמימה בלבד.
  correct: 3
  explanation: >-
    בשיטת הצלחת החמה ממיסים רק את קצה השפה: Callebaut משפשפים כמה שניות, Food Network מניחים לשנייה על
    אש נמוכה מאוד. חום או זמן מיותרים ממיסים עוד מהשפה. שפה רחבה דווקא נותנת תפר חזק יותר.
- id: q4
  question: >-
    חברה מבקשת שתבדקו תבנית סביבון באתר אמריקאי לפני שהיא מזמינה ל־50 מארזים. מה הכי חשוב לבדוק
    בדף המוצר?
  options:
    - >-
      רק את המחיר ואת המשלוח, כי כל תבניות הסביבון בעולם בנויות מאותו חומר ובאותו גודל.
    - >-
      חומר (פוליקרבונט או פלסטיק דק), תלת־ממד או שטוחה, קליפסים, גובה ושקעים, וזמן ייצור ומשלוח.
    - >-
      רק שהתבנית מסיליקון, כי רק סיליקון מתאים לצורה עם חוד וידית שצריך לקלף.
    - >-
      שהתבנית מגיעה עם מתכון, כי לכל תבנית מחו"ל יש עקומת טמפרור משלה שחייבים לעבוד לפיה.
  correct: 1
  explanation: >-
    החומר קובע ברק ועמידות, תבנית שטוחה נותנת חצי סביבון שצריך לחבר, ובתבנית סגורה צריך קליפסים שלא תמיד
    כלולים. חלק מהתבניות מיוצרות לפי הזמנה, ולכן מזמינים כחודשיים מראש.
- id: q5
  question: >-
    הכנתם סביבונים עם סוכריות ושמתם אותם במקרר כי היה חם. בבוקר, שעה אחרי שהוצאתם את הקופסה פתוחה
    לשולחן, הסוכריות זלגו צבע. מה היה נכון לעשות?
  options:
    - >-
      להשאיר אותם במקרר עד הרגע שנותנים, כי כל זמן בחדר מאפשר לסוכריות לזלוג.
    - >-
      להוציא את הקופסה סגורה ולחכות שתגיע לטמפרטורת החדר לפני שפותחים, ועדיף אחסון קבוע ב־18-20°C.
    - >-
      לקשט בסוכריות רק אחרי הקירור, על שוקולד קשה, כדי שלא ייגעו בלחות של המקרר.
    - >-
      לייבש את הסביבונים במייבש שיער מיד כשמוציאים אותם, כדי שהלחות תתאדה לפני שתזיק.
  correct: 1
  explanation: >-
    שוקולד קר בחדר חם אוסף עיבוי, שממיס צבע וסוכר. מוציאים את הקופסה סגורה כדי שהעיבוי ייווצר עליה ולא
    על השוקולד (03.5). סוכריות לא נדבקות לשוקולד קשה, ומייבש שיער ממיס את הפאות.
- id: q6
  question: >-
    בהדגמה של פצצות שוקו במסיבת חנוכה, ילדה בת 3 עומדת ליד השולחן ורוצה להחזיק את הספל. מה עושים?
  options:
    - >-
      נותנים לה להחזיק את הספל בשתי ידיים, כי ספל בידיים יציב יותר מספל על שולחן.
    - >-
      משתמשים בחלב רותח כדי שהפצצה תתפוצץ מהר, וכך הילדה מחזיקה את הספל רק כמה שניות.
    - >-
      ממלאים ספל קטן עד השפה, כדי שהילדה תקבל כמות קטנה שקל לה להחזיק.
    - >-
      הספל עומד על השולחן, מבוגר שופך לאט מקנקן, והילדה צופה ממרחק ולא בטווח יד.
  correct: 3
  explanation: >-
    לפי נתוני בטר"ם, רוב הכוויות בפעוטות נגרמות מנוזלים חמים, ועור של ילד רגיש יותר. ספל גדול (300 מ"ל
    לפחות) על שולחן, מבוגר שופך לאט, וילדים במרחק. ספל מלא עד השפה גולש כשהכדור והמרשמלו נכנסים.
- id: q7
  question: >-
    פצצת שוקו של 6 ס"מ: הקליפה שוקלת 27 גרם. כמה שוקולד קצוץ כדאי להוסיף בפנים, כדי לקבל שוקו בעוצמה של
    Callebaut לכוס של 200 מ"ל?
  options:
    - >-
      כ־8-10 גרם, כי Callebaut מציינים 35 גרם ל־200 מ"ל, והקליפה נותנת את רובם.
    - >-
      כ־35 גרם, כי הקליפה נמסה רק בחלקה בחלב ולכן לא נחשבת בכמות השוקולד של הכוס.
    - >-
      שום דבר, כי 27 גרם הם כבר יותר מהמנה של Callebaut ל־200 מ"ל חלב.
    - >-
      כ־70 גרם, כי פצצה צריכה כפול שוקולד מכוס רגילה כדי שהמרשמלו לא ידלל את הטעם.
  correct: 0
  explanation: >-
    לפי Callebaut 35 גרם ל־200 מ"ל. הקליפה נמסה כולה אחרי ערבוב, ולכן 27 + 8-10 ≈ 35-37 גרם. אבקת שוקו
    מוסיפה טעם ומתיקות, אבל החשבון של השוקולד נשאר אותו חשבון.
- id: q8
  question: >-
    חבר מציע להדפיס לכם במדפסת ביתית מאסטר של חצי סביבון כדי להכין תבנית. מה הדרך הבטוחה להשתמש בו?
  options:
    - >-
      יוצקים שוקולד ישר להדפסה, בתנאי שהחוט לא צבוע ושוטפים במים רותחים לפני כל שימוש.
    - >-
      מורחים את ההדפסה בשמן צמחי, כי השמן אוטם את החריצים בין השכבות והופך אותה לבטוחה.
    - >-
      יוצקים מעליו סיליקון או יריעה שהיצרן מאשר למזון; המאסטר לא נוגע בשוקולד.
    - >-
      מדפיסים אותו מחדש לפני כל חג, כי הדפסה חדשה עוד לא הספיקה לאגור חיידקים.
  correct: 2
  explanation: >-
    חריצים בין שכבות אוגרים חיידקים וסופגים סבון (Prusa, Formlabs), ו־PLA מתרכך ב־60-70°C, כך שמים רותחים
    מעוותים אותו. ההדפסה משמשת כמאסטר בלבד, והשוקולד נוגע רק בחומר שהיצרן מאשר למגע במזון.
- id: q9
  question: >-
    עיצבתם מאסטר לתבנית ואקום של חנוכייה קטנה. ביריעה הראשונה הלהבות יצאו שטוחות והמאסטר נתקע. מה משנים
    בעיצוב?
  options:
    - >-
      מעבים את היריעה ל־3 מ"מ, כדי שתהיה חזקה מספיק למשוך את המאסטר החוצה בלי להיקרע.
    - >-
      מוסיפים זווית שחרור של 5-10°, מבטלים חתכים חוזרים, ומוסיפים חורים של 1 מ"מ בנקודות הנמוכות.
    - >-
      מגדילים את הלהבות פי שניים, כי פרטים קטנים לא יכולים לצאת בשום תבנית ואקום.
    - >-
      מדפיסים בשכבה עבה יותר, כדי שהמאסטר יהיה מחוספס ויחזיק את היריעה במקום בזמן השאיבה.
  correct: 1
  explanation: >-
    Formlabs ממליצים על עיצוב בלי חתכים חוזרים ועל חורים של 1 מ"מ בנקודות הנמוכות כדי שהוואקום יגיע לפרטים;
    Mayku ממליצים על זווית של 5-10° ופינות מעוגלות. שכבה עבה רק מעבירה פסים לתבנית ולשוקולד.
- id: q10
  question: >-
    חישבתם שבמארז של 5 סביבונים יש 105 גרם שוקולד, בעלות של כ־9.5 ₪, ומארז דומה נמכר ב־40 ₪. חבר
    אומר "אז יש לך רווח של 30 ₪ על כל מארז". מה התשובה הנכונה?
  options:
    - >-
      הוא צודק, כי השוקולד הוא העלות היחידה במארז ביתי, והשאר הוא רווח נקי.
    - >-
      הוא צודק בערך, כי צריך להוריד רק את מחיר הקופסה, שהוא כ־2 ₪ לכל מארז.
    - >-
      הוא טועה, כי שוקולד שנשאר בקערה אחרי הטמפרור נזרק, ולכן העלות האמיתית כפולה.
    - >-
      הוא טועה: חסרים קישוט, אריזה, תווית, שעות עבודה ועמלות.
  correct: 3
  explanation: >-
    עלות חומרי הגלם היא רק חלק מהעלות. אריזה, קישוט, עבודה, משלוח ועמלות משנים את החשבון לגמרי, ומחיר
    בחנות אחרת הוא נתון שוק ולא מחיר שאתם יכולים להעתיק. השוקולד העודף חוזר לקערה ולא נזרק.
