- id: q1
  question: >-
    ליום ההולדת של לקוחה הכנתם מארז מעורב: 4 סביבוני שוקולד, 4 בונבוני פרלינה ו־4 טראפלס שמנת. איך
    מאחסנים ומוסרים את המארז?
  options:
    - >-
      ב־18-20°C ובקופסה מבודדת, כי רוב הפריטים במארז הם שוקולד מוצק.
    - >-
      בקופסה רגילה בארון, כי בכל הפריטים יש קליפה של שוקולד מטומפר.
    - >-
      לפי הפריט הרגיש ביותר: מקרר, צידנית, ועד שעתיים מיציאה ועד מסירה.
    - >-
      במקפיא עד הבוקר של יום ההולדת, ואז בקופסה רגילה בלי קירור.
  correct: 2
  explanation: >-
    מוצר עם שני סוגי מילוי מקבל את הקבוצה של המסוכן יותר. טראפלס שמנת הוא מזון שדורש בקרת זמן
    וטמפרטורה, ולכן כל המארז נשמר ונמסר כמו קבוצה ג.
- id: q2
  question: >-
    באמצע יום ייצור גיליתם שהמדחום במקרר מראה 8°C, ובפנים שני מגשי טראפלס מהבוקר. מה הפעולה המתקנת
    הנכונה לפי דף הסכנות?
  options:
    - >-
      מעבירים את המגשים למקפיא לחצי שעה, כדי להחזיר אותם מהר לטמפרטורה.
    - >-
      ממשיכים כרגיל, כי שוקולד מכסה את הגנאש ומגן עליו מחיידקים.
    - >-
      מורידים את התאריך על המארזים ביומיים ומוכרים אותם כמתוכנן.
    - >-
      לא מוכרים עד שמבררים כמה זמן המקרר היה חם, ומתקנים את המקרר.
  correct: 3
  explanation: >-
    הגבול הוא עד 4°C. כשחורגים, עוצרים את המכירה, רושמים, ובודקים כמה זמן היה המוצר מחוץ לגבול. אם לא
    ידוע, לא מוכרים.
- id: q3
  question: >-
    הספק של השוקולד הלבן החליף מפעל, ועל השקית החדשה נוסף "עלול להכיל בוטנים". יש לכם 30 תוויות
    מודפסות לבונבון קוקוס. מה עושים?
  options:
    - >-
      מעדכנים את המטריצה ומדפיסים תוויות חדשות, או מוסיפים מדבקה, לפני השימוש.
    - >-
      משתמשים בתוויות הישנות עד שייגמרו, ורק אז מדפיסים חדשות עם האזהרה.
    - >-
      מוסיפים "עלול להכיל אגוזים", כי זה מכסה גם בוטנים וחוסך תווית חדשה.
    - >-
      לא משנים כלום, כי במתכון של בונבון הקוקוס אין בוטנים בכלל.
  correct: 0
  explanation: >-
    התווית שלכם נשענת על התווית של הספק. אזהרה חדשה נכנסת למטריצה ולתווית לפני שמשתמשים בשקית, ובוטנים
    נכתבים בשמם, לא כ"אגוזים".
- id: q4
  question: >-
    לקוח מבקש שתכתבו על המארז "ללא אגוזים" כי הבת שלו אלרגית. אין אגוזים במתכון, אבל יש במטבח, ועל
    השוקולד כתוב "עלול להכיל אגוזים". מה כותבים?
  options:
    - >-
      "ללא אגוזים", כי המתכון לא כולל אגוזים והלקוח ביקש במפורש.
    - >-
      "אין אגוזים ברכיבים" ו"עלול להכיל אגוזים", ומסבירים לו בכנות למה.
    - >-
      "ללא אגוזים" ו"עלול להכיל אגוזים" יחד, כדי לכסות את שני הצדדים.
    - >-
      לא כותבים כלום על אגוזים, כי המטבח הוא עניין פנימי של העסק.
  correct: 1
  explanation: >-
    "ללא" הוא ערובה שדורשת בקרה מחמירה שאין במטבח משותף, ולא כותבים "ללא" ו"עלול להכיל" על אותו אלרגן.
    האזהרה מהאריזה עוברת לתווית, והלקוח מחליט.
- id: q5
  question: >-
    שליח לוקח מארזי bark מריר מחולון לבאר שבע באוגוסט, נסיעה של שעתיים. מה התוכנית הנכונה?
  options:
    - >-
      קרטון רגיל בתא המטען, כי שוקולד מוצק לא מתקלקל ונשאר בטוח לאכילה.
    - >-
      צידנית עם קרחון שמונח ישירות על השוקולד, כדי לשמור עליו קר בכל הדרך.
    - >-
      קופסה מבודדת, נסיעה בשעות קרות, והוראת אחסון כתובה על המארז.
    - >-
      מקפיאים את ה־bark לילה לפני המשלוח, ואורזים אותו קפוא בקרטון רגיל.
  correct: 2
  explanation: >-
    שוקולד מוצק בטוח, אבל מעל 34°C הטמפר הולך, ורכב בקיץ מתחמם מהר מאוד. קרחון שנוגע בשוקולד ושוקולד
    קפוא שנפתח בחום גורמים לעיבוי ולפריחת סוכר.
- id: q6
  question: >-
    חנות קונספט מוכרת את הטבלאות שלכם ושמה אותן בחלון הראווה בשמש. על התווית כתבתם "לשמור ב־18-20°C,
    לא במקרר". מה אומר סעיף 156 לחוק המזון?
  options:
    - >-
      החנות רשאית להחליט, כי היא העוסק שמחזיק עכשיו במזון ומוכרת אותו.
    - >-
      ההוראה שלכם לא מחייבת, כי רק משרד הבריאות קובע טמפרטורות אחסון.
    - >-
      ההוראה מחייבת רק אם החנות חתמה איתכם על הסכם הפצה כתוב ומפורט.
    - >-
      עוסק במזון מאחסן ומחזיק לפי הוראות היצרן, כלומר לפי מה שכתבתם.
  correct: 3
  explanation: >-
    סעיף 156 מחייב עוסק במזון לאחסן, להחזיק ולהוביל לפי הוראות היצרן. לכן ההוראה צריכה להיות כתובה על
    המארז, וכדאי להזכיר אותה לחנות.
- id: q7
  question: >-
    שוקולד מריר שקניתם ב־2025 הוחזר בריקול בגלל חלב לא מסומן, ואתם שומעים על זה רק עכשיו. מה קובע אם
    תוכלו למצוא את הלקוחות שקיבלו מוצרים ממנו?
  options:
    - >-
      דפי אצווה שבהם רשומה אצווה של הספק לכל אצווה שלכם, ולמי נמכרה.
    - >-
      קבלות מהספק על הקנייה, עם התאריך והסכום ששילמתם על השוקולד.
    - >-
      מספר העוקבים באינסטגרם, כי שם אפשר לפרסם הודעה לכל הלקוחות.
    - >-
      הזיכרון שלכם מהעונה, כי במטבח קטן יודעים מה הוכן ממה ומתי.
  correct: 0
  explanation: >-
    עקיבות היא שרשרת: שקית של הספק, אצווה שלכם, מארז, לקוח. סעיף 32 מחייב לשמור את הרשומות לפחות שנה
    מתום חיי המדף. קבלה וזיכרון לא מחברים את השקית ללקוח.
- id: q8
  question: >-
    אתם מכינים בונבונים עם גנאש ורוצים לכתוב תאריך על המארז. יש לכם מתכון מקצועי שמחזיק לפי היצרן 6
    שבועות, אבל שיניתם בו את השמנת והסוכר. מה כותבים?
  options:
    - >-
      6 שבועות, כי זה מה שהמתכון המקצועי מבטיח לכל מי שמכין אותו.
    - >-
      תאריך של שוקולד מוצק, כי הקליפה המטומפרת אוטמת את הגנאש מהאוויר.
    - >-
      תאריך שמרני קצר, ותאריך ארוך יותר רק אחרי ניסוי חיי מדף באורך מלא.
    - >-
      בלי תאריך בכלל, כי מוצר בעבודת יד בכמויות קטנות פטור מתאריך.
  correct: 2
  explanation: >-
    את התאריך קובע היצרן (סעיף 12), ו־Callebaut ממליצים לטעון רק אחרי ניסוי באורך מלא ולהיות שמרניים.
    שינוי בשמנת ובסוכר משנה את פעילות המים, ולכן התאריך של המתכון המקורי לא עובר.
- id: q9
  question: >-
    אתם רוצים להתחיל למכור מהמטבח בבית. מה הצעד הראשון הנכון לפי השיעור?
  options:
    - >-
      לפתוח תיק עוסק פטור ולהתחיל למכור, כי זה כל מה שעסק קטן צריך.
    - >-
      לשלוח דף תיאור עסק ללשכת הבריאות ולרשות המקומית, ולבקש תשובה בכתב.
    - >-
      להתחיל למכור לחברים, ולפנות לרשויות רק כשהמכירות יעברו את התקרה.
    - >-
      לבקש תעודת כשרות מהרב המקומי, כי היא כוללת גם רישיון ייצור לאתר.
  correct: 1
  explanation: >-
    רישיון ייצור (לשכת הבריאות) ורישיון עסק (הרשות המקומית) הם שני מסלולים נפרדים, ולא נמצא בחוק פטור
    לייצור ביתי. תיק במס הכנסה ותעודת כשרות לא מחליפים אותם.
- id: q10
  question: >-
    לקוחה כותבת שאחרי טראפלס מהמארז שלכם היו לה הקאות, ועכשיו היא בסדר. במארז נשארו שני טראפלס. מה
    עושים?
  options:
    - >-
      מבקשים ממנה לזרוק את מה שנשאר, ושולחים מארז חדש כפיצוי.
    - >-
      אוכלים בעצמכם טראפלס מאותה אצווה, כדי לבדוק אם משהו לא בסדר.
    - >-
      מסבירים שהקאות אחרי שוקולד הן בדרך כלל מאכילה מרובה, וסוגרים.
    - >-
      רושמים ביומן התלונות, מבקשים לשמור את מה שנשאר, ובודקים את האצווה.
  correct: 3
  explanation: >-
    תלונה על נזק לבריאות נרשמת ונשמרת לפחות שלוש שנים (סעיף 164(ז)). שומרים את המוצר ובודקים לפי
    מספר האצווה את הטמפרטורות והשעות. אם יש חשש למזון מזיק, פועלים בתיאום עם שירות המזון.
