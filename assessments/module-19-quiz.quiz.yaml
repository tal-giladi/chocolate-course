- id: q1
  question: >-
    דנה מוכרת מארזי סביבונים. היא חישבה שוקולד, קופסה וסרט, הוסיפה 30% ומכרה. אחרי חנוכה הבינה שעבדה
    50 שעות ולא נשאר לה כמעט כלום. איזו שורה הכי כנראה חסרה בגיליון שלה?
  options:
    - >-
      שורת מע"מ, כי כל עסק קטן חייב לגבות 18% מע"מ גם כשהוא עוסק פטור.
    - >-
      שורת משלוח, כי משלוח הוא תמיד השורה הגדולה ביותר במארז שוקולד ביתי.
    - >-
      שורת עבודה: דקות למארז כפול שכר שעתי, שבמוצר בעבודת יד היא לרוב הגדולה.
    - >-
      שורת פחת, כי 12% פחת מסבירים לבד את כל ההפרש שהיא לא הרוויחה בעונה.
  correct: 2
  explanation: >-
    במארז הסביבונים בשיעור, העבודה (25 דקות × 50 ₪ לשעה = 20.83 ₪) עולה יותר מכל החומרים והאריזה
    יחד. גיליון בלי שורת עבודה נותן מחיר שלא משלם על הזמן. עוסק פטור לא גובה מע"מ.
- id: q2
  question: >-
    אבי רוצה מרווח של 30% על מארז שעלותו, כולל עמלה, 42 ₪. הוא כותב 42 × 1.3 = 54.60 ₪. מה המרווח
    שיקבל בפועל, בערך?
  options:
    - >-
      כ־23%, כי הוא חישב תוספת של 30% על העלות, וזה מרווח קטן יותר מהמחיר.
    - >-
      30% בדיוק, כי כך מחשבים מרווח בכל עסק שמוכר מוצרים לצרכנים פרטיים.
    - >-
      כ־39%, כי מרווח תמיד יוצא גדול מהתוספת שמחשבים על העלות של המוצר.
    - >-
      כ־13%, כי מהמרווח צריך להוריד גם את המע"מ שעוסק פטור מעביר למדינה.
  correct: 0
  explanation: >-
    הרווח הוא 12.60 ₪, ו־12.60 ÷ 54.60 = 23%. תוספת של 30% היא מרווח של 30 ÷ 130. למרווח של 30% צריך
    מחיר של 42 ÷ 0.7 = 60 ₪, ואחר כך בדיקה בחזרה.
- id: q3
  question: >-
    לקוחה מזמינה באתר מארז אחד ב־58 ₪, בתשלום בכרטיס, עם עמלה של 1.7% ועוד 1 ₪ לעסקה. למה ההזמנה
    הזאת "יקרה" לכם יותר מהזמנה של עשרה מארזים?
  options:
    - >-
      כי בהזמנה קטנה האחוז של העמלה גבוה יותר, לפי מדרגות של חברת האשראי.
    - >-
      כי מארז בודד דורש יותר שוקולד מכל מארז בהזמנה גדולה של אותו מוצר.
    - >-
      כי את העמלה על הזמנה קטנה משלמים פעמיים, פעם בכרטיס ופעם בהעברה.
    - >-
      כי הסכום הקבוע לעסקה, וגם המשלוח, מתחלקים כאן על מארז אחד בלבד.
  correct: 3
  explanation: >-
    עמלה ומשלוח הם עלות להזמנה. 1 ₪ על 58 ₪ הוא כמעט 2%, ועל 580 ₪ פחות מ־0.2%. משלוח של כ־70 ₪
    (ice, 19.11.2025) גדול מהמארז עצמו, ולכן הוא שורה נפרדת או איסוף עצמי.
- id: q4
  question: >-
    משרד רואי חשבון מבקש 60 מארזי סביבונים לחנוכה, ושואל "כמה הנחה תיתנו?". המחיר לצרכן שלכם 58 ₪,
    ועלות המארז בהזמנה כזו (סדרה, העברה בנקאית, משלוח אחד, מדבקת לוגו) היא 38.05 ₪. מה עונים?
  options:
    - >-
      20% הנחה, 46.40 ₪, כי זו ההנחה המקובלת לחברות בכל ענף המתנות בישראל.
    - >-
      52 ₪ למארז, מדרגה שמחושבת מהעלות של ההזמנה, עם מקדמה שמכסה את החומרים.
    - >-
      58 ₪ כמו כולם, כי הזמנה גדולה רק מוסיפה לכם עבודה בשבוע העמוס של החג.
    - >-
      38.05 ₪, מחיר עלות, כי לקוח עסקי גדול יביא הרבה הזמנות בהמשך השנה.
  correct: 1
  explanation: >-
    מדרגה לחברות בנויה על העלות שלה: ב־52 ₪ נשארים 13.95 ₪ למארז, מרווח של 26.8%, כמו במחיר לצרכן.
    ההזמנה 3,120 ₪, וחומרים ואריזה 912.60 ₪, ולכן מקדמה של 30% (936 ₪) מכסה אותם.
- id: q5
  question: >-
    אותה חברה שואלת אם תקבל חשבונית מס כדי לקזז מע"מ. אתם עוסקים פטורים (מחזור עד 122,833 ₪ ב־2026).
    מה התשובה הנכונה?
  options:
    - >-
      כן, אבל רק אם הסכום מעל 5,000 ₪, כי אז חובה להוציא חשבונית עם מספר הקצאה.
    - >-
      לא: עוסק פטור אינו רשאי להוציא חשבונית מס; אומרים את זה לפני ההצעה.
    - >-
      כן, עוסק פטור מוציא חשבונית מס רגילה, רק בלי שורת מע"מ בתחתית שלה.
    - >-
      לא משנה, כי חברה יכולה לקזז מע"מ גם על קבלה רגילה של עוסק פטור.
  correct: 1
  explanation: >-
    לפי כל זכות (נבדק 2026-11-10), עוסק פטור לא גובה מע"מ ואינו רשאי להוציא חשבונית מס; הוא מוציא
    חשבון עסקה וקבלה. סף 5,000 ₪ למספר הקצאה חל על חשבוניות מס של עוסק מורשה. מידע כללי, לא ייעוץ.
- id: q6
  question: >-
    רונית עוסקת מורשית, וחברתה עוסקת פטורה. שתיהן מוכרות אותו מארז, באותן עלויות, ב־58 ₪ לצרכן.
    מה נכון?
  options:
    - >-
      לרונית נשאר יותר, כי היא מקזזת מע"מ על כל ההוצאות, כולל שעות העבודה שלה.
    - >-
      לשתיהן נשאר אותו רווח, כי המע"מ עובר מהלקוח למדינה ולא נוגע בעסק.
    - >-
      רונית רשאית לפרסם 49.15 ₪ ולהוסיף מע"מ בקופה, ולכן הרווח שלהן שווה.
    - >-
      לרונית נשאר פחות, כי 8.85 ₪ מכל מארז הם מע"מ, והקיזוז מחזיר רק חלק.
  correct: 3
  explanation: >-
    בדוגמה בשיעור: לעוסקת הפטורה נשארים 15.62 ₪, ולעוסקת המורשית 9.44 ₪. כדי לשמור על הרווח, עוסק
    מורשה צריך מחיר גבוה יותר. ולצרכן מציגים רק מחיר כולל מע"מ (חוק הגנת הצרכן, 17א-17ב).
- id: q7
  question: >-
    מטבח אחד, 2 תבניות שנותנות 19 מארזים ביום, ו־6 שעות עבודה נטו עם 25 דקות למארז. קיבלתם 220
    מארזים לשלושת השבועות שלפני חנוכה (15 ימי עבודה). מה עושים?
  options:
    - >-
      מסגרים הזמנות או מקדימים ייצור, כי 15 × 14.4 = 216, וב־80% רק כ־165.
    - >-
      קונים עוד תבנית, כי אז הקיבולת עולה ל־28 מארזים ביום וזה מספיק לכולם.
    - >-
      מקבלים את כולן, כי בעונה עובדים מהר יותר ותמיד מספיקים את מה שצריך.
    - >-
      מעבירים את כל המארזים למקרר מראש, כי כך אפשר לייצר יותר בכל סבב.
  correct: 0
  explanation: >-
    הידיים (360 ÷ 25 = 14.4) הן צוואר הבקבוק, לא התבניות, ולכן תבנית נוספת לא עוזרת. 220 מעל
    הקיבולת המלאה, והרבה מעל 80%. מסגרים לפי קיבולת, או מייצרים מוקדם מוצר שמחזיק שבועות ב־18-20°C.
- id: q8
  question: >-
    שבועיים לפני חנוכה הקוברטורה המרירה אזלה בחנות שממנה אתם קונים תמיד. מה הייתה צריכה להיות
    התוכנית מראש?
  options:
    - >-
      לקנות שוקולד בסופר בכמות, כי לכל שוקולד מריר יש אותן תכונות בטמפרור.
    - >-
      לחכות למשלוח הבא של החנות, כי החלפת ספק משנה את הטעם של כל המארזים.
    - >-
      ספק גיבוי עם אותו אחוז קקאו, והזמנה שבועיים לפני השבוע העמוס הראשון.
    - >-
      להוציא את המריר מהמארז, כי מארז בשני סוגים נמכר באותו מחיר כמו מארז בשלושה.
  correct: 2
  explanation: >-
    בתכנון הייצור יש ספק ראשי וגיבוי לכל חומר גלם, ומזמינים מוקדם, כי מלאי באתר לא תמיד אמיתי. ספק
    חדש פירושו אריזה חדשה: בודקים עליה כשרות ואלרגנים, ומטמפרים לפי העקומה שלה.
- id: q9
  question: >-
    בגיליון שלכם המארז עולה 37.36 ₪ ליחידה, ומחיר הרצפה (מרווח אפס, אחרי עמלה) הוא 39.33 ₪. לקוח
    קבוע מבקש 5 מארזים ב־38 ₪ כל אחד. מה המשמעות?
  options:
    - >-
      רווח קטן אבל חיובי, כי 38 ₪ גבוה מהעלות ליחידה ולכן כל מארז מרוויח.
    - >-
      אין משמעות, כי מחיר רצפה רלוונטי רק להזמנות של חברות ולא ללקוח פרטי.
    - >-
      רווח רגיל, כי ההנחה מתקזזת בזה שלקוח קבוע לא צריך עלויות שיווק בכלל.
    - >-
      כל מארז מתחת לרצפה: אחרי העמלה הוא לא מכסה את העלות, כולל השכר שלכם.
  correct: 3
  explanation: >-
    מחיר הרצפה כולל את העמלה, שתלויה במחיר. ב־38 ₪ העמלה (כ־1.94 ₪) מביאה את העלות ל־39.30 ₪, יותר
    מהמחיר. אפשר להציע מחיר אחר או איסוף בהעברה בנקאית, אבל לא מתחת לרצפה בלי לדעת.
- id: q10
  question: >-
    שואלים אתכם כמה עולה מארז 5 סביבונים. יש לכם שלושה מספרים: חומרים ואריזה כ־15.2 ₪ (11.2), עלות
    מלאה כ־42 ₪, ומחיר בשוק 40 ₪ (גיפטוש, 2026-11-10). מה כל אחד אומר?
  options:
    - >-
      15.2 ₪ הוא המחיר הנכון, כי עבודה ביתית לא נחשבת עלות בעסק קטן כזה.
    - >-
      15.2 ₪ הוא רצפה של חומרים, 42 ₪ עלות מלאה עם עבודה, ו־40 ₪ נקודת השוואה, לא מחיר.
    - >-
      40 ₪ הוא המחיר שלכם, כי לקוחות לא ישלמו יותר ממה שמחיר השוק מראה להם.
    - >-
      42 ₪ הוא מחיר המכירה, כי מוכרים בעלות מלאה כדי להתחרות במחיר השוק.
  correct: 1
  explanation: >-
    חומרים ואריזה הם רק רצפה. עלות מלאה מוסיפה עבודה, פחת, הוצאות קבועות ועמלה. מחיר של עסק אחר הוא
    נקודת השוואה ניטרלית, עם שיטת עבודה אחרת. המחיר שלכם נקבע מהעלות המלאה ומרווח, ומוסבר מול השוק.
