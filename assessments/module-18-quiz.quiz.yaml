- id: q1
  question: >-
    ספק השוקולד החלב שלכם החליף גרסה, ובמפרט החדש מופיעה "תמצית לתת שעורה". על המארזים כתוב "ללא
    גלוטן". מה עושים?
  options:
    - >-
      משאירים את התווית, כי הכמות קטנה מאוד ושוקולד בדרך כלל לא מכיל גלוטן.
    - >-
      עוצרים מכירה, מתקנים את התווית ומדגישים "שעורה", ובודקים מה כבר נמכר.
    - >-
      מוסיפים בכתב יד "עלול להכיל גלוטן" ליד "ללא גלוטן" על המארזים במלאי.
    - >-
      ממשיכים למכור את המלאי, ומתקנים את התווית רק בהדפסה הבאה.
  correct: 1
  explanation: >-
    שעורה היא דגן עם גלוטן, והיא רכיב במוצר. מדגישים את שם הדגן ברשימת הרכיבים, ו"ללא גלוטן" כבר
    שגוי. מה שנמכר עם תווית שגויה נבדק לפי נוהל הריקול של 16.4.
- id: q2
  question: >-
    לקוחה שואלת למה על מארז "שוקולד מריר 70%" שלכם יש שני סמלים אדומים, "הרי זה מריר". מה התשובה
    הנכונה?
  options:
    - >-
      טעות בהדפסה: מריר 70% מתחת לספים, והסמלים יוסרו בהדפסה הבאה.
    - >-
      הסמלים חובה על כל מוצר בעבודת יד, בלי קשר להרכב שלו.
    - >-
      הסמל השני הוא לנתרן, כי בכל שוקולד יש מלח שמוסיפים לטעם.
    - >-
      גם במריר יש ל־100 גרם יותר מ־10 גרם סוכרים ויותר מ־4 גרם שומן רווי.
  correct: 3
  explanation: >-
    ב־Guanaja 70%, למשל, 30 גרם סוכרים ו־25 גרם שומן רווי ל־100 גרם. הספים הם 10 גרם סוכרים ו־4 גרם
    שומן רווי, ולכן שני סמלים. הנתרן בו כמעט אפס.
- id: q3
  question: >-
    אתם מוכרים טראפלס בודד בקופסה של 4×4 ס"מ. מה צריך להופיע עליה לגבי סימון תזונתי?
  options:
    - >-
      טבלה תזונתית, אבל בלי סמלים אדומים, כי החזית 16 סמ"ר.
    - >-
      סמלים אדומים בקוטר 15 מ"מ, ובלי טבלה, כי אין לה מקום.
    - >-
      שום דבר, כי קופסה של יחידה אחת פטורה מכל הסימון התזונתי.
    - >-
      רק כפיות הסוכר, כי הן מחליפות את הטבלה באריזה קטנה.
  correct: 0
  explanation: >-
    חזית של 25 סמ"ר או פחות פטורה מהסמלים (תקנה 6), אבל לא מהטבלה. אם אין מקום, התקנות מאפשרות לתת
    את המידע בשורה אחת או יותר.
- id: q4
  question: >-
    חברה רוצה 200 מארזי גנאש לראש השנה, ומבקשת "תאריך של חודש מחוץ למקרר". הגנאש שלכם עם שמנת
    ומעט סוכר. מה הצעד הנכון?
  options:
    - >-
      לכתוב חודש, כי במקרר הוא מחזיק שבועיים ומחוץ למקרר הקקאו משמר.
    - >-
      להשאיר מארז אחד על השיש שבוע, ואם אין עובש, לכתוב חודש.
    - >-
      מוצר מקרר עם תאריך קצר, או מתכון שנמדד במעבדה ונבדק.
    - >-
      להעתיק את התאריך שעל שקית השוקולד, כי היא הרכיב העיקרי.
  correct: 2
  explanation: >-
    גנאש שמנת נמדד סביב aw 0.88, מעל 0.85, כלומר מוצר מקרר. יותר מהכלל הביתי דורש מדידת aw וניסוי
    באורך מלא (Callebaut). תאריך הרכיב לא מתאים למוצר עם מילוי.
- id: q5
  question: >-
    בניסוי חיי מדף, ביום 30, הסביבונים בתנאי "יום רע" (24-26°C) אפרפרים, ובתנאי התווית (18°C) הם
    מבריקים. מה עושים עם המידע?
  options:
    - >-
      מבטלים את הניסוי, כי תוצאות שונות בשני התנאים מראות שהוא נכשל.
    - >-
      ממשיכים, מחזקים את הוראת האחסון ושולחים בקיץ בקופסה מבודדת.
    - >-
      מעבירים את כל הדגימות למקרר, כדי שכולן יישארו מבריקות.
    - >-
      מקצרים את התאריך לחודש, כי מה שנכשל בתנאי אחד נכשל בכול.
  correct: 1
  explanation: >-
    תנאי "יום רע" נועד להראות מה קורה אצל לקוח שלא שמר כמו שכתוב. התאריך נקבע לפי תנאי התווית, והמידע
    מהתנאי החם משפר את הוראת האחסון ואת המשלוח. מקרר לא מומלץ לממתקים.
- id: q6
  question: >-
    המכסה של המארז שלכם 20×5 ס"מ. המעצבת שמה את המשקל נטו בתחתית ואת השם במכסה. מה הבעיה?
  options:
    - >-
      שם המוצר והכמות נטו צריכים להופיע באותו שדה ראייה.
    - >-
      המשקל נטו חייב להופיע בתוך הטבלה התזונתית, לא בנפרד.
    - >-
      אין בעיה, כל עוד המשקל כתוב בגופן של 1.2 מ"מ לפחות.
    - >-
      המשקל צריך להופיע רק בדף המוצר בחנות, לא על הקופסה.
  correct: 0
  explanation: >-
    לפי 1169/2011 סעיף 13(5), שם המזון והכמות נטו מופיעים באותו שדה ראייה, כלומר רואים אותם יחד בלי
    לסובב את הקופסה. זה חלק מהכללים שצפויים לחול מ־2028.
- id: q7
  question: >-
    בית דפוס מציע מחיר טוב על 1,000 קופסאות עם כל התווית מודפסת עליהן, כולל רכיבים ותאריך. מה
    הבעיה העיקרית?
  options:
    - >-
      קופסה מודפסת אסורה למזון, ורק מדבקות מותרות על מארז שוקולד.
    - >-
      בית דפוס לא יכול להדפיס את האדום של הסמל בצבע הנכון.
    - >-
      אין בעיה, כל עוד מזמינים מראש כמות שמספיקה לכל העונה.
    - >-
      רכיבים ותאריך משתנים, ומה שמודפס על הקרטון ננעל עד שהמלאי נגמר.
  correct: 3
  explanation: >-
    תאריך ואצווה משתנים בכל יום ייצור, ורכיבים משתנים כשמשתנה ספק או מתכון. לכן על הקרטון רק מיתוג
    קבוע, ושאר המידע במדבקת מוצר ובמדבקת תאריך.
- id: q8
  question: >-
    הוצאתם מארז מהמקרר, פתחתם מיד וצילמתם. בתמונה יש כתמים לבנים מחוספסים על הסביבונים. מה קרה?
  options:
    - >-
      פריחת שומן, כי הטמפרור של האצווה לא היה טוב מההתחלה.
    - >-
      האור מהחלון חזק מדי, והמצלמה שרפה את הצבע בנקודות.
    - >-
      עיבוי על שוקולד קר, שגרם לפריחת סוכר על פני השוקולד.
    - >-
      סוכריות הקישוט נמסו מהקור ונמרחו על פני השוקולד.
  correct: 2
  explanation: >-
    Callebaut ממליצים לפתוח רק אחרי שהאריזה חזרה לטמפרטורת החדר, כדי למנוע עיבוי ופריחת סוכר. פריחת
    שומן נראית כשכבה אפורה או פסים, לא ככתמים מחוספסים.
- id: q9
  question: >-
    לצילום הראשי בחנות בחרתם את המארז הכי יפה שיצא פעם, ומחקתם בעריכה פריחה קלה על אחד הסביבונים. מה
    הבעיה?
  options:
    - >-
      התמונה מציגה מוצר שלא תואם את מה שהלקוח יקבל, וזו הטעיה בהצגה.
    - >-
      עריכה של צילום מזון אסורה לגמרי, גם תיקון אור וצבע.
    - >-
      הבעיה רק טכנית: עריכה מורידה את רזולוציית התמונה.
    - >-
      אין בעיה, כי הלקוח מקבל את אותו מוצר ומדובר רק בשיווק.
  correct: 0
  explanation: >-
    חוק המזון אוסר תיאור מזון "בהצגה אחרת של מידע" שלא תואם אותו, וחוק הגנת הצרכן אוסר מצג מטעה גם
    בפרסומת. מצלמים מאצווה רגילה, ומתקנים רק אור וצבע.
- id: q10
  question: >-
    אין לכם תעודת הכשר לעסק, אבל כל השוקולדים שלכם מסומנים בהכשר על האריזה. מה אפשר לשים על המארז?
  options:
    - >-
      "כשר" קטן בגב, כי חומרי הגלם כולם כשרים לפי האריזות.
    - >-
      סמל שמעוצב כמו חותמת כשרות, בלי המילה "כשר".
    - >-
      את סמל ההכשר של ספק השוקולד, כי הוא מופיע על הרכיב העיקרי.
    - >-
      בלי "כשר" ובלי סמל; מה מותר לכתוב בלי תעודה, לפי מודול 17.
  correct: 3
  explanation: >-
    לפי חוק איסור הונאה בכשרות, יצרן לא מסמן מוצר כ"כשר" בלי תעודת הכשר. עיצוב שנראה כמו סמל כשרות או
    סמל של ספק יוצרים אותו רושם. מה כן אפשר לכתוב נלמד במודול 17.
