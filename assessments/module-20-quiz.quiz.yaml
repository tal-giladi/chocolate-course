- id: q1
  question: >-
    שירה מוכרת כ־10 מארזים של 58 ₪ בחודש. בפלטפורמה ישראלית יש חבילה בסיסית (39 ₪ ועוד 5.5%) וחבילה
    מתקדמת (189 ₪ ועוד 0.55%). מה זול יותר בשבילה היום?
  options:
    - >-
      המתקדמת, כי באחוז נמוך כל הזמנה עולה לה פחות, ולכן היא זולה בכל מחזור.
    - >-
      הבסיסית: כ־70.90 ₪ בחודש מול כ־192 ₪, כי המחזור רחוק מנקודת המעבר.
    - >-
      שתיהן עולות בערך אותו דבר, כי ההפרש באחוזים מקזז את ההפרש במנוי.
    - >-
      אי אפשר לדעת בלי לדעת את עמלת הסליקה, כי היא שונה בכל חבילה.
  correct: 1
  explanation: >-
    המחזור 580 ₪. בסיסית: 39 + 31.90; מתקדמת: 189 + 3.19. נקודת המעבר (150 ÷ 4.95%) היא כ־3,030 ₪
    בחודש. עמלת הסליקה נפרדת, ותלויה בספק ולא בחבילה.
- id: q2
  question: >-
    אחרי פוסט של סביבונים לחנוכה, עשרה אנשים כותבים לאלון בהודעה באינסטגרם "איך קונים?". מה הדרך
    שמתאימה למה שנמצא על אינסטגרם בישראל?
  options:
    - >-
      לתייג את המחיר על התמונה, כדי שהלקוחות יקנו ישירות מתוך הפוסט באפליקציה.
    - >-
      לבקש מכל לקוח את פרטי הכרטיס בהודעה, ולחייב אותם ידנית במסוף בבית.
    - >-
      לפתוח חנות בתוך האפליקציה דרך מנהל המסחר של מטא, עם תשלום מובנה.
    - >-
      לשלוח קישור לדף המוצר או קישור תשלום, ולשים את הקישור גם בפרופיל.
  correct: 3
  explanation: >-
    לפי ynetnews (2023), מאז אוגוסט 2023 עסק ישראלי לא יכול להחזיק חנות בתוך האפליקציה, רק קישור
    לאתר. פרטי כרטיס לא מבקשים בהודעה; התשלום בדף של ספק הסליקה.
- id: q3
  question: >-
    נועה, עוסקת פטורה, מוכרת כ־20 מארזים של 58 ₪ בחודש. ספק הסליקה מציע "לפי שימוש" (1.7% + 1 ₪)
    או "שירות" (59 ₪ בחודש + 1.5%), לא כולל מע"מ. מה נכון?
  options:
    - >-
      "לפי שימוש" זול יותר: כ־39.72 ₪ לפני מע"מ, מול כ־76.40 ₪ בחבילת שירות.
    - >-
      "שירות" זול יותר, כי בלי סכום קבוע לכל עסקה החודש תמיד יוצא זול יותר.
    - >-
      שתיהן זהות, כי ההבדל של 0.2% מכסה בדיוק את המנוי החודשי של 59 ₪.
    - >-
      מע"מ על העמלה מקוזז אצלה, ולכן משווים רק את האחוזים בלי הסכום הקבוע.
  correct: 0
  explanation: >-
    לפי שימוש: 20 × (0.986 + 1) = 39.72 ₪; שירות: 59 + 20 × 0.87 = 76.40 ₪. השירות משתלם רק מכ־53
    הזמנות כאלה בחודש. ועוסקת פטורה לא מקזזת מע"מ, אז היא משלמת עוד 18%.
- id: q4
  question: >-
    חברת הייטק מזמינה מעוסק מורשה 150 מארזים לראש השנה, 7,000 ₪ לפני מע"מ, באוגוסט 2026. מה צריך
    לפני שמוציאים חשבונית מס?
  options:
    - >-
      שום דבר מיוחד, כי מספר הקצאה נדרש רק בחשבוניות מעל 25,000 ₪.
    - >-
      לפצל לשתי חשבוניות של 3,500 ₪, כדי שכל אחת תהיה מתחת לסף.
    - >-
      מספר הקצאה מרשות המסים, כי מ־1.6.2026 הסף הוא 5,000 ₪ לפני מע"מ.
    - >-
      אישור של ספק הסליקה שהחברה שילמה, כי הוא מנפיק את מספר ההקצאה.
  correct: 2
  explanation: >-
    לפי ynetnews, מ־1.6.2026 חשבונית מס מעל 5,000 ₪ לפני מע"מ צריכה מספר הקצאה. פיצול מלאכותי כדי
    לעקוף את הסף נחשב התנהלות פסולה. את הפרטים בודקים עם רואה חשבון.
- id: q5
  question: >-
    שרב: התחזית לתל אביב 36°C. הזמנה של מארז שוקולד מוצק לרמת גן, בשליח שאוסף ב־12:00. מה אומר כלל
    הקיץ של הקורס?
  options:
    - >-
      שולחים כרגיל, כי רמת גן קרובה והנסיעה עצמה לוקחת פחות משעה.
    - >-
      שולחים בקרטון רגיל, ומבקשים מהשליח להשאיר את המארז בצל ליד הדלת.
    - >-
      יום אדום: לא בשליח; מציעים איסוף, מסירה שלכם לפני 10:00, או לדחות.
    - >-
      שולחים בקופסה מבודדת, כי קרחון מחזיק את המארז בכל חום וכל זמן.
  correct: 2
  explanation: >-
    מ־33°C היום אדום: צורה V נמסה ב־33.8°C, ורכב סגור חם יותר מהאוויר. ביום כזה הכלל של הקורס הוא
    איסוף או מסירה שלכם בבוקר, ושליח נדחה. זה כלל של הקורס, לא של יצרן.
- id: q6
  question: >-
    לקוחה מצלמת מארז שהגיע בקופסה מבודדת: טיפות על השקית, ואחר כך שכבה לבנה יבשה על הצד שהיה קרוב
    לקרחון. מה קרה?
  options:
    - >-
      הקרחון נגע במארז או שהשקית נפתחה קרה: עיבוי ואחריו פריחת סוכר.
    - >-
      השוקולד התחמם מעל 34°C בדרך, ולכן התקשה שוב בלי טמפרור.
    - >-
      השוקולד לא היה מטומפר מלכתחילה, וזה מופיע רק אחרי משלוח ארוך.
    - >-
      האבקה הלבנה היא עובש, ולכן צריך להודיע על ריקול לכל האצווה.
  correct: 0
  explanation: >-
    שכבה לבנה ויבשה בצד הקר אחרי טיפות היא פריחת סוכר מעיבוי (Callebaut, 11.3). חוצץ קרטון בין הקרחון
    למארז, ופתיחת השקית רק בטמפרטורת החדר, מונעים אותה.
- id: q7
  question: >-
    לקוח מחיפה מבקש מארז טראפלס שמנת בחבילה שמגיעה למחרת. מה עונים?
  options:
    - >-
      שולחים בצידנית עם שני קרחונים, וכותבים על המארז "לשמור בקירור".
    - >-
      שולחים רק בחורף, כי בטמפרטורה נמוכה אין מגבלת זמן על שמנת.
    - >-
      שולחים, בתנאי שהלקוח חותם שהוא אחראי למה שקורה אחרי האיסוף.
    - >-
      טראפלס רק באיסוף או במסירה ביד; מציעים לו מארז שוקולד מוצק.
  correct: 3
  explanation: >-
    טראפלס שמנת הוא קבוצה ג: עד שעתיים מחוץ למקרר בסך הכול (UF/IFAS), כולל הדרך. וגם לא אומת אם
    מותר להוביל אותו בלי רישיון הובלה (סעיף 149); זו שאלה ללשכת הבריאות.
- id: q8
  question: >-
    לקוחה קיבלה מארז עם הלוגו של המשרד שלה, שהוזמן לפי בקשתה, ואחרי שלושה ימים כותבת: "שינינו
    תוכניות, אני רוצה להחזיר". המארז תקין. מה נכון, באופן כללי?
  options:
    - >-
      חייבים להחזיר את מלוא הסכום, כי לא עברו 14 ימים מקבלת המוצר.
    - >-
      כנראה חל החריג למוצר שיוצר במיוחד (14ג(ד)); עונים לפי המדיניות הכתובה.
    - >-
      מחזירים את הכסף פחות 100 ₪, כי זה סכום דמי הביטול הקבוע בחוק.
    - >-
      מחזירים רק אם היא שולחת את המארז בחזרה, כי כך כל מוצר חוזר.
  correct: 1
  explanation: >-
    לפי 14ג(ד), זכות הביטול לא חלה על טובין שיוצרו במיוחד עבור הצרכן, ולא על טובין פסידים. זו פרשנות
    כללית, לא ייעוץ משפטי; אם המדיניות שלכם נדיבה יותר, אתם מחויבים לה.
- id: q9
  question: >-
    במדיניות של עידו כתוב "מוצרי מזון לא מוחזרים בשום מקרה". לקוח קיבל מארז שבור לגמרי. מה נכון?
  options:
    - >-
      פגם: מחזירים את מלוא הסכום או מחליפים, בלי דמי ביטול, ומתקנים את הנוסח.
    - >-
      המדיניות קובעת, כי היא הופיעה בדף לפני שהלקוח שילם על ההזמנה.
    - >-
      מחזירים חצי מהסכום, כי השוקולד עדיין ראוי לאכילה גם כשהוא שבור.
    - >-
      גובים דמי ביטול של 5%, כי הלקוח הוא זה שביקש לבטל את העסקה.
  correct: 0
  explanation: >-
    לפי 14ה(א), בביטול בגלל פגם או אי־התאמה מחזירים תוך 14 ימים בלי דמי ביטול. מדיניות לא יכולה לבטל
    זכות שהחוק נותן; לכן כותבים בה במפורש מה קורה בפגם.
- id: q10
  question: >-
    בשבוע אחד בספטמבר הגיעו שלוש פניות "המארז נמס" מלקוחות באזורים שונים. מה הצעד הנכון?
  options:
    - >-
      מחליפים לכל אחד מארז, ומשאירים את אופן המשלוח כפי שהוא.
    - >-
      מוסיפים לדף המוצר "העסק לא אחראי לנזקי חום", וממשיכים לשלוח כרגיל.
    - >-
      מבקשים מהלקוחות לשים את המארזים במקרר, כדי שיתקשו שוב לפני האכילה.
    - >-
      מטפלים בכל פנייה, ואז עוצרים חבילות, בודקים ביומן ומודדים שוב את האריזה.
  correct: 3
  explanation: >-
    יומן הפניות נועד לראות דפוסים: שלוש פניות באותו שבוע הן בעיה בתהליך. מטפלים בלקוחות (פגם = החזר
    או החלפה), ואז בודקים את כלל הקיץ ואת הקופסה במדחום.
