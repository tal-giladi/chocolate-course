- id: q1
  question: >-
    ערב חנוכה, אתם מכינים קרמל מלוח למארזים. בלי גלוקוזה בבית, בישלתם סוכר ומים, ערבבתם כל הזמן
    "כדי שיהיה אחיד", והסיר הפך לגוש לבן. מה עושים עכשיו, ומה משנים בפעם הבאה?
  options:
    - >-
      זורקים את הגוש, כי סוכר שהתגבש כבר לא יחזור להיות שקוף, ובפעם הבאה מבשלים על אש חזקה יותר.
    - >-
      מוסיפים מעט מים וממיסים עד שקוף; בפעם הבאה גלוקוזה או מעט לימון, ולא מערבבים אחרי שנמס.
    - >-
      מוסיפים את השמנת מיד, כי השמנת ממיסה את הגבישים, ובפעם הבאה מוסיפים אותה כבר בהתחלה.
    - >-
      ממשיכים לבשל את הגוש על אש חזקה עד שייעשה חום, ובפעם הבאה משתמשים בסוכר חום במקום לבן.
  correct: 1
  explanation: >-
    התגבשות מתקנים בהמסה מחדש עם מים. גלוקוזה או חומצה מפריעות לגבישים להיבנות (America's Test
    Kitchen), ו"לא לערבב אחרי שנמס" מונע את הגביש הראשון.
- id: q2
  question: >-
    לקוחה מחברה שמזמינה מתנות שואלת אם בונבוני הקרמל המלוח שלכם יחזיקו חודשיים במחסן המשרד. מה התשובה
    האחראית?
  options:
    - >-
      כן, כי המלח והסוכר בקרמל משמרים אותו, ולכן כל קרמל מחזיק לפחות חודשיים בטמפרטורת החדר.
    - >-
      כן, אם הם יהיו במקרר במשרד, כי הקור מוריד את פעילות המים לרמה של סוכריות טופי.
    - >-
      כן, אם מבשלים את המילוי ל־130°C, כי אז הוא יציב לגמרי ועדיין נשאר רך וזורם.
    - >-
      מילוי קרמל רך מכיל מים זמינים; בבית מבטיחים עד כשבועיים, ולמכירה צריך מדידה ומבחן חיי מדף.
  correct: 3
  explanation: >-
    טופי יושב ב־aw של 0.45-0.60, אבל מילוי רך שבושל ל־105°C מכיל הרבה יותר מים. Callebaut: אף מדידה
    אחת לא חוזה חיי מדף, ומבטיחים פחות ממה שבטוחים בו.
- id: q3
  question: >-
    אתם מסבירים בסדנה למה קרמל עם שמנת טועם כמו טופי. משתתף אומר: "זה פשוט סוכר שנשרף יותר". מה
    התיקון הנכון?
  options:
    - >-
      הטעם מגיע גם ממייאר: חלבוני החלב והלקטוז מגיבים עם הסוכר אחרי שהשמנת נכנסת.
    - >-
      הטעם מגיע רק מהחמאה, כי חמאה מכילה טעם טופי טבעי שמתחזק כשמחממים אותה בסוכר.
    - >-
      הטעם מגיע מקרמליזציה בטמפרטורה נמוכה, כי השמנת מורידה את נקודת הקרמליזציה ל־100°C.
    - >-
      הטעם מגיע מהגלוקוזה, שמתקרמלת אחרת מסוכרוז ונותנת טעם חמאתי לכל קרמל שמבשלים.
  correct: 0
  explanation: >-
    קרמליזציה היא פירוק של סוכר לבד, מכ־160°C. מייאר דורשת סוכר מחזר וחלבון (Fontana), ולכן היא
    מתחילה רק כשהשמנת נכנסת ומבשלים ל־104-106°C. זה טעם הטופי.
- id: q4
  question: >-
    הכנתם בונבוני פרלינה משלוש כפות פרלינה קנויה ושוקולד מומס ב־40°C, וסגרתם אחרי שעתיים. אחרי
    שבוע הם אפורים, והמכסה של חלקם נדחף החוצה. מה היה צריך לשנות?
  options:
    - >-
      להוסיף שמנת למילוי, כדי שיהיה רך יותר ולא ילחץ על המכסה כשהוא מתקשה בתוך הקליפה.
    - >-
      לקרר את הבונבונים במקפיא לילה, כדי שהשמן מהאגוזים יתקשה ולא ינדוד לקליפה.
    - >-
      להוסיף 5%-6% חמאת קקאו, לגבש את המילוי ל־25-26°C, ולחכות 24-36 שעות לפני הסגירה.
    - >-
      להחליף לפרלינה עם יותר סוכר, כי סוכר מקשה את המילוי ומונע פריחת שומן בבונבון.
  correct: 2
  explanation: >-
    Callebaut: מילוי שומני מאיץ פריחת שומן, ומוסיפים לו 5%-6% חמאת קקאו ומגבשים אותו. Valrhona:
    מילוי פרלינה מתייצב ב־25-26°C ונח 24-36 שעות לפני הסגירה.
- id: q5
  question: >-
    ט"ו בשבט. לקוחה מבקשת 20 בונבונים "עם פטל טרי בפנים" למסיבה בעוד חמישה ימים. מה מציעים?
  options:
    - >-
      ג'לי פטל מבושל ל־106°C בתחתית הבונבון, כי מילוי פרי טרי עלול לא להיות בטוח אחרי שעות.
    - >-
      פטל טרי טחון עם שוקולד לבן, כי השוקולד הלבן קושר את המים ומספיק לחמישה ימים במקרר.
    - >-
      פטל טרי שלם בתוך גנאש, כי פרי שלם לא משחרר מים כמו פרי טחון ולכן מחזיק יותר זמן.
    - >-
      ריבת פטל מהסופר, כי ריבה היא כבר ג'לי מוכן ואין הבדל בינה לבין ג'לי שמבשלים בבית.
  correct: 0
  explanation: >-
    Callebaut: מחית פירות ושוקולד עלולה לא להיות בטוחה אחרי יום ואפילו כמה שעות. ג'לי מבושל יושב
    ב־aw של 0.50-0.75; ריבה ב־0.80-0.85 (Fontana) ורכה מדי לבונבון.
- id: q6
  question: >-
    הג'לי שלכם לא התקשה. ביומן: מחית מנגו, 2.5 גרם פקטין צהוב, סוכר וגלוקוזה, 106°C, ושכחתם את
    החומצה. מה הסיבה הכי סבירה?
  options:
    - >-
      מנגו מכיל אנזים שמפרק פקטין, ולכן אי אפשר להכין ממנו ג'לי עם פקטין בשום מצב.
    - >-
      106°C חם מדי לפקטין, והוא התפרק בחום, ולכן צריך לעצור ב־100°C כשיש מנגו.
    - >-
      בלי חומצה ה־pH של המנגו גבוה מדי, ופקטין HM צריך pH של כ־2.8-3.5 כדי להתקשות.
    - >-
      2.5 גרם פקטין זה מעט מדי ל־100 גרם מחית, וצריך לפחות 10 גרם כדי שג'לי יתקשה.
  correct: 2
  explanation: >-
    UGA Extension: פקטין HM צריך סוכר גבוה וחומציות של כ־2.8-3.5. מנגו פחות חמוץ מפטל, ולכן החומצה
    בסוף חשובה במיוחד. הכמות והטמפרטורה היו נכונות.
- id: q7
  question: >-
    בניתם חטיף: נוגט בוטנים, ומעליו קרמל רך מהצנצנת בלי בישול נוסף, וציפוי שוקולד רק מלמעלה. אחרי
    ארבעה ימים הנוגט דביק. מה שני השינויים הכי נכונים?
  options:
    - >-
      לבשל את הנוגט ל־160°C ולהוסיף לו מלח, כדי שיהיה קשה מספיק לעמוד מול הקרמל.
    - >-
      לשמור את החטיפים במקרר ולהוסיף עוד בוטנים, כי הבוטנים סופגים את המים מהקרמל.
    - >-
      להחליף את הקרמל בריבה, כי ריבה מכילה פחות מים מקרמל ולא תרכך את הנוגט.
    - >-
      לבשל שוב את הקרמל ל־118-120°C, ולצפות את כל החטיף בשוקולד מטומפר.
  correct: 3
  explanation: >-
    Fontana: מים עוברים מהשכבה עם ה־aw הגבוה לנמוך, וציפוי שוקולד מגן מלחות הסביבה. קרמל של
    118-120°C קרוב לנוגט. מקרר מוסיף לחות, וריבה רטובה יותר מקרמל.
- id: q8
  question: >-
    במרציפן, אחרי שהוספתם קמח שקדים וחלבון, אתם רוצים לסיים מהר ולא לחמם שוב. למה King Arthur
    מחזירים את התערובת לאש?
  options:
    - >-
      כדי שהשקדים ישחררו שמן, אחרת המרציפן יהיה יבש ולא יתחבר לגוש אחד בלישה.
    - >-
      כדי שהחלבון יגיע לפחות ל־72°C ויהיה מפוסטר, וכדי שהתערובת תהיה סמיכה ואחידה.
    - >-
      כדי שהסוכר יתקרמל מעט ויתן למרציפן צבע זהוב וטעם עמוק יותר של קרמל.
    - >-
      כדי שגבישי הסוכר יימסו לגמרי, כי מרציפן טוב הוא מרציפן בלי שום גבישי סוכר.
  correct: 1
  explanation: >-
    King Arthur: מבשלים תוך ערבוב עד שהתערובת סמיכה ומגיעה לפחות ל־161°F (כ־72°C) כדי לפסטר את
    החלבון. במרציפן רוצים גבישים זעירים, לא אפס גבישים.
- id: q9
  question: >-
    אתם כותבים פתק למארז של 9 בונבונים: קרמל מלוח, ג'יאנדוז'ה, וג'לי פטל עם גנאש שמנת. מה חייב
    להופיע?
  options:
    - >-
      שמות המילויים בלבד, כי אלרגנים כותבים רק על מוצרים שנמכרים בחנות ולא על מתנות.
    - >-
      "פרווה" על הג'לי והג'יאנדוז'ה, ו"חלבי" רק על הקרמל, ותאריך אחד לפי המילוי הארוך ביותר.
    - >-
      חלב, אגוזי לוז, סויה ומה שכתוב על המחית; חלבי; ותאריך לפי המילוי הקצר ביותר.
    - >-
      רק "עלול להכיל אגוזים", כי זה מכסה את כל האלרגנים האפשריים במארז שוקולד ביתי.
  correct: 2
  explanation: >-
    כל מילוי מוסיף אלרגנים משלו, ומילוי חלבי אחד הופך את המארז לחלבי. התאריך נקבע לפי המילוי הרגיש
    ביותר, כאן הגנאש והקרמל הרכים.
- id: q10
  question: >-
    אתם קולים אגוזים ומבשלים קרמל לפרלינה, ושלושה ילדים מסתובבים במטבח. הקרמל ב־172°C. מה נכון לעשות?
  options:
    - >-
      להוציא את הילדים מהמטבח לפני שהסוכר עולה מעל 100°C, לעבוד עם שרוולים, ולא להשאיר את הסיר.
    - >-
      להמשיך כרגיל, כי קרמל מסוכן רק בשלב השמנת, ובפרלינה אין שמנת ולכן אין קיטור.
    - >-
      לשים קערת קרח ליד הכיריים, כי בכוויה מסוכר מחזיקים את היד בקרח עד שהכאב עובר.
    - >-
      לתת לילד הגדול לערבב, כי ערבוב רציף של הקרמל מונע התזות ושומר על צבע אחיד.
  correct: 0
  explanation: >-
    סוכר ב־170°C נדבק לעור וממשיך לשרוף, גם בלי שמנת. NHS: בכוויה, מים זורמים קרירים 20 דקות
    בהקדם. ערבוב קרמל אחרי שנמס גם גורם להתגבשות.
