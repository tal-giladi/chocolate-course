- id: q1
  question: >-
    נועה מתחילה לפרסם את מארזי החנוכה שלה ביום ראשון 29.11. לפי תכנון הייצור, היא יכולה לקבל
    הזמנות רק עד שני 30.11. מה הבעיה העיקרית בתוכנית?
  options:
    - >-
      ראשון הוא יום חלש ברשתות, ולכן היה עדיף להתחיל ביום חמישי באותו שבוע.
    - >-
      לפרסום נשאר יום וחצי לפני הסגירה; לוח תוכן נבנה אחורה ממועד הסגירה, שבועות לפני.
    - >-
      היא צריכה קודם לצבור אלף עוקבים, ורק אז לפרסם פוסט שמוכר מוצר.
    - >-
      אין בעיה, כי רוב הלקוחות הפרטיים מזמינים ממילא ביום האחרון לפני החג.
  correct: 1
  explanation: >-
    מועד סגירת ההזמנות נקבע לפי הקיבולת (19.3), ולוח התוכן נבנה אחורה ממנו: צילום, רילס ופוסטי מחיר
    ואלרגנים בשבועות שלפני. פוסט מכירה שמתחיל יום לפני הסגירה כמעט לא מביא הזמנות.
- id: q2
  question: >-
    יוסי מכין קו מריר 85% עם מלטיטול, וכותב בפוסט "מתאים לסוכרתיים, לא מעלה סוכר". הוא טוען שזה
    בסדר כי זה לא על האריזה. מה נכון?
  options:
    - >-
      הוא צודק, כי סעיף 13 חל רק על התווית ולא על רשתות חברתיות של עסק קטן.
    - >-
      זה מותר אם הוא מוסיף "לפי ניסיון אישי" בסוף הפוסט, כדי שיהיה ברור שזו דעה.
    - >-
      זה מותר אם יש במוצר פחות מ־10 גרם סוכר ל־100 גרם, כי אז אין סמל אדום.
    - >-
      זה אסור: סעיף 13 חל גם על פרסום, ו"מתאים לסוכרתיים" מייחס למזון השפעה על מחלה.
  correct: 3
  explanation: >-
    סעיף 13 לחוק המזון אוסר לייחס למזון ריפוי או השפעה על מחלה "בדרך של סימון, או פרסום". פוסט הוא
    פרסום. בלי סמל אדום לא הופך מוצר ל"בריא" (13.5). כותבים עובדות: אחוז קקאו, הממתיק, והאזהרה.
- id: q3
  question: >-
    שלחתם מארז למשפיענית אוכל, והיא העלתה רילס עם "תודה ל־@העסק" בסוף הכיתוב. לקוח שואל אם זה
    פרסום. מה עושים?
  options:
    - >-
      מבקשים ממנה לפתוח את הכיתוב ב"פרסומת" או "שיתוף פעולה", ובפעם הבאה מסכמים מראש בכתב.
    - >-
      לא עושים כלום, כי היא קיבלה מוצר ולא כסף, ולכן זה לא נחשב פרסומת.
    - >-
      מבקשים ממנה להוסיף #ad בסוף הכיתוב, ליד התיוג שכבר מופיע שם.
    - >-
      מוחקים את התגובה של הלקוח, כדי שלא תיווצר בעיה עם המשפיענית.
  correct: 0
  explanation: >-
    לפי סעיף 7(ג)(1) לחוק הגנת הצרכן, פרסומת שאדם סביר עלול לחשוב שאינה פרסומת היא פרסומת מטעה. לפי
    עמדת היועמ"ש (2021), צריך הבהרה בפתח הפוסט, והאשטאג או שם המממן לבד לא מספיקים.
- id: q4
  question: >-
    באתר שלכם מארז ב־58 ₪. בפוסט חדש כתבתם "49 ₪ + מע"מ" כדי שייראה זול. אתם עוסקת פטורה. מה
    הבעיה?
  options:
    - >-
      אין בעיה, כי "+ מע"מ" הוא ניסוח מקובל שכל לקוח מבין בלי הסבר נוסף.
    - >-
      הבעיה היא רק שהמחיר שונה מהאתר, ואפשר לפתור אותה בעדכון המחיר באתר ל־49 ₪.
    - >-
      לצרכן מציגים מחיר כולל, ועוסקת פטורה בכלל לא גובה מע"מ; המחיר שהוצג גם מחייב.
    - >-
      אין בעיה, כל עוד המחיר בקופה אחרי המע"מ יוצא בדיוק 58 ₪ כמו באתר.
  correct: 2
  explanation: >-
    לפי סעיפים 17א-17ב לחוק הגנת הצרכן מציגים "מחיר כולל", כולל מע"מ, והמחיר שמוצג מחייב. עוסקת
    פטורה לא גובה מע"מ (19.2), ולכן "49 + מע"מ" מטעה פעמיים.
- id: q5
  question: >-
    משאבי אנוש בחברה מבקשים 80 מארזים ממותגים ושואלים "מה אתם צריכים מאיתנו?". מה הרשימה הנכונה?
  options:
    - >-
      קובץ לוגו, אישור כתוב של כמות ומועד, אישור הדמיה, מקדמה, ותשובה על אלרגיות וכשרות.
    - >-
      רק כתובת למשלוח, כי את הלוגו אפשר להוריד מהאתר של החברה בלי לשאול.
    - >-
      רק מספר ח"פ, כדי להוציא חשבונית מס, כי זה מה שחברה צריכה לפני הכול.
    - >-
      רק תשלום מלא מראש, כי עם תשלום מלא לא צריך לאשר הדמיה או כמות בכתב.
  correct: 0
  explanation: >-
    לפי 21.2: הלוגו מגיע מהחברה, היא מאשרת הדמיה בכתב, יש אישור כתוב על כמות, מחיר ומועד, ומקדמה
    לפני קניית חומרים. שואלים על אלרגיות בצוות ועל דרישת כשרות כבר בשיחה הראשונה.
- id: q6
  question: >-
    חברה מבקשת "15% הנחה כי זו כמות גדולה" על 60 מארזים במחיר המדרגה, 52 ₪. מחיר הרצפה של המדרגה
    כ־39 ₪. מה התשובה הנכונה?
  options:
    - >-
      לאשר מיד, כי חברה שמזמינה פעם אחת תזמין שוב, וההפסד יחזור בהזמנה הבאה.
    - >-
      לסרב לכל משא ומתן, כי מחיר מדרגה הוא מחיר קבוע שאסור לשנות בשום מקרה.
    - >-
      להציע 15% הנחה ולהוריד את המקדמה, כדי שההצעה תיראה נדיבה יותר לחברה.
    - >-
      לחשב: 44.20 ₪ עדיין מעל הרצפה אבל מוריד את הרווח; עונים במספר, או מציעים מדרגה גבוהה יותר.
  correct: 3
  explanation: >-
    52 × 0.85 = 44.20 ₪. זה מעל מחיר הרצפה, אבל הרווח למארז יורד בחדות. הכלל מ־19.2 ו־21.2: לא הנחה
    באוויר, אלא חישוב מול הרצפה ותשובה במספר; לפעמים כמות גדולה יותר מצדיקה מדרגה חדשה.
- id: q7
  question: >-
    אתם עוסק פטור. חברה מאשרת הזמנה של 3,120 ₪. איזה מסמך מוציאים ומתי?
  options:
    - >-
      חשבונית מס עם מספר הקצאה, כי העסקה מעל 3,000 ₪ ונעשית עם חברה.
    - >-
      חשבון עסקה כדרישת תשלום, וקבלה כשהתשלום מתקבל; לא חשבונית מס.
    - >-
      שום מסמך, כי עוסק פטור לא צריך לתעד הכנסות מתחת לתקרה השנתית.
    - >-
      חשבונית מס רגילה, כי כל עסק רשאי להוציא אותה כשהלקוח הוא חברה.
  correct: 1
  explanation: >-
    לפי כל זכות, עוסק פטור אינו רשאי להוציא חשבונית מס; הוא מוציא חשבון עסקה, וקבלה כשמשולם. מספר
    הקצאה נוגע לחשבונית מס של עוסק מורשה מעל 5,000 ₪ לפני מע"מ.
