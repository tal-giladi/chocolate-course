    קישוטים מטומפרים נשמרים היטב בקופסה סגורה בטמפרטורת חדר קרירה. על עוגה במקרר הם מתכסים בפריחת סוכר,
    בשקית פתוחה הם סופגים ריחות וטביעות, ומהמקפיא הם מזיעים כשמוציאים.
