  options:
    - >-
      מחממים את העוגה במיקרוגל לכמה שניות, כדי שהקרם ידביק את הסדקים.
    - >-
      ממיסים את הצווארון בעודו על העוגה במייבש שיער חם, עד שהסדקים נעלמים.
    - >-
      זורקים את הפס וקונים צווארון מוכן, כי שוקולד סדוק לא חוזר לשימוש.
    - >-
      שוברים את הפס לשברים לקישוט, או עוטפים ומסתירים את הסדקים בקישוטים.
  correct: 3
  explanation: >-
    שוקולד שהתקשה על האצטט נסדק כשמכופפים אותו. השברים הם קישוט בפני עצמו, ושוקולד נקי חוזר לקערה. בפעם
    הבאה עוטפים כשהשוקולד לא מחליק ועוד גמיש.
- id: q10
  question: >-
    הזמנה של 4 עוגות לחברה. אתם רוצים להכין את כל הספירלות והפיליגרן ביום ראשון ולהרכיב ביום רביעי. איפה
    שומרים את הקישוטים בינתיים?
  options:
    - >-
      בקופסה סגורה בשכבות עם נייר אפייה, ב־18-20°C, ומוציאים אותם רק להרכבה.
    - >-
      על העוגות עצמן במקרר, כדי שיספיקו להיצמד לקרם עד יום רביעי.
    - >-
      בשקית פתוחה על השיש, כדי שהשוקולד ינשום ולא יצבור לחות בקופסה.
    - >-
      במקפיא בשקית, ומעבירים אותם ישר מהמקפיא לעוגה בבוקר ההרכבה.
  correct: 0
