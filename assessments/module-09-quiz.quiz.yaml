- id: q1
  question: >-
    ביום שישי בבוקר, במטבח של 17°C, ניסיתם לגלגל ספירלות על אצטט. בכל פעם שחיכיתם שהשוקולד יהיה יבש למגע,
    הוא כבר נסדק כשגלגלתם. מה כדאי לשנות?
  options:
    - >-
      לחמם את השוקולד ל־35°C לפני הפריסה, כדי שיישאר נוזלי זמן רב יותר על האצטט.
    - >-
      להיות מוכנים עם הגליל מראש ולגלגל מוקדם יותר, כי בחדר קר החלון קצר מאוד.
    - >-
      לפרוס שכבה עבה של 4-5 מ"מ, כי שכבה עבה נשארת גמישה גם אחרי שהתקשתה.
    - >-
      להכניס את פסי האצטט למקרר לפני הפריסה, כדי שהשוקולד יתגבש באופן אחיד.
  correct: 1
  explanation: >-
    בחדר קר השוקולד מגיע מהר מהשלב היבש למגע לשלב השביר. מוכנים מראש ומגלגלים ברגע שהברק נעלם. חימום ל־35°C
    שובר את הטמפר, ואצטט קר מקצר את החלון עוד יותר.
- id: q2
  question: >-
    אחות שלכם מבקשת לבר המצווה תלתלי שוקולד על 60 כוסות מוס, ואין לכם זמן לטמפר שוב. בארון יש 3 טבלאות
    מריר של 100 גרם מהסופר. מה הדרך הפשוטה?
  options:
    - >-
      להמיס את הטבלאות, לפרוס על משטח קר, ולגרד סיגריות בלי לטמפר כי הן נאכלות מיד.
    - >-
      לגרד את הטבלאות במגררת גבינה, כי מקלף ירקות לא עובד על שוקולד מסחרי.
    - >-
      להכניס את הטבלאות למקפיא לשעה, ואז לקלף מהן במקלף כשהן קשות במיוחד.
    - >-
      לחמם כל טבלה מעט ולקלף ממנה תלתלים במקלף ירקות, בלי להמיס אותה בכלל.
  correct: 3
  explanation: >-
    תלתלים במקלף מקלפים מגוש מחומם מעט, בלי להמיס, ולכן הטמפר של הטבלה נשמר. שוקולד מומס שלא טומפר נשאר רך
    ואפור, וגוש קפוא מתפורר לאבקה.
- id: q3
  question: >-
    הכנתם 12 קישוטי פיליגרן ללבבות על עוגת יום נישואין. כשהרמתם אותם, בשבעה מהם נשאר על הנייר הקו הפנימי
    שבאמצע הלב. מה משנים בסבב הבא?
  options:
    - >-
      מזלפים קודם את קו המתאר, וכל קו פנימי מתחיל ונגמר עליו או על קו אחר.
    - >-
      מזלפים על אצטט במקום נייר, כי שוקולד לא נדבק לאצטט ותמיד עולה שלם.
    - >-
      מקררים את הקישוטים במקפיא לפני ההרמה, כדי שהקו הפנימי יתקשה יותר.
    - >-
      מזלפים בפתח גדול של 4-5 מ"מ, כי רק קו עבה מחזיק את עצמו כשמרימים.
  correct: 0
  explanation: >-
    פיליגרן מחזיק את עצמו דרך החיבורים בין הקווים. קו שלא נוגע בשלד נשאר מאחור. אצטט לא פותר קו מנותק, ופתח
    גדול הורס את המראה העדין.
- id: q4
  question: >-
    באמצע זילוף מילה "מזל טוב", הקו בקורנט נהיה עבה וגלי ויוצא בלחץ. בקערה השוקולד ב־31°C ועבר בדיקת סכין
    לפני 5 דקות. מה הצעד הנכון?
  options:
    - >-
      לטמפר מחדש את כל הקערה, כי קורנט שמסמיך מעיד שהטמפר כולו כבר נכשל.
    - >-
      להוסיף לקורנט כמה טיפות חלב, כדי לדלל את השוקולד ולהחזיר קו דק ואחיד.
    - >-
      לחמם את הקורנט 2-3 שניות במייבש שיער, או למלא קורנט חדש מהקערה.
    - >-
      לחתוך את הקצה של הקורנט גבוה יותר, כדי שהשוקולד הסמיך יצא בקלות.
  correct: 2
  explanation: >-
    בקורנט יש כמות קטנה שמתקררת ומתגבשת, גם כשהקערה בסדר. חימום קצר או קורנט חדש מחזירים זרימה. חלב יגרום
    לשוקולד להיתפס, ופתח גדול ייתן קו עבה.
- id: q5
  question: >-
    לקוחה מזמינה עוגת קצפת עם צווארון שוקולד לשבת בצהריים. אתם רוצים להכין את הצווארון ביום שישי בבוקר.
    איך שומרים עליו מבריק עד ההגשה?
  options:
    - >-
      עוטפים את העוגה, מקלפים מיד את האצטט, ושומרים את העוגה בחדר בקופסה.
    - >-
      עוטפים, מקררים, ומשאירים את האצטט על הצווארון במקרר עד רגע ההגשה.
    - >-
      עוטפים, ומכניסים את העוגה למקפיא עד שבת כדי שהשוקולד לא יאבד ברק.
    - >-
      מכינים את הצווארון בנפרד, ומדביקים אותו לעוגה בשבת בבוקר בשוקולד חם.
  correct: 1
  explanation: >-
    עוגת קצפת חייבת להיות במקרר. האצטט מגן על הצווארון מעיבוי ומשאיר אותו מבריק, ומקלפים אותו בהגשה. עוגה
    בחדר מסוכנת, ומקפיא יוצר עיבוי חזק עוד יותר כשמוציאים.
- id: q6
  question: >-
    באירוע בחצר ביולי, ב־30°C, ספירלות השוקולד על העוגה התחילו להתעקם אחרי 20 דקות. העוגה עם קרם שמנת. מה
    ההחלטה הנכונה?
  options:
    - >-
      להשאיר את העוגה בחוץ עד סוף האירוע ולהחליף ספירלות כשהן מתעקמות.
    - >-
      לכסות את העוגה במגבת רטובה, כדי לקרר את הקישוטים בלי להזיז את העוגה.
    - >-
      לרסס את הקישוטים במים קרים, כדי לקרר את השוקולד ולעצור את ההתרככות.
    - >-
      לחתוך ולהגיש עכשיו, ולהחזיר את מה שנשאר למקרר, כי העוגה מתכלה.
  correct: 3
  explanation: >-
    עוגה עם קרם לא נשארת בחוץ יותר משעתיים, ושעה כשחם מ־32°C. הקישוטים מתרככים, והעוגה עצמה בסיכון. מים
    ומגבת רטובה יוצרים כתמים ופריחת סוכר על השוקולד.
- id: q7
  question: >-
    חברה שאלה למה כל המניפות שלה נשברות לפתיתים. היא פורסת שוקולד מטומפר על שיש, מחכה 10 דקות כדי "להיות
    בטוחה", ורק אז דוחפת את השפכטל. מה תגידו לה?
  options:
    - >-
      שתתחיל אחרי 1-3 דקות, כשהשוקולד עמום אבל ציפורן עוד נכנסת בו בקלות.
    - >-
      שתחכה עוד, עד 20 דקות, כי שוקולד שלא התקשה לגמרי נמרח על השפכטל.
    - >-
      שתעבור לשוקולד שלא טומפר, כי שוקולד מטומפר קשיח מדי בשביל מניפות.
    - >-
      שתקרר את השיש במקפיא לפני הפריסה, כדי שהשכבה תתגבש מהר ואחיד.
  correct: 0
  explanation: >-
    מניפות וסיגריות מגרדים כשהשוקולד התייצב ועוד לא קשה. אחרי 10 דקות הוא שביר. שוקולד לא מטומפר נמרח ולא
    מחזיק צורה, ושיש קפוא מקצר את החלון ויוצר עיבוי.
- id: q8
  question: >-
    אתם מכינים קינוח פרווה לסיום ארוחה בשרית: כוסות מוס על בסיס קרם קוקוס, עם תחרת שוקולד ונצנצים זהובים.
    מה בודקים?
  options:
    - >-
      רק את השוקולד, כי מוס על בסיס קוקוס הוא תמיד פרווה וכך גם הנצנצים.
    - >-
      רק את הנצנצים, כי שוקולד מריר הוא פרווה גם כשכתוב עליו "ציוד חלבי".
    - >-
      את כל הרכיבים לפי האריזה: שוקולד, קרם, נצנצים אכילים, ומה כתוב על ציוד חלבי.
    - >-
      שום דבר, כי קישוטים שוקלים מעט מאוד ולכן אינם משנים את כשרות הקינוח.
  correct: 2
  explanation: >-
    הקינוח מקבל את הכשרות של כל רכיב בו, לפי מה שכתוב על כל אריזה, כולל "ציוד חלבי". נצנצים צריכים להיות
    אכילים ועם כשרות משלהם. אם יש ספק, שואלים את הרב.
- id: q9
  question: >-
    פרסתם שוקולד על פס אצטט לצווארון לעוגה של 16 ס"מ, חיכיתם 10 דקות בזמן שהקצפתם קרם, ועכשיו כשאתם עוטפים
