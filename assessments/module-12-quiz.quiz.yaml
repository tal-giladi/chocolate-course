- id: q1
  question: >-
    משפחה מזמינה מכם קינוח לסעודת שבת בשרית, ואחת האורחות טבעונית. יש לכם שני שקים: Callebaut 811
    "חלבי, לאוכלי אבקת חלב נכרי" ו־Lubeka מריר "פרווה, בד"ץ בית יוסף". בשני השקים אין חלב ברכיבים.
    במה משתמשים?
  options:
    - >-
      בשניהם, כי שניהם בלי חלב ברכיבים ולכן שניהם פרווה וטבעוניים.
    - >-
      ב־Callebaut, כי "לאוכלי אבקת חלב נכרי" אומר שאפשר להקל ולאכול אחרי בשר.
    - >-
      ב־Lubeka המסומן פרווה, כי שולחן בשרי דורש הכשר פרווה, והוא גם בלי חלב לטבעונית.
    - >-
      באף אחד, כי מריר טבעוני חייב לשאת סימן טבעוני רשמי ולא רק הכשר פרווה.
  correct: 2
  explanation: >-
    לשולחן בשרי בודקים הכשר, ולטבעונית רכיבים. Callebaut 811 מתאים לטבעונית אבל מסומן חלבי בגלל קו
    הייצור (OK). רק המריר הפרווה עונה על שתי השאלות. אם יש ספק, שואלים את הרב.
- id: q2
  question: >-
    לקוח עם אלרגיה חמורה לחלב רוצה לקנות מכם מארז "טבעוני ופרווה". כל הרכיבים בלי חלב, והמריר מסומן
    "עלול להכיל חלב". מה עונים לו?
  options:
    - >-
      מראים לו את האריזות ואת "עלול להכיל", ואומרים שלא ניתן להבטיח שאין עקבות חלב.
    - >-
      שהמארז בטוח, כי מארז שהוא גם טבעוני וגם פרווה לא יכול להכיל חלב.
    - >-
      שהמארז בטוח רק אם הוא נשמר במקרר, כי עקבות חלב מתפרקים בקירור.
    - >-
      שאפשר לסמוך על הכשר מהדרין, כי גופי כשרות בודקים גם אלרגנים במעבדה.
  correct: 0
  explanation: >-
    טבעוני ופרווה לא מבטיחים היעדר עקבות: FDA מצאו חלב ב־4 מתוך 52 מרירים "dairy free", ובישראל נאסף
    ב־2025 מארז פרלינים פרווה בגלל חשש לחלב. אומרים מה בדקתם והלקוח מחליט.
- id: q3
  question: >-
    הכנתם שוקולד "חלב" טבעוני ביתי עם אבקת אורז. בדיקת הסכין ב־32°C נשארת רכה אחרי 5 דקות, והבדיקה
    ב־30.5°C מתקשה ומבריקה. מה המסקנה?
  options:
    - >-
      שאבקת האורז פגומה, כי שוקולד טבעוני אמור להתנהג בדיוק כמו מריר.
    - >-
      שהשוקולד לא מטומפר בכלל, ושההתקשות ב־30.5°C היא רק קירור רגיל.
    - >-
      שצריך לעבוד ב־27°C, כי שוקולד ביתי צריך תמיד טמפרטורה נמוכה ככל האפשר.
    - >-
      ש־30-31°C הוא הטווח הנכון, כמו אצל Valrhona ו־Felchlin.
  correct: 3
  explanation: >-
    שומן שאינו חמאת קקאו מוריד את טמפרטורת העבודה בכמעלה ממריר. ב־32°C גבישי V נמסים חלקית; ב־30.5°C
    הבדיקה מתקשה ומבריקה, וזה סימן לטמפר. 27°C הוא טמפרטורת קירור בשיטת המשטח, לא עבודה.
- id: q4
  question: >-
    בגל חום של אוגוסט שולחים מארז טבעוני עם טראפלס גנאש קרם קוקוס, בונבוני טחינה ודיסקיות. הלקוחה
    רוצה להשאיר אותו על השיש לשבוע. מה כותבים על המארז?
  options:
    - >-
      שבוע בחדר, כי גנאש בלי שמנת אינו מזון רגיש ונשמר כמו שוקולד.
    - >-
      "לשמור במקרר" ותאריך קצר, לפי הגנאש, הפריט הרגיש ביותר.
    - >-
      שבועות בחדר קריר, לפי בונבוני הטחינה שהם רוב המארז.
    - >-
      "לשמור בחדר ממוזג", כי המקרר יגרום לפריחת סוכר על הדיסקיות.
  correct: 1
  explanation: >-
    בקרם קוקוס עד 74.6% מים, וגנאש 2:1 ממנו רטוב מעט יותר מגנאש שמנת, שנמדד ב־aw 0.85-0.88. המארז מקבל
    את האחסון של הפריט הרגיש ביותר. מי שרוצה מארז לחדר מוציא את הגנאש.
- id: q5
  question: >-
    בבית מרקחת טבעי מצאתם "אבקת חלב קוקוס" לשוקולד "חלב" טבעוני. ברכיבים: חלב קוקוס, מלטודקסטרין,
    נתרן קזאינט. ועל האריזה: "פרווה". מה עושים?
  options:
    - >-
      קונים, כי ההכשר פרווה מוכיח שהקזאינט שבה צמחי.
    - >-
      לא קונים לשוקולד טבעוני, כי נתרן קזאינט הוא חלבון חלב.
    - >-
      קונים, ומשתמשים ב־35% מהמתכון כדי לקבל טעם חלבי חזק יותר.
    - >-
      קונים, אבל מחממים מעל 80°C כדי לפרק את הקזאינט לפני השימוש.
  correct: 1
  explanation: >-
    נתרן קזאינט הוא נגזרת חלב, ואבקה כזו אינה טבעונית (OliveNation). פער בין הרכיבים לסימון הוא סיבה
    לשאול את היצרן. וגם באבקה טבעונית, יותר מכ־15% קוקוס מעכב התגבשות.
- id: q6
  question: >-
    לקוחה טבעונית שמחה מבונבון הקרמל שלכם, אבל אומרת שהוא "פחות טופי" מהגרסה עם שמנת שאכלה פעם. מה
    ההסבר?
  options:
    - >-
      הקרמל בושל לטמפרטורה נמוכה מדי, ובקרמל קוקוס צריך להגיע ל־200°C.
    - >-
      שמן הקוקוס מתקשה בפה ולכן מסתיר את הטעם של הקרמל.
    - >-
      קרם קוקוס מכיל הרבה יותר סוכר משמנת, והמתיקות מכסה על הטופי.
    - >-
      בלי חלבון חלב יש פחות תגובת מייאר, ולכן פחות טעם טופי.
  correct: 3
  explanation: >-
    טעם הטופי בא מתגובת מייאר בין סוכרים לחלבוני החלב שבשמנת (07.1). קרם קוקוס מביא מים ושומן, לא
    חלבון חלב. קרמל ענבר מעט כהה יותר מפצה חלקית; מעל 204°C הקרמל שרוף.
- id: q7
  question: >-
    לחנוכה אתם מכינים סביבונים טבעוניים עם סוכריות קישוט. על השקית כתוב "כשר פרווה" וברכיבים "E904".
    חברה אומרת "פרווה זה טבעוני, אל תדאג". מה נכון?
  options:
    - >-
      E904 הוא שלאק מהפרשת חרק, ולכן הסוכריות לא טבעוניות למרות ההכשר.
    - >-
      E904 הוא צבע סינתטי, ולכן הסוכריות טבעוניות כל עוד אין בהן E120.
    - >-
      הסוכריות טבעוניות, כי גופי כשרות לא מאשרים פרווה למוצר עם רכיבים מחרקים.
    - >-
      הסוכריות טבעוניות אם מפזרים אותן רק על החלק החיצוני של הסביבון.
  correct: 0
  explanation: >-
    E904 הוא שלאק, שרף שמפרישה כנימת הלכה, ומשמש להברקת סוכריות. פרווה היא קטגוריה הלכתית ולא טבעונית.
    מחליפים בפיסטוק, אבקת פטל או פניני קראנץ' שמסומנות טבעוני.
- id: q8
  question: >-
    אתם רוצים טראפלס טבעוניים למארז שיחכה כמה שבועות בחדר קריר, בלי מקרר. איזה מילוי מתאים?
  options:
    - >-
      גנאש משקה שיבולת שועל עם עמילן, כי העמילן קושר את המים לאורך זמן.
    - >-
      גנאש קרם קוקוס 2:1 עם גלוקוזה, כי בקוקוס יש שומן שמגן מפני עובש.
    - >-
      מילוי טחינה ומריר בלי מים, שמתנהג כמו ג'יאנדוז'ה, בקליפה מטומפרת.
    - >-
      גנאש אקוופאבה, כי החלבון שבה מייצב את האמולסיה כמו חלבון ביצה.
  correct: 2
  explanation: >-
    הבעיה בשמירה היא מים זמינים. גנאש שיבולת שועל (כ־45% מים), קוקוס ואקוופאבה רטובים ודורשים מקרר.
    שוקולד ושומן בלי מים מחזיקים שבועות; הסיכון שם הוא נדידת שומן לקליפה.
- id: q9
  question: >-
    מצאתם מתכון גנאש "plant-based" של יצרן שוקולד מוכר: משקה שיבולת שועל, עמילן תפוחי אדמה, דבש
    ושוקולד מריר. אתם רוצים למכור אותו בתווית "טבעוני". מה בודקים קודם?
  options:
    - >-
      שום דבר, כי יצרן מקצועי שכתב "plant-based" כבר בדק שהמתכון טבעוני.
    - >-
      רק את השוקולד, כי שאר הרכיבים במתכון צמחיים מעצם הגדרתם.
    - >-
      רק את העמילן, כי עמילן תפוחי אדמה מעובד לפעמים עם ג'לטין.
    - >-
      כל רכיב, ובראשם הדבש, שרוב הטבעונים לא אוכלים.
  correct: 3
  explanation: >-
    במתכון של Valrhona ל"plant-based ganache" יש דבש, ורוב הטבעונים לא אוכלים דבש. "צמחי" במתכון אינו
    בדיקת רכיבים. גלוקוזה מחליפה את הדבש גם במרקם וגם בקשירת מים.
- id: q10
  question: >-
    אתם מתמחרים מארז טבעוני של 5 פריטים לצד מארז רגיל זהה בגודלו. איך מחשבים את העלות?
  options:
    - >-
      מעתיקים את עלות המארז הרגיל, כי ההבדל בין חומרי הגלם זניח.
    - >-
      מחשבים בנפרד, לפי מחירי חומרי הגלם הטבעוניים שקניתם.
    - >-
      מוסיפים 50% קבוע לעלות הרגילה, כי זה המקובל למוצרים טבעוניים.
    - >-
      מחשבים רק את השוקולד, כי מילויים וקישוטים הם פחות מ־5% מהעלות.
  correct: 1
  explanation: >-
    לפי 11.2, מארז טבעוני מחושב בנפרד: חומרי הגלם, הכמויות והפחת שונים. אחוז קבוע או העתקה מהמקורי
    מסתירים את ההבדל האמיתי, שהפרויקט מבקש לחשב.
