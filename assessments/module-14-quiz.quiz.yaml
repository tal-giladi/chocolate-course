- id: q1
  question: >-
    דנה מכינה מגש שוקולד ליום הולדת בגן. אמא של אחד הילדים כתבה "אלרגי לאגוזים". דנה מתכננת דיסקיות
    עם פיסטוקים לכולם ודיסקיות פשוטות לילד. מה הצעד הראשון הנכון?
  options:
    - >-
      להכין את שתי הגרסאות באותה קערה, ולהקפיד שהפיסטוקים לא יגיעו לדיסקיות של הילד.
    - >-
      להכין קודם את הפיסטוקים, כי אחר כך היא תשטוף הכול ביסודיות לפני הדיסקיות הפשוטות.
    - >-
      לשאול את האמא גם על בוטנים ועל עקבות, ולבדוק "עלול להכיל" על השוקולד לפני שקונים.
    - >-
      לוותר על הבדיקה, כי מריר בלי אגוזים ברכיבים מתאים לכל אלרגי לאגוזים.
  correct: 2
  explanation: >-
    בוטנים הם קבוצה נפרדת, ורגישות לעקבות משנה את כל התוכנית. "עלול להכיל אגוזים" על השוקולד חשוב
    בדיוק לילד כזה, ולכן בודקים לפני שקונים.
- id: q2
  question: >-
    יוסי קנה קוברטורה בלי לציטין בשביל אורחת אלרגית לסויה. השוקולד המומס סמיך, והדיסקיות יוצאות עבות
    ועם זנבות. מה הוא עושה?
  options:
    - >-
      מוסיף כ־2-3% חמאת קקאו בשלב החם, ומטמפר מחדש לפי העקומה שעל האריזה.
    - >-
      מוסיף מעט לציטין סויה מהמזווה, כי בכמות של פחות מ־1% הוא לא משפיע על אלרגיים.
    - >-
      עובד ב־35°C במקום ב־31-32°C, כי השוקולד נוזלי יותר ככל שהוא חם יותר.
    - >-
      מוסיף כף שמנת חמה, כי שומן החלב מדלל את השוקולד בלי לשנות את הטעם.
  correct: 0
  explanation: >-
    לציטין מוריד צמיגות כמו פי עשרה ממנו חמאת קקאו, ולכן בלעדיו מפצים בחמאת קקאו. לציטין סויה מחזיר את
    האלרגן, חום שובר טמפר, ושמנת מכניסה מים וחלב.
- id: q3
  question: >-
    על שוקולד מריר מיובא אין שום אזכור של בוטנים, לא ברכיבים ולא באזהרה. לקוחה עם אלרגיה לבוטנים שואלת
    אם הוא "בטוח". מה נכון לפי סקר ה־FDA על טבלאות מריר?
  options:
    - >-
      הוא בטוח, כי יצרן חייב לכתוב "עלול להכיל" בכל מקרה של סיכון בקו.
    - >-
      הוא מסוכן יותר ממוצר עם אזהרה, כי מי שלא מזהיר כנראה גם לא מנקה.
    - >-
      הוא בטוח, כי בוטנים מגיעים רק לשוקולד חלב ולא לשוקולד מריר.
    - >-
      היעדר אזהרה הוא לא הוכחה: ב־17% מהטבלאות בלי אזכור נמצאו בוטנים.
  correct: 3
  explanation: >-
    בסקר (Bedford, 2017) נמצאו בוטנים ב־17% מהטבלאות בלי אזכור וב־8% מאלה עם אזהרה. רק טבלאות שסומנו
    "ללא בוטנים" יצאו נקיות. לא מבטיחים; מראים מה כתוב והלקוחה מחליטה.
- id: q4
  question: >-
    מיכל מכינה "רוקי רוד" ללא גלוטן לחברה עם צליאק. ברכיבי האורז התפוח כתוב "אורז, סוכר, לתת שעורה",
    ועל המרשמלו כתוב "ללא גלוטן". מה היא עושה?
  options:
    - >-
      משתמשת באורז התפוח, כי לתת הוא רק חומר טעם ואורז הוא דגן ללא גלוטן.
    - >-
      מחליפה את האורז התפוח במוצר שכתוב עליו "ללא גלוטן", כי לתת שעורה הוא גלוטן.
    - >-
      קולה את האורז התפוח בתנור 10 דקות, כי חום מפרק את הגלוטן שבלתת.
    - >-
      משתמשת באורז התפוח, אבל מוסיפה רק חצי מהכמות כדי להישאר מתחת ל־20 חלקים למיליון.
  correct: 1
  explanation: >-
    בתקנות הישראליות לתת נכלל בהגדרת גלוטן. Coeliac UK: מוצר עם תמצית לתת שעורה מתאים רק אם הוא מסומן
    ללא גלוטן. חום לא מוריד גלוטן, ואי אפשר לחשב כמות בלי לדעת כמה יש.
- id: q5
  question: >-
    אבי הכין אשכולות עוגיות, ונשארו לו 200 גרם שוקולד מטומפר בקערה. אורח עם צליאק הגיע פתאום והוא רוצה
    להכין לו bark. מה הוא עושה עם השוקולד שבקערה?
  options:
    - >-
      מעביר אותו לקערה נקייה, כי הגלוטן נשאר על הקערה הישנה ולא בשוקולד.
    - >-
      מסנן אותו דרך מסננת דקה, כי בלי פירורים גלויים אין גלוטן.
    - >-
      מסמן אותו "מכיל גלוטן", ומטמפר שוקולד מאריזה אחרת, בכלים שנשטפו.
    - >-
      ממיס אותו מחדש ל־50°C, כי טמפרטורה גבוהה מנטרלת את הגלוטן.
  correct: 2
  explanation: >-
    כלי אפשר לשטוף, אבל שוקולד שעוגיות נגעו בו הוא כמו מי פסטה משותפים, שבהם כל הדגימות עברו את הסף
    (Weisbrod, 2020). חימום וסינון לא מורידים חלבון.
- id: q6
  question: >-
    נועה מוכרת מארזים מהבית. לקוח מבקש שתכתוב "ללא אגוזים" על מארז של מריר, ובמטבח שלה יש פרלינה.
    על אריזת השוקולד כתוב "עלול להכיל אגוזים". מה היא כותבת?
  options:
    - >-
      "ללא אגוזים", כי אין אגוזים ברכיבים והאזהרה היא רק של היצרן.
    - >-
      "ללא אגוזים" וגם "עלול להכיל אגוזים", כדי שיהיו שתי השורות.
    - >-
      "מתאים לאלרגיים ברמה קלה", כדי לא להבטיח וגם לא להבריח את הלקוח.
    - >-
      רכיבים, "מכיל", "עלול להכיל אגוזים" ומה עשתה, בלי "ללא".
  correct: 3
  explanation: >-
    "ללא" הוא ערובה שדורשת בקרה מחמירה, ולא כותבים אותו לצד "עלול להכיל" לאותו אלרגן (FSA). "רמה קלה"
    היא קביעה רפואית שאינה שלה. מה שמכירה בפועל: מה ברכיבים ומה עשתה.
- id: q7
  question: >-
    רון מתכנן יום ייצור: דיסקיות לאורח בלי שומשום, bark פיסטוקים ובונבוני טחינה. באיזה סדר?
  options:
    - >-
      דיסקיות האורח ראשונות, נסגרות ומתויגות; אחריהן bark הפיסטוקים; בונבוני הטחינה אחרונים.
    - >-
      בונבוני הטחינה ראשונים כי הם הכי ארוכים, ואחר כך ניקוי יסודי ודיסקיות האורח.
    - >-
      דיסקיות האורח ובונבוני הטחינה במקביל בשני קצוות השיש, כדי לחסוך טמפרור.
    - >-
      bark הפיסטוקים ראשון כי אין בו שומשום, ודיסקיות האורח אחריו כשהשוקולד עוד חם.
  correct: 0
  explanation: >-
    מוצר בלי אלרגן מכינים ראשון ביום וסוגרים לפני שפותחים אלרגנים, ואחר כך מהמעט להרבה. גם bark
    פיסטוקים לפני דיסקיות האורח מכניס אלרגן נוסף לכלים ולאוויר.
- id: q8
  question: >-
    שירה מסדרת "קופסת אורח" לכלים שלא משותפים עם אצוות רגילות. איזו רשימה מתאימה?
  options:
    - >-
      קערת זכוכית, שפכטל מתכת ותבנית פוליקרבונט שלמה, כי בהם עובדים עם השוקולד עצמו.
    - >-
      מרית סיליקון, מברשת, שקיות זילוף רב־פעמיות וספוג, כי קשה לנקות אותם עד הסוף.
    - >-
      מדחום אינפרא אדום, משקל דיגיטלי ונייר אפייה, כי הם נוגעים בכל המוצרים.
    - >-
      סיר בן־מארי, כפות מדידה מנירוסטה וקערת נירוסטה, כי הם עוברים חום גבוה.
  correct: 1
  explanation: >-
    כלים רכים, נקבוביים או עם חריצים מחזיקים שומן ופירורים. כלים חלקים וקשיחים אפשר לשתף אחרי מים וסבון
    וייבוש.
- id: q9
  question: >-
    באמצע העבודה ענבל שברה חלבה על השיש, ועכשיו היא רוצה להכין דיסקיות לאורח אלרגי לשומשום. ביד יש לה
    ג'ל לחיטוי ומטלית יבשה. מה היא עושה?
  options:
    - >-
      ג'ל על הידיים ומטלית יבשה על השיש, כי השומשום יבש ולא נדבק.
    - >-
      מרססת אלכוהול על השיש, כי הוא הורג כל מה שנשאר.
    - >-
      מנגבת במים חמים מאוד, כי החום מפרק את החלבון של השומשום.
    - >-
      ידיים בסבון ומים, שיש במים וסבון ואחר כך ניגוב במטלית נקייה.
  correct: 3
  explanation: >-
    לפי FARE ו־Perry (2004), סבון ומים או מגבונים מורידים חלבון אלרגני; ג'ל ומים בלבד לא תמיד. חום
    וחיטוי לא מורידים חלבון.
- id: q10
  question: >-
    לקוחה שואלת על מארז שתקנה בינואר 2028: "אז מעכשיו 'עלול להכיל' יהיה חובה?" מה התשובה, לפי מה שמשרד
    הבריאות פרסם?
  options:
    - >-
      כן, מ־2028 כל מוצר יחויב לכתוב "עלול להכיל" לכל אחד מ־14 האלרגנים.
    - >-
      לא, מ־2028 "עלול להכיל" נאסר, ומותר לכתוב רק אלרגנים שנמצאים במוצר בכוונה.
    - >-
      לא. מה שמשתנה הוא הדגשת אלרגנים מכוונים ברשימת הרכיבים; "עלול להכיל" נשאר וולונטרי.
    - >-
      כן, אבל רק ליצרנים גדולים; עסקים קטנים מהבית פטורים מכל סימון אלרגנים.
  correct: 2
  explanation: >-
    מ־1.1.2028 אלרגן מכוון מודגש בתוך רשימת הרכיבים בשיטה האירופית. "עלול להכיל" לא מוסדר בכללים
    האירופיים, ולכן לא משתנה. על חובות של עסק קטן לומדים במסלול העסקי.
