- id: q1
  question: >-
    על שקית אורז תפוח כתוב ברכיבים: "אורז, סוכר, מלח, תמצית לתת שעורה". אין עליה "ללא גלוטן". אפשר
    להשתמש בה לאשכולות לאורחת עם צליאק?
  options:
    - >-
      כן, כי אורז הוא דגן ללא גלוטן והתמצית היא רק חומר טעם בכמות קטנה.
    - >-
      כן, אם קולים אותו בתנור לפני ההכנה, כי חום מפרק את הגלוטן שבלתת.
    - >-
      לא, כי לתת שעורה הוא גלוטן, ובלי "ללא גלוטן" אין דרך לדעת כמה יש.
    - >-
      לא, כי כל אורז תפוח עשוי מקמח חיטה שמנפחים בצורת גרגר אורז.
  correct: 2
  explanation: >-
    לתת הוא שעורה מונבטת, ובתקנות הישראליות הוא נכלל במפורש בהגדרת גלוטן. Coeliac UK: מוצר עם תמצית
    לתת שעורה מתאים רק אם הוא מסומן ללא גלוטן.
- id: q2
  question: >-
    אחרי שהכנתם אשכולות עוגיות, נשארו 150 גרם שוקולד מטומפר באותה קערה. אורח עם צליאק ביקש bark.
    מה עושים עם השוקולד?
  options:
    - >-
      מעבירים אותו לקערה נקייה שנשטפה בסבון, וכך הוא חוזר להיות ללא גלוטן.
    - >-
      מסננים אותו דרך מסננת דקה, כי הגלוטן נמצא רק בפירורים שרואים.
    - >-
      מחממים אותו שוב ל־50°C ומטמפרים מחדש, כי החימום מנקה את הגלוטן.
    - >-
      מסמנים אותו "מכיל גלוטן", ומטמפרים לאורח שוקולד שלא נגע בעוגיות.
  correct: 3
  explanation: >-
    כלי אפשר לשטוף, אבל שוקולד שטבלו בו עוגיות הוא כמו מי פסטה ששימשו לפסטה רגילה: הגלוטן בתוכו.
    חימום לא מוריד אלרגן.
- id: q3
  question: >-
    כמה זה 20 חלקים למיליון גלוטן, הסף של "ללא גלוטן" בתקנות בישראל, בקילו שוקולד?
  options:
    - >-
      20 מיליגרם גלוטן בקילו: פחות ממה שיש בגרם אחד של קמח חיטה.
    - >-
      20 גרם גלוטן בקילו: בערך כף עוגיות טחונות שנשפכה לקערה.
    - >-
      2 גרם גלוטן בקילו: בערך כפית קמח, ולכן פירורים בודדים לא משנים.
    - >-
      200 מיליגרם בקילו: בערך עוגייה אחת שלמה לכל קילו שוקולד.
  correct: 0
  explanation: >-
    20 חלקים למיליון הם 20 מיליגרם בקילו, 0.002%. בגרם קמח חיטה יש בערך 80-100 מיליגרם גלוטן, ולכן
    גרם אחד בקילו כבר חורג פי כמה.
- id: q4
  question: >-
    לקוחה שואלת אם המטבעות שלכם "כשרים לפסח" מתאימים לבת שלה עם צליאק. מה נכון?
  options:
    - >-
      כן, כי מוצר כשר לפסח לא מכיל חמץ, ולכן לא מכיל גלוטן.
    - >-
      לא בהכרח: מוצרים לפסח יכולים להכיל קמח מצה, שהוא חיטה.
    - >-
      כן, אבל רק אם ההכשר לפסח הוא של הרבנות הראשית ולא של בד"ץ.
    - >-
      לא, כי מוצר כשר לפסח תמיד מכיל קמח מצה, ולכן תמיד יש בו גלוטן.
  correct: 1
  explanation: >-
    "כשר לפסח" עונה על שאלה הלכתית, ו"ללא גלוטן" על כמות גלוטן. קמח מצה הוא חיטה. בודקים רכיבים
    וסימון "ללא גלוטן" בנפרד.
- id: q5
  question: >-
    לפי המחקר של Weisbrod (2020), מה קרה כשסכין שמרחה זיגוג על קאפקייקס רגילים נשטפה לפני שעברה
    לקאפקייקס ללא גלוטן?
  options:
    - >-
      רק שטיפה בסבון עבדה; מים בלבד ומגבון השאירו גלוטן מעל 20 חלקים למיליון.
    - >-
      השטיפה לא עזרה, וכל הדגימות היו מעל 20 חלקים למיליון כמו בלי שטיפה.
    - >-
      28 מתוך 30 דגימות היו בלי גלוטן מדיד, ואף אחת לא עברה 20 חלקים למיליון.
    - >-
      השטיפה עזרה רק כשהסכין גם עברה חיטוי בג'ל אלכוהול אחרי הסבון.
  correct: 2
  explanation: >-
    סבון ומים, מים בלבד ומגבון הורידו את הגלוטן מהסכין. מה שאי אפשר לשטוף הוא מזון שהגלוטן כבר בתוכו,
    כמו מי הפסטה המשותפים, שבהם כל הדגימות עברו את הסף.
