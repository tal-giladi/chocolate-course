- id: q1
  question: >-
    הכנתם דיסקיות מריר בלי אגוזים, ראשונות ביום, בכלים נפרדים. במטבח יש אגוזים, ועל שקית השוקולד כתוב
    "עלול להכיל אגוזים". מה כותבים על הכרטיס לאורח?
  options:
    - >-
      "ללא אגוזים", כי עשיתם את כל מה שאפשר לעשות במטבח ביתי.
    - >-
      "ללא אגוזים ברכיבים", בלי האזהרה, כי היא מופיעה כמעט על כל שוקולד.
    - >-
      "מתאים לאלרגיים לאגוזים ברמה קלה", כי הסיכון נמוך אחרי ניקוי.
    - >-
      מה ברכיבים, "עלול להכיל אגוזים" מהאריזה, ומה עשיתם, בלי הבטחה.
  correct: 3
  explanation: >-
    "ללא" הוא ערובה שדורשת בקרה מחמירה (FSA), ואין כזו במטבח משותף. מעתיקים את האזהרה מהאריזה
    ומוסיפים מה עשיתם; האורח מחליט.
- id: q2
  question: >-
    אחרי שבירת חלבה על השיש אתם מנגבים אותו לפני אצוות האורח. לפי FARE ו־Perry (2004), מה הדרך
    הנכונה?
  options:
    - >-
      ספריי אלכוהול לחיטוי, כי הוא הורג את כל מה שנשאר על המשטח.
    - >-
      מים וסבון, שטיפה, וניגוב במטלית נקייה; ידיים בסבון ולא בג'ל.
    - >-
      מטלית יבשה ונקייה, כי חלבה היא מוצק ולא משאירה שכבה.
    - >-
      מים חמים מאוד בלי סבון, כי חום מפרק את החלבון של השומשום.
  correct: 1
  explanation: >-
    חימום וחיטוי לא מורידים חלבון אלרגני. סבון ומים או מגבונים הורידו את חלבון הבוטן מהידיים, ונוזל
    כלים לבדו השאיר עקבות בחלק מהשולחנות, ולכן שוטפים ומנגבים.
- id: q3
  question: >-
    אילו מהכלים האלה כדאי לשים בקופסת האורח הנפרדת, ולא לשתף גם אחרי שטיפה?
  options:
    - >-
      מרית סיליקון, מברשת ושקית זילוף רב־פעמית.
    - >-
      קערת זכוכית, שפכטל מתכת ותבנית פוליקרבונט שלמה.
    - >-
      משקל דיגיטלי, מדחום אינפרא אדום ונייר אפייה חדש.
    - >-
      קערת נירוסטה, מזלג טיבול ממתכת וסיר לבן־מארי.
  correct: 0
  explanation: >-
    כלים רכים, נקבוביים או עם חריצים מחזיקים שומן ופירורים, ולכן הם לא משותפים. כלים חלקים וקשיחים
    אפשר לשתף אחרי מים וסבון וייבוש.
- id: q4
  question: >-
    מה משתנה בסימון האלרגנים בישראל מ־1.1.2028, לפי משרד הבריאות?
  options:
    - >-
      "עלול להכיל" הופך לחובה, ובוטל הסימון של אלרגנים בתוך רשימת הרכיבים.
    - >-
      סימון האלרגנים יחול רק על יבואנים, ויצרנים קטנים יקבלו פטור.
    - >-
      אלרגן שנמצא בכוונה מודגש ברשימת הרכיבים, ו"עלול להכיל" נשאר וולונטרי.
    - >-
      כל מוצר יחויב בבדיקת מעבדה לאלרגנים לפני שהוא מסומן "ללא".
  correct: 2
  explanation: >-
    מ־2028 אלרגן מכוון מודגש בתוך רשימת הרכיבים בשיטה האירופית, ובדגנים מדגישים את שם הדגן. "עלול
    להכיל" לא מוסדר בכללים האירופיים ולכן לא משתנה.
- id: q5
  question: >-
    הורה של ילד עם אלרגיה חמורה לבוטנים מבקש שתבטיחו שהעוגיות שלכם "בלי בוטנים בכלל". במטבח שלכם יש
    חמאת בוטנים. מה עונים?
  options:
    - >-
      מבטיחים, אם תכינו אותן ראשונות ביום אחרי ניקוי יסודי במים וסבון.
    - >-
      אומרים שאין בוטנים ברכיבים אבל יש במטבח, ולכן אין הבטחה כזו.
    - >-
      מבטיחים, אם תקנו שקית שוקולד חדשה ותשתמשו רק בכלים חד־פעמיים.
    - >-
      מסרבים להכין ולא מסבירים, כי כל הסבר עלול להתפרש כהבטחה.
  correct: 1
  explanation: >-
    הפרדה וניקוי מקטינים סיכון, אבל לא מבטלים אותו במטבח משותף. אומרים בדיוק מה נבדק ומה לא, וההורה
    מחליט; מוצר ארוז עם "ללא" נשען על בקרה שאין בבית.
