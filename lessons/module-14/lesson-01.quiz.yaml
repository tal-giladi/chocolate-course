- id: q1
  question: >-
    על קוברטורה כתוב ברכיבים "מתחלב: לציטין חמניות", ובאותה אריזה "עלול להכיל אגוזים וסויה".
    אורחת אלרגית לסויה ברמת עקבות שואלת אם השוקולד מתאים לה. מה עונים?
  options:
    - >-
      שאין סויה ברכיבים, אבל המפעל מעבד סויה ויש אזהרה; היא מחליטה, וכנראה לא מתאים לה.
    - >-
      שהוא מתאים, כי לציטין חמניות הוחלף בדיוק כדי שאלרגיים לסויה יוכלו לאכול אותו.
    - >-
      שהוא מתאים, כי "עלול להכיל" הוא אזהרה משפטית שמוסיפים לכל מוצר ואין לה משמעות.
    - >-
      שהוא לא מתאים, כי לציטין חמניות הוא סוג של סויה ולכן הוא אלרגן בעצמו.
  correct: 0
  explanation: >-
    הרכיבים אומרים מה הכניסו בכוונה, ו"עלול להכיל" אומר מה עלול להגיע מהקו. לאלרגית לעקבות האזהרה
    חשובה, וההחלטה שלה. לציטין חמניות עשוי מחמניות, לא מסויה.
- id: q2
  question: >-
    המסתם קוברטורה בלי לציטין בכלל, והיא סמיכה מדי ליציקת דיסקיות דקות. מה עושים?
  options:
    - >-
      מחממים את השוקולד המטומפר ל־36°C, כי בטמפרטורה גבוהה יותר הוא נוזלי יותר.
    - >-
      מוסיפים מעט מים חמים, כי מים מדללים כל נוזל ובכמות קטנה הם לא מזיקים.
    - >-
      מוסיפים 6-10 גרם חמאת קקאו ל־300 גרם בשלב החם, ואז מטמפרים כרגיל.
    - >-
      מוסיפים כפית שמן חמניות בסוף הטמפרור, כי שמן נוזלי מדלל בלי לפגוע בקריסטלים.
  correct: 2
  explanation: >-
    לציטין מוריד צמיגות כמו פי עשרה ממנו חמאת קקאו (Blommer), ולכן בלעדיו מפצים בכ־2-3% חמאת קקאו.
    חום מעל הטווח שובר את הטמפר, מים גורמים לשוקולד להיתפס, ושמן נוזלי פוגע בהתקשות.
- id: q3
  question: >-
    טבלת מריר שאין עליה שום אזכור של בוטנים: לא ברכיבים ולא ב"עלול להכיל". מה אפשר להסיק
    לפי סקר ה־FDA על טבלאות מריר (2017)?
  options:
    - >-
      שאין בה בוטנים, כי יצרן חייב לכתוב אזהרה אם יש סיכון כלשהו בקו.
    - >-
      שהסיכון בה גבוה יותר מבטבלה עם אזהרה, כי יצרנים בלי אזהרה לא מנקים קווים.
    - >-
      שאפשר להגיש אותה לאלרגי לבוטנים אם היא מריר, כי בוטנים נמצאים רק בשוקולד חלב.
    - >-
      שאין הוכחה שאין בה בוטנים: ב־17% מהטבלאות בלי אזכור נמצאו בוטנים.
  correct: 3
  explanation: >-
    בסקר נמצאו בוטנים ב־8% מהטבלאות עם אזהרה וב־17% מהטבלאות בלי שום אזכור. אזהרה היא לא הוכחה
    שיש, והיעדר אזהרה הוא לא הוכחה שאין. רק תשע הטבלאות שסומנו "ללא בוטנים" יצאו נקיות.
- id: q4
  question: >-
    ילד אלרגי לאגוזים מגיע לארוחה. ההורים לא אמרו כלום על בוטנים. אתם מתכננים חטיף בוטנים וקרמל
    כקינוח. מה נכון?
  options:
    - >-
      בוטנים הם אגוזים לכל דבר, ולכן מוותרים עליהם בלי לשאול.
    - >-
      שואלים את ההורים על בוטנים בנפרד, כי זו קבוצת אלרגנים אחרת.
    - >-
      בוטנים הם קטנית, ולכן הם בטוחים לכל מי שאלרגי לאגוזים.
    - >-
      מכינים את החטיף בכלים נפרדים, וכך גם אם יש אלרגיה הסיכון נעלם.
  correct: 1
  explanation: >-
    בוטן הוא קטנית ולא אגוז, ולפי FARE רק כ־40% מהילדים האלרגיים לאגוזים אלרגיים גם לבוטנים. לכן
    לא מניחים לשום כיוון: שואלים.
- id: q5
  question: >-
    אתם מכינים ביום אחד bark בלי אגוזים לאורח אלרגי ו־bark פיסטוקים לשאר המשפחה. באיזה סדר?
  options:
    - >-
      קודם הפיסטוקים, כי אחר כך שוטפים הכול ביסודיות והמטבח נקי יותר בסוף.
    - >-
      שניהם במקביל על שני קצוות השיש, כדי שהשוקולד יהיה באותה טמפרטורה.
    - >-
      קודם ה־bark בלי אגוזים, מכסים אותו, ורק אחר כך פותחים את הפיסטוקים.
    - >-
      לא משנה הסדר, כי טמפרור ב־45-50°C מפרק את החלבון של האגוזים.
  correct: 2
  explanation: >-
    לפי FARE מכינים קודם את המוצר בלי האלרגן ומכסים אותו. חימום לא מוריד אלרגן, ועבודה במקביל
    מזמינה פירורים.
