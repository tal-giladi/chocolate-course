- id: q1
  question: >-
    אין לכם תעודת הכשר. איזה משפט בדף המוצר באתר מותר לפי מה שלמדנו?
  options:
    - >-
      "כל חומרי הגלם שלנו כשרים בהכשר מהדרין, ולכן גם המארז כשר למהדרין."
    - >-
      "שוקולד מריר, קרם קוקוס, פרלינת לוז. מכיל: אגוזי לוז, סויה. לעסק אין תעודת כשרות."
    - >-
      "100% כשר, בלי תעודה רשמית, כי אנחנו מקפידים על הכול בעצמנו במטבח."
    - >-
      "כשר פרווה לפי הסמל שעל שק השוקולד", עם תמונה של הסמל של הספק ליד.
  correct: 1
  explanation: >-
    רכיבים, אלרגנים ואמירה כנה שאין תעודה הם עובדות בלי מצג כשרות. "כשר", "מהדרין" או סמל של ספק בלי
    תעודה הם הצגה ככשר, שסעיף 4 אוסר גם בפרסום.
- id: q2
  question: >-
    יש לכם תעודה לטראפלס ולפרלינים. הוספתם לקטלוג טבלת שוקולד חדשה שמכינים אצל חברה במטבח אחר.
    מה כותבים עליה?
  options:
    - >-
      "כשר" כמו על שאר המוצרים, כי לעסק יש תעודה והטבלה נמכרת תחת אותו שם עסק.
    - >-
      "כשר" רק אם הטבלה עשויה מאותו שוקולד, כי חומר הגלם הוא מה שהתעודה בודקת.
    - >-
      "כשר בהשגחה חלקית", כדי שהלקוח ידע שהמוצר שונה ובכל זאת יכיר בכשרות שלו.
    - >-
      לא כותבים "כשר" עד שהגוף המכשיר מאשר שהתעודה מכסה אותה, כי תעודה למוצר אחד לא מכסה אחר.
  correct: 3
  explanation: >-
    לפי סעיף 4, מי שיש לו תעודה למוצר אחד לא יציג ככשר מוצר אחר שאין לו תעודה. מוצר חדש, ובמיוחד
    ממקום ייצור אחר, נבדק מול הגוף המכשיר לפני שכותבים.
- id: q3
  question: >-
    עסק בפיקוח של גוף פרטי, בלי תעודת רבנות, רוצה לכתוב על האריזה של מארז שוקולד את שם הגוף. מה
    הצעד הסביר?
  options:
    - >-
      לבדוק את הנוסח עם עורך דין, כי ההחלטות שתוארו עסקו בבתי אוכל ויש מחלוקת על ציון שם הגוף.
    - >-
      להדפיס את הלוגו של הגוף על האריזה, כי לוגו הוא לא המילה "כשר" ולכן מותר.
    - >-
      לכתוב "כשר בפיקוח פרטי", כי פסיקת גיני התירה לעסקים כאלה להשתמש במילה.
    - >-
      לא לכתוב כלום ולא לענות ללקוחות ששואלים, כי אסור לעסק כזה לומר שום דבר.
  correct: 0
  explanation: >-
    לפי הדיווחים מ־2018, אסור להציג לוגו או תעודה של הגוף, והמילה "כשר" אסורה. מותר "מצג אמת", אבל
    ההחלטות עסקו בבתי אוכל ויש מחלוקת על שם הגוף, ולכן נוסח על אריזה בודקים עם עורך דין.
- id: q4
  question: >-
    התעודה שלכם פגה בסוף השנה העברית, והחידוש עוד בתהליך. מה עושים עם הסמל שבאתר ועם המדבקות?
  options:
    - >-
      משאירים עד שהחידוש יגיע, כי התהליך כבר התחיל והמועצה יודעת שאתם בתהליך.
    - >-
      משאירים באתר אבל מפסיקים להדביק על מארזים חדשים, כי אתר הוא לא אריזה.
    - >-
      מורידים את הסמל מהאתר ולא מדביקים מדבקות עם "כשר" עד שהתעודה החדשה בידכם.
    - >-
      מוסיפים ליד הסמל "בתהליך חידוש", כי כך הלקוח מקבל מידע מלא ואמיתי על המצב.
  correct: 2
  explanation: >-
    לפי סעיף 10 מציגים תעודה רק בזמן שהיא בתוקף, ואתר הוא פרסום. בלי תעודה בתוקף אין "כשר" ואין סמל,
    גם בזמן חידוש. נוסח כמו "בתהליך" בודקים עם עורך דין.
