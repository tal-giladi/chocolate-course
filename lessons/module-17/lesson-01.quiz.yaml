- id: q1
  question: >-
    אתם מייצרים פרלינים במטבח שכור ורוצים לכתוב "כשר" על המארז. לפי נוסח החוק שנבדק, מי נותן תעודת
    הכשר לאתר ייצור כזה?
  options:
    - >-
      הספק של השוקולד, כי ההכשר שעל השק שקניתם עובר למוצר שהכנתם ממנו במטבח.
    - >-
      הרב המקומי של המקום או מועצת הרבנות הראשית, ולא ההכשר של חומרי הגלם.
    - >-
      לשכת הבריאות המחוזית, יחד עם רישיון הייצור שהיא נותנת לאתר הייצור.
    - >-
      כל בד"ץ פרטי שתבחרו, והוא מחליף את התעודה של הרבנות לכל דבר ועניין.
  correct: 1
  explanation: >-
    לפי סעיף 2 לחוק איסור הונאה בכשרות, לאתר ייצור נותן תעודה הרב המקומי או מועצת הרבנות הראשית.
    ההכשר של חומרי הגלם הוא תנאי, לא תעודה למוצר שלכם. לשכת הבריאות עוסקת ברישוי, לא בכשרות.
- id: q2
  question: >-
    חברה שואלת כמה תעלה לכם תעודת כשרות בשנה. מה הדרך הנכונה להכניס את המספר לגיליון התמחור?
  options:
    - >-
      לכתוב 49 ₪ לשעה כפול שעות משוערות, כי זה התעריף הרשמי שנקבע בחוק לכל המועצות.
    - >-
      לא לכלול את העלות במחיר, כי אגרת כשרות לעסק קטן היא סכום זניח שלא משנה את התמחור.
    - >-
      לקבל בכתב מהמועצה הדתית את האגרה, השעות והתעריף, ורק אז להכניס כעלות קבועה.
    - >-
      להעתיק את המחיר שמתחרה סיפר לכם בטלפון, כי במועצות שונות התעריף תמיד זהה.
  correct: 2
  explanation: >-
    49 ₪ לשעה הוא ממוצע ממדגם של 81 מועצות ב־2019 (המכון הישראלי לדמוקרטיה), לא תעריף. התעריף משתנה
    בין מועצות, ואת האגרה, השעות והתעריף מקבלים בכתב מהמועצה הדתית שלכם.
- id: q3
  question: >-
    על שקית שוקולד כתוב "בהשגחת בד"ץ העדה החרדית, בהשגחת OK, באישור הרבנות הראשית". מה זה מלמד על
    הכשר פרטי בישראל?
  options:
    - >-
      שעל אריזות בישראל ההכשר הפרטי מופיע לרוב לצד אישור הרבנות, ולא במקומו.
    - >-
      שהבד"ץ הוא חלק מהרבנות הראשית, ולכן אין שום הבדל בין הסטנדרטים של שניהם.
    - >-
      ששלושה גופים מכשירים פירושם שהמוצר כשר לפסח, גם בלי סימון נפרד על השקית.
    - >-
      שעסק קטן יכול להעתיק את שלושת הסמלים לאריזה שלו, כי השתמש בשוקולד הזה.
  correct: 0
  explanation: >-
    במוצרים שנבדקו במדריך הכשרות, ההכשר הפרטי מופיע יחד עם אישור הרבנות. כל בד"ץ קובע סטנדרט משלו.
    פסח הוא סימון נפרד, ואסור להעתיק סמל של ספק לאריזה שלכם (סעיף 4).
- id: q4
  question: >-
    עסק בלי תעודת רבנות נמצא בפיקוח של גוף פרטי. לפי פסיקת גיני (2017) וחוות הדעת מ־2018, כפי שתוארו
    בשיעור, מה מותר לו?
  options:
    - >-
      לכתוב "כשר בפיקוח פרטי" ולתלות את תעודת הגוף הפרטי בכניסה, כי יש עליו פיקוח אמיתי.
    - >-
      להשתמש בלוגו של הגוף הפרטי בלבד, בלי המילה "כשר", כי לוגו הוא לא מילה כתובה.
    - >-
      שום דבר, כי אסור לעסק בלי תעודת רבנות לומר שום מילה על הדרך שבה הוא עובד.
    - >-
      לתאר באמת את הסטנדרטים ואת אופן הפיקוח, בלי "כשר", ולציין שאין פיקוח של הרבנות.
  correct: 3
  explanation: >-
    לפי המכון הישראלי לדמוקרטיה, פסיקת גיני מתירה "מצג אמת" על הסטנדרטים בלי מצג של כשרות. לפי
    הדיווח בכיפה (12.7.2018), אסור להציג תעודה או לוגו של הגוף, וצריך לציין שאין פיקוח של הרבנות.
    ההחלטות עסקו בבתי אוכל, ולכן נוסח למוצר ארוז בודקים עם עורך דין.
