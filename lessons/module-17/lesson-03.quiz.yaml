- id: q1
  question: >-
    אין לכם תעודת הכשר. טראפלס הקוקוס שלכם עשוי ממריר פרווה וקרם קוקוס פרווה, בלי חלב ברכיבים. מה
    כותבים בשורת הכשרות בתווית?
  options:
    - >-
      "פרווה", כי כל הרכיבים מסומנים פרווה על האריזות שלהם והמתכון בלי חלב בכלל.
    - >-
      "פרווה (לא בהשגחה)", כדי שהלקוח ידע שהמוצר בלי חלב אבל שאין עליו תעודה.
    - >-
      משאירים אותה ריקה; את מה שיש ואין ברכיבים כותבים ברשימת הרכיבים ובאלרגנים.
    - >-
      את סמלי ההכשר של המריר ושל קרם הקוקוס, כי הם מראים מאיפה הגיעו חומרי הגלם.
  correct: 2
  explanation: >-
    פרווה הוא סטטוס כשרות שהגוף המכשיר נותן, ובלי תעודה לא כותבים אותו ולא מעתיקים סמלים של ספקים.
    הרכיבים והאלרגנים נכתבים בכל מקרה. מה מותר לתאר בלי תעודה, ב־17.4.
- id: q2
  question: >-
    לקוחה אלרגית לחלב רואה "פרווה" על מוצר שיש לו תעודה, ושואלת אם הוא בטוח לה. מה עונים?
  options:
    - >-
      שפרווה הוא סטטוס כשרות, ושתבדוק את רשימת הרכיבים ואת שורת "עלול להכיל" שבתווית.
    - >-
      שכן, כי פרווה פירושו שאין במוצר חלב בכלל, וזה נבדק על ידי המשגיח בכל אצווה.
    - >-
      שלא, כי כל מוצר פרווה עלול להכיל חלב, ולכן אלרגיים לא אוכלים שום מוצר פרווה.
    - >-
      שכן, אם התעודה בתוקף, כי תעודת כשרות בתוקף כוללת גם בדיקת אלרגנים שנתית.
  correct: 0
  explanation: >-
    כשרות ואלרגנים הן שתי שאלות. ב־2025 נאסף מארז פרלינים שסומן פרווה כי ייתכן שהכיל חלב שלא סומן.
    לאלרגי, מה שקובע הוא רשימת הרכיבים ו"עלול להכיל".
- id: q3
  question: >-
    באותו מטבח ובאותם כלים אתם מכינים גנאש עם שמנת ופרלינים בלי חלב. יש לכם תעודה. מי קובע אם
    הפרלינים יסומנו פרווה?
  options:
    - >-
      אתם, לפי המתכון, כי אין בפרלינים שום רכיב חלבי ולכן הם פרווה בכל מקרה.
    - >-
      ספק השוקולד, כי הסטטוס של המריר שקניתם עובר אוטומטית לכל מוצר שמכינים ממנו.
    - >-
      הלקוח, לפי המנהג שלו, ולכן כותבים "פרווה" ומוסיפים "לשאול את הרב" על התווית.
    - >-
      הגוף המכשיר, שקובע אם צריך הפרדת ציוד או שהמוצר יוגדר חלבי, ושואלים אותו לפני הדפסה.
  correct: 3
  explanation: >-
    הסטטוס תלוי גם בציוד, והגוף המכשיר הוא שקובע. שואלים אותו מה נדרש כדי לסמן פרווה, ושולחים לו את
    נוסח התווית לפני הדפסה.
- id: q4
  question: >-
    שוקולד מריר מסומן "חלבי" ולא "ציוד חלבי", אף שאין בו חלב ברכיבים. לפי OK Kosher, מה ההסבר הסביר?
  options:
    - >-
      שבמריר תמיד מוסיפים אבקת חלב בכמות קטנה, והיצרן פשוט לא כתב אותה ברשימת הרכיבים.
    - >-
      שהקו מרוקן ולא נשטף בין שוקולד חלב למריר, ולכן נשארות שאריות; DE רק כשאין שום שארית.
    - >-
      ש"חלבי" ו"ציוד חלבי" הם שני שמות לאותו סטטוס, וכל גוף מכשיר בוחר באיזו מילה להשתמש.
    - >-
      שהמשגיח לא היה נוכח בייצור, ולכן הגוף המכשיר סימן חלבי ליתר ביטחון על כל המוצרים.
  correct: 1
  explanation: >-
    לפי OK Kosher (16.12.2025), בהחלפת ייצור הקו מרוקן ולא נשטף, ושאריות שוקולד חלב נכנסות למריר. לכן
    מריר כזה מוגדר בדרך כלל חלבי, ו־DE ניתן רק כשאין שארית חלב.
