- id: q1
  question: >-
    אתם בונים קו פרווה. במלאי יש שק מריר בלי חלב ברשימת הרכיבים, ועליו "כשר חלבי, לאוכלי אבקת חלב
    נכרי". מה עושים עם השק הזה?
  options:
    - >-
      משתמשים בו לקו הפרווה, כי אין חלב ברכיבים והסימון החלבי הוא רק עניין של אלרגנים.
    - >-
      משתמשים בו לקו הפרווה, בתנאי שמוסיפים לתווית "עלול להכיל חלב" ליד רשימת הרכיבים.
    - >-
      מעבירים אותו למוצרים חלביים, כמו גנאש עם שמנת, וקונים לקו הפרווה מריר שכתוב עליו פרווה.
    - >-
      מחזירים אותו לחנות, כי מריר שמסומן חלבי הוא טעות של היצרן ואסור למכור אותו.
  correct: 2
  explanation: >-
    לפי OK Kosher, מריר מקו שמייצר גם שוקולד חלב מקבל בדרך כלל הכשר חלבי, כי נשארות שאריות. לקו פרווה
    צריך מריר שכתוב עליו פרווה. השק עצמו טוב למוצר חלבי, ושום דבר לא נזרק.
- id: q2
  question: >-
    דף החנות אומר "פרווה, בד"ץ", אבל על השקית שהגיעה כתוב "חלבי, OK". לפי מה ממלאים את טבלת הספקים?
  options:
    - >-
      לפי דף החנות, כי החנות מתעדכנת מהיבואן ויודעת יותר טוב מהמדבקה על השקית.
    - >-
      לפי השקית שהגיעה, ומצלמים אותה עם תאריך, כי מה שכתוב על האריזה קובע.
    - >-
      לפי מה שהיה בפעם הקודמת שקניתם את אותו מוצר, כי הכשר של מוצר לא משתנה.
    - >-
      לפי ההכשר הגבוה מבין השניים, כדי שלא תפספסו לקוחות שמקפידים על בד"ץ.
  correct: 1
  explanation: >-
    אותו מותג מגיע בכשרויות שונות לפי מק"ט ואריזה, ודפי חנויות לא תמיד מעודכנים. מה שכתוב על האריזה
    שהגיעה קובע, ובודקים בכל משלוח.
- id: q3
  question: >-
    לפי המדריך (10.11.2026), Callebaut 811 מריר נמכר ב־2.5 ק"ג חלבי ב־179 ₪, וב־5 ק"ג "פרווה הרב רובין"
    ב־259 ₪. מה נכון?
  options:
    - >-
      הגרסה הפרווה זולה יותר לק"ג (כ־51.80 ₪ מול כ־71.60 ₪), אבל צריך לבדוק שההכשר מקובל על הגוף שלכם.
    - >-
      הגרסה החלבית זולה יותר לק"ג, כי פרווה דורש ייצור מיוחד ולכן תמיד מייקר את חומר הגלם.
    - >-
      אין הבדל בין השניים, כי זה אותו שוקולד מאותו מפעל, והכשרות היא רק מדבקה על השק.
    - >-
      אי אפשר להשוות, כי מחיר לק"ג לא רלוונטי לעסק קטן שקונה רק שקים של 2.5 ק"ג.
  correct: 0
  explanation: >-
    259 חלקי 5 הם 51.80 ₪ לק"ג, ו־179 חלקי 2.5 הם 71.60 ₪ לק"ג. הכשרות שונה לפי מק"ט, ולכן ההחלטה היא
    גם מחיר וגם שאלה לגוף המכשיר: האם הוא מקבל את ההכשר הזה.
- id: q4
  question: >-
    לגנאש של המארז לחברה רציתם ליקר תפוזים שיש לכם בבית, בלי הכשר על הבקבוק. מה הצעד הנכון?
  options:
    - >-
      להשתמש בו, כי 5 גרם ליקר בגנאש של 70 גרם הם כמות קטנה שלא משנה את הכשרות.
    - >-
      להשתמש בו, כי האלכוהול מתנדף בזמן ההכנה ולכן לא נשאר ממנו דבר במוצר המוגמר.
    - >-
      להשתמש בו ולכתוב על המארז "מכיל אלכוהול", כי זה כל מה שנדרש לגבי משקה בגנאש.
    - >-
      להחליף לבקבוק עם הכשר שהגוף שלכם מקבל, או להכין את הגרסה בלי אלכוהול.
  correct: 3
  explanation: >-
    ליקרים צריכים הכשר (06.3), ואלכוהול שמוסיפים לגנאש ב־35-40°C נשאר במוצר. כמות קטנה היא שאלה לרב,
    לא החלטה של המטבח. כל רכיב, גם אלכוהול, נכנס לטבלת הספקים.
