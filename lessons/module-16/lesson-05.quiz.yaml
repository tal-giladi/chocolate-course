- id: q1
  question: >-
    מי נותן רישיון ייצור למזון, ומי נותן רישיון עסק, לפי החוקים שנלמדו?
  options:
    - >-
      שניהם ניתנים ברשות המקומית, במחלקת רישוי עסקים, באותה בקשה.
    - >-
      שניהם ניתנים בלשכת הבריאות המחוזית, אחרי ביקורת אחת באתר.
    - >-
      רישיון ייצור נותן רואה החשבון, ורישיון עסק נותנת רשות המסים.
    - >-
      ייצור: בקשה ללשכת הבריאות המחוזית; עסק: ראש הרשות המקומית.
  correct: 3
  explanation: >-
    רישיון ייצור לפי חוק המזון (בקשה ללשכת הבריאות, סעיף 28), ורישיון עסק לפי חוק רישוי עסקים (ראש
    הרשות המקומית, סעיף 5), שבו משרד הבריאות הוא אחד מנותני האישור.
- id: q2
  question: >-
    חברה מקבוצת פייסבוק כותבת: "מוכרים שוקולד מהבית כבר שנים, לא צריך שום רישיון". מה עושים?
  options:
    - >-
      מתחילים למכור, כי משרד הבריאות אמר ב־2021 שאין לו פיקוח על בתים.
    - >-
      לא מסתמכים על זה; שואלים את לשכת הבריאות ואת הרשות המקומית, ומבקשים תשובה בכתב.
    - >-
      מתחילים למכור, ואם תבוא פנייה מהעירייה, אז פותחים את תהליך הרישוי.
    - >-
      מוותרים על העסק, כי החוק אוסר במפורש כל מכירה של מזון שהוכן בבית.
  correct: 1
  explanation: >-
    לא נמצא בחוק פטור לייצור ביתי, ומשרד הבריאות אמר שזה "אינה מוסדרת בחוק" ושהאכיפה בידי הרשות
    המקומית. אין כאן היתר וגם לא איסור מפורש לביתי: התשובה לעסק שלכם מגיעה מהרשויות.
- id: q3
  question: >-
    למה כדאי לשאול סוכן ביטוח על ביטוח אחריות מוצר כבר בשלב התכנון?
  options:
    - >-
      כי לפי חוק האחריות למוצרים פגומים, יצרן מפצה על נזק גוף מפגם גם בלי אשמה.
    - >-
      כי בלי ביטוח כזה לשכת הבריאות לא מקבלת בקשה לרישיון ייצור בכלל.
    - >-
      כי ביטוח דירה רגיל מכסה תמיד פעילות עסקית בבית, ואז חוסכים כסף.
    - >-
      כי ביטוח אחריות מוצר מחליף את הצורך בתוכנית בטיחות מזון כתובה.
  correct: 0
  explanation: >-
    סעיף 2 לחוק קובע חובת פיצוי של יצרן על נזק גוף מפגם במוצר, בלי תלות באשמה. מה הביטוח דורש ומה
    הוא מכסה (גם אלרגיה) שואלים את הסוכן; זה לא מחליף בטיחות מזון.
- id: q4
  question: >-
    פקיד בטלפון אמר לכם: "אם זה קטן, מהבית זה בסדר". מה רושמים ביומן הפניות?
  options:
    - >-
      "מותר מהבית", ומתחילים למכור כבר מהשבוע הבא.
    - >-
      כלום, כי שיחת טלפון לא נחשבת פנייה רשמית בכלל.
    - >-
      תאריך, שם ותפקיד, התשובה במילים שלו, ו"לבקש בכתב".
    - >-
      רק את שם המשרד, כדי לצטט אותו אם תהיה ביקורת.
  correct: 2
  explanation: >-
    כל תשובה נרשמת עם תאריך, שם ומה נאמר. תשובה בעל פה היא לא אישור; את מה שמתכננים לסמוך עליו
    מבקשים בכתב.
