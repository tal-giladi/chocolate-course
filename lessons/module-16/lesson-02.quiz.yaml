- id: q1
  question: >-
    פתחתם שקית חדשה של אותו שוקולד מריר שאתם קונים תמיד. בשקית החדשה כתוב "עלול להכיל שומשום", ובקודמת
    לא היה. מה עושים?
  options:
    - >-
      ממשיכים כרגיל, כי זה אותו מוצר של אותו ספק ובאותו מחיר.
    - >-
      מעדכנים את המטריצה ואת התוויות לפני שמשתמשים בשקית.
    - >-
      מוסיפים "עלול להכיל שומשום" רק במוצרים שיש בהם חלבה.
    - >-
      מחזירים את השקית לספק, כי אזהרה חדשה פירושה פגם באריזה.
  correct: 1
  explanation: >-
    התווית שלכם נשענת על התווית של הספק. אזהרה חדשה עוברת לכל מוצר שמשתמש בשוקולד הזה, לפני השימוש,
    ונרשמת יחד עם מספר האצווה.
- id: q2
  question: >-
    על bark פיסטוקים כתבתם "עלול להכיל אגוזים". לקוחה אלרגית לבוטנים שואלת אם זה מכסה גם אותה. מה
    נכון?
  options:
    - >-
      כן, כי בוטנים הם חלק מקבוצת האגוזים ברשימת 14 הקבוצות.
    - >-
      כן, אם הפיסטוקים נקנו בשקית שכתוב עליה "ללא בוטנים".
    - >-
      לא, אבל אין צורך לציין בוטנים כי הם לא נמצאים במתכון.
    - >-
      לא. בוטנים הם קבוצה נפרדת, וכותבים כל אלרגן בשמו.
  correct: 3
  explanation: >-
    בוטנים ואגוזים הם שתי קבוצות. ה־FSA כותבים ש"עלול להכיל אגוזים" לא מספיק כדי להזהיר על בוטנים.
    אם יש בוטנים במטבח או באזהרות האריזה, כותבים "עלול להכיל בוטנים".
- id: q3
  question: >-
    מה השתנה, לפי משרד הבריאות, בסימון אלרגנים בישראל מ־1.1.2028?
  options:
    - >-
      אלרגן מכוון מודגש בתוך רשימת הרכיבים, ו"עלול להכיל" לא משתנה.
    - >-
      "עלול להכיל" הופך לחובה, וצריך בדיקת מעבדה לכל אזהרה כזו.
    - >-
      רק יצרנים גדולים מסמנים אלרגנים, ועסק קטן מקבל פטור מלא.
    - >-
      רשימת האלרגנים מצטמצמת לשמונה, כמו הרשימה של ה־FDA.
  correct: 0
  explanation: >-
    מ־2028 אלרגנים מודגשים ברשימת הרכיבים לפי 14 הקבוצות האירופיות. "עלול להכיל" לא מוסדר בכללים
    האירופיים ולכן נשאר כמו שהוא. לא נמצא פטור ליצרן קטן.
- id: q4
  question: >-
    אתם מוכרים מארזים דרך אינסטגרם. איפה צריך להופיע מידע האלרגנים לפי ההנחיה הבריטית שנלמדה?
  options:
    - >-
      רק על המארז, כי שם הלקוח קורא את התווית לפני שהוא אוכל.
    - >-
      רק בהודעה פרטית, אם הלקוח שואל על אלרגן מסוים לפני ההזמנה.
    - >-
      לפני הקנייה (בדף או בפוסט) וגם במסירה (על המארז).
    - >-
      רק בדף המוצר, כי מי שקנה כבר ראה את המידע בזמן ההזמנה.
  correct: 2
  explanation: >-
    במכירה מרחוק המידע זמין לפני הקנייה וגם במסירה. במארז מתנה מי שאוכל הוא לא מי שקנה, ולכן התווית
    במארז חיונית.
