- id: q1
  question: >-
    לפי סעיף 32 לחוק המזון, כמה זמן שומרים את רשומות האצווה של מארז טראפלס שהתאריך שלו 20.11.2026?
  options:
    - >-
      עד 20.11.2026, כי אחרי התאריך המוצר כבר לא נמצא בשוק.
    - >-
      שלוש שנים מיום הייצור, כמו כל רשומה אחרת של עסק.
    - >-
      לפחות עד 20.11.2027, שנה מתום חיי המדף.
    - >-
      חודש אחד אחרי המכירה האחרונה, אם אין תלונות.
  correct: 2
  explanation: >-
    היצרן שומר את המסמכים לכל אצווה לפחות שנה מתום חיי המדף, ואם אין תאריך, שנה מיום ההעברה. שלוש
    שנים הן הזמן לתיעוד תלונות (סעיף 164(ז)).
- id: q2
  question: >-
    מי קובע את התאריך האחרון לשימוש על מארז הבונבונים שאתם מכינים ומוכרים?
  options:
    - >-
      אתם, כיצרן, ואתם צריכים לעמוד מאחוריו, רצוי אחרי ניסוי באורך מלא.
    - >-
      ספק השוקולד, כי התאריך על השקית שלו הוא התאריך של המוצר המוגמר.
    - >-
      לשכת הבריאות, שמנפיקה טבלת תאריכים לכל סוג של מוצר שוקולד.
    - >-
      החנות שמוכרת את המארז, לפי תנאי האחסון שיש לה על המדף.
  correct: 0
  explanation: >-
    סעיף 12 מדבר על התאריך "כפי שקבע היצרן". Callebaut ממליצים לטעון רק מה שאתם בטוחים בו אחרי
    ניסוי באורך מלא, ולהיות שמרניים. תאריך השוקולד הגולמי לא מתאים למוצר עם מילוי.
- id: q3
  question: >-
    לקוח מתקשר: הבן שלו קיבל פריחה אחרי בונבון מהמארז שלכם, ועכשיו הוא בסדר. מה עושים, לפי הסדר?
  options:
    - >-
      מחזירים לו כסף, ולא רושמים כלום, כי הילד כבר בסדר.
    - >-
      מוודאים שהילד קיבל טיפול, רושמים ביומן התלונות, ובודקים את האצווה.
    - >-
      מבקשים ממנו בדיקת אלרגיה של הילד לפני שמתחילים לבדוק משהו.
    - >-
      מודיעים מיד בפומבי על ריקול של כל המוצרים שמכרתם החודש.
  correct: 1
  explanation: >-
    קודם בריאות. אחר כך כל תלונה על נזק לבריאות נרשמת ונשמרת שלוש שנים לפחות, ובודקים לפי מספר
    האצווה אם יש בעיה במוצר. ריקול נעשה בתיאום עם שירות המזון, אם יש מזון מזיק.
- id: q4
  question: >-
    בדף המוצר באתר שלכם כתוב: "שוקולד מריר 85% שמחזק את המערכת החיסונית". מה הבעיה?
  options:
    - >-
      אין בעיה, כי זו פרסומת באתר ולא התווית שעל המארז עצמו.
    - >-
      צריך להוסיף רק מקור מדעי, ואז הטענה מותרת בכל מקום.
    - >-
      הבעיה היא רק ה־85%, כי צריך לכתוב את אחוז הקקאו בטבלה.
    - >-
      סעיף 13 אוסר לייחס למזון סגולת חיזוק או ריפוי, גם בפרסום.
  correct: 3
  explanation: >-
    האיסור חל על סימון וגם על פרסום, אלא אם הותר לפי חקיקת המזון. "85% קקאו" הוא תיאור מותר; "מחזק
    את המערכת החיסונית" היא טענה אסורה.
