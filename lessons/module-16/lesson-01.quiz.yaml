- id: q1
  question: >-
    אתם מתכננים למכור ארבעה מוצרים: טבלת מריר, bark פיסטוקים, בונבון פרלינה וטראפלס גנאש שמנת. איזה
    מהם שייך לקבוצה שדורשת מקרר עד 4°C ושעון?
  options:
    - >-
      הטראפלס, כי גנאש עם שמנת נמדד בפעילות מים של כ־0.88 ו־pH מעל 5.
    - >-
      בונבון הפרלינה, כי אגוזים טחונים הם המוצר הרגיש ביותר במארז.
    - >-
      ה־bark פיסטוקים, כי פירות יבשים ואגוזים מושכים לחות מהאוויר.
    - >-
      טבלת המריר, כי שוקולד מטומפר נמס כבר ב־34°C ומאבד את הברק.
  correct: 0
  explanation: >-
    Kansas State מדדו גנאש מבושל ב־aw 0.88 ו־pH 5.5, וזה מזון שדורש בקרת זמן וטמפרטורה. פרלינה
    ושוקולד מוצק יבשים בהרבה; חום פוגע בהם במראה, לא בבטיחות.
- id: q2
  question: >-
    בדף הסכנות שלכם, בעמודת "גבול" ליד השלב "גלגול טראפלס", כתוב "לעבוד מהר ובזהירות". מה הבעיה?
  options:
    - >-
      אין בעיה, כי בשלב הגלגול מספיק לעבוד עם כפפות חד־פעמיות נקיות.
    - >-
      הגבול צריך להיות טמפרטורת השוקולד בגלגול, 31-32°C, ולא זמן.
    - >-
      גבול הוא מספר שאפשר לבדוק, למשל "עד שעתיים בחוץ בסך הכול".
    - >-
      בשלב הגלגול לא צריך גבול, כי הוא לא אחת מנקודות הבקרה הקריטיות.
  correct: 2
  explanation: >-
    לפי עקרונות HACCP, גבול קריטי הוא ערך מקסימלי או מינימלי שבודקים. "בזהירות" אי אפשר למדוד;
    "שעתיים" אפשר לבדוק בטיימר ולפעול כשחורגים.
- id: q3
  question: >-
    איזו מהסכנות האלה היא סכנה כימית לפי החלוקה של ה־FDA?
  options:
    - >-
      שערה שנפלה לתוך הגנאש בזמן הערבוב.
    - >-
      חלב שלא סומן על מארז שנמכר כ"פרווה".
    - >-
      סטפילוקוקוס שעבר מהידיים לטראפלס.
    - >-
      שבב פלסטיק מתבנית פוליקרבונט סדוקה.
  correct: 1
  explanation: >-
    אלרגן לא מסומן נחשב סכנה כימית, כמו שאריות חומר ניקוי. שערה ושבב הם סכנות פיזיקליות, וחיידק הוא
    סכנה ביולוגית.
- id: q4
  question: >-
    קמתם בבוקר יום ייצור עם שלשול. יש לכם 20 מארזי טראפלס להכין להזמנה. מה עושים?
  options:
    - >-
      מכינים, אבל עם כפפות ומסכה, ושוטפים ידיים כל חצי שעה.
    - >-
      מכינים רק את הגנאש, כי הבישול בשמנת הורג את רוב החיידקים.
    - >-
      מכינים, ומקצרים את התאריך על המארז לשלושה ימים בלבד.
    - >-
      לא מכינים היום, ומודיעים ללקוח על דחייה או מוצאים מישהו בריא.
  correct: 3
  explanation: >-
    עובד חולה הוא אחת הסיבות להתפרצויות ממילויים (Kansas State). כפפות לא מספיקות, ובישול לא הופך
    גנאש לבטוח אחרי שנגעו בו.
- id: q5
  question: >-
    לפי ה־FDA, מה צריך להיות במקום לפני שכותבים נקודות בקרה קריטיות?
  options:
    - >-
      תוכניות קדם: ניקוי, היגיינה אישית, ספקים, אחסון, עקיבות והדברה.
    - >-
      בדיקת מעבדה של כל מוצר לחיידקים, לעובש ולפעילות מים.
    - >-
      רישיון ייצור מלשכת הבריאות, ובלעדיו אין טעם לכתוב תוכנית.
    - >-
      מקרר מסחרי נפרד ומטבח שאין בו שימוש ביתי בכלל.
  correct: 0
  explanation: >-
    ה־FDA מתארים תוכניות קדם כבסיס שעליו בונים את שבעת העקרונות. במטבח קטן הן רוב העבודה, והן לא
    דורשות מעבדה או ציוד מסחרי כדי להתחיל.
