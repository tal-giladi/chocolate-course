- id: q1
  question: >-
    הארון היחיד הפנוי לחומרי הגלם נמצא ליד התנור, ומדדתם בו 27°C בצהריים. מה עושים עם שקיות
    הקוברטורה?
  options:
    - >-
      שומרים אותן שם, כי שקית סגורה מגינה מחום כל עוד היא לא נפתחה.
    - >-
      מעבירים את כולן למקרר, כי שם הכי קר ויציב בבית בקיץ.
    - >-
      מוצאים מקום קריר ויבש יותר, קרוב ל־12-18°C וללחות עד 70%.
    - >-
      מקפיאים אותן, ומפשירים כל שקית בלילה שלפני יום הייצור.
  correct: 2
  explanation: >-
    Callebaut ממליצים 12-18°C ולחות עד 70%, ולא ממליצים מקרר לשוקולד בגלל הלחות. בחום השוקולד
    מתרכך ומאבד ברק גם בשקית סגורה.
- id: q2
  question: >-
    מגש טראפלס שמנת יצא מהמקרר לאריזה ב־10:00, השליח אסף ב־11:00 ומסר ב־12:30. מה נכון לפי כלל
    השעתיים?
  options:
    - >-
      הכול בסדר, כי הזמן נספר רק מהרגע שהשליח אסף את המארז.
    - >-
      עברו שעתיים וחצי מחוץ למקרר, ולכן המארז היה צריך להגיע מוקדם יותר.
    - >-
      הכול בסדר, כל עוד הלקוח מכניס את המארז למקרר מיד כשהוא מקבל.
    - >-
      הכלל חל רק מעל 32°C, ולכן ביום רגיל אין מגבלת זמן על טראפלס.
  correct: 1
  explanation: >-
    כלל השעתיים סופר את כל הזמן מחוץ למקרר: אריזה, המתנה, נסיעה. מעל 32°C הגבול הוא שעה. התוכנית
    צריכה לקבוע אריזה סמוך לאיסוף וזמן מרבי לשליח.
- id: q3
  question: >-
    חנות שמוכרת את המארזים שלכם שואלת איך לאחסן אותם. לפי סעיף 156 לחוק המזון, מה קובע?
  options:
    - >-
      ההחלטה של החנות, לפי המקום והציוד שיש לה בחנות עצמה.
    - >-
      תקן כללי של משרד הבריאות לכל מוצרי השוקולד באשר הם.
    - >-
      ההוראה שתיתנו בעל פה לבעל החנות כשאתם מביאים את הסחורה.
    - >-
      הוראות היצרן, כלומר מה שאתם כותבים על המארז.
  correct: 3
  explanation: >-
    עוסק במזון מאחסן ומוביל לפי הוראות היצרן. אתם היצרן, ולכן ההוראה צריכה להיות כתובה על המארז, כדי
    שהחנות והשליח יוכלו לפעול לפיה.
- id: q4
  question: >-
    במקרר שלכם שתי קופסאות טראפלס בלי תווית, ואתם לא זוכרים מתי הכנתם אותן. מה עושים?
  options:
    - >-
      לא מוכרים אותן, ומעכשיו מדביקים תווית לפני שקופסה נסגרת.
    - >-
      טועמים טראפלס אחד מכל קופסה, ואם הטעם טוב מוכרים את השאר.
    - >-
      מוכרים אותן קודם, כי כנראה הן הישנות ביותר במקרר.
    - >-
      מדביקים עליהן את התאריך של היום, כי הן נשמרו כל הזמן במקרר.
  correct: 0
  explanation: >-
    בלי אצווה ותאריך אין רוטציה ואין עקיבות. טעם לא מגלה חיידקים או רעלנים, ותאריך שהומצא הוא
    הטעיה.
