- id: q1
  question: >-
    בטעימה עיוורת אתם מקבלים שתי דגימות מריר. שתיהן מבריקות ונשברות בקליק. איך תזהו מי מהן שוקולד
    ציפוי?
  options:
    - >-
      לפי הצבע על המפית הלבנה: שוקולד ציפוי תמיד כהה יותר, כי יש בו יותר אבקת קקאו.
    - >-
      לפי הפה: שוקולד ציפוי נמס לאט ובאופן שעוותי, והטעם שלו מתוק וחלש יותר.
    - >-
      לפי הצליל: לשוקולד ציפוי סנאפ חזק יותר תמיד, כי השומן הצמחי קשה יותר.
    - >-
      לפי הריח: לשוקולד ציפוי ריח קלוי חזק, כי הקקאו בו עובר קלייה כפולה.
  correct: 1
  explanation: >-
    במראה ובצליל שוקולד ציפוי יכול להיראות טוב, כי השומן הצמחי מתקשה בלי טמפרור. בפה הוא נמס אחרת
    מחמאת קקאו, ויש בו פחות קקאו ויותר סוכר.
- id: q2
  question: >-
    על טבלה שעמדה בארון ליד התנור יש שכבה אפורה. כשאתם משפשפים אותה באצבע, היא נעלמת ומרגישה שמנונית.
    מה זה ומה עושים?
  options:
    - >-
      פריחת סוכר מלחות; זורקים את הטבלה כי הסוכר שהתגבש מסמן קלקול.
    - >-
      עובש שמתחיל על פני השטח; מגרדים את השכבה ואוכלים רק את האמצע.
    - >-
      פריחת סוכר מקור; מחממים בעדינות במיקרוגל כדי שהסוכר יחזור פנימה.
    - >-
      פריחת שומן מחום; בטוח לאכילה, ואפשר להמיס ולטמפר מחדש או לאפות.
  correct: 3
  explanation: >-
    פריחת שומן נעלמת במגע ומרגישה שמנונית; היא נוצרת מחום או מחוסר טמפר. פריחת סוכר מחוספסת ולא
    נעלמת, והיא מלחות. שתיהן בטוחות לאכילה.
- id: q3
  question: >-
    טעמתם קודם מריר 85% ואחריו שוקולד חלב, ושוקולד החלב טעם "שטוח" ומתוק בלבד. מה הסיבה הסבירה?
  options:
    - >-
      הסדר הפוך: המריר החזק כיסה את העדין; מתחילים מלבן וחלב ועולים באחוזים.
    - >-
      שוקולד החלב באיכות נמוכה, כי שוקולד חלב טוב אמור לטעום חזק כמו מריר.
    - >-
      שוקולד החלב היה חם מדי, וחום מעלים את הארומה ומשאיר רק מתיקות.
    - >-
      לא שתיתם מים, ומים הם הדבר היחיד שמחזיר את חוש הטעם אחרי מריר.
  correct: 0
  explanation: >-
    טעם חזק ומר נשאר בפה ומטשטש את מה שבא אחריו. לכן טועמים מהעדין לחזק, ושותים מים בין דגימה
    לדגימה.
- id: q4
  question: >-
    בניסוי האף, כשהאף סגור הרגשתם בעיקר מתוק ומר, וכשפתחתם הרגשתם "פירותי" ו"קלוי". מה זה מלמד?
  options:
    - >-
      שהדגימה הייתה קרה מדי, והחום של האצבעות על האף חימם אותה מספיק כדי שתשחרר טעם.
    - >-
      שהלשון צריכה כמה שניות להתעורר, ולכן הטעמים המורכבים מגיעים תמיד אחרי המתוק והמר.
    - >-
      שהלשון מזהה רק טעמים בסיסיים, והארומה (פירותי, קלוי) מגיעה מהאף גם כשהשוקולד בפה.
    - >-
      שבשוקולד הזה יש תוספת של טעם פירות, כי בשוקולד רגיל אין ארומה פירותית בכלל.
  correct: 2
  explanation: >-
    הלשון מבחינה בחמישה טעמים בסיסיים. כל השאר הוא ארומה שעולה מהפה לאף, ולכן נותנים לשוקולד להימס
    ושואפים אוויר דרך הפה.
- id: q5
  question: >-
    אתם רוצים לבדוק בטעימה את הטבלה שהכנתם. היא שכבה לילה במקרר. מה עושים לפני הטעימה?
  options:
    - >-
      טועמים מיד כשהיא קרה, כי קור שומר על הסנאפ והברק ומראה את התוצאה האמיתית.
    - >-
      מחממים חתיכה בין האצבעות דקה לפני, כדי שהארומה תצא מהר יותר בפה.
    - >-
      שמים אותה רבע שעה במקפיא, כדי שהסנאפ יהיה ברור ואפשר יהיה לשמוע אותו.
    - >-
      מוציאים אותה בקופסה סגורה חצי שעה לפני, וטועמים בטמפרטורת החדר.
  correct: 3
  explanation: >-
    שוקולד קר מתוק פחות, ריחני פחות ונמס לאט, וגם עלול להעלות אדים. טמפרטורת החדר וקופסה סגורה
    נותנות טעימה הוגנת ומונעות פריחת סוכר.
