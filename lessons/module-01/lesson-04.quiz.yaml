- id: q1
  question: >-
    הכנתם טבלת שוקולד עם חלבה, ניקיתם את הידיים בג'ל אלכוהול, ועברתם לטבלה "בלי שומשום" לאורחת
    אלרגית. מה הבעיה?
  options:
    - >-
      אין בעיה, כי אלכוהול בג'ל מפרק חלבונים ומנטרל את האלרגן שנשאר על הידיים.
    - >-
      הבעיה רק בטעם: האלכוהול עובר לשוקולד ומשאיר בו טעם חריף שקשה להסתיר.
    - >-
      הבעיה רק אם הטבלה תחומם שוב, כי חימום מפעיל מחדש את האלרגן בשומשום.
    - >-
      ג'ל לחיטוי לא מוריד אלרגן מהידיים; רק סבון ומים מורידים אותו.
  correct: 3
  explanation: >-
    לפי FARE, סבון ומים או מגבונים מורידים אלרגן, וג'ל או מים בלבד לא. הסדר הנכון: קודם המוצר בלי
    האלרגן, אחר כך המוצר איתו, ואז ניקוי.
- id: q2
  question: >-
    באמצע אוגוסט, הדירה ב־31°C בלי מזגן, וביום שישי אחה"צ הגשתם תותים מטובלים בשוקולד בגינה (34°C).
    כמה זמן הם יכולים לעמוד בחוץ לפני שמחזירים למקרר?
  options:
    - >-
      עד שעה אחת, כי מזון מתכלה בטמפרטורה מעל 32°C חוזר למקרר תוך שעה.
    - >-
      עד ארבע שעות, כי השוקולד מצפה את התותים ומגן עליהם מחיידקים מבחוץ.
    - >-
      כל הערב, כי פירות טריים לא נחשבים מזון מתכלה כמו בשר או מוצרי חלב.
    - >-
      עד שעתיים בדיוק, כי זה הכלל בכל טמפרטורה, ומעבר לזה אין הבדל בין חורף לקיץ.
  correct: 0
  explanation: >-
    לפי ה־FDA, מזון מתכלה נכנס למקרר תוך שעתיים, ותוך שעה כשבחוץ יותר מ־32°C (90°F). תותים חתוכים
    או מטובלים הם מזון מתכלה, והשוקולד לא מגן עליהם.
- id: q3
  question: >-
    הוצאתם קופסת מטבעות שוקולד חשופים מהמקרר למטבח חם ולח. למחרת יש עליהם שכבה לבנבנה מחוספסת. מה קרה
    ומה עושים?
  options:
    - >-
      השוקולד התעפש מהלחות; זורקים את כל הקופסה ומנקים את המקרר בחומר חיטוי.
    - >-
      פריחת שומן מהחום במטבח; מחזירים למקרר כדי שהשומן יחזור פנימה ויעלם.
    - >-
      פריחת סוכר מאדים שהתעבו על השוקולד הקר; בטוח לאכילה, ממיסים לתרגול.
    - >-
      הסוכר נשרף בקירור החזק; השוקולד מר עכשיו ומתאים רק לבראוניז.
  correct: 2
  explanation: >-
    אדים מתעבים על שוקולד קר, ממיסים את הסוכר שעל פני השטח, והוא מתגבש כשכבה מחוספסת. זה עניין של
    מראה, לא של בטיחות. קופסה סגורה עד שמגיעים לטמפרטורת החדר מונעת את זה.
- id: q4
  question: >-
    קניתם אבקת ברק זהב. על האריזה: "Non-toxic, for decorative purposes only", בלי רשימת רכיבים. אפשר
    לפזר אותה על טבלת שוקולד לאורחים?
  options:
    - >-
      כן, כי "לא רעיל" פירושו שהמוצר נבדק ומותר לאכילה בכמויות של קישוט.
    - >-
      לא; מוצר "לקישוט בלבד" בלי רשימת רכיבים לא שמים ישירות על אוכל.
    - >-
      כן, בתנאי שמערבבים אותה עם מעט חמאת קקאו כדי שלא תתפזר באוויר.
    - >-
      רק על שוקולד מריר, כי בשוקולד לבן היא משנה צבע וזה סימן לתגובה כימית.
  correct: 1
  explanation: >-
    מוצר אכיל מציג רשימת רכיבים ולרוב "אכיל". "לא רעיל" או "לקישוט בלבד" בלי רכיבים אומר שלא שמים
    אותו על אוכל, ואם קישטתם בו, מסירים לפני ההגשה.
- id: q5
  question: >-
    איפה כדאי לשמור טבלאות שוקולד מוגמרות לשבועיים, בדירה של 27°C בקיץ?
  options:
    - >-
      בקופסה סגורה במקום הקריר בבית, או בקופסה סגורה במקרר עם יציאה הדרגתית.
    - >-
      במקפיא בשקית פתוחה, כי קור חזק עוצר כל שינוי בשוקולד ושומר על הברק.
    - >-
      על השיש בצלחת מכוסה במגבת, כי שוקולד מוצק לא מושפע מחום מתחת ל־35°C.
    - >-
      במקרר בלי קופסה, ליד הגבינות, כי שם המקרר הכי יציב ולא נפתח הרבה.
  correct: 0
  explanation: >-
    האידיאל הוא 14-20°C, סגור והרחק מריחות. כשהבית חם, מקרר בקופסה סגורה עדיף על שיש, ומוציאים
    בקופסה סגורה כדי שלא יתעבו אדים.
