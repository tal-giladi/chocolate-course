- id: q1
  question: >-
    בשקית "מטבעות שוקולד חום" שקניתם בחנות אפייה כתוב ברכיבים: סוכר, שומן צמחי (דקל), אבקת קקאו
    12%, לציטין סויה. מה אתם יודעים על המוצר?
  options:
    - >-
      זו קוברטורה זולה, כי יש בה אבקת קקאו ולא עיסה, וצריך לטמפר אותה בטמפרטורות של מריר.
    - >-
      זה שוקולד מריר רגיל, כי מופיעה בו אבקת קקאו, אבל צריך לחמם אותו לאט כדי שלא ייפרד.
    - >-
      זה שוקולד ציפוי: השומן הוא שומן צמחי ולא חמאת קקאו, ולכן ממיסים ועובדים בלי טמפרור.
    - >-
      זה שוקולד לבן צבוע בחום, כי אין בו עיסת קקאו, ולכן עובדים איתו בטמפרטורות של לבן.
  correct: 2
  explanation: >-
    כשהשומן העיקרי הוא שומן צמחי ויש מעט קקאו, זה שוקולד ציפוי (צימקאו). השומן הזה לא מתגבש בצורות
    של חמאת קקאו, ולכן אין צורך בטמפרור.
- id: q2
  question: >-
    חבר אומר שטבלת מריר 85% "בריאה יותר כי יש בה 85% קקאו טהור". מה נכון לגבי המספר 85%?
  options:
    - >-
      זה כל מה שבא מפולי הקקאו (עיסה, חמאה ואבקה) יחד, והשאר בעיקר סוכר, כ־15%.
    - >-
      זה אחוז חמאת הקקאו בטבלה, ולכן היא תהיה נוזלית מאוד בהמסה ומתאימה לטיבול דק.
    - >-
      זה אחוז מוצקי הקקאו הכהים בלבד, בלי חמאת הקקאו, שמחושבת בנפרד על האריזה.
    - >-
      זה ציון איכות שהיצרן נותן לפולים, ולכן מריר 85% עשוי מפולים טובים יותר מ־70%.
  correct: 0
  explanation: >-
    האחוז כולל את כל מה שמגיע מהפולים. הוא אומר בערך כמה סוכר יש (השאר), אבל לא כמה מתוכו חמאת
    קקאו ולא מה איכות הפולים. ואין כאן טענה בריאותית, רק פחות סוכר.
- id: q3
  question: >-
    אתם בוחרים שוקולד לבונבונים שיוצקים בתבנית בשכבה דקה, ורוצים שוקולד נוזלי ומבריק. מה מבדיל
    קוברטורה מטבלת שוקולד רגילה מהסופר?
  options:
    - >-
      בקוברטורה אין סוכר בכלל, ולכן היא נוזלית יותר ומתאימה לשכבות דקות בתבנית.
    - >-
      קוברטורה מגיעה כבר מטומפרת לתמיד, ולכן אפשר להמיס אותה בלי לטמפר מחדש.
    - >-
      בקוברטורה יש שומן צמחי שמוסיף נוזליות, ולכן היא מתקשה מהר יותר מטבלה רגילה.
    - >-
      בקוברטורה יש יותר חמאת קקאו (31% לפחות לפי ההגדרה האירופית), ולכן היא נוזלית יותר.
  correct: 3
  explanation: >-
    חמאת קקאו היא מה שהופך שוקולד מותך לנוזלי. קוברטורה עשירה בה, ולכן מתאימה לתבניות ולטיבול. גם
    היא צריכה טמפרור אחרי המסה, כמו כל שוקולד אמיתי.
- id: q4
  question: >-
    בניסוי השיעור, דגימת שוקולד הציפוי התקשתה מבריקה תוך 15 דקות, ודגימת המריר הרגיל התקשתה אחרי 40
    דקות, עמומה ועם פסים. מה המסקנה הנכונה?
  options:
    - >-
      המריר היה פגום או ישן, כי שוקולד טוב מתקשה מבריק גם בלי שום טיפול אחרי ההמסה.
    - >-
      המריר הוא שוקולד אמיתי שצריך טמפרור אחרי המסה; שוקולד הציפוי לא צריך, ולכן התקשה יפה.
    - >-
      שוקולד הציפוי איכותי יותר מהמריר, ולכן כדאי לעבוד רק איתו גם בבונבונים ובמארזים.
    - >-
      המריר חומם מעט מדי, ולו היה מגיע ל־60°C הוא היה מתקשה מבריק כמו שוקולד הציפוי.
  correct: 1
  explanation: >-
    חמאת הקקאו במריר התגבשה בלי טמפרור בצורות לא יציבות, ולכן התוצאה עמומה ומפוספסת. שוקולד הציפוי
    עוקף את הבעיה בזכות השומן הצמחי, אבל משלם בטעם ובמרקם.
- id: q5
  question: >-
    לקוחה מבקשת מכם מארז "ורוד בלי צבע מאכל". שקלתם שוקולד רובי. מה נכון לגביו?
  options:
    - >-
      זה שוקולד לבן עם אבקת פטל, ולכן אפשר להכין אותו בבית מלבן ופירות מיובשים בהקפאה.
    - >-
      זה שוקולד ציפוי צבעוני, ולכן הוא לא צריך טמפרור ואפשר לשמור אותו בכל מקום בבית.
    - >-
      זו קוברטורה מפולי רובי, הצבע מגיע מהפולים עצמם, והיא רגישה לאור, לחום וללחות.
    - >-
      זה שוקולד חלב רגיל שהיצרן מוסיף לו צבע טבעי מסלק, ולכן הטעם שלו כמו שוקולד חלב.
  correct: 2
  explanation: >-
    לפי היצרן, הצבע והטעם הפירותי של רובי מגיעים מהפולים, בלי צבע או טעם מוסף. הוא קוברטורה שצריכה
    טמפרור, ושומרים אותו סגור, בחושך ובקור מתון כדי שהצבע לא ישתנה.
