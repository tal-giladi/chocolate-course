- id: q1
  question: >-
    טבלתם את המדחום החדש במי קרח, והוא מתייצב על 1.5°C. מה עושים לפני שמשתמשים בו לשוקולד?
  options:
    - >-
      זורקים אותו מיד, כי מדחום שלא מראה 0°C בדיוק לא מתאים לעבודה עם שוקולד.
    - >-
      בודקים שוב בכוס מלאה קרח, ואם זה חוזר רושמים עליו תיקון של ‎-1.5.
    - >-
      לא עושים כלום, כי בטמפרטורות של שוקולד (30-50°C) הסטייה מתאפסת מעצמה.
    - >-
      בודקים במים רותחים במקום, כי בדיקת קרח לא מדויקת למדחומים דיגיטליים.
  correct: 1
  explanation: >-
    קודם מוודאים שהבדיקה נעשתה נכון (הרבה קרח, ערבוב, דקר באמצע). סטייה קבועה רושמים ומתקנים בראש.
    בשוקולד 1.5°C זה ההבדל בין טמפר תקין לטמפר שבור.
- id: q2
  question: >-
    בחנות מציעים לכם מדחום אינפרא אדום ב־99 ₪ "שמחליף את הדקר". מה הבעיה העיקרית בו לשוקולד?
  options:
    - >-
      הוא מדויק מדי, ולכן מראה שינויים קטנים שמבלבלים את מי שרק מתחיל לעבוד.
    - >-
      הלייזר שלו מחמם את פני השוקולד ושובר את הטמפר במקום שבו מודדים.
    - >-
      הוא עובד רק על משטחים מתכתיים, ולא על שוקולד בקערת זכוכית או פלסטיק.
    - >-
      הוא מודד רק את פני השטח, ובחלק מהדגמים הטווח מתחיל ב־50°C ולא מכסה את טווח העבודה.
  correct: 3
  explanation: >-
    בקערה יש הבדלי חום בין הפנים לשוליים, והאינפרא אדום רואה רק את המעטפת. דגם שמתחיל ב־50°C לא מודד
    בכלל 28-32°C. הוא תוספת נוחה, לא תחליף לדקר.
- id: q3
  question: >-
    הזמנתם מדחום וספטולה באתר שסימן אותם "במלאי". יומיים אחר כך החנות מודיעה שהמדחום אזל, ושבוע לפני
    חנוכה. מה היה מונע את זה?
  options:
    - >-
      רשימה עם שתי חנויות לכל פריט חובה, ולפני חג טלפון או וואטסאפ לחנות לפני התשלום.
    - >-
      לקנות רק בחנות הגדולה ביותר, כי בחנויות גדולות המלאי באתר תמיד מעודכן.
    - >-
      להזמין דגם מסוים לפי מק"ט, כי חיפוש לפי תיאור כללי מחזיר מוצרים שלא קיימים.
    - >-
      לחכות עם כל הקניות לאחרי החג, כי לפני חג אי אפשר לסמוך על אף חנות.
  correct: 0
  explanation: >-
    חנויות רבות מציגות "במלאי" גם כשהפריט אזל. לכן המדריך נותן 3-4 חנויות לכל קטגוריה, ולפני עונה
    עמוסה מבררים ישירות עם החנות.
- id: q4
  question: >-
    שטפתם את הקערה במדיח וממהרים להמיס בה שוקולד. בתוכה עוד יש אדים וכמה טיפות. מה הסיכון?
  options:
    - >-
      הקערה החמה תשרוף את השוקולד, אבל המים עצמם לא משנים שום דבר במרקם.
    - >-
      המים יגרמו לשוקולד להיות דליל מדי, ולכן הוא יתקשה לאט יותר מהרגיל.
    - >-
      כמה טיפות מים יכולות לגרום לשוקולד להיתפס לגוש קשה, שכבר אי אפשר לעבוד איתו כשוקולד.
    - >-
      האדים יעלו את הלחות בחדר, ולכן השוקולד יצא עם פריחת שומן אחרי כמה ימים.
  correct: 2
  explanation: >-
    מעט מים גורמים לסוכר ולקקאו להידבק לגושים (seize). מייבשים את הקערה לגמרי, כולל אדים. שוקולד
    שנתפס הולך לשוקו חם או לרוטב.
- id: q5
  question: >-
    התקציב שלכם 350 ₪ ואין בבית כלום חוץ מקערות ומגש. מה הסדר הנכון לקנייה?
  options:
    - >-
      תבנית פוליקרבונט ומזלגות טיבול קודם, כי בלי תבנית אי אפשר להכין שום מוצר יפה.
    - >-
      מדחום דקר, משקל 1 גרם, מרית סיליקון, נייר אפייה ושוקולד; תבניות אחרי מודול 3.
    - >-
      מכונת טמפרור קטנה, כי היא חוסכת את כל מודול 3 ואת הצורך במדחום נפרד.
    - >-
      משקל 0.1 גרם ומדחום אינפרא אדום, כי הם המדויקים ביותר ומתאימים לכל שלב בקורס.
  correct: 1
  explanation: >-
    הכלים שקובעים הצלחה זולים: מדחום שנבדק, משקל ומרית יבשה. תבנית בלי טמפרור לא משחררת את השוקולד,
    ולכן היא מחכה למודול 4.
