- id: q1
  question: >-
    על שקית קוברטורה מריר 54% כתוב "כשר חלבי, לאוכלי אבקת חלב נכרי", וברשימת הרכיבים אין שום רכיב
    חלב. מה ההסבר הסביר ביותר?
  options:
    - >-
      טעות בדפוס של היצרן, כי שוקולד בלי רכיבי חלב הוא תמיד פרווה לפי כל גוף כשרות.
    - >-
      השוקולד מכיל חלב שלא הוצהר, ולכן הוא מסוכן לאלרגיים לחלב ויש לדווח על ריקול.
    - >-
      הקו מייצר גם שוקולד חלב, ומכשירים כמו OK מגדירים מריר על קו כזה כחלבי בגלל שאריות.
    - >-
      הסימון מתייחס לאבקת קקאו שמכילה לקטוז, ולכן כל מריר שמכיל אבקת קקאו מוגדר חלבי.
  correct: 2
  explanation: >-
    לפי OK, בהחלפת ייצור הקו מרוקן ולא נשטף, ונשארות שאריות של שוקולד חלב, ולכן המריר מוגדר חלבי.
    DE ניתן רק כשאין שום שארית. זה עניין של כשרות, לא בהכרח של סימון אלרגנים.
- id: q2
  question: >-
    חברה אלרגית לחלב שואלת אם אפשר לתת לבן שלה פרלינים "כי כתוב עליהם פרווה". מה התשובה הנכונה?
  options:
    - >-
      כן, כי מוצר פרווה עבר בדיקת מעבדה של גוף הכשרות שאין בו חלב בכלל.
    - >-
      פרווה הוא סטטוס הלכתי, לא הצהרת אלרגנים; קוראים את הרכיבים ואת "עלול להכיל".
    - >-
      רק אם ההכשר הוא של הרבנות הראשית, כי היא בודקת אלרגנים וגופים פרטיים לא.
    - >-
      לא, כי כל שוקולד מכיל חלב בכמות כלשהי, גם אם הוא מסומן פרווה וגם אם לא.
  correct: 1
  explanation: >-
    ב־2025 נאסף מארז פרלינים שסומן פרווה בגלל חשש לחלב לא מסומן. לאלרגיה קוראים את רשימת הרכיבים
    ואת שורת האלרגנים, לא רק את ההכשר.
- id: q3
  question: >-
    קניתם קילו קוברטורה "בשקילה" בחנות אפייה. על השקית מדבקה עם השגחה של רבנות העיר, ואין את ההכשר
    המקורי של היצרן. אתם מקפידים על הכשר מסוים. מה עושים?
  options:
    - >-
      מבררים עם החנות מה היה על השק המקורי ושואלים את הרב; בפעם הבאה קונים אריזה מקורית.
    - >-
      סומכים על ההשגחה העירונית, כי היא תמיד מחליפה את ההכשר המקורי באותה רמה בדיוק.
    - >-
      מחפשים את המוצר באתר של מותג אחר, כי לכל המותגים הבלגיים יש אותו הכשר.
    - >-
      משתמשים בו רק לשוקולד חלב, כי שוקולד ארוז מחדש מוגדר אוטומטית חלבי.
  correct: 0
  explanation: >-
    אריזה מחדש מוסיפה השגחה מקומית ולפעמים מסתירה את המקור. מי שמקפיד קונה אריזה מקורית של היצרן,
    ובמקרה של ספק שואל את הרב.
- id: q4
  question: >-
    על טבלת שוקולד חלב כתוב "לאוכלי אבקת חלב נכרי". מה הסימון הזה אומר, לפי מאמר מכון התורה והארץ?
  options:
    - >-
      שהמוצר כולו נבדק ומתאים גם למי שמקפיד על חלב ישראל, בתנאי שאוכלים אותו בבית.
    - >-
      שבמוצר אין רכיבי חלב אחרים מלבד אבקת החלב, ולכן אין צורך לבדוק את שאר הרכיבים.
    - >-
      שהמוצר פרווה, אבל יוצר על קו שעובר גם אבקת חלב, כמו ציוד חלבי.
    - >-
      שאבקת החלב אינה חלב ישראל; הסימון לא אומר דבר על שאר רכיבי החלב או על הפיקוח במפעל.
  correct: 3
  explanation: >-
    הסימון מודיע על רכיב אחד, אבקת החלב. רכיבים כמו מי גבינה או לקטוז, הכלים במפעל וההשגחה נבדקים
    בנפרד.
- id: q5
  question: >-
    אתם מכינים טבלת שוקולד לפסח לבני משפחה שלא אוכלים קטניות. על שוקולד הציפוי כתוב "כשר לפסח", וברכיבים
    יש לציטין סויה. מה המסקנה?
  options:
    - >-
      מתאים, כי "כשר לפסח" כולל תמיד גם את מי שלא אוכל קטניות, והלציטין בכמות זניחה.
    - >-
      לא מתאים, כי שוקולד ציפוי לעולם לא מקבל הכשר לפסח, והסימון כנראה מזויף.
    - >-
      כנראה כשר לפסח לאוכלי קטניות; מחפשים "ללא חשש קטניות", ואם יש ספק שואלים את הרב.
    - >-
      מתאים רק אם ממיסים אותו בכלים של פסח, כי הבעיה היא רק בכלים ולא במוצר.
  correct: 2
  explanation: >-
    לציטין סויה הוא קטניות. מוצר "כשר לפסח" עם סויה מיועד בדרך כלל לאוכלי קטניות. מי שלא אוכל קטניות
    מחפש סימון מפורש "ללא חשש קטניות".
