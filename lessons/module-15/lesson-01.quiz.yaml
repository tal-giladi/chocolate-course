- id: q1
  question: >-
    משרד מבקש 60 מארזי סביבונים זהים ליום אחד לפני חנוכה. מארז אחד לוקח לכם 25 דקות. מה החישוב הראשון
    שעושים לפני שעונים?
  options:
    - >-
      בודקים כמה עולה מארז דומה בגיפטוש, כי המחיר בשוק קובע אם ההזמנה כדאית או לא.
    - >-
      מחשבים עלות לשישים מארזים בלבד, כי שעות העבודה שלכם הן לא הוצאה שיוצאת מהכיס.
    - >-
      מחשבים שעות: 60 × 25 דקות הן 25 שעות, ובודקים אם הן נכנסות בשבוע לפני חנוכה.
    - >-
      מבקשים מהמשרד להקדים את המסירה בחודש, כי הזמנות של חברות תמיד נסגרות מוקדם.
  correct: 2
  explanation: >-
    הזמנה של חברה היא הרבה מאותו דבר במועד אחד. 60 × 25 = 1,500 דקות, 25 שעות, בשבוע שבו גם הלקוחות
    הפרטיים מזמינים. קודם בודקים אם זה נכנס במטבח ובזמן, ורק אחר כך עלות ומחיר.
- id: q2
  question: >-
    פתחתם עוסק פטור. חברה רוצה להזמין מכם מתנות לראש השנה ומבקשת "חשבונית מס כדי לקזז מע"מ". מה נכון
    לפי מה שלמדנו?
  options:
    - >-
      עוסק פטור אינו רשאי להוציא חשבונית מס, ולכן שואלים את רואה החשבון לפני שמתחייבים להזמנה.
    - >-
      עוסק פטור מוציא חשבונית מס כמו כל עסק, רק בלי לגבות מע"מ על הסכום שבה.
    - >-
      מספיק לשלוח קבלה רגילה, כי חברות מקזזות מע"מ גם על קבלה של עוסק פטור.
    - >-
      חשבונית מס נדרשת רק בעסקאות מעל 5,000 ₪, ולכן בהזמנה קטנה אין כאן שאלה.
  correct: 0
  explanation: >-
    לפי כל זכות, עוסק פטור אינו גובה מע"מ ואינו רשאי להוציא חשבונית מס. זו שאלה לרואה חשבון לפני
    שבונים מודל של מתנות לחברות. סף 5,000 ₪ קשור למספר הקצאה בחשבונית מס, לא לחובה להוציא חשבונית.
- id: q3
  question: >-
    בחרתם מארזי חג לבית כמודל ראשי. איזה מודל משני הכי פחות מתנגש איתו בעונה, לפי התרשים בשיעור?
  options:
    - >-
      מתנות לחברות, כי גם הן לפני החגים, ואפשר לקנות חומרי גלם לשני המודלים יחד.
    - >-
      מארזי חג נוספים לחגים אחרים, כי כך כל השנה מלאה בהזמנות ואין חודשים שקטים.
    - >-
      מתנות לחברות לפסח בלבד, כי בפסח הלקוחות הפרטיים כמעט לא קונים שוקולד בכלל.
    - >-
      מנוי חודשי קטן או אירועים, כי הביקוש בהם מתפזר על השנה ולא נופל על שבועות החג.
  correct: 3
  explanation: >-
    מארזי חג ומתנות לחברות מתנגשים על אותם שבועות (ראש השנה, חנוכה, פסח). אירועים, סדנאות ומנוי
    מפזרים עבודה על פני השנה, ולכן הם משלימים מודל עונתי.
- id: q4
  question: >-
    כתבה מדווחת שמתנה ממוצעת לעובד בפסח היא כ־500 ₪. מה המסקנה הנכונה לעסק קטן של שוקולד?
  options:
    - >-
      שאפשר לתמחר מארז שוקולד לחברות ב־500 ₪, כי זה מה שחברות מוציאות על כל עובד.
    - >-
      שזה הקשר: חברות קונות גם תווי קנייה ומארזים גדולים, ושוקולד הוא לרוב חלק קטן מהמתנה.
    - >-
      שכדאי לוותר על לקוחות פרטיים, כי חברה אחת שווה יותר ממאה לקוחות פרטיים בחג.
    - >-
      שהשוק לא מתאים לשוקולד בכלל, כי חברות עברו כמעט לגמרי למתנות דיגיטליות.
  correct: 1
  explanation: >-
    ממוצע שוק הוא הקשר, לא מחיר ולא תחזית. לפי המקורות יש מעבר למתנות דיגיטליות ולמתנות לבחירה,
    ותווי קנייה לרשתות מזון הוכפלו; מארז שוקולד מתחרה גם בהם, ולרוב הוא חלק ממארז גדול יותר.
- id: q5
  question: >-
    אתם שוקלים מנוי חודשי. איזו שאלה היא החשובה ביותר לכתוב כ"שאלה פתוחה" כבר עכשיו?
  options:
    - >-
      איך שולחים מארז שוקולד ביולי ובאוגוסט, ומה התנאים אם מארז הגיע נמס.
    - >-
      איזה צבע סרט מתאים לכל חודש, כדי שהמנויים ירגישו שהמארז השתנה.
    - >-
      כמה עוקבים צריך באינסטגרם לפני שמותר לפתוח מנוי חודשי בתשלום חוזר.
    - >-
      אם אפשר לשלוח את אותו מארז כל חודש, כי מנויים מעדיפים מוצר קבוע ומוכר.
  correct: 0
  explanation: >-
    במנוי המשלוח קורה גם בקיץ, וצריך תנאים כתובים מראש לחיוב, לביטול ולמשלוח שנמס. אלה שאלות
    למודולים 20 (משלוח ותנאים) ו־16 (רישוי), ולא שאלות של עיצוב.
