- id: q1
  question: >-
    לקוחה שואלת אם אפשר לכתוב "כשר למהדרין" על המארזים שלכם, כי כל חומרי הגלם בהכשר מהדרין. מה
    התשובה לפי מה שלמדנו?
  options:
    - >-
      כן, כי כשכל הרכיבים בהכשר מהדרין, גם המוצר הסופי נחשב כשר למהדרין בלי בדיקה נוספת.
    - >-
      כן, בתנאי שכותבים ליד גם את שמות הגופים המכשירים של כל אחד מחומרי הגלם במארז.
    - >-
      לא, כי בלי תעודת הכשר לאתר הייצור אסור לציין על מוצר שייצרתם שהוא כשר.
    - >-
      לא, כי "מהדרין" מותר רק למפעלים גדולים, ועסק קטן יכול לכתוב רק "כשר" רגיל.
  correct: 2
  explanation: >-
    לפי חוק איסור הונאה בכשרות (סעיף 4), יצרן לא יציין על מוצר או על אריזתו שהוא כשר בלי תעודת הכשר.
    רכיבים בהכשר הם תנאי, לא תחליף לתעודה. התהליך במודול 17; אם יש ספק, שואלים את הרב.
- id: q2
  question: >-
    שלוש נישות קיבלו ציון כולל דומה. לאחת מהן יש ביקוש ברור, אבל ציון 1 ב"הוכחה" (למשל "ללא אגוזים"
    במטבח משותף). מה עושים איתה?
  options:
    - >-
      בוחרים בה, כי ביקוש ברור הוא הקריטריון החשוב ביותר בבחירת נישה לעסק קטן.
    - >-
      לא בוחרים בה עכשיו, ורושמים מה חסר כדי שאפשר יהיה להוכיח את ההבטחה בכל מארז.
    - >-
      בוחרים בה, וכותבים על האריזה "ללא אגוזים" ובאותיות קטנות "עלול להכיל אגוזים".
    - >-
      בוחרים בה רק לחגים, כי בעונה קצרה הסיכון של מגע צולב קטן יותר מאשר כל השנה.
  correct: 1
  explanation: >-
    נישה היא הבטחה, וכשאי אפשר להוכיח אותה היא לא נבחרת עכשיו, גם עם ביקוש. "ללא" דורש בקרה שאין
    במטבח ביתי (14.3), ולא כותבים "ללא" ו"עלול להכיל" על אותו אלרגן.
- id: q3
  question: >-
    בחרתם בנישה "ללא סוכר" עם שוקולד ממותק במלטיטול. איזה משפט מתאים לדף המוצר?
  options:
    - >-
      "ממותק במלטיטול. צריכה מרובה עלולה לגרום לגזים ולשלשול; לא מתאים לילדים בכמות."
    - >-
      "מתאים לסוכרתיים ולשומרי משקל, כי אין בו סוכר בכלל ולא מעלה את הסוכר בדם."
    - >-
      "שוקולד בריא בלי סוכר, שאפשר לאכול ממנו בלי הגבלה, גם לילדים וגם למבוגרים."
    - >-
      "מכיל ממתיק טבעי בלבד, ולכן אין צורך באזהרה מיוחדת כמו בממתיקים מלאכותיים."
  correct: 0
  explanation: >-
    אסור לייחס למזון ריפוי או מניעת מחלה (סעיף 13 לחוק המזון), ולכן לא "מתאים לסוכרתיים" ולא "בריא".
    מלטיטול בכמות גורם לגזים ולשלשול ולא מתאים לילדים בכמות (13.2). את הנוסח "ללא סוכר" בודקים מול
    הכלל העדכני (13.5).
- id: q4
  question: >-
    במחקר השוק שלכם, כל שבע השורות מציעות מארזי חנוכה. מה הצעד הסביר אם בכל זאת רוצים נישה של חגים?
  options:
    - >-
      לוותר על חגים, כי שוק שכל המתחרים פעילים בו לא משאיר מקום לעסק חדש וקטן.
    - >-
      להוריד את המחיר מתחת לכל השורות במחקר, כי בחג הלקוח בוחר בעיקר לפי מחיר.
    - >-
      להוסיף עוד מוצרים לחנוכה, כדי שיהיה מגוון גדול יותר מכל אחד מהמתחרים בטבלה.
    - >-
      לחפש צירוף: חג עם נישה אחרת, כמו "מארזי חנוכה טבעוניים", או חג עם אזור משלוח.
  correct: 3
  explanation: >-
    חגים היא נישה של זמן, והיא משתלבת עם נישות של רכיב או של לקוח. כשהנישה עמוסה, מחפשים צירוף
    שאפשר להוכיח. המחיר נקבע מהעלות במודול 19, לא מהמתחרה הזול.
