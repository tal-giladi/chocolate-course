- id: q1
  question: >-
    עסק אחד מוכר מארז של 6 פרלינים ב־70 ₪, ועסק אחר מארז של 24 ב־155 ₪. איך משווים ביניהם בטבלת מחקר
    השוק?
  options:
    - >-
      משווים את מחירי המארזים כמו שהם, כי הלקוח משלם על מארז שלם ולא על פרלין בודד.
    - >-
      מחשבים ₪ לפרלין: 11.67 ₪ מול כ־6.46 ₪, ורושמים גם שהמארזים בגדלים שונים.
    - >-
      רושמים רק את המארז הזול, כי מחקר שוק נועד למצוא את המחיר הנמוך ביותר בשוק.
    - >-
      ממירים את שניהם למחיר למארז 12, בהנחה שכל עסק מוכר גם מארז 12 באותו יחס.
  correct: 1
  explanation: >-
    מחיר ליחידה הוא הדרך להשוות מארזים בגדלים שונים: 70 ÷ 6 = 11.67 ₪, ו־155 ÷ 24 = כ־6.46 ₪. רושמים
    גם את מספר היחידות, כי בתוך אותו עסק מארז גדול לרוב זול יותר ליחידה.
- id: q2
  question: >-
    בטבלה שלכם כתבתם על מתחרה: "אריזה זולה, נראה לא טרי". מה עושים?
  options:
    - >-
      משאירים, כי זה מידע חשוב שיעזור לכם להסביר ללקוחות למה המוצר שלכם טוב יותר.
    - >-
      מעבירים את ההערה לעמודת המסקנות, כדי שהיא לא תופיע ליד שם העסק בטבלה עצמה.
    - >-
      משאירים רק "אריזה זולה", כי על אריזה מותר לחוות דעה ועל טריות לא.
    - >-
      מוחקים ומחליפים בעובדה מהדף, למשל "מארז מעוצב, משקל לא צוין", עם תאריך.
  correct: 3
  explanation: >-
    במחקר רושמים רק מה שמופיע בדף ביום הבדיקה: מחיר, יחידות, אריזה כפי שהיא מתוארת, משלוח וכשרות.
    דעה על עסק אחר היא לא מידע, וגם לא הוגנת. מתחרים הם דוגמה ניטרלית, בלי ביקורת ובלי המלצה.
- id: q3
  question: >-
    מארז בדף של מתחרה עולה 40 ₪. העלות שלכם למארז דומה היא כ־15 ₪. מה המסקנה הנכונה?
  options:
    - >-
      שמחיר המתחרה כולל מע"מ, עבודה, אריזה ועמלות, ולכן הוא לא העלות שלו ולא המחיר שלכם.
    - >-
      שהמתחרה מרוויח כ־25 ₪ על כל מארז, ולכן גם אתם תרוויחו כך אם תמכרו באותו מחיר.
    - >-
      שכדאי לתמחר ב־39 ₪, שקל מתחת למתחרה, כדי שהלקוחות יבחרו בכם ולא בו.
    - >-
      שהעלות שחישבתם שגויה, כי עסק לא יכול למכור מארז בפחות מפי שלושה מהעלות.
  correct: 0
  explanation: >-
    מחיר בשוק הוא מחיר לצרכן, כולל מע"מ של 18% אצל עוסק מורשה, עבודה, משלוח ועמלות. הוא לא מגלה את
    העלות של המתחרה. את המחיר שלכם קובעים מהעלות המלאה שלכם במודול 19.
- id: q4
  question: >-
    בדף של עסק באפליקציית משלוחים כתוב "הכשרות באחריות בית העסק בלבד", ואין שם של הכשר. מה רושמים
    בעמודת הכשרות?
  options:
    - >-
      "כשר", כי אפליקציית משלוחים לא הייתה מציגה עסק שאינו כשר בקטגוריה של מתוקים.
    - >-
      "לא כשר", כי אם היה הכשר העסק היה כותב את שם הגוף המכשיר בדף בצורה ברורה.
    - >-
      את המשפט כמו שהוא, ושלא צוין גוף מכשיר בדף, בלי להסיק מזה דבר לכאן או לכאן.
    - >-
      משאירים ריק, כי כשרות היא לא חלק ממחקר שוק אלא נושא נפרד של מודול 17.
  correct: 2
  explanation: >-
    כשרות במחקר מעתיקים מהדף כמו שהיא כתובה, או "לא צוין". המחקר לא קובע מה כשר, הוא אוסף מה הלקוח
    רואה. אם יש ספק לגבי מוצר מסוים, שואלים את הרב.
- id: q5
  question: >-
    באמצע נובמבר אתם ממלאים טבלת עונתיות. איך בודקים את ההערכה שלכם שהביקוש בחנוכה "גבוה"?
  options:
    - >-
      שואלים בקבוצת פייסבוק כמה אנשים מתכננים לקנות שוקולד בחנוכה, ומסיקים מהתשובות.
    - >-
      חוזרים לאותם דפים לפני החג ורושמים מה השתנה: קטגוריות חג, מוצרים חדשים, מבצעים, "אזל".
    - >-
      מעתיקים את הערכת הביקוש מהטבלה בשיעור, כי היא מבוססת על נתוני מכירות של עסקים.
    - >-
      מחכים לסוף החג ובודקים כמה מארזים מכרתם, כי רק מכירות אמיתיות הן נתון אמין.
  correct: 1
  explanation: >-
    הביקוש בטבלה הוא הערכה, ומסמנים אותו ככזה. דרך פשוטה לבדוק אותה היא לחזור לאותם דפים לפני כל חג
    ולרשום מה השתנה. הטבלה בשיעור היא גם הערכה, לא נתוני מכירות.
