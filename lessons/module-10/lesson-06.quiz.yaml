- id: q1
  question: >-
    בת מצווה של 50 אורחים, שולחן מתוקים עם עוגות, ושוקולד כאחד הקינוחים. כמה יחידות שוקולד של 10 גרם
    מתכננים לשולחן?
  options:
    - >-
      50 יחידות, אחת לכל אורח, כי עם עוגות על השולחן אף אחד לא לוקח יותר מאחת.
    - >-
      250 יחידות, חמש לאורח, כי שוקולד הוא הקינוח הראשון שנגמר בכל אירוע.
    - >-
      כ־165 יחידות: 2-3 לאורח (150) ועוד 10% רזרבה לשבירה ולאורחים שלא נרשמו.
    - >-
      כ־100 יחידות, שתיים לאורח, בלי רזרבה, כדי שלא יישאר שוקולד אחרי האירוע.
  correct: 2
  explanation: >-
    לצד קינוחים אחרים אורחים טועמים 2-3 יחידות; 4-5 כשהשוקולד לבד. רזרבה של 10% מכסה שבירה ואורחים
    נוספים, ומה שנשאר נמסר למזמינים או נאכל.
- id: q2
  question: >-
    אירוע בגינה באוגוסט, ארבע שעות בחוץ. המזמינה רוצה טראפלס שמנת ותותים מטובלים "על כל השולחן מההתחלה".
    מה ממליצים?
  options:
    - >-
      להוציא הכול מהמקרר ממש לפני האירוע, כי שוקולד קר מחזיק את עצמו לפחות שלוש שעות בחוץ.
    - >-
      להגיש הכול כמבוקש, ולזרוק בסוף רק את מה שנראה נמס או מוכתם לעין.
    - >-
      לשים את הטראפלס והתותים ישר על קרחונים בשולחן, כדי שיישארו קרים כל הערב.
    - >-
      לוותר על מוצרים רגישים בחוץ בקיץ, ולהגיש מוצקים בגלים מקופסה מבודדת בצל.
  correct: 3
  explanation: >-
    טראפלס שמנת ופירות מטובלים הם מזון רגיש: שעתיים בחוץ, ושעה מעל 32°C, גם אם נראים טוב. מקרר וקרחון
    ישיר מוסיפים עיבוי. מוצקים בגלים נשארים יפים ובטוחים.
- id: q3
  question: >-
    הוצאתם מגש בונבונים קר מהמקרר לאולם חם, ותוך כמה דקות הופיעו טיפות ואחר כך כתמים לבנים. מה היה עדיף?
  options:
    - >-
      להביא את הבונבונים בקופסה סגורה, ולפתוח אותה רק אחרי שהתחממה מעט באולם.
    - >-
      להכניס את הבונבונים למקפיא במקום למקרר, כדי שיחזיקו יותר זמן בחוץ.
    - >-
      לרסס את הבונבונים בחמאת קקאו לפני האירוע, כדי שהלחות לא תיגע בהם.
    - >-
      להגיש אותם על קרחון עטוף במגבת לחה, כדי שהטמפרטורה לא תשתנה בבת אחת.
  correct: 0
  explanation: >-
    לחות מהאוויר מתעבה על שוקולד קר, ולפי Callebaut עיבוי וזעזועי טמפרטורה גורמים לפריחת סוכר. קופסה
    סגורה מאפשרת לשוקולד להתחמם בלי שהלחות תגיע אליו. מקפיא ומגבת לחה מחמירים.
- id: q4
  question: >-
    משפחה מזמינה מזכרות שוקולד חלב לחתונה, והארוחה בשרית באולם עם תעודת כשרות. מה עושים קודם?
  options:
    - >-
      מייצרים כמבוקש, כי מזכרת ארוזה נלקחת הביתה ולכן לא נוגעת בכשרות של הארוחה.
    - >-
      שואלים את המשפחה והאולם על מוצרים מבחוץ, ומציעים מריר פרווה.
    - >-
      מחליפים לשוקולד לבן, כי בשוקולד לבן אין מוצקי קקאו ולכן הוא נחשב פרווה.
    - >-
      מוסיפים למדבקה "כשר" כללי, כדי שהמשגיח באולם יאשר את המזכרות בכניסה.
  correct: 1
  explanation: >-
    בארוחה בשרית מוצר חלבי לא מתאים לשולחן, ואולם עם תעודה יכול להגביל מוצרים מבחוץ, ולכן שואלים לפני
    הייצור. שוקולד לבן מכיל חלב. "כשר" בלי תעודה אסור לכתוב (מודול 17).
- id: q5
  question: >-
    במבחן החום, טבלה לא ארוזה על צלחת כהה ליד חלון התחילה להימרח אחרי 20 דקות, והטבלה הארוזה אחרי 40.
    איך זה משנה את תוכנית ההגשה?
  options:
    - >-
      שום דבר, כי באירוע אמיתי יש מזגן ותמיד יהיה קריר יותר מאשר ליד החלון בבית.
    - >-
      מגישים הכול ארוז בצלופן, כי האריזה מכפילה את הזמן ומונעת המסה לגמרי.
    - >-
      מגישים על צלחות כהות יותר, כי הן מסתירות את הכתמים כשהשוקולד מתחיל להימרח.
    - >-
      גלים קצרים מ־20 דקות במקום חם, צל ומגש בהיר, ואריזה למזכרות שמחכות לאורך זמן.
  correct: 3
  explanation: >-
    המבחן נותן מספר: כמה זמן שוקולד חשוף שורד במקום הזה. הגלים קצרים ממנו. משטח כהה בשמש מתחמם יותר.
    אריזה עוזרת למזכרות, אבל לא עוצרת המסה.
