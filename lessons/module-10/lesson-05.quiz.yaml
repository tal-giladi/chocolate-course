- id: q1
  question: >-
    חבר רוצה גנאש "עם הרבה טעם דבש", ומציע להחליף את כל השמנת בדבש. מה הבעיה העיקרית?
  options:
    - >-
      דבש מתגבש בטמפרטורה של 28°C, ולכן אי אפשר יהיה לזלף את הגנאש לקליפות.
    - >-
      בלי השמנת אין אמולסיה של גנאש: המילוי יוצא סמיך ודביק, קשה לזלף ומתוק מדי.
    - >-
      דבש מכיל אנזימים שמפרקים את חמאת הקקאו, ולכן הקליפה תימס מבפנים תוך יום.
    - >-
      דבש מעלה את פעילות המים, ולכן הבונבון יתקלקל מהר יותר מגנאש עם שמנת.
  correct: 1
  explanation: >-
    גנאש הוא אמולסיה שהשמנת מביאה לה מים ושומן. דבש בכמות קטנה (כ־6% אצל Callebaut) מוסיף טעם ומוריד
    פעילות מים; במקום השמנת הוא נותן מילוי דביק ומתוק מדי. לדבש aw נמוך, לא גבוה.
- id: q2
  question: >-
    רציתם טעם תפוח חזק, וקצצתם לגנאש תפוח טרי. אחרי שלושה ימים בקופסה יש טיפות על המכסים וריח חמוץ. מה
    קרה, ומה עושים בפעם הבאה?
  options:
    - >-
      תפוח טרי הוסיף מים חופשיים והעלה את פעילות המים; בפעם הבאה תפוח מיובש או אבקת תפוח.
    - >-
      הקינמון הגיב עם החומצה של התפוח; בפעם הבאה מוותרים על הקינמון כשיש פרי.
    - >-
      השוקולד במכסה לא היה מטומפר; בפעם הבאה בודקים בסכין לפני הסגירה.
    - >-
      הדבש התסיס את התפוח; בפעם הבאה מחליפים את הדבש בסוכר לבן באותה כמות.
  correct: 0
  explanation: >-
    פרי טרי הוא ברובו מים, ובתוך גנאש הוא מקצר את חיי המדף לימים. תפוח מיובש נותן טעם בלי מים
    חופשיים. ריח חמוץ אומר קלקול: לא טועמים.
- id: q3
  question: >-
    אתם מוזמנים לארוחת ערב חג בשרית ורוצים להביא בונבונים. מה מתאים לבקשה של מארחים ששומרים כשרות?
  options:
    - >-
      בונבונים בגנאש שמנת, כי אחרי הארוחה מחכים כמה שעות בכל מקרה ואז אפשר לאכול חלבי.
    - >-
      בונבונים בגנאש שמנת עם קליפה מריר פרווה, כי הקליפה היא מה שנוגע בשולחן.
    - >-
      בונבונים בגנאש חלב בלי חמאה, כי החמאה היא הרכיב החלבי היחיד במתכון.
    - >-
      גרסה פרווה: מריר פרווה, קרם קוקוס במקום שמנת ושמן קוקוס במקום חמאה, כולם מסומנים פרווה.
  correct: 3
  explanation: >-
    שמנת וחמאה הופכות את הבונבון לחלבי, וגם שוקולד חלב חלבי. לארוחה בשרית מביאים מוצר שכל רכיביו
    מסומנים פרווה בהכשר שהמארחים סומכים עליו, וכותבים את זה במדבקה.
- id: q4
  question: >-
    איך הכי נכון לשלב רימונים טריים במתנה שמוסרים למארחים ביום חמישי לפני החג?
  options:
    - >-
      לפזר גרגרי רימון על טבלת מריר ולארוז אותה בקופסה סגורה יחד עם הבונבונים.
    - >-
      למלא בונבונים בגרגרי רימון במקום גנאש, כי הקליפה סוגרת אותם מהאוויר.
    - >-
      לא לארוז פרי טרי; לתת בונבונים בצבע רימון, ואת טבלת הרימונים הטריים להגיש ביום ההגשה.
    - >-
      לייבש את הגרגרים בתנור חם שעה ואז לטבול אותם בשוקולד לפני האריזה.
  correct: 2
  explanation: >-
    גרגרי רימון טריים הם פרי רטוב ומזון רגיש: על שוקולד הם משאירים מיץ ופריחת סוכר, ובחוץ מחזיקים
    שעתיים. הצבע מחזיק כמו הבונבון; הפרי הטרי נכנס רק ביום ההגשה.
- id: q5
  question: >-
    ראש השנה מתחיל ביום שישי בערב ונמשך עד מוצאי שבת. מתי סוגרים את הבונבונים, אם רוצים למסור אותם
    ביום חמישי?
  options:
    - >-
      בסביבות שבת־ראשון שלפני, כדי שהקליפות, הגנאש והלילה של המנוחה ייכנסו בנחת עד המסירה.
    - >-
      ביום חמישי בבוקר, כי בונבון שנסגר באותו יום הוא הטרי ביותר והטעים ביותר.
    - >-
      שלושה שבועות לפני, כי בונבוני גנאש מחזיקים חודשים בקופסה סגורה בחדר.
    - >-
      במוצאי החג, כי בתוך שלושת ימי החג ממילא לא אוכלים בונבונים.
  correct: 0
  explanation: >-
    בונבון גנאש צריך יום לקליפות ולמילוי, לילה של מנוחה ויום לסגירה, ומחזיק עד כשבועיים בקריר. סגירה
    4-5 ימים לפני משאירה מרווח לתקלה, בלי לבזבז חיי מדף.
