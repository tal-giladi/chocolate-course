- id: q1
  question: >-
    היום 10 בנובמבר, ואתם רוצים לתת בחנוכה (4 בדצמבר) עשרה מארזים עם מטבעות, חנוכייה וסביבונים
    מתבנית שעוד לא הזמנתם מחו"ל. מה הסדר הנכון?
  options:
    - >-
      לחכות לתבנית, ואז להכין את כל המוצרים יחד בשבוע האחרון כדי שהכול יהיה טרי באותה מידה.
    - >-
      להכין עכשיו מטבעות וחנוכיות שמחזיקים שבועות, ולסביבונים לתכנן הרכבה מחלקים אם התבנית לא תגיע.
    - >-
      להכין את הכול כבר השבוע ולשמור במקרר עד חנוכה, כי שוקולד במקרר מחזיק הכי הרבה זמן.
    - >-
      לוותר על הסביבונים השנה, כי בלי תבנית סביבון אי אפשר לקבל צורה שנראית כמו סביבון.
  correct: 1
  explanation: >-
    שוקולד מוצק ומטומפר מחזיק שבועות ב־18-20°C קבוע, ולכן מכינים אותו מוקדם. תבנית מחו"ל מזמינים
    כחודשיים לפני, ובלעדיה בונים סביבון מחלקים כמו ב־08.2. מקרר מוסיף עיבוי, לא חיי מדף.
- id: q2
  question: >-
    חתכתם את בסיס החנוכייה על האצטט, ואחרי דקה ראיתם שהחתך "נסגר" והשוקולד התחבר מחדש. מה קרה ומה
    עושים?
  options:
    - >-
      השוקולד לא טומפר, ולכן צריך להמיס הכול ולטמפר מחדש לפני שמנסים לחתוך שוב.
    - >-
      הסכין הייתה חמה מדי, ולכן צריך לקרר אותה במים קרים ולחתוך מיד שוב באותו מקום.
    - >-
      האצטט היה דק מדי, ולכן צריך להעביר את הטבלה לתבנית ולהמשיך שם את החיתוך.
    - >-
      חתכתם מוקדם מדי, כשהשוקולד עוד נוזלי; מחכים עוד 2-3 דקות וחותכים שוב באותו קו.
  correct: 3
  explanation: >-
    חותכים כשהשוקולד עמום ויבש למגע אבל עוד נכנע לאצבע. מוקדם מדי הוא זורם ונסגר, מאוחר מדי הוא
    נשבר. סכין מקררים במים רק אם מייבשים אותה לגמרי.
- id: q3
  question: >-
    שכנה מבקשת חנוכיית שוקולד "שאפשר להדליק עליה נרות קטנים בערב הראשון". מה עונים?
  options:
    - >-
      שזו חנוכייה לאכילה ולקישוט בלבד, כי שוקולד נמס בערך מ־34°C ונר דולק עלול ליפול.
    - >-
      שאפשר, אם משתמשים בשוקולד מריר 70% שנקודת ההתכה שלו גבוהה בהרבה משל חלב.
    - >-
      שאפשר, בתנאי שהחנוכייה עומדת במקרר עד רגע ההדלקה ומכבים את הנרות אחרי עשר דקות.
    - >-
      שאפשר, אם מוסיפים לבסיס שכבה עבה של שוקולד לבן שמבודדת את החום מהנרות.
  correct: 0
  explanation: >-
    חמאת הקקאו בכל סוגי השוקולד נמסה סביב גוף האדם, ולהבה קרובה ממיסה את הנר ואת נקודת הדבק. החנוכייה
    לשולחן ולאכילה; את הנרות מדליקים בחנוכייה רגילה.
- id: q4
  question: >-
    החנוכייה עברה את כל הבדיקות, אבל שני נרות נוטים מעט אחרי שהוספתם להבות לבנות. מה הסיבה הסבירה?
  options:
    - >-
      הלבן התקשה מהר מדי ומשך את הנר בזמן ההתכווצות, ולכן צריך להבות ממריר בלבד.
    - >-
      הנרות זולפו דקים מדי ולכן התרככו מהחום של היד בזמן ההדבקה של הלהבות.
    - >-
      הטיפות היו גדולות וכבדות מדי לראש של נר בעובי 7-8 מ"מ; מזלפים טיפה בגודל עדשה.
    - >-
      הבסיס היה עבה מדי, ולכן הנרות לא יכלו לשקוע לתוכו ונשארו עומדים בזווית.
  correct: 2
  explanation: >-
    טיפה כבדה על ראש נר צר מטה אותו לפני שהדבק בתחתית התקשה לגמרי. טיפה קטנה, פתח קטן בשקית, ומנוחה
    בלי לגעת.
- id: q5
  question: >-
    נשארו לכם שוליים מהבסיס, שני נרות עקומים ושלושה נרות עם להבה צבועה. מה עושים עם כל אחד?
  options:
    - >-
      ממיסים הכול יחד באותה קערה, כי הצבע בכמות קטנה לא משנה את השוקולד.
    - >-
      שוליים ונרות עקומים חוזרים להמסה; נרות עם להבה צבועה הולכים לשוקו או ל־bark.
    - >-
      שומרים הכול בשקית אחת למארז "שברים" שמוכרים בזול בחנוכה הבא.
    - >-
      זורקים את הנרות עם הצבע, כי צבע מסיס שומן לא מתאים לחימום חוזר.
  correct: 1
  explanation: >-
    שוקולד נקי מאותו מוצר חוזר להמסה. חלקים עם צבע או קישוט לא נכנסים לשוקולד הנקי, אבל הם אכילים
    לגמרי בשוקו, בטבלה או בעוגה. שוקולד לשנה הבאה כבר לא באותה איכות.
