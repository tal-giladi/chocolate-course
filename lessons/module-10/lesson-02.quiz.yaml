- id: q1
  question: >-
    הוצאתם תמרים ממולאים מהמקרר וטבלתם אותם מיד. אחרי שעה הופיעו על השוקולד טיפות וכתמים לבנים. מה
    קרה?
  options:
    - >-
      השוקולד לא היה מטומפר, ולכן הוא נמס על התמרים והפריד את חמאת הקקאו החוצה.
    - >-
      המילוי של הטחינה דלף החוצה, והשמן שלו עלה דרך השוקולד ויצר את הכתמים.
    - >-
      התמרים הקרים "הזיעו" בחדר; העיבוי פגע בשוקולד ויצר פריחת סוכר.
    - >-
      התמרים היו יבשים מדי, ומשכו את הלחות מהשוקולד עד שהוא הלבין מבחוץ.
  correct: 2
  explanation: >-
    פרי קר שיוצא לחדר מעבה עליו לחות מהאוויר, כמו התות ב־02.2. מים על פני השוקולד ממיסים סוכר שמתגבש
    מחדש בכתמים. טובלים תמרים בטמפרטורת החדר ויבשים.
- id: q2
  question: >-
    חברה רוצה להכין 40 תמרים ממולאים לט"ו בשבט כבר שלושה שבועות לפני, "כי זה פרי יבש ולא מתקלקל".
    מה אומרים לה?
  options:
    - >-
      שתמר עם כ־21% מים מחזיק ימים עד כשבוע; טבלה אפשר מוקדם, את התמרים 1-4 ימים לפני.
    - >-
      שאין בעיה, כי השוקולד אוטם את התמר לגמרי ושום עובש לא יכול לגדול מתחתיו.
    - >-
      שאין בעיה אם שומרים אותם במקפיא, ומוציאים אותם ישר לחדר בבוקר של החג.
    - >-
      שמותר רק אם הם במקרר כל הזמן, כי תמר ממולא הוא מוצר רגיש כמו תות מטובל.
  correct: 0
  explanation: >-
    פעילות המים של תמר נמוכה מסף החיידקים (0.85), אבל לא מסף העובשים והשמרים, ומילוי אגוזים מאיץ פריחת
    שומן. מקפיא ומקרר מוסיפים עיבוי בהוצאה, ותמר עם אגוז הוא לא מזון רגיש כמו פרי טרי.
- id: q3
  question: >-
    השוקולד מחליק מהתמרים הממולאים בטחינה ונפרד מהם, ובתמרים עם השקד הוא נצמד יפה. מה הסיבה הסבירה?
  options:
    - >-
      טחינה מקררת את התמר מבפנים, ולכן השוקולד מתקשה עליו מהר מדי ונסדק.
    - >-
      הטחינה הופכת את התמר לכבד יותר, והשוקולד לא מחזיק את המשקל בזמן ההתקשות.
    - >-
      השוקולד היה חם מדי, ולכן הוא זרם מהתמרים הרכים ונשאר רק על הקשים.
    - >-
      שמן מהטחינה נמרח על קליפת התמר, ושוקולד לא נצמד למשטח שמנוני; מנגבים לפני הטבילה.
  correct: 3
  explanation: >-
    שכבת שמן בין התמר לשוקולד מונעת הצמדה. ממלאים בזהירות, סוגרים, ומנגבים כל תמר בנייר לפני הטבילה.
    אם השוקולד היה חם מדי, כל התמרים היו מושפעים, לא רק אלה עם הטחינה.
- id: q4
  question: >-
    איזה פריט לא מתאים למארז ט"ו בשבט שמחלקים ביום שישי לכמה משפחות, שיאכלו במשך השבת?
  options:
    - >-
      טבלת שוקולד מריר עם תאנים, משמש ושקדים שהוכנה לפני שבוע ונשמרה בקופסה סגורה.
    - >-
      תמרים ממולאים בגבינת שמנת וטבולים בשוקולד, שהוכנו בבוקר.
    - >-
      תמרים ממולאים במרציפן וטבולים במריר, שהוכנו יומיים לפני.
    - >-
      תמרים ממולאים בשקד, טבולים עד חציים ומקושטים בפתית מלח, שהוכנו ביום חמישי.
  correct: 1
  explanation: >-
    מילוי גבינה או שמנת הופך את התמר למזון רגיש שצריך מקרר, ושעתיים לכל היותר מחוצה לו. מארז שמחזיקים
    בבית יום־יומיים בחדר בנוי רק ממוצרים יבשים.
- id: q5
  question: >-
    באריזת המשמשים המיובשים כתוב "מכיל סולפיטים". מה עושים במארז?
  options:
    - >-
      לא כותבים, כי סולפיטים הם חומר משמר ולא אלרגן, ובכמות קטנה הם לא משנים.
    - >-
      מוותרים על המשמש, כי סולפיטים אסורים במוצרי שוקולד ביתיים שנותנים במתנה.
    - >-
      שוטפים את המשמש במים חמים כדי להסיר את הסולפיטים ומייבשים לפני השימוש.
    - >-
      כותבים "סולפיטים" במדבקה לצד האגוזים, השומשום, הסויה והחלב.
  correct: 3
  explanation: >-
    מה שכתוב על אריזות הרכיבים עובר למדבקה של המארז, כי מי שרגיש צריך לדעת. שטיפה מוסיפה מים שתופסים
    את השוקולד ולא מבטיחה כלום.
