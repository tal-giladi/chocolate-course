- id: q1
  question: >-
    אתם מכינים 15 משלוחי מנות שהילדים יחלקו מ־9 בבוקר עד הצהריים. איזה פריט מתאים הכי פחות?
  options:
    - >-
      מנדיאנטים ממריר עם שקדים וחמוציות, ארוזים בשקית צלופן קטנה וסגורה.
    - >-
      לוליפופ מסכה משוקולד חלב מטומפר, בשקית שטוחה עם סרט.
    - >-
      נוגט שקדים עטוף ביחידות, עם מדבקה שכתוב בה "אגוזים" ו"ביצים".
    - >-
      טראפלס גנאש שמנת מגולגלים בקקאו, בקופסה קטנה עם מדבקה.
  correct: 3
  explanation: >-
    גנאש שמנת הוא מזון רגיש (aw כ־0.85-0.88) שלא נשאר מחוץ למקרר יותר משעתיים, והוא גם נמס ומלכלך.
    שוקולד מוצק, מנדיאנטים ונוגט בטוחים בטמפרטורת החדר.
- id: q2
  question: >-
    משלוח המנות שלכם כולל תפוז, עוגיות חמות מהתנור ומסכת שוקולד. בערב השוקולד דביק ומוכתם בלבן. מה
    קרה?
  options:
    - >-
      העוגיות החמות חיממו את השוקולד מעל 34°C, והוא איבד טמפר ונמס בתוך השקית.
    - >-
      לחות מהתפוז ומהעוגיות החמות התעבתה על השוקולד וגרמה לפריחת סוכר.
    - >-
      שוקולד מסכה דק נוטה להלבין תמיד אחרי כמה שעות, בלי קשר לשקית.
    - >-
      ריח התפוז נספג בשוקולד, ושמני ההדרים גרמו לחמאת הקקאו לעלות לפני השטח.
  correct: 1
  explanation: >-
    שקית משותפת היא שקית לחה. לחות על שוקולד ממיסה סוכר שמתגבש מחדש בכתמים ומשאירה פני שטח דביקים.
    לכן השוקולד באריזה פנימית סגורה, ועוגות מכניסים רק אחרי שהתקררו לגמרי.
- id: q3
  question: >-
    אמא של ילד שקיבל ממכם משלוח שואלת בטלפון אם יש בו בוטנים. במריר שהשתמשתם כתוב "עלול להכיל בוטנים",
    ובמדבקה כתבתם רק "אגוזים". מה עונים?
  options:
    - >-
      שאין בוטנים, כי לא הוספתם בוטנים, ו"עלול להכיל" הוא רק כיסוי משפטי של היצרן.
    - >-
      שיש מעט בוטנים, כי "עלול להכיל" אומר שתמיד יש כמות קטנה בכל שוקולד.
    - >-
      שהיצרן כתב "עלול להכיל בוטנים", ולכן לא לתת לילד אלרגי.
    - >-
      שאם הילד אכל בעבר שוקולד מריר בלי בעיה, אין סיבה לדאוג מהמשלוח הזה.
  correct: 2
  explanation: >-
    "עלול להכיל" אומר שהיצרן לא יכול להבטיח היעדר. מי שאלרגי מחליט לפי זה, ולכן זה עובר למדבקה כמו
    שכתוב. לא מנחשים ולא מקטינים.
- id: q4
  question: >-
    מתי הכי נכון להכין את המסכות והמנדיאנטים לפורים שיוצא ביום שלישי?
  options:
    - >-
      כשבוע לפני, לשמור בקופסה סגורה ב־18-20°C, ולארוז ערב לפני.
    - >-
      בבוקר של פורים, כי שוקולד טרי מהטמפרור הוא הכי מבריק ובטוח.
    - >-
      חודש לפני, ולשמור במקרר עד בוקר פורים כדי שלא יתרכך.
    - >-
      יומיים לפני, ולארוז מיד כשהשוקולד עוד חמים כדי שיתקבע בשקית.
  correct: 0
  explanation: >-
    שוקולד מוצק ומנדיאנטים מחזיקים שבועות בטמפרטורה קבועה, ולכן מכינים מוקדם ומשאירים את הערב האחרון
    לאריזה ולמדבקות. מקרר מוסיף עיבוי בהוצאה, ושקית סגורה על שוקולד חמים מעבה לחות.
- id: q5
  question: >-
    שכנה שואלת אם שני פריטים משוקולד (מסכה ומנדיאנטים) נחשבים "שני סוגי מאכל" למצוות משלוח מנות. מה
    עונים?
  options:
    - >-
      שזו שאלה הלכתית לרב; מבחינת האוכל, שניהם מוכנים לאכילה ובטוחים יום בחוץ.
    - >-
      שכן, כי מנדיאנטים כוללים פירות יבשים ואגוזים, ולכן הם בוודאות סוג אחר.
    - >-
      שלא, ולכן תמיד צריך להוסיף פרי טרי או מאפה למשלוח כדי שיהיה כשר למצווה.
    - >-
      שכן, כל עוד הם ארוזים בשתי שקיות נפרדות ויש מדבקה נפרדת לכל אחד.
  correct: 0
  explanation: >-
    הקורס לא פוסק הלכה. מה שהשיעור יודע לענות הוא מבחינת בטיחות ואחסון; את ההגדרה ההלכתית שואלים את
    הרב.
