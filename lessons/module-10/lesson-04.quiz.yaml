- id: q1
  question: >-
    לקוחה שלא אוכלת קטניות בפסח מבקשת מארז. על השוקולד שקניתם כתוב "כשר לפסח", וברכיבים "לציטין
    סויה". מה עושים?
  options:
    - >-
      אומרים לה מה כתוב על האריזה, ומחפשים שוקולד שמסומן "ללא קטניות" או שהיא תשאל את הרב.
    - >-
      מכינים את המארז, כי "כשר לפסח" כבר כולל את כל המנהגים ולא צריך לבדוק יותר.
    - >-
      מכינים את המארז, כי לציטין הוא חומר בכמות קטנה מאוד ולכן לא נחשב לשום מנהג.
    - >-
      מסרבים, כי אין שוקולד בעולם בלי לציטין סויה, ולכן אין לה מה לאכול בפסח.
  correct: 0
  explanation: >-
    לציטין סויה נמנה בין מוצרי הקטניות אצל הנוהגים, ו"כשר לפסח" לבד לא אומר "ללא קטניות". הקורס לא
    פוסק: מעבירים את המידע מהאריזה, ומי שנוהג מחפש סימון מתאים או שואל.
- id: q2
  question: >-
    בכל השנה אתם שמים גלוקוזה בקרמל כדי שלא יתגבש. בפסח אין לכם גלוקוזה כשרה לפסח. מה החלופה שעובדת
    על אותו עיקרון?
  options:
    - >-
      להוסיף קמח תפוחי אדמה, כי עמילן מסמיך את הסירופ ולכן הסוכר לא יכול להתגבש.
    - >-
      לבשל לטמפרטורה נמוכה יותר, כי גבישים נוצרים רק מעל 150°C בסירופ סוכר.
    - >-
      דבש כשר לפסח או מעט מיץ לימון, שמוסיפים לסיר סוכרים אחרים שמפריעים לגבישים.
    - >-
      לערבב כל הזמן עד הסוף, כדי שהגבישים יישברו לפני שהם מספיקים לגדול.
  correct: 2
  explanation: >-
    גלוקוזה ודבש הם סוכרים אחרים שנכנסים בין מולקולות הסוכר; חומצה מפרקת חלק מהסוכר ויוצרת אותם בתוך
    הסיר. ערבוב דווקא מעודד התגבשות, ועמילן לא עושה את העבודה הזו.
- id: q3
  question: >-
    הטופי לפסח התגבש בסיר לחול לבן אחרי שגירדתם את הדפנות במרית. מה הצעד הנכון עכשיו?
  options:
    - >-
      לזרוק ולהתחיל מחדש, כי סוכר שהתגבש לא חוזר להיות חלק בשום דרך.
    - >-
      להוסיף כף מים, להמיס מחדש על אש נמוכה, ולבשל שוב בלי לערבב ובלי לגרד.
    - >-
      להוסיף עוד חמאה קרה בבת אחת, כי השומן ממיס את הגבישים בתוך הסיר.
    - >-
      להעלות את האש לגבוהה ולבשל עד שהגבישים יישרפו וייעלמו לבד.
  correct: 1
  explanation: >-
    מים ממיסים את הגבישים בחזרה לסירופ, ואז מבשלים שוב עם הכללים: בלי ערבוב, בלי גבישים מהדפנות.
    חמאה קרה בבת אחת מפרידה את הטופי, ואש חזקה שורפת אותו.
- id: q4
  question: >-
    בנובמבר בדקתם באתר חנות, ולא מצאתם קוברטורה עם "כשר לפסח ללא קטניות". מה המסקנה הנכונה?
  options:
    - >-
      שאין כזו בישראל, ולכן לא מציעים מארזי פסח למי שלא אוכל קטניות.
    - >-
      שאפשר לקנות את הקוברטורה הרגילה, כי בחורף הכשר כל השנה תקף גם לפסח.
    - >-
      שצריך להזמין מחו"ל כבר עכשיו, כי מוצרי פסח לא נמכרים בחנויות בישראל.
    - >-
      שמוצרי פסח מגיעים קרוב לחג: בודקים שוב 4-6 שבועות לפני, ושואלים את החנויות בטלפון.
  correct: 3
  explanation: >-
    בדיקה מחוץ לעונה לא מראה את מלאי הפסח. מתכננים לבדוק שוב חודש־חודש וחצי לפני, ולוקחים בחשבון
    שמוצרים אוזלים. הכשר של כל השנה לא תקף לפסח.
- id: q5
  question: >-
    מתכון עוגת שוקולד לפסח דורש "כפית אבקת אפייה" ו"כף קורנפלור". מה מחליפים?
  options:
    - >-
      שני הרכיבים מחליפים בסודה לשתייה, כי היא גם מתפיחה וגם מסמיכה.
    - >-
      את שניהם מחליפים בקמח מצה, כי הוא כשר לפסח ומחליף כל אבקה.
    - >-
      קורנפלור בקמח תפוחי אדמה; אבקת אפייה רק אם יש עליה הכשר לפסח.
    - >-
      לא מחליפים, כי בכמות של כפית האבקות האלה לא משנות את הכשרות של העוגה.
  correct: 2
  explanation: >-
    קורנפלור הוא עמילן תירס (קטניות), וקמח תפוחי אדמה מסמיך דומה. אבקת אפייה צריכה הכשר לפסח, כי רובה
    עם עמילן תירס. קמח מצה הוא לא תחליף למי שלא אוכל מצה שרויה, וסודה לא מסמיכה.
