- id: q1
  question: >-
    הכנתם קרמל קוקוס לפי 07.1, ואחרי הבישול ל־105°C יש עליו שכבת שמן צהובה. מה עושים?
  options:
    - >-
      זורקים ומתחילים מחדש, כי קרמל שנפרד לא חוזר להיות אחיד.
    - >-
      ממשיכים לבשל עד 120°C, כדי שהשמן יתאדה יחד עם המים העודפים.
    - >-
      מערבלים 20-30 שניות בבלנדר מוט, כי קרם קוקוס נפרד ברתיחה ומתחבר בחזרה.
    - >-
      מוסיפים כף שמנת מתוקה, כי חלבון החלב מחבר את השומן בחזרה לקרמל.
  correct: 2
  explanation: >-
    קרם קוקוס נפרד בעמידה ומתחיל להיקרש מעל כ־80°C, ובקרמל הוא רותח. בלנדר מוט מחזיר את האמולסיה.
    בישול נוסף מקשה את הקרמל, ושמנת הופכת אותו לחלבי ולא טבעוני.
- id: q2
  question: >-
    למה מילוי של טחינה ומריר בלי מים מחזיק שבועות בחדר קריר, כשקרמל קוקוס וגנאש קוקוס לא?
  options:
    - >-
      כי השומשום מכיל חומר משמר טבעי שמונע עובש, גם כשיש במילוי מים.
    - >-
      כי במילוי כמעט אין מים, ולכן פעילות המים נמוכה כמו בפרלינה וג'יאנדוז'ה.
    - >-
      כי הטחינה מתגבשת כמו חמאת קקאו בצורה V ונועלת את המילוי.
    - >-
      כי אבקת הסוכר במילוי קושרת את כל השומן ולכן הוא לא מתחמצן.
  correct: 1
  explanation: >-
    הבעיה בגנאש ובקרמל רך היא המים הזמינים. מילוי של שוקולד ושומן בלי מים קרוב לג'יאנדוז'ה, והסיכון שלו
    הוא נדידת שומן לקליפה ולא עובש.
- id: q3
  question: >-
    במארז טבעוני יש בונבוני טחינה (שבועות), תמרים ממולאים (כשבועיים) וטראפלס גנאש קוקוס (מקרר, ימים).
    איזה תאריך ואחסון כותבים על המארז?
  options:
    - >-
      שבועיים בקופסה סגורה בחדר, כי זה הממוצע של שלושת הפריטים.
    - >-
      שבועות בחדר קריר, כי רוב המארז עשוי מפריטים בלי מים.
    - >-
      את התאריך של הבונבונים, ומדבקה נפרדת על הטראפלס בלבד.
    - >-
      מקרר ותאריך של הגנאש, כי התאריך של מארז הוא של הפריט הקצר ביותר.
  correct: 3
  explanation: >-
    לפי הכלל מ־11.2, המארז מקבל את התאריך ואת תנאי האחסון של הפריט הרגיש ביותר. אם רוצים מארז לחדר עם
    תאריך ארוך, מוציאים ממנו את הגנאש.
- id: q4
  question: >-
    רוצים להכין נוגט טבעוני לפי 07.4. מה ההחלפה שמתאימה למה שנמצא במקורות?
  options:
    - >-
      אקוופאבה במקום חלבון (כ־30 מ"ל לחלבון) וגלוקוזה במקום דבש, כניסוי קטן עם רישום.
    - >-
      קרם קוקוס במקום החלבון, כי השומן שבו מחזיק את האוויר כמו חלבון.
    - >-
      עמילן תפוחי אדמה במקום החלבון, כי הוא מסמיך את הסירופ כמו בגנאש של Valrhona.
    - >-
      סילאן במקום החלבון והדבש יחד, כי הוא סמיך ומחזיק את הבוטנים בלי הקצפה.
  correct: 0
  explanation: >-
    אקוופאבה מוקצפת ומחליפה חלבון במרנג ובנוגט, ו־Valrhona שופכים עליה סירופ חם כמו על חלבון. לא נמצא
    מתכון מקצועי לנוגט אקוופאבה ב־140°C, ולכן זה ניסוי ולא מתכון.
