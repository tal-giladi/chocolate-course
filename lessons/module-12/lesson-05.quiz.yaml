- id: q1
  question: >-
    על שקית סוכריות מבריקות מיובאות כתוב: Sugar, corn starch, confectioner's glaze, carnauba wax, Red 40.
    אפשר לפזר אותן על בונבונים טבעוניים?
  options:
    - >-
      כן, כי הצבע Red 40 סינתטי ואין ברשימה אף רכיב שכתוב בו חלב או ביצה.
    - >-
      כן, כי confectioner's glaze הוא סוכר מבושל שמבריק את הסוכרייה.
    - >-
      לא, כי confectioner's glaze הוא שלאק (E904), שרף שמפרישה כנימה.
    - >-
      לא, כי Red 40 הוא קרמין, והשם האנגלי פשוט מסתיר את מקורו.
  correct: 2
  explanation: >-
    confectioner's glaze הוא השם המסחרי של שלאק כחומר הברקה. Red 40 הוא צבע סינתטי ולא קרמין; קרמין
    מופיע בשם carmine או cochineal, או E120.
- id: q2
  question: >-
    לקוחה שואלת למה על אריזות אמריקאיות כתוב היום "carmine" ולא "color added". מה הסיבה לפי ה־FDA?
  options:
    - >-
      דיווחים על תגובות אלרגיות חמורות, כולל אנפילקסיס, ולכן מחייבים לכתוב אותו בשם.
    - >-
      בקשה של ארגוני טבעונים, ולכן הכלל חל רק על מוצרים שמסומנים צמחוניים.
    - >-
      קרמין נאסר באירופה, ולכן ארה"ב מחייבת לסמן אותו כאזהרה ליצואנים.
    - >-
      קרמין הוא צבע סינתטי חדש, וכל צבע סינתטי חדש חייב להופיע בשמו.
  correct: 0
  explanation: >-
    הכלל מ־2009 (בתוקף מ־5.1.2011) מחייב לכתוב cochineal extract או carmine בשם, כדי שאלרגיים יוכלו
    להימנע. קרמין בא מחרקים, ולכן הוא חשוב גם לטבעונים.
- id: q3
  question: >-
    קניתם סוכריות צבעוניות בתפזורת במשקל, בלי מדבקת רכיבים. המוכר אומר "אין בהן כלום מן החי". מה
    רושמים בטבלה ומה עושים?
  options:
    - >-
      טבעוני, כי המוכר אמר, וסוכריות צבעוניות הן ברובן סוכר וצבע.
    - >-
      לא טבעוני, כי כל סוכרייה צבעונית מכילה קרמין או שלאק בלי יוצא מן הכלל.
    - >-
      טבעוני אם הן לא מבריקות, כי רק סוכריות מבריקות מכילות שלאק.
    - >-
      לא ידוע, ולא משתמשים בהן לגרסה הטבעונית עד שרואים רשימת רכיבים.
  correct: 3
  explanation: >-
    בלי רשימת רכיבים אין על מה לסמוך. "לא ידוע" היא תשובה לגיטימית, והיא לא שווה ל"לא טבעוני": אפשר
    לבקש מהחנות את פרטי היצרן.
- id: q4
  question: >-
    קישוט ממרשמלו מסומן "כשר פרווה" וברכיבים "ג'לטין דגים". איך מסכמים אותו לטבלה?
  options:
    - >-
      טבעוני ופרווה, כי ג'לטין דגים הוא מוצר צמחי שמופק מאצות.
    - >-
      פרווה לפי ההכשר, אבל לא טבעוני, כי ג'לטין עשוי מקולגן של בעלי חיים.
    - >-
      לא פרווה ולא טבעוני, כי כל ג'לטין הוא בשרי לפי ההלכה ומן החי.
    - >-
      טבעוני אבל לא פרווה, כי דגים אינם נחשבים בשר אבל הם מן החי.
  correct: 1
  explanation: >-
    ג'לטין מופק מקולגן של בקר, עופות, חזירים או דגים. ג'לטין דגים יכול להיות מסומן פרווה, ועדיין אינו
    טבעוני. שתי השאלות נבדקות בנפרד, ובהלכה שואלים את הרב.
