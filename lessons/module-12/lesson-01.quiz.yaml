- id: q1
  question: >-
    על שק Callebaut 811 מריר של 2.5 ק"ג כתוב "חלבי, לאוכלי אבקת חלב נכרי", וברשימת הרכיבים אין חלב.
    אורחת טבעונית ששואלת אם היא יכולה לאכול ממנו. מה התשובה המדויקת?
  options:
    - >-
      לא, כי "חלבי" על האריזה אומר שיש בשוקולד חלב, גם אם הוא לא מופיע ברכיבים.
    - >-
      לפי הרכיבים הוא מתאים לטבעונית; ה"חלבי" נובע מקו הייצור, וזה חשוב לשולחן בשרי.
    - >-
      כן, וגם אפשר להגיש אותו אחרי ארוחה בשרית, כי ברכיבים אין חלב בכלל.
    - >-
      רק אם היא מוכנה לאכול מוצרים חלביים, כי טבעונות וכשרות נבדקות באותה דרך.
  correct: 1
  explanation: >-
    טבעונות נבדקת ברשימת הרכיבים, וכשרות בהכשר. לפי OK, מריר מקו שמייצר גם שוקולד חלב מוגדר בדרך כלל
    חלבי כי הקו מרוקן ולא נשטף. למי שאלרגי לחלב השאלה שונה: שם בודקים גם "עלול להכיל".
- id: q2
  question: >-
    סוכריות קישוט מסומנות "כשר פרווה", וברכיבים כתוב "confectioner's glaze" וצבע E120. האם הן
    מתאימות ל־bark טבעוני?
  options:
    - >-
      כן, כי ההכשר פרווה אומר שאין בהן שום רכיבים מן החי.
    - >-
      כן, אבל רק אם ה־bark עצמו מריר פרווה, כי הסוכריות לבדן לא קובעות.
    - >-
      לא, כי ה־glaze הוא שלאק מחרק, ו־E120 הוא קרמין מחרקים.
    - >-
      לא, כי כל סוכרייה מבריקה מכילה חלב, גם כשהיא מסומנת פרווה.
  correct: 2
  explanation: >-
    פרווה היא קטגוריה הלכתית ולא טבעונית. שלאק (E904) וקרמין (E120) באים מחרקים, ויכולים להופיע במוצר
    פרווה. טבעוני בודק רכיבים.
- id: q3
  question: >-
    אורח אלרגי לחלב שואל אם המריר שלכם, המסומן "פרווה" ועם הכיתוב "עלול להכיל חלב", בטוח לו.
    מה עושים?
  options:
    - >-
      מראים לו את האריזה, אומרים מה בדקתם, ונותנים לו להחליט בלי להבטיח.
    - >-
      אומרים שהוא בטוח, כי פרווה הוא סימון כשרות שמבטיח שאין בו חלב בכלל.
    - >-
      אומרים שהוא בטוח רק אם השוקולד גם מסומן טבעוני, כי הסימון הטבעוני דורש מפעל נפרד.
    - >-
      מחליפים לשוקולד "dairy free" מיובא, כי הסימון הזה נבדק ולא יכול להכיל חלב.
  correct: 0
  explanation: >-
    לא פרווה, לא טבעוני ולא dairy free מבטיחים שאין עקבות חלב: ה־FDA מצאו חלב ב־4 מתוך 52 מוצרי מריר
    "dairy free", וב־2025 נאסף בישראל מארז פרלינים פרווה בגלל חשש לחלב. ה־Vegan Society לא דורשים מפעל
    נפרד.
- id: q4
  question: >-
    מטמפרים מריר פרווה ל־bark לשולחן בשרי, ונגמרו הזרעים. בשקית אחרת יש Cacao Barry OCOA 70%
    המסומן "חלבי, חלב נכרי". מה הבעיה אם משתמשים בו כזרעים?
  options:
    - >-
      אין בעיה, כי זרעים הם פחות משליש מהכמות ולכן לא משנים את הסימון.
    - >-
      הבעיה היא רק טכנית: 70% מטמפרים בטמפרטורה אחרת ולכן הטמפר יישבר.
    - >-
      אין בעיה כל עוד ברשימת הרכיבים של OCOA אין חלב, כי הכשרות נקבעת לפי הרכיבים.
    - >-
      הזרעים נכנסים לקערה, ולכן מבחינת הכשר כל ה־bark כבר לא עשוי מרכיבים שמסומנים פרווה.
  correct: 3
  explanation: >-
    כל רכיב בקערה צריך להיות מסומן פרווה, כולל הזרעים. לכן מתייגים שקיות שאריות עם שם המוצר וההכשר.
    טכנית מריר 70% ומריר 55% עובדים באותו טווח, 31-32°C. אם יש ספק, שואלים את הרב.
