- id: q1
  question: >-
    מטמפרים שוקולד "חלב" טבעוני ביתי, ומישהו מציע לעבוד ב־31-32°C "כמו במריר, כי אין בו חלב". למה
    עדיף להתחיל ב־30-31°C?
  options:
    - >-
      כי אבקת הסוכר הנוספת מעלה את נקודת ההתכה, ולכן צריך טמפרטורה נמוכה כדי לא להמיס את הסוכר.
    - >-
      כי גם בו יש שומן שאינו חמאת קקאו שמרכך אותה, ויצרנים כמו Valrhona מטמפרים מוצר כזה ב־30-31°C.
    - >-
      כי שוקולד טבעוני לא מכיל צורה V, ולכן מטמפרים אותו לצורה IV שנמסה נמוך יותר.
    - >-
      כי אבקת אורז סופגת חום, ובטמפרטורה גבוהה היא הופכת לדבק ומסמיכה את המסה.
  correct: 1
  explanation: >-
    Valrhona נותנים ל־Amatika 46% עבודה ב־30-31°C, ו־Felchlin נותנים לשוקולד הטבעוני שלהם את טווח שוקולד
    החלב (30-32°C) ולא של המריר. שמן שקדים, שמן קוקוס או שומן מהאבקה מדללים את חמאת הקקאו, כמו שומן חלב.
- id: q2
  question: >-
    הכנתם שוקולד "חלב" טבעוני עם 35% אבקת חלב קוקוס. טמפרתם, ובדיקת הסכין נשארה רכה ושמנונית גם אחרי
    10 דקות. מה הצעד הנכון?
  options:
    - >-
      להוריד את טמפרטורת העבודה ל־26°C, כי שוקולד עם קוקוס פשוט מתגבש נמוך יותר.
    - >-
      להכניס את הבדיקה למקפיא, ואם היא מתקשה שם, לצקת את כל השוקולד ולהקפיא.
    - >-
      להוסיף חמאת קקאו, להמיס ולטמפר שוב, ובפעם הבאה להגביל את אבקת הקוקוס לכ־15%.
    - >-
      להוסיף עוד אבקת קוקוס, כי היא מכילה מתחלבים שעוזרים לשוקולד להתקשות.
  correct: 2
  explanation: >-
    באבקת קוקוס 60-65% שמן, ושמן קוקוס נוזלי בטמפרטורת העבודה ומעכב התגבשות של חמאת קקאו (Chocolate
    Alchemy). הורדת טמפרטורה נותנת מסה רכה ולא גבישי V. מורידים את הקוקוס ומחזקים את חמאת הקקאו.
- id: q3
  question: >-
    באבקת "Coconut milk powder" שמצאתם כתוב: חלב קוקוס, מלטודקסטרין, נתרן קזאינט. אפשר להשתמש בה
    לשוקולד טבעוני?
  options:
    - >-
      כן, כי נתרן קזאינט הוא מלח מינרלי שמוסיפים כדי שהאבקה לא תתגבש.
    - >-
      כן, אם על האריזה כתוב "non-dairy", כי המילה הזו מבטיחה שאין רכיבי חלב.
    - >-
      כן, אבל רק בכמות קטנה, כי הקזאינט משפיע רק על הטמפרור ולא על ההרכב.
    - >-
      לא, כי נתרן קזאינט הוא חלבון חלב, והשוקולד יהיה גם לא טבעוני וגם חלבי.
  correct: 3
  explanation: >-
    נתרן קזאינט הוא נגזרת חלב שמוסיפים כמתחלב. OliveNation כותבים על אבקה כזו שהיא אינה טבעונית ואינה
    נטולת חלב. בודקים את הרכיבים, לא רק את השם "קוקוס".
- id: q4
  question: >-
    השוקולד הביתי שלכם התקשה, מבריק ונשבר, אבל מרגישים בו גרגרים קטנים בפה. מה הכי סביר?
  options:
    - >-
      האבקה והסוכר לא נטחנו לחלקיקים קטנים מספיק; מעל כ־30 מיקרון חלקיקים מורגשים כגרגריים.
    - >-
      הטמפר נכשל, והגרגרים הם גבישי חמאת קקאו מצורה IV שהתגבשו על פני השטח.
    - >-
      השוקולד קיבל לחות מהאוויר, והגרגרים הם פריחת סוכר שנוצרה בתוך הדיסקית.
    - >-
      חמאת הקקאו לא נמסה לגמרי בהתחלה, והגרגרים הם חתיכות של חמאת קקאו מוצקה.
  correct: 0
  explanation: >-
    לפי HORIBA, חלקיקים מעל 30 מיקרון מורגשים כגרגריים ומתחת ל־20 מיקרון המרקם חלק. מפעל טוחן לשם;
    בלנדר ביתי לא. שוקולד שמבריק ונשבר בסנאפ עבר את הטמפר.
