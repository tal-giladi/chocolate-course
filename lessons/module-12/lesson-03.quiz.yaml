- id: q1
  question: >-
    החלפתם בגנאש 1:1 את השמנת 38% באותה כמות קרם קוקוס, והגנאש יצא רך מדי לגלגול ועם שכבת שומן
    בשוליים. מה ההסבר הסביר?
  options:
    - >-
      בקרם קוקוס יש יותר שומן משמנת, ולכן צריך להוסיף מים כדי לאזן את היחס.
    - >-
      בקרם קוקוס פחות שומן ויותר מים משמנת 38%, ולכן מתחילים ב־2:1 ומחממים ל־70°C בלבד.
    - >-
      קרם קוקוס לא יוצר אמולסיה בכלל, ולכן אי אפשר להכין ממנו גנאש לטראפלס.
    - >-
      הקוקוס מעלה את טמפרטורת ההתגבשות של חמאת הקקאו, ולכן הגנאש לא מתקשה.
  correct: 1
  explanation: >-
    לפי Codex בקרם קוקוס לפחות 20% שומן ועד 74.6% מים, ובשמנת 38% כמעט פי שניים שומן וכ־58% מים.
    יותר שוקולד (2:1) מחזיר מוצקות, וחימום מתון מונע קרישה והיפרדות.
- id: q2
  question: >-
    במתכון הגנאש הצמחי של Valrhona יש משקה שיבולת שועל, עמילן תפוחי אדמה ודבש. מה צריך לשנות כדי
    שיהיה טבעוני?
  options:
    - >-
      שום דבר, כי Valrhona קוראים למתכון "plant-based" וזה אותו דבר כמו טבעוני.
    - >-
      להחליף את העמילן בקמח רגיל, כי עמילן תפוחי אדמה מעובד עם חומרים מן החי.
    - >-
      להחליף את הדבש בסירופ גלוקוזה, כי רוב הטבעונים לא אוכלים דבש.
    - >-
      להחליף את משקה שיבולת השועל בקרם קוקוס, כי משקה דגנים אינו נחשב טבעוני.
  correct: 2
  explanation: >-
    דבש הוא מוצר מן החי, וה־Vegan Society מונים אותו עם חלב וביצים. "Plant-based" על מתכון לא פוטר
    מבדיקת כל רכיב. גלוקוזה גם מרככת וגם קושרת מים.
- id: q3
  question: >-
    גנאש שיבולת שועל (40 גרם שוקולד, 47 גרם משקה, עמילן וגלוקוזה) הוא כ־45% מים. איך מתייחסים אליו?
  options:
    - >-
      כמו לג'יאנדוז'ה: אין בו שמנת, ולכן הוא מחזיק שבועות בקופסה סגורה בחדר.
    - >-
      כמו לטראפלס מקצועי: עם גלוקוזה הוא מחזיק 2-3 שבועות ב־16-18°C.
    - >-
      כמו לשוקולד מוצק: העמילן קושר את כל המים, ולכן פעילות המים שלו נמוכה.
    - >-
      כמזון רגיש: מקרר עד 4°C, לא יותר משעתיים בחוץ, ולסיים תוך ימים ספורים.
  correct: 3
  explanation: >-
    יותר מים מגנאש שמנת, שנמדד ב־aw 0.85-0.88 (06.4). אין מדידה לגנאש כזה, ולכן לא מאריכים את הזמן.
    "בלי שמנת" לא אומר "בלי מים".
- id: q4
  question: >-
    חברה רוצה להשתמש באקוופאבה במקום קרם קוקוס כדי להכין טראפלס טבעוניים למארז שיחכה שבוע. מה אומרים
    לה?
  options:
    - >-
      אקוופאבה היא כ־95% מים ומעט חלבון, ולכן מתאימה למוס של אותו יום ולא לטראפלס שמחכה.
    - >-
      אקוופאבה מכילה הרבה שומן מהחומוס, ולכן הטראפלס יהיו שמנוניים ולא יתגלגלו.
    - >-
      אקוופאבה מתאימה מצוין, כי החלבון שלה זהה לחלבון ביצה ומייצב את הגנאש לשבועות.
    - >-
      אקוופאבה מתאימה רק אם מרתיחים אותה עם השוקולד, כדי שהעמילן שבה יסמיך.
  correct: 0
  explanation: >-
    לפי Wikipedia באקוופאבה כ־5% מוצקים, בלי שומן ובלי עמילן, וחלבון בכעשירית מחלבון ביצה. היא מוסיפה
    בעיקר מים, ולכן גנאש ממנה קצר־חיים.
