- id: q1
  question: >-
    שני גנאשים מכילים בדיוק 20% מים. באחד aw של 0.75 ובשני 0.90. מה ההסבר?
  options:
    - >-
      המדידה של אחד מהם שגויה, כי באותה כמות מים ה־aw חייב להיות זהה.
    - >-
      בגנאש של 0.90 יש יותר שומן, והשומן הוא שמעלה את פעילות המים.
    - >-
      הגנאש של 0.75 קר יותר, ופעילות מים יורדת תמיד כשמקררים מזון.
    - >-
      בגנאש של 0.75 יותר סוכרים שקושרים מים, ולכן פחות מים חופשיים בו.
  correct: 3
  explanation: >-
    Callebaut מביאים בדיוק דוגמה כזו: אותה תכולת מים, aw של 0.750 מול 0.900. ההבדל הוא כמה מהמים
    קשורים לסוכרים ולרכיבים אחרים. לכן גלוקוזה וסוכר אינוורטי משנים את חיי המדף בלי לשנות הרבה את
    כמות המים.
- id: q2
  question: >-
    לקוחה מבקשת מארז טראפלס של שוקולד ושמנת שיעמוד שבוע על שולחן במשרד בלי מקרר. מה עונים?
  options:
    - >-
      שגנאש כזה נמדד ב־aw של 0.85-0.88 וצריך מקרר, ומציעים מארז אחר או אחסון במקרר.
    - >-
      שאפשר, אם מוסיפים כפית אלכוהול לכל גנאש, כי אלכוהול משמר כל מוצר.
    - >-
      שאפשר, כי השוקולד עוטף את הגנאש ומונע מחיידקים להגיע לשמנת שבפנים.
    - >-
      שאפשר, אם מכינים את הגנאש ביחס 1:1, כי גנאש רך מתקלקל לאט יותר.
  correct: 0
  explanation: >-
    Kansas State מדדו גנאש ביתי ב־0.85-0.88, טווח שבו רוב העובשים וסטפילוקוקוס עוד גדלים. אלכוהול
    עוזר, אבל בלי מדידה וניסוי לא יודעים כמה. 1:1 מכיל יותר מים, לא פחות.
- id: q3
  question: >-
    בגנאש של 100 גרם מריר ו־50 גרם שמנת, כמה אחוז מים יש בערך (שמנת כ־58% מים, שוקולד כ־1%)?
  options:
    - >-
      כ־33%, כי שליש מהגנאש הוא שמנת והשמנת היא בעיקר מים.
    - >-
      כ־58%, כמו בשמנת עצמה, כי השוקולד לא מכיל מים בכלל.
    - >-
      כ־20%: 29 גרם מים מהשמנת ועוד גרם מהשוקולד, מתוך 150 גרם.
    - >-
      כ־10%, כי חמאת הקקאו בשוקולד קושרת את רוב המים שבשמנת.
  correct: 2
  explanation: >-
    50 × 0.58 = 29 גרם מים מהשמנת, ועוד כגרם מהשוקולד: כ־30 גרם מתוך 150, כלומר כ־20%. שליש הוא
    משקל השמנת, לא משקל המים שבה. אחוז המים לא אומר לבד מה ה־aw, אבל מראה לאיזה כיוון הולכים.
- id: q4
  question: >-
    מתכון טראפלס של Callebaut כותב "2-3 שבועות ב־16-18°C". אפשר להעתיק את זה לתווית של הטראפלס
    שלכם משוקולד ושמנת?
  options:
    - >-
      כן, כי Callebaut בדקו את המתכון, והשוקולד שלכם הוא מאותו יצרן.
    - >-
      לא. המתכון שלהם בנוי לשמירה, ותאריך קובעים רק אחרי ניסוי מלא.
    - >-
      כן, בתנאי שהטראפלס שלכם טבולים בשוקולד מטומפר כמו הטראפלס שלהם.
    - >-
      לא, כי Callebaut כותבים חיי מדף רק למוצרים שנשמרים במקפיא.
  correct: 1
  explanation: >-
    חיי המדף שלהם נשענים על פורמולה שמורידה את פעילות המים ועל ייצור מבוקר. Callebaut כותבים שאף
    מדידה לא חוזה חיי מדף, ושמבטיחים רק אחרי ניסוי באורך המלא. הקליפה לא משנה את ה־aw של הגנאש.
- id: q5
  question: >-
    רוצים שגנאש הטראפלס יישמר טוב יותר בלי להפוך למתוק מאוד. איזו תוספת מתאימה יותר?
  options:
    - >-
      סוכר אינוורטי, כי הוא קושר מים ומתוק פחות מסוכר לבן רגיל.
    - >-
      דבש, כי הוא כמעט לא מוסיף מתיקות והוא קושר את כל המים בגנאש.
    - >-
      עוד שמנת 38%, כי השומן בשמנת מגן על הגנאש מפני עובשים וחיידקים.
    - >-
      סירופ גלוקוזה, כי הוא קושר מים ומתוק פחות מסוכר (כ־74% ממנו).
  correct: 3
  explanation: >-
    לפי Barry Callebaut, גלוקוזה DE 40-60 מתוקה ב־74% מסוכר, וסוכר אינוורטי ב־125%: יותר מתוק. דבש
    הוא בעיקר סוכר אינוורטי, ולכן מתוק. עוד שמנת מוסיפה מים ומעלה את פעילות המים.
