- id: q1
  question: >-
    חלטתם 30 גרם שמנת עם תרמילי הל, ואחרי הסינון נשארו 23 גרם. המתכון דורש 20 גרם שמנת על 50 גרם
    שוקולד חלב. מה עושים?
  options:
    - >-
      משתמשים בכל 23 הגרם, כי שמנת עם טעם הל חזק שווה יותר משמנת רגילה.
    - >-
      שוקלים 20 גרם מהשמנת המסוננת, מחממים ל־60-65°C ושופכים על השוקולד.
    - >-
      מוסיפים 7 גרם שמנת טרייה כדי לחזור ל־30 גרם, כמו בתחילת החליטה.
    - >-
      שופכים את השמנת על השוקולד עם ההל, כדי שהטעם ימשיך להתפתח בגנאש.
  correct: 1
  explanation: >-
    המטרה היא היחס של המתכון: 20 גרם שמנת על 50 גרם שוקולד. ההל סופח שמנת, ולכן חולטים עם עודף
    ושוקלים אחרי הסינון. אם נשאר פחות מ־20 גרם, משלימים בשמנת טרייה. 23 או 30 גרם ירככו את הגנאש.
- id: q2
  question: >-
    אתם רוצים טראפלס עם ברנדי. מתי ואיך מוסיפים אותו?
  options:
    - >-
      מרתיחים אותו עם השמנת, כדי שהטעם ייכנס לשמנת לפני השוקולד.
    - >-
      מוסיפים לשוקולד לפני ההמסה, כדי שהאלכוהול לא יגרום לגנאש להיפרד.
    - >-
      מגלגלים בו את הטראפלס הגמורים, כדי שלא ישנה את מרקם הגנאש.
    - >-
      בסוף, בגנאש של 35-40°C, ומורידים מהשמנת את אותה כמות נוזל.
  correct: 3
  explanation: >-
    אלכוהול מתנדף בחום, ולכן מוסיפים אותו לגנאש שכבר התחבר והתקרר מעט. הוא גם נוזל, ולכן מורידים
    מהשמנת את אותה כמות, אחרת הגנאש יוצא רך מדי לגלגול.
- id: q3
  question: >-
    לקוחה שומרת כשרות מבקשת טראפלס עם ליקר תפוזים. בבית יש בקבוק מחו"ל בלי שום סמל כשרות. מה
    עונים?
  options:
    - >-
      שאפשר להשתמש בו, כי אלכוהול מזוקק כשר תמיד ואין בו שאלה של יין.
    - >-
      שאפשר להשתמש בו, כי 5 גרם בטראפלס הם כמות קטנה שלא משפיעה.
    - >-
      שליקרים צריכים הכשר, ומשתמשים רק בבקבוק עם הכשר שהיא סומכת עליו.
    - >-
      שאפשר להשתמש בו אם מחממים את הגנאש לרתיחה ומאדים את כל האלכוהול.
  correct: 2
  explanation: >-
    Star-K כותבים שכל הליקרים צריכים הכשר, כי אפשר להוסיף להם יין וטעמים. השאלה אם כמות קטנה
    משנה היא שאלה לרב, לא החלטה של המטבח. רתיחה לא משנה את הכשרות ופוגעת בגנאש.
- id: q4
  question: >-
    הוספתם 25 גרם טחינה לגנאש של 50 גרם שוקולד ו־20 גרם שמנת, והוא נעשה שמנוני ונפרד. למה זה קרה?
  options:
    - >-
      בטחינה כמחצית שומן וכמעט בלי מים, אז יש עכשיו הרבה שומן ביחס לנוזל.
    - >-
      בטחינה יש הרבה מים, והם גרמו לשוקולד להיתפס כמו טיפה במיקרוגל.
    - >-
      טחינה היא חומצית, והחומצה פירקה את השמנת לגושים קטנים בגנאש.
    - >-
      טחינה מקררת את הגנאש מתחת ל־20°C, ולכן חמאת הקקאו התגבשה בבת אחת.
  correct: 0
  explanation: >-
    לפי USDA בטחינה כ־54% שומן וכ־3% מים. 25 גרם הם 50% ממשקל השוקולד, ואין מספיק נוזל להחזיק את
    כל השומן. מתקנים בכפית מים פושרים, ובפעם הבאה מוסיפים עד כ־20% ממשקל השוקולד.
- id: q5
  question: >-
    גנאש התמר יצא רך בהרבה מגנאש ההל, למרות שבשניהם 50 גרם שוקולד ו־20 גרם שמנת. מה ההסבר הסביר?
  options:
    - >-
      בתמר יש שומן שמונע מחמאת הקקאו להתגבש ולהקשות את הגנאש.
    - >-
      בתמר יש מים וסוכר מומס, שנוספו לחלק המימי וריככו את הגנאש.
    - >-
      ההל בגנאש השני ספג שומן מהשוקולד, ולכן דווקא הוא התקשה יותר.
    - >-
      תמרים מעלים את טמפרטורת הגנאש, ולכן הוא צריך יותר זמן במקרר.
  correct: 1
  explanation: >-
    בתמר מג'הול כ־21% מים וכ־66% סוכר (USDA). סוכר מומס ומים מרככים את הגנאש, כמו שסוכר ואבקת חלב
    מרככים גנאש לבן (06.1). מורידים מעט שמנת, או מקררים יותר זמן.
