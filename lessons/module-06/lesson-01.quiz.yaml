- id: q1
  question: >-
    הכנתם גנאש מ־100 גרם מריר 72% ו־30 גרם שמנת. הוא יצא עבה, גרגרי, ועם ברק של שמן בשוליים. מה
    הצעד הראשון?
  options:
    - >-
      להוסיף עוד 30 גרם שוקולד מומס, כדי שהשומן העודף ייקשר בשוקולד החדש.
    - >-
      להכניס את הקערה למקרר לעשר דקות, כדי שהשומן יתקשה ויתערבב מחדש.
    - >-
      להוסיף כפית מים פושרים (32-35°C), להקציף חזק, ולחזור על זה אם צריך.
    - >-
      להוסיף כף שמנת קרה מהמקרר, כי שמנת קרה מייצבת את טיפות השומן.
  correct: 2
  explanation: >-
    30 גרם שמנת הם 30% מהשוקולד, פחות מהמינימום של 33% ש־King Arthur נותנים, ובשוקולד של 72% יש
    פחות סוכר שנמס במים. חסרים מים, ולכן מוסיפים מים פושרים בכפיות. עוד שוקולד או שמנת קרה מחמירים.
- id: q2
  question: >-
    אתם רוצים טראפלס מגולגלים משוקולד לבן, והמתכון של המריר שלכם הוא 2:1. מה עושים עם היחס?
  options:
    - >-
      מעלים את כמות השוקולד, בערך ל־3:1, כי סוכר ואבקת חלב מרככים את הגנאש.
    - >-
      שומרים על 2:1, כי היחס תלוי רק בכמות השומן שיש בשמנת שבחרתם.
    - >-
      מורידים את כמות השוקולד ל־1:1, כי שוקולד לבן מתקשה מהר יותר ממריר.
    - >-
      מחליפים את השמנת בחלב, כי בשוקולד לבן יש כבר מספיק שומן משלו.
  correct: 0
  explanation: >-
    McGill ו־Hartel מצאו שסוכר ואבקת חלב נמסים בחלק המימי ומרככים, ומוצקי קקאו מקשים. בלבן אין
    מוצקי קקאו, ולכן גם Valrhona שמים כמעט פי 2.3 יותר שוקולד לבן ממריר על אותה כמות שמנת.
- id: q3
  question: >-
    אתם מכינים גנאש חלב. לאיזו טמפרטורה מחממים את השמנת?
  options:
    - >-
      לרתיחה מלאה של דקה, כדי שהשמנת תמיס את השוקולד החלבי עד הסוף.
    - >-
      ל־35°C בלבד, כדי שהשוקולד לא יאבד את הטמפר שהיצרן עשה לו מראש.
    - >-
      ל־90-95°C, כי שוקולד חלב סמיך יותר וצריך יותר חום כדי להתערבב.
    - >-
      ל־60-65°C, ולשפוך על שוקולד חלב שכבר נמס חלקית בקערה.
  correct: 3
  explanation: >-
    Valrhona מחממים שמנת לגנאש חלב ולבן ל־60-65°C ושופכים על שוקולד נמס חלקית; למריר 75-80°C.
    שוקולד חלב ולבן נפגעים מחום, ובגנאש לא שומרים על טמפר, כך ש־35°C לא נותנים מספיק חום להמסה.
- id: q4
  question: >-
    הגנאש עמד על השיש בזמן שענית לטלפון. עכשיו הוא 27°C, סמיך, גושי ועם גרגרים קשים, אבל בלי שמן
    צף. מה עושים?
  options:
    - >-
      מוסיפים כף מים קרים ומקציפים, כי הבעיה היא תמיד חוסר במים.
    - >-
      מחממים בעדינות ל־35-40°C בפולסים קצרים, ומערבבים מהמרכז או בבלנדר.
    - >-
      מחממים במיקרוגל דקה שלמה, עד שהגנאש נוזלי לגמרי ומתחילים מחדש.
    - >-
      ממשיכים לערבב חזק בטמפרטורת החדר עד שהגרגרים נעלמים מעצמם.
  correct: 1
  explanation: >-
    מתחת לכ־34°C חמאת הקקאו מתחילה להתגבש, והשומן כבר לא מתפזר לטיפות. מחזירים את הגנאש ל־35-40°C
    ומערבבים. דקה במיקרוגל עלולה לגרום לחום יתר, שזו סיבה אחרת להיפרדות.
- id: q5
  question: >-
    למה King Arthur מתקנים גנאש שנפרד במים פושרים ולא בעוד שמנת?
  options:
    - >-
      כי מים פושרים מקררים את הגנאש מהר יותר, והקור מאחד מחדש את השומן.
    - >-
      כי מים מוסיפים סוכר מומס לגנאש, והסוכר הוא שמחזיק את האמולסיה.
    - >-
      כי מים מוסיפים את הנוזל שחסר בלי להוסיף שומן, שכבר יש ממנו יותר מדי.
    - >-
      כי שמנת חמה גורמת לשוקולד להיתפס, ומים לא גורמים לזה אף פעם.
  correct: 2
  explanation: >-
    בגנאש שנפרד יש יותר מדי שומן ומוצקים ביחס לנוזל. מים מחזירים את האיזון בלי להוסיף שומן. מים
    פושרים לא מקררים, ומעט מים כן יכולים לגרום לשוקולד נקי להיתפס (02.1), לכן מוסיפים רק לגנאש.
