- id: q1
  question: >-
    באמצע הגלגול הגנאש מתחיל להימרח על הכפפות ולהשאיר עליהן שכבה חומה. מה עושים?
  options:
    - >-
      מוסיפים לגנאש כף אבקת קקאו, כדי לייבש אותו ולהקשות אותו מיד.
    - >-
      מחזירים את המגש ל־10 דקות במקרר, מחליפים כפפות ומקררים ידיים.
    - >-
      ממשיכים לגלגל מהר יותר, כי החום מהידיים יעזור לפני הגנאש להיות חלקים.
    - >-
      מכניסים את המגש למקפיא לשעה, כדי שהגלגול יהיה הכי קל שאפשר.
  correct: 1
  explanation: >-
    חמאת קקאו נמסה מתחת לטמפרטורת היד, והגנאש רך ממנה. קירור קצר מחזיר אותו למצב שאפשר לגלגל. גנאש
    קפוא נסדק, וקקאו בתוך הגנאש משנה את היחס ואת המרקם.
- id: q2
  question: >-
    חברה שואלת למה טבלתם חלק מהטראפלס בשוקולד מטומפר ולא הסתפקתם בקקאו. מה ההסבר הנכון?
  options:
    - >-
      כי קליפת שוקולד מורידה את פעילות המים של הגנאש שבפנים לרמה בטוחה.
    - >-
      כי קקאו מסתיר גנאש שנפרד, ושוקולד מטומפר מראה מיד אם יש בו בעיה.
    - >-
      כי שוקולד מטומפר מוסיף סוכר לגנאש, וזה מה שגורם לו להחזיק יותר זמן.
    - >-
      כי הקליפה אוטמת את הגנאש מאוויר ומריחות, ומחזיקה צורה בזמן ההגשה.
  correct: 3
  explanation: >-
    קקאו נדבק לגנאש אבל לא אוטם אותו. קליפה דקה של שוקולד מטומפר מגינה ונותנת יציבות, ולכן Callebaut
    טובלים ורק אז מגלגלים בקקאו. היא לא משנה את פעילות המים של הגנאש, ולכן גם הם נשמרים במקרר.
- id: q3
  question: >-
    הכנתם 12 טראפלס של שוקולד ושמנת בלבד לארוחת שישי. איך שומרים אותם עד הערב?
  options:
    - >-
      בקופסה סגורה במקרר, ומוציאים 20-30 דקות לפני ההגשה בלי לפתוח.
    - >-
      בקופסה סגורה על השיש ב־24°C, כי בשוקולד יש מספיק סוכר שמגן עליו.
    - >-
      במקפיא בצלחת פתוחה, ומעבירים לשולחן ישר לפני שמגישים את הקינוח.
    - >-
      בצלחת פתוחה במקרר, כדי שהקקאו יישאר יבש והטראפלס לא יזיעו.
  correct: 0
  explanation: >-
    גנאש ביתי של שוקולד ושמנת נמדד ב־Kansas State ב־aw של 0.85-0.88, ולכן צריך קירור. קופסה סגורה
    מגינה מריחות, ופתיחה רק אחרי שהטראפלס התחממו מונעת עיבוי. מקפיא ישר לחדר גורם לסדקים ולטיפות.
- id: q4
  question: >-
    טבלתם טראפלס בשוקולד מריר, ואחרי שעה הקליפה עדיין רכה ונמרחת באצבע. מה הסיבה הסבירה?
  options:
    - >-
      הגנאש היה קר מדי, והקור מהגנאש מנע מהקליפה להתקשות כמו שצריך.
    - >-
      השוקולד היה מטומפר יותר מדי, ולכן הוא מתקשה רק אחרי כמה שעות.
    - >-
      השוקולד לא היה מטומפר, או התחמם מעל 32°C אחרי בדיקת הסכין.
    - >-
      אבקת הקקאו שעל הידיים נכנסה לשוקולד ומנעה ממנו להתקשות.
  correct: 2
  explanation: >-
    שוקולד מטומפר מתקשה תוך דקות. קליפה רכה אחרי שעה אומרת שאין מספיק גבישי V: הטמפר לא הצליח, או
    שהשוקולד התחמם אחרי הבדיקה. בודקים בבדיקת סכין ובמדחום לפני כל סבב טבילה.
- id: q5
  question: >-
    טראפלס יצאו מהמקרר ישר לחדר של 28°C, ואחרי רבע שעה יש עליהם טיפות, ולמחרת כתמים לבנים. מה
    קרה?
  options:
    - >-
      הגנאש נפרד בתוך הקליפה, והשומן שלו יצא החוצה דרך השוקולד.
    - >-
      לחות מהאוויר התעבתה על הטראפלס הקרים, והשאירה פריחת סוכר.
    - >-
      השוקולד התקרר מהר מדי במקרר, וזו פריחת שומן שנגרמת מקור בלבד.
    - >-
      הקקאו ספג מים מהגנאש, ולכן מופיעים כתמים כשהוא מתחמם בחדר.
  correct: 1
  explanation: >-
    משטח קר בחדר חם ולח מושך אליו טיפות מים, והן ממיסות סוכר על פני השוקולד; כשהן מתייבשות נשאר
    כתם לבן. מוציאים את הקופסה סגורה ופותחים רק אחרי 20-30 דקות.
