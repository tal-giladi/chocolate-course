- id: q1
  question: >-
    אתם ממיסים שוקולד ציפוי בבן־מארי. הורדתם את הקערה, ופתאום השוקולד הסמיך, איבד ברק ונהיה מגורען,
    אף שהמדחום מראה רק 38°C. מה הכי סביר שקרה?
  options:
    - >-
      השוקולד התקרר מתחת לטווח העבודה והתחיל להתגבש, וצריך רק לחמם אותו שוב.
    - >-
      השוקולד התחמם יותר מדי בתחתית הקערה, אף שהמדחום במרכז מראה טמפרטורה נמוכה.
    - >-
      טיפת מים מתחתית הקערה או אדים מהסיר נכנסו לשוקולד, והוא נתפס.
    - >-
      שוקולד ציפוי לא מתאים לבן־מארי, ותמיד מתגרען כשממיסים אותו מעל מים.
  correct: 2
  explanation: >-
    ב־38°C שוקולד ציפוי לא נשרף ולא מתגבש. סמיך, מט ומגורען אחרי בן־מארי הוא סימן של מים: הסוכר
    והמוצקים נמשכים לטיפות ויוצאים מהשומן. מנגבים את תחתית הקערה ולא נותנים לאדים לעלות.
- id: q2
  question: >-
    שוקולד נתפס ממים לפני שהספקתם לטבול. מה עושים איתו?
  options:
    - >-
      מוסיפים הרבה חלב חם או שמנת ומקבלים רוטב או שוקו, ולא משתמשים בו לטיבול.
    - >-
      מוסיפים עוד כמה טיפות מים ומחממים חזק, כדי שהגבישים יימסו בחזרה לגמרי.
    - >-
      מוסיפים כף שוקולד מוצק ומערבבים עד שהשוקולד חוזר להיות נוזלי ומבריק.
    - >-
      זורקים אותו, כי שוקולד שנכנסו אליו מים מתקלקל ולא בטוח לאכילה.
  correct: 0
  explanation: >-
    מעט מים גורמים לשוקולד להיתפס, אבל הרבה נוזל מפזר שוב את הסוכר והמוצקים, וזה כבר רוטב. הוא בטוח
    ומצוין לשוקו, לגלידה או לעוגיות, אבל לא חוזר להיות שוקולד לטיבול.
- id: q3
  question: >-
    אתם ממיסים 150 גרם שוקולד לבן במיקרוגל, ואין לכם עקומה על האריזה. מה התוכנית הנכונה?
  options:
    - >-
      דקה וחצי ברצף בעוצמה מלאה, כי שוקולד לבן נמס בטמפרטורה נמוכה יותר ממריר.
    - >-
      פולסים של 30 שניות בעוצמה מלאה עד 50°C, כמו במריר, כדי שהכול יימס.
    - >-
      בעוצמה מלאה עד שאין חתיכות, ואז להשאיר במיקרוגל הסגור עוד דקה שיתייצב.
    - >-
      פולסים קצרים בעוצמה של 50%, ערבוב אחרי כל פולס, ועצירה סביב 40°C.
  correct: 3
  explanation: >-
    בשוקולד לבן יש אבקת חלב וסוכר שנפגעים מחום. King Arthur ממיסים אותו עד 40°C, וב־Serious Eats עוצמה
    של 50% הייתה הבטוחה ביותר. 50°C מתאים למריר, וחימום ארוך ברצף יוצר נקודות חמות.
- id: q4
  question: >-
    המסתם קוברטורה מרירה ל־45°C, טבלתם בה תות ושמתם בצד במטבח של 28°C. אחרי שעתיים השוקולד רך, עמום
    ונמרח באצבעות. מה ההסבר?
  options:
    - >-
      הקוברטורה הייתה מקולקלת, כי קוברטורה טובה מתקשה תמיד ומבריקה בכל טמפרטורה.
    - >-
      בלי טמפרור חמאת הקקאו התגבשה בצורות לא יציבות, שנמסות בחום של המטבח.
    - >-
      התות שחרר מים לתוך השוקולד, והשוקולד נתפס והתרכך במשך הזמן.
    - >-
      המסתם לטמפרטורה נמוכה מדי, ולכן חמאת הקקאו לא נמסה עד הסוף מלכתחילה.
  correct: 1
  explanation: >-
    ב־45°C הגבישים היציבים של היצרן נמסו, והשוקולד התקשה בלי טמפרור בצורות שנמסות מתחת ל־28°C. לכן
    הוא רך, עמום ובהמשך מפוספס. פתרון: שוקולד ציפוי, אחסון במקרר והגשה קרה, או טמפרור במודול 3.
- id: q5
  question: >-
    החתיכות במיקרוגל נראות כמעט שלמות אחרי שני פולסים, אבל המדחום כבר מראה 36°C. מה עושים?
  options:
    - >-
      מוסיפים פולס ארוך של דקה, כי בלי חום נוסף החתיכות לא יימסו לעולם.
    - >-
      מעבירים לבן־מארי עם מכסה, שמחזיק את החום ונותן לחתיכות להימס בשקט.
    - >-
      מערבבים היטב, כי החתיכות רכות מבפנים, ורק אם צריך מוסיפים פולס של 10-15 שניות.
    - >-
      מוסיפים כפית שמן או מים חמים, שעוזרים לחתיכות להימס בלי לחמם יותר.
  correct: 2
  explanation: >-
    חתיכות יכולות להיראות שלמות כשהן כבר רכות, והשוקולד ממשיך להימס מהחום שיש בו. ערבוב מפזר את החום.
    פולס ארוך מסתכן בשריפה, ומכסה ומים גורמים לשוקולד להיתפס.
