- id: q1
  question: >-
    שטפתם תותים, הוצאתם ישר מהמקרר וטבלתם. השוקולד מחליק, ואחרי כמה דקות נסדק ומתקלף. מה הסיבה
    העיקרית?
  options:
    - >-
      השוקולד היה חם מדי, ולכן לא הספיק להתקשות לפני שהחליק מהפרי.
    - >-
      הפרי היה קר ולח: עיבוי על הקליפה מונע הידבקות, והשוקולד מתקשה מהר מדי.
    - >-
      בתותים יש חומצה שמפרידה את השוקולד, ולכן צריך לטבול רק פירות יבשים.
    - >-
      שוקולד ציפוי לא נדבק לפרי טרי, ולכן תותים טובלים רק בקוברטורה.
  correct: 1
  explanation: >-
    פרי קר מהמקרר מושך עליו לחות מהאוויר, והשוקולד מתקשה עליו בבת אחת ומתכווץ. מייבשים ונותנים לפירות
    30-60 דקות בטמפרטורת החדר לפני הטבילה.
- id: q2
  question: >-
    אירוח בחצר ביולי, 33°C בצל. המגש עם התותים המטובלים יצא מהמקרר ב־20:00. מתי מחזירים אותו?
  options:
    - >-
      ב־23:00, כי שוקולד מגן על הפרי ומאריך את הזמן שאפשר להשאיר אותו בחוץ.
    - >-
      רק כשהשוקולד מתחיל להימס, כי זה הסימן היחיד שהמגש עמד יותר מדי זמן.
    - >-
      ב־22:00, לפי כלל השעתיים למזון רגיש, כי הפרי עצמו קבע את הזמן ולא השוקולד.
    - >-
      ב־21:00, כי מעל 32°C מזון רגיש לא נשאר בחוץ יותר משעה.
  correct: 3
  explanation: >-
    הכלל למזון רגיש הוא שעתיים בטמפרטורת החדר, ושעה כשחם מ־32°C (90°F). שוקולד לא מגן על פרי טרי, ומה
    שנראה בסדר עדיין יכול לעמוד בחוץ יותר מדי.
- id: q3
  question: >-
    איך שוטפים תותים לטבילה, לפי ה־FDA ולפי מה שעובד בשוקולד?
  options:
    - >-
      במים זורמים עם שפשוף עדין, בלי סבון, עם העלים, ואז ייבוש בנייר מגבת.
    - >-
      בהשריה של חצי שעה בקערת מים עם מעט סבון כלים, ואז שטיפה במים זורמים.
    - >-
      מורידים את העלים, משרים במים ומייבשים במקרר, כדי שהפרי יהיה קר וקשה.
    - >-
      לא שוטפים בכלל, כי כל טיפת מים גורמת לשוקולד להיתפס על הפרי.
  correct: 0
  explanation: >-
    ה־FDA ממליצים על מים זורמים בלי סבון, וייבוש במגבת נקייה שמפחית עוד חיידקים. עם העלים מים לא נכנסים
    לפרי, ויש ידית. לא לשטוף בכלל זה לא בטוח, ומקרר מחזיר את בעיית העיבוי.
- id: q4
  question: >-
    שכנה רוצה להכין יום לפני בר מצווה מגש של תותים, משמשים מיובשים ותמרים בשוקולד. מה אומרים לה?
  options:
    - >-
      להכין הכול יום קודם, כי שוקולד ציפוי סוגר את הפרי ושומר עליו טרי לכמה ימים.
    - >-
      להכין הכול באותו בוקר, כי גם פירות יבשים בשוקולד לא נשמרים יותר מכמה שעות.
    - >-
      את הפירות היבשים יום קודם בקופסה סגורה, ואת התותים באותו יום, במקרר עד ההגשה.
    - >-
      את התותים יום קודם במקפיא, ולהפשיר אותם על השיש שעה לפני שהאורחים מגיעים.
  correct: 2
  explanation: >-
    בפירות יבשים כמעט אין מים חופשיים, והם נשמרים כמו הפרי היבש עצמו. תות טרי ממשיך לשחרר מיץ מתחת
    לשוקולד, ולכן טובלים אותו באותו יום ושומרים במקרר. הפשרה על השיש יוצרת עיבוי ופרי רך.
- id: q5
  question: >-
    טבלתם תותים בקוברטורה מרירה בלי טמפרור. איך מגישים אותם כדי שייראו הכי טוב?
  options:
    - >-
      משאירים אותם על השיש כמה שעות, עד שהשוקולד מתקשה לבד ומקבל ברק.
    - >-
      שומרים במקרר ומגישים קר, ישר לפני האכילה, כי בחדר הקוברטורה מתרככת ומאפירה.
    - >-
      מקפיאים אותם חצי שעה, כי בקור חזק הקוברטורה מתגבשת כמו קוברטורה מטומפרת.
    - >-
      מחממים אותם מעט במייבש שיער לפני ההגשה, כדי שהשוקולד יחזור להבריק.
  correct: 1
  explanation: >-
    קוברטורה בלי טמפרור מתגבשת בצורות לא יציבות: בחדר היא רכה, עמומה ומקבלת פסים. במקרר היא קשה ונראית
    סבירה, ולכן מגישים קר ומיד. מקפיא לא מטמפר, ורק מוסיף עיבוי.
