- id: q1
  question: >-
    זילפתם 12 מנדיאנטים ברצף, ורק אז התחלתם לפזר תוספות. בדיקת ההיפוך: מהדיסקיות האחרונות כמעט
    הכול נשאר, ומהראשונות הרבה נפל. למה?
  options:
    - >-
      על הדיסקיות הראשונות השוקולד כבר התחיל להתקשות, והתוספות לא שקעו בו.
    - >-
      בדיסקיות הראשונות היה פחות שוקולד, כי השקית הייתה מלאה מדי בהתחלה.
    - >-
      התוספות שהונחו ראשונות היו כבדות יותר, ולכן נפלו מהדיסקיות.
    - >-
      השוקולד הראשון היה חם מדי, והתוספות שקעו עד הנייר ונדבקו אליו.
  correct: 0
  explanation: >-
    שוקולד ציפוי מתקשה מהר. תוספת שמונחת על שוקולד שכבר התחיל להתקשות לא שוקעת, ונופלת כשהופכים.
    לכן עובדים בקבוצות של 4: מזלפים ומיד מניחים תוספות.
- id: q2
  question: >-
    קליתם שקדים, ומיד פיזרתם אותם על טבלת bark. סביב כל שקד השוקולד מט ורך. מה לעשות בפעם הבאה?
  options:
    - >-
      לקלות פחות זמן, כי שקדים קלויים מדי משחררים שמן שממיס את השוקולד.
    - >-
      להכניס את הטבלה למקפיא מיד אחרי הפיזור, כדי שהשוקולד יתקשה לפני השקדים.
    - >-
      לתת לשקדים להתקרר לגמרי על צלחת קרה לפני שהם נוגעים בשוקולד.
    - >-
      לפזר את השקדים לפני שיוצקים את השוקולד, כדי שהשוקולד יכסה אותם מלמעלה.
  correct: 2
  explanation: >-
    שקד חם ממיס את השוקולד סביבו, והוא מתקשה מחדש לא אחיד ומט. תוספות צריכות להיות בטמפרטורת החדר.
    מקפיא יוצר עיבוי וסדקים, ולא פותר את החום שבשקד.
- id: q3
  question: >-
    אתם רוצים להכין 30 מנדיאנטים לבת מצווה בעוד שבוע, ולארוז בשקיות צלופן על שולחן מתוקים באולם.
    איזה שוקולד מתאים במודול הזה?
  options:
    - >-
      קוברטורה מרירה בלי טמפרור, כי הטעם שלה טוב יותר ואף אחד לא ישים לב למראה.
    - >-
      טבלאות שוקולד מהסופר שהומסו, כי הן כבר עברו טמפרור אצל היצרן ונשארות כך.
    - >-
      קוברטורה בלי טמפרור ששמרתם במקפיא, כי הקור הופך אותה ליציבה כמו מטומפרת.
    - >-
      שוקולד ציפוי, כי הוא נשאר מבריק בלי טמפרור ונשמר בקופסה סגורה במקום קריר.
  correct: 3
  explanation: >-
    קוברטורה שנמסה מאבדת את הטמפר של היצרן, ובלי טמפרור היא עמומה, רכה ומקבלת פסים, בעיקר אחרי שבוע
    באולם חם. שוקולד ציפוי מתאים. מי שרוצה קוברטורה אמיתית מטמפר אחרי מודול 3.
- id: q4
  question: >-
    הטבלה שלכם מתפוררת לפירורים כשאתם חותכים אותה לריבועים. מה הכי סביר?
  options:
    - >-
      התוספות היו כבדות מדי, ולכן השוקולד נסדק סביבן כשהסכין עברה.
    - >-
      הטבלה דקה מדי או קרה מדי מהמקרר, ונחתכה בסכין קרה.
    - >-
      השוקולד היה חם מדי כשיצקתם, ולכן הוא נשאר רך מבפנים ומתפורר.
    - >-
      שוקולד ציפוי תמיד מתפורר בחיתוך, ולכן שוברים אותו רק ביד.
  correct: 1
  explanation: >-
    שכבה של 1-2 מ"מ, או טבלה קרה מאוד, נשברת לפירורים. 3-5 מ"מ, בטמפרטורת החדר, ובסכין שחוממה במים
    ונוגבה, נותנים חתיכות נקיות. את הפירורים משתמשים כתוספת.
