- id: q1
  question: >-
    מישהי רוצה מקלות שוקו בטעם וניל, ומוסיפה כפית תמצית וניל לשוקולד המומס. השוקולד הסמיך ונהיה
    מגורען. מה קרה ומה עושים בפעם הבאה?
  options:
    - >-
      הווניל קירר את השוקולד, ולכן צריך לחמם את התמצית לפני שמוסיפים אותה.
    - >-
      השוקולד התחמם יותר מדי, ולכן צריך להוסיף את התמצית רק אחרי שהוא מתקרר.
    - >-
      תמצית וניל לא מתאימה לשוקולד מריר, ובפעם הבאה מוסיפים אותה רק לשוקולד לבן.
    - >-
      התמצית הנוזלית גרמה לשוקולד להיתפס; בפעם הבאה תבלינים יבשים, ואת הווניל לחלב בכוס.
  correct: 3
  explanation: >-
    מעט נוזל, כמו כפית תמצית, מושך את הסוכר והקקאו מהשומן והשוקולד נתפס. בכוס יש 200 מ"ל, הרבה מעל
    המינימום, ולכן שם הטעם הנוזלי לא מזיק. את השוקולד שנתפס שותים כשוקו.
- id: q2
  question: >-
    כמה שוקולד שמים במקל לכוס חלב של 200 מ"ל, לפי המינון של Callebaut?
  options:
    - >-
      35 גרם, וקובייה של כ־3×3×3 ס"מ מחזיקה בערך את הכמות הזו.
    - >-
      15 גרם, כי שוקולד מומס בחלב מתפשט ונותן משקה סמיך גם בכמות קטנה.
    - >-
      70 גרם, כי בלי כמות כפולה החלב לא מספיק חם כדי להמיס את השוקולד.
    - >-
      100 גרם, כמו טבלה שלמה, כדי שהמשקה יהיה סמיך כמו בבתי קפה.
  correct: 0
  explanation: >-
    Callebaut כותבים ש־35 גרם הם המנה המתאימה ל־200 מ"ל חלב. מי שאוהב חזק יותר מגדיל ל־45-50 גרם או
    מקטין את הכוס. 100 גרם יתנו משקה כמעט כמו רוטב.
- id: q3
  question: >-
    הכנתם 12 מקלות מקוברטורה בלי טמפרור למתנות לחנוכה, בעוד שלושה שבועות, לחלוקה בכיתה של הילדים.
    מה הבעיה העיקרית ומה עושים?
  options:
    - >-
      הם יתקלקלו ויהיו לא בטוחים לאכילה, ולכן ממיסים אותם ומכינים מחדש ביום החלוקה.
    - >-
      אין בעיה, כי שוקולד שנמס בכוס לא צריך להיראות טוב, ושומרים אותם על השיש.
    - >-
      בחדר הם יתרככו ויקבלו פסים אפורים; שומרים במקרר, או מכינים את המתנות משוקולד ציפוי.
    - >-
      הם ייסדקו במקרר, ולכן מקפיאים אותם עד יום החלוקה ומוציאים בבוקר.
  correct: 2
  explanation: >-
    קוברטורה בלי טמפרור עמומה, רכה ונוטה לפריחת שומן. זה בטוח, אבל מתנה כזו תיראה מוזנחת אחרי שבועות
    בחדר. במקרר היא נשמרת טוב יותר; לשבועות על מדף מתאים שוקולד ציפוי, או טמפרור אחרי מודול 3.
- id: q4
  question: >-
    תקעתם את המקלות מיד אחרי שיצקתם את השוקולד לתבנית, וכולם נפלו על הצד. מה עושים בפעם הבאה?
  options:
    - >-
      משתמשים במקלות כבדים יותר, שיחזיקו את עצמם ישרים גם בשוקולד נוזלי.
    - >-
      מחכים 5-10 דקות עד שהשוליים מסמיכים, ואז תוקעים את המקל לעומק 1.5-2 ס"מ.
    - >-
      מכניסים את התבנית למקפיא ל־20 דקות לפני שתוקעים את המקלות בשוקולד.
    - >-
      תוקעים את המקלות בתבנית הריקה, ויוצקים את השוקולד סביבם.
  correct: 1
  explanation: >-
    שוקולד נוזלי לא מחזיק מקל. כשהשוליים מתחילים להסמיך והמרכז עדיין רך, המקל נכנס ונשאר ישר. במקפיא
    השוקולד מתקשה לגמרי והמקל כבר לא נכנס.
