- id: q1
  question: >-
    המסתם שוקולד מריר והשארתם אותו להתקשות על השיש בלי טמפרור. למחרת הוא עמום, עם פסים אפורים,
    ומתכופף במקום להישבר. מה קרה בתוך חמאת הקקאו?
  options:
    - >-
      השוקולד התחמם יותר מדי, הסוכר נשרף והתגבש על פני השטח ויצר את הפסים האפורים.
    - >-
      חמאת הקקאו נפרדה מהמוצקים ועלתה למעלה, ולכן צריך פשוט לערבב יותר בזמן ההתקשות.
    - >-
      חמאת הקקאו התגבשה קודם בצורות לא יציבות (I-IV), ואחר כך השתנתה בצורה לא אחידה.
    - >-
      השוקולד קיבל לחות מהאוויר בזמן ההתקשות, והמים המסו את הסוכר שעל פני השטח.
  correct: 2
  explanation: >-
    בלי זרעים של צורה V, חמאת הקקאו מתגבשת קודם בצורות הלא יציבות כי הן נוצרות מהר. התוצאה רכה,
    עמומה ומפוספסת. לחות גורמת לפריחת סוכר, שהיא תופעה אחרת עם מראה מחוספס.
- id: q2
  question: >-
    למה טווח העבודה של שוקולד מריר הוא 31-32°C ולא 35°C?
  options:
    - >-
      ב־35°C גם גבישי צורה V (שנמסים ב־33.8°C בערך) נמסים, ולא נשארים זרעים.
    - >-
      ב־35°C השוקולד נוזלי מדי ולכן נוצרות בועות אוויר בתבנית, אבל הגבישים נשמרים.
    - >-
      ב־35°C הסוכר מתחיל להתגבש מחדש, ולכן השוקולד מקבל מרקם גרגרי בפה.
    - >-
      ב־35°C נוצרת צורה VI במקום V, והיא נותנת שוקולד קשה מדי שלא נמס בפה.
  correct: 0
  explanation: >-
    טווח העבודה הוא מעל נקודת ההתכה של צורות I-IV ומתחת לזו של צורה V. מעל כ־34°C גם הזרעים
    הטובים נמסים, והטמפר "נשבר".
- id: q3
  question: >-
    חברה שואלת למה בשוקולד לבן עובדים ב־28-29°C ולא ב־31-32°C כמו במריר. מה התשובה הנכונה?
  options:
    - >-
      בשוקולד לבן אין חמאת קקאו בכלל, אלא שומן צמחי, ולכן הטמפרטורות שלו נמוכות יותר.
    - >-
      בשוקולד לבן יש יותר סוכר, והסוכר מעלה את נקודת ההתכה של חמאת הקקאו.
    - >-
      שוקולד לבן לא צריך טמפרור, והטמפרטורה הנמוכה רק שומרת שלא יישרף.
    - >-
      שומן החלב מתערבב עם חמאת הקקאו ומרכך אותה, ולכן היא מתגבשת בטמפרטורה נמוכה יותר.
  correct: 3
  explanation: >-
    שוקולד לבן אמיתי עשוי מחמאת קקאו, סוכר ואבקת חלב, וצריך טמפרור. שומן החלב מוריד את טמפרטורת
    ההתגבשות, ולכן גם חלב וגם לבן עובדים נמוך יותר ממריר.
- id: q4
  question: >-
    קניתם "שוקולד ציפוי" מריר בקילו, וברכיבים כתוב "שומן צמחי (דקל)". צריך לטמפר אותו לפני טיבול?
  options:
    - >-
      כן, כל שוקולד צריך טמפרור, אחרת הוא יפרח באחסון גם אם השומן שבו צמחי.
    - >-
      לא, השומן הצמחי בא במקום רוב חמאת הקקאו ולא מתגבש בשש הצורות שלה.
    - >-
      כן, אבל בטמפרטורות של שוקולד חלב, כי שומן צמחי מתנהג כמו שומן חלב.
    - >-
      לא, אבל רק אם מוסיפים לו קצת חמאת קקאו כדי שיתקשה מהר יותר.
  correct: 1
  explanation: >-
    שוקולד ציפוי (compound) בנוי על שומן אחר שלא תלוי בצורות הקריסטל של חמאת קקאו, ולכן ממיסים
    ועובדים בלי טמפרור. המחיר: פחות ברק, סנאפ וטעם.
- id: q5
  question: >-
    בניסוי השיעור, דוגמה שלא טומפרה התקשתה אחרי 40 דקות, והחתיכה מהטבלה המקורית נשארה מבריקה ונשברה
    בסנאפ. מה ההסבר?
  options:
    - >-
      הטבלה המקורית עשויה משוקולד אחר עם יותר סוכר, ולכן היא קשה ומבריקה יותר.
    - >-
      הטבלה המקורית קוררה במקרר במפעל, וקירור מהיר הוא מה שנותן ברק וסנאפ.
    - >-
      היצרן טמפר את הטבלה, ולכן חמאת הקקאו שבה כבר מגובשת בצורה V.
    - >-
      הדוגמה הייתה דקה מדי, ודוגמה דקה תמיד מתקשה לאט ויוצאת עמומה.
  correct: 2
  explanation: >-
    טבלה מסחרית נמכרת מטומפרת, כלומר בצורה V. קירור מהיר לבדו דווקא מעודד צורות לא יציבות. זה גם
    מה שמאפשר להשתמש בשוקולד מטומפר כ"זרעים" בשיטת ההזרעה.
