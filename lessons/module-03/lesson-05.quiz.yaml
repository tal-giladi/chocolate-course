- id: q1
  question: >-
    טבלה שהכנתם לפני שבועיים, ויצאה מבריקה, קיבלה שכבה אפורה. כשמעבירים עליה אצבע חמה, השכבה
    נמרחת ונעלמת לרגע. הטבלה עמדה על מדף ליד התנור. מה זה, ומה משנים?
  options:
    - >-
      פריחת סוכר מאדים של התנור. מאחסנים מעכשיו במקרר, כדי שהשוקולד יהיה רחוק מלחות.
    - >-
      פריחת שומן מחום לא קבוע. מאחסנים מעכשיו במקום קבוע של 18-20°C, רחוק מהתנור.
    - >-
      טמפר חלקי ביום היציקה. בפעם הבאה מוסיפים יותר זרעים, והאחסון לא משנה כלום.
    - >-
      עובש שהתחיל להתפתח על פני השוקולד. זורקים את הטבלה ומנקים היטב את המדף.
  correct: 1
  explanation: >-
    שכבה שמנונית שנעלמת במגע היא פריחת שומן. היא הופיעה אחרי שבועיים על טבלה שיצאה טובה, ולכן הסיבה
    היא חום לא קבוע. Callebaut ממליצים על 18-20°C קבוע. פריחה בטוחה לאכילה.
- id: q2
  question: >-
    באוגוסט שמרתם מארז טבלאות במקרר. הוצאתם אותו לסלון של 28°C, פתחתם מיד, ולמחרת יש על הטבלאות
    שכבה לבנה יבשה ומחוספסת. מה היה צריך לעשות?
  options:
    - >-
      להוציא את הקופסה סגורה ולחכות שעה־שעתיים לפני שפותחים, כדי שהעיבוי ייווצר עליה.
    - >-
      להוציא את הטבלאות מהקופסה עוד במקרר, כדי שיתחממו מהר יותר בסלון.
    - >-
      לשמור את הטבלאות במקפיא ולא במקרר, כי שם אין לחות שיכולה לגרום לפריחה.
    - >-
      לטמפר בטמפרטורה גבוהה יותר, כי טבלה מטומפרת היטב לא מקבלת פריחה כזו.
  correct: 0
  explanation: >-
    שכבה יבשה ומחוספסת היא פריחת סוכר מעיבוי: אוויר חם ולח פוגש שוקולד קר. כשהקופסה סגורה, השוקולד
    מתחמם בתוכה והטיפות נוצרות מבחוץ. גם טבלה מטומפרת היטב פורחת כך.
- id: q3
  question: >-
    בטבלה מבריקה, שיצאה מהתבנית בקלות, יש עשרות נקודות עגולות קטנות ועמומות דווקא בצד שנגע בתבנית.
    מה הסיבה הסבירה?
  options:
    - >-
      טמפר חלקי, כי השוקולד התחמם מעל 32°C באמצע היציקה ואיבד את הגבישים.
    - >-
      פריחת סוכר, כי התבנית הוכנסה למקרר מהר מדי אחרי היציקה ונוצר עליה עיבוי.
    - >-
      שוקולד שהתגבש יותר מדי בקערה, ולכן לא מילא את כל השטח של התבנית.
    - >-
      טיפות מים או שאריות בתבנית, שמונעות מהשוקולד לגעת בדופן ולקבל ממנה ברק.
  correct: 3
  explanation: >-
    טבלה שיצאה בקלות ומבריקה ברובה מטומפרת. כתמים עגולים במקומות קבועים בצד התבנית באים ממה שהיה
    בתבנית: טיפות או לכלוך. מייבשים ומשפשפים בצמר גפן לפני היציקה.
- id: q4
  question: >-
    הבדיקות של טבלה: סכין התקשה תוך 4 דקות, ברק טוב, יצאה מהתבנית לבד, אבל הסנאפ רך. היא בעובי 12
    מ"מ והחדר 27°C. מה המסקנה הסבירה?
  options:
    - >-
      הטבלה לא מטומפרת, כי סנאפ הוא הבדיקה החשובה מכולן ואם הוא נכשל השאר לא משנות.
    - >-
      הטבלה מטומפרת יותר מדי, ולכן צריך להמיס אותה ולטמפר שוב בטמפרטורה נמוכה יותר.
    - >-
      הטבלה כנראה מטומפרת. הסנאפ רך בגלל העובי והחום, ובודקים שוב בחדר קריר.
    - >-
      הטבלה מטומפרת רק בחלק החיצוני שלה, ולכן הברק טוב אבל הפנים נשאר רך.
  correct: 2
  explanation: >-
    שלוש בדיקות מתוך ארבע עברו. טבלה עבה בחדר חם נשברת רכה גם כשהיא מטומפרת. מחליטים לפי רוב
    הבדיקות, ובודקים סנאפ שוב בחדר של כ־20°C.
- id: q5
  question: >-
    באמצע יציקה השוקולד המטומפר בקערה ירד ל־28°C והפך סמיך כמו משחה, והקליפות בתבנית יוצאות עבות. מה
    המצב, ומה עושים?
  options:
    - >-
      השוקולד איבד את הטמפר. ממיסים אותו מחדש ל־45°C ומתחילים את הטמפרור מההתחלה.
    - >-
      השוקולד התגבש יותר מדי אבל עדיין מטומפר. מחממים במעלה־שתיים ומערבבים.
    - >-
      השוקולד נתפס מלחות. מוסיפים מעט שמן צמחי כדי להחזיר לו את הנוזליות.
    - >-
      זה המצב הרצוי לתבניות. ממשיכים ככה, כי קליפה עבה חזקה יותר ולא נסדקת.
  correct: 1
  explanation: >-
    לפי Callebaut, שוקולד שהתקרר יותר מדי סמיך מדי ונותן קליפות עבות, אבל הוא עדיין מלא גבישים.
    חימום עדין לטווח העבודה מספיק. המסה מלאה מבזבזת את הטמפר.
