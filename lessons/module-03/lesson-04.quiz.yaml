- id: q1
  question: >-
    אתם מטמפרים 450 גרם שוקולד חלב עם חמאת קקאו באבקה. כמה אבקה שוקלים, ומתי מוסיפים אותה?
  options:
    - >-
      45 גרם, מיד אחרי ההמסה ב־45°C, כדי שהאבקה תתפזר טוב בשוקולד החם.
    - >-
      4.5 גרם, אחרי שהשוקולד התקרר ל־33-34°C, ואז מערבבים עד 29-30°C.
    - >-
      4.5 גרם, אחרי שהשוקולד התקרר ל־27°C, ואז מחממים חזרה ל־29-30°C.
    - >-
      9 גרם, כי בשוקולד חלב צריך כפול, ומוסיפים כשהשוקולד ב־40°C בערך.
  correct: 1
  explanation: >-
    1% ממשקל השוקולד הוא 4.5 גרם. לפי Cacao Barry, בחלב מוסיפים ב־33-34°C ועובדים ב־29-30°C. אין
    צורך לרדת ל־27°C, כי האבקה כבר מביאה גבישים יציבים.
- id: q2
  question: >-
    הוספתם 3 גרם אבקה ל־300 גרם מריר ב־42°C. אחרי ערבוב ל־31°C בדיקת הסכין נשארת רכה. מה קרה?
  options:
    - >-
      האבקה נמסה בשוקולד החם, ולא נשארו בה גבישים יציבים שיזריעו את השוקולד.
    - >-
      הכמות קטנה מדי לשוקולד מריר, שצריך 3% אבקה כי יש בו יותר מוצקי קקאו.
    - >-
      31°C חם מדי לשוקולד עם אבקה, וצריך לעבוד איתו בדיוק ב־27°C.
    - >-
      האבקה הייתה טרייה מדי, וצריך לתת לה לנוח בשוקולד חצי שעה לפני היציקה.
  correct: 0
  explanation: >-
    ב־42°C גם הגבישים היציבים של האבקה נמסים, והיא הופכת לעוד קצת חמאת קקאו נוזלית. מקררים ל־34°C,
    מוסיפים 1% נוסף ומערבבים.
- id: q3
  question: >-
    האבקה עבדה מצוין בחורף. אחרי שהאריזה נשארה שעתיים ברכב באוגוסט היא כבר לא מטמפרת. למה?
  options:
    - >-
      האבקה ספגה ריחות מהרכב, וריחות זרים מפריעים לחמאת הקקאו להתגבש.
    - >-
      בחום האבקה הפכה לצורה VI, שהיא יציבה מדי ולכן לא יכולה להזריע.
    - >-
      בחום הגבישים באבקה נמסו, ואחרי שהתקשתה שוב היא כבר לא בצורה היציבה.
    - >-
      האבקה איבדה לחות ברכב, ובלי לחות היא לא מתפזרת בתוך השוקולד.
  correct: 2
  explanation: >-
    ברכב סגור בקיץ הטמפרטורה עוברת בהרבה את 34°C. הגבישים נמסים, וכשהאבקה מתקשה שוב בלי בקרה היא
    כבר לא זרעים טובים. שומרים אותה סגורה, קרירה ויבשה.
- id: q4
  question: >-
    יש לכם משקל מטבח רגיל בלבד, ברזולוציה של גרם אחד. איך הכי נכון לשקול 3 גרם אבקה?
  options:
    - >-
      שוקלים כפית אחת בערך, כי בכמות כזו קטנה הדיוק לא באמת משנה את התוצאה.
    - >-
      שוקלים 10 גרם ולוקחים מהם בעין שליש, שזה בערך שלושה גרמים.
    - >-
      מוסיפים כמה שיותר אבקה, כי עודף אבקה לא יכול להזיק לטמפר בשום מצב.
    - >-
      קונים משקל דיוק 0.1 גרם, או מטמפרים בהזרעה עד שיהיה כזה.
  correct: 3
  explanation: >-
    במשקל של גרם אחד, 3 גרם יכולים להיות 2 או 4, טעות של שליש. מעט מדי לא מטמפר, ויותר מדי מסמיך
    מהר. בלי משקל דיוק, ההזרעה בטוחה יותר.
