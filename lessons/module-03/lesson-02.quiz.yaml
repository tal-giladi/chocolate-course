- id: q1
  question: >-
    המסתם 200 גרם מריר ל־48°C והוספתם 70 גרם טבליות. תוך דקה הן נעלמו לגמרי, והמדחום מראה 37°C. מה
    עושים?
  options:
    - >-
      ממשיכים לערבב בלי להוסיף כלום עד 31°C, כי הטבליות כבר נמסו ועשו את שלהן.
    - >-
      מכניסים את הקערה למקרר לחמש דקות כדי לקצר את הזמן עד טמפרטורת העבודה.
    - >-
      מוסיפים עוד 20-30 גרם טבליות ומערבבים, כי השוקולד עדיין חם מדי לזרעים.
    - >-
      מחממים בחזרה ל־45°C ומתחילים מחדש, כי הטמפר כבר נהרס ואין טעם להמשיך.
  correct: 2
  explanation: >-
    ב־37°C גבישי V עדיין נמסים, ולכן הזרעים שנעלמו לא השאירו כמעט כלום. Callebaut: אם הטבליות
    נמסות מהר, השוקולד חם מדי, מוסיפים עוד ומערבבים. מקרר מקרר את הדפנות לא אחיד.
- id: q2
  question: >-
    אתם מטמפרים 300 גרם שוקולד לבן בהזרעה. לאיזו טמפרטורת עבודה מכוונים, אם על השק אין עקומה?
  options:
    - >-
      31-32°C, כמו במריר, כי חמאת הקקאו זהה בכל סוגי השוקולד.
    - >-
      28-29°C, כי שומן החלב מוריד את טמפרטורת ההתגבשות של חמאת הקקאו.
    - >-
      25-26°C, כי בשוקולד לבן מטמפרים רק בקירור ולא בחימום חוזר.
    - >-
      34-35°C, כי שוקולד לבן נוזלי יותר וצריך אותו חם כדי לא להסמיך.
  correct: 1
  explanation: >-
    לשוקולד לבן טווח עבודה של כ־28-29°C (למשל Valrhona Ivoire 35%: 28-29°C). 25-26°C הוא שלב
    הקירור בשיטת המשטח, ו־34°C כבר ממיס את גבישי V.
- id: q3
  question: >-
    בדיקת הסכין במטבח ממוזג (21°C) עדיין רכה ודביקה אחרי 6 דקות, והמדחום בקערה מראה 33°C. מה המסקנה?
  options:
    - >-
      השוקולד מטומפר, אבל הסכין הייתה קרה מדי ולכן השכבה עליה לא התקשתה עדיין.
    - >-
      השוקולד מטומפר יותר מדי, ולכן הוא מתקשה לאט וצריך להוסיף לו שוקולד מותך חם.
    - >-
      הבדיקה לא אמינה במטבח ממוזג, ולכן יוצקים ובודקים את הטבלה עצמה אחרי שעה.
    - >-
      השוקולד חם מדי ולא מטומפר. מוסיפים זרעים, מערבבים עד 31-32°C ובודקים שוב.
  correct: 3
  explanation: >-
    שוקולד מטומפר מתקשה בבדיקה תוך 3-5 דקות בחדר של 18-22°C. ב־33°C הזרעים הולכים ונמסים, ולכן
    מוסיפים זרעים, יורדים ליעד ובודקים שוב לפני יציקה.
- id: q4
  question: >-
    באמצע יציקה השוקולד בקערה ירד ל־29°C והסמיך. איך מחזירים אותו לעבודה בלי לאבד את הטמפר?
  options:
    - >-
      חימום עדין במייבש שיער או בפולס של 5 שניות, ערבוב, ובדיקה שלא עבר את 32°C.
    - >-
      חימום במיקרוגל לחצי דקה כדי שיחזור להיות נוזלי לגמרי, ואז ממשיכים לעבוד.
    - >-
      הוספה של כף מים חמים, שמדללת את השוקולד ולא משנה את הטמפרטורה שלו.
    - >-
      ממשיכים לעבוד בו כמו שהוא, כי שוקולד סמיך נותן קליפה עבה וחזקה יותר.
  correct: 0
  explanation: >-
    שוקולד שהתקרר עדיין מטומפר, רק סמיך. מחממים במעלה־שתיים בלבד. חצי דקה במיקרוגל עלולה לעבור את
    34°C ולהמיס את גבישי V, ומים גורמים לשוקולד להיתפס.
- id: q5
  question: >-
    למה Callebaut מסתפקים ב־5% טבליות כזרעים, ובקערה בבית משתמשים בהרבה יותר?
  options:
    - >-
      כי הטבליות של Callebaut מכילות יותר גבישי V מטבליות של יצרנים אחרים.
    - >-
      כי בבית ממיסים לטמפרטורה גבוהה יותר, ולכן צריך יותר זרעים שיישרפו.
    - >-
      כי הם עובדים במכונה שמחזיקה את טמפרטורת העבודה, ובבית הזרעים גם מקררים.
    - >-
      כי בכמויות קטנות צריך אחוז גבוה יותר של זרעים כדי שהטעם יהיה אחיד.
  correct: 2
  explanation: >-
    במכונת המסה התרמוסטט מוריד את הטמפרטורה, והזרעים רק מספקים גבישים. בקערה הזרעים הקרים הם גם
    מה שמוריד את החום, ולכן צריך יותר מהם.
