- id: q1
  question: >-
    יולי, 16:00, אין מזגן במטבח, ומשטח השיש חמים למגע. רציתם לטמפר 300 גרם מריר על המשטח. מה כדאי?
  options:
    - >-
      לעבוד על המשטח כרגיל, אבל לשפוך את כל 300 הגרם ולא רק שני שליש, כדי לקרר מהר יותר.
    - >-
      לקרר את המשטח בקרח בשקית לפני העבודה, לנגב ולהתחיל מיד לשפוך את השוקולד.
    - >-
      להמיס את השוקולד לטמפרטורה נמוכה יותר, כ־35°C, כדי שיהיה פחות מה לקרר על המשטח.
    - >-
      לבחור הזרעה, כי משטח חם לא יוריד את השוקולד ל־27-28°C בזמן סביר.
  correct: 3
  explanation: >-
    מעל 22°C הקירור על המשטח איטי מאוד. קרח משאיר עיבוי, ומים על המשטח הם בעיה לשוקולד. המסה
    ל־35°C לא מוחקת את הגבישים הישנים. בחדר חם ההזרעה בטוחה יותר.
- id: q2
  question: >-
    איך יודעים בלי מדחום שהשוקולד על המשטח קרוב לקירור הנכון?
  options:
    - >-
      הוא מסמיך, מאבד מהברק ונהיה מט, וכששופכים ממנו מהמרית הוא נשאר כפס מוגבה.
    - >-
      הוא נעשה נוזלי יותר ומבריק מאוד, ומתפשט לבד לשכבה דקה בלי שצריך למרוח אותו.
    - >-
      הוא מתקשה לגמרי על המשטח ונשבר במרית, ואז זה הזמן להחזיר אותו לקערה.
    - >-
      מופיעים עליו פסים לבנים קטנים, שהם הסימן לכך שגבישי V התחילו להיווצר בו.
  correct: 0
  explanation: >-
    כשנוצרים גבישים השוקולד מסמיך ומאבד ברק. שוקולד שהתקשה לגמרי הוא כבר גושים שקשה לפרק, ופסים
    לבנים הם סימן לטמפר לא טוב, לא לגבישים טובים.
- id: q3
  question: >-
    החזרתם את השוקולד מהמשטח לקערה וערבבתם. המדחום מראה 34°C במריר. מה עושים?
  options:
    - >-
      ממשיכים ויוצקים, כי 34°C קרוב מספיק לטווח וגבישי V עדיין לא נמסים בו.
    - >-
      שופכים שוב כ־50 גרם על המשטח, מורחים דקה ומחזירים לקערה.
    - >-
      מכניסים את הקערה למקרר לשלוש דקות ומערבבים, עד שהמדחום מראה 31°C.
    - >-
      מוסיפים מעט שוקולד מותך חם, כדי שהשוקולד יהיה נוזלי יותר לפני היציקה.
  correct: 1
  explanation: >-
    34°C זה כבר בגבול ההתכה של צורה V. Smith מתאר בדיוק את התיקון: אם השוקולד לא מטומפר מספיק,
    מעבירים עוד כמות קטנה למשטח לזמן קצר ומחזירים.
- id: q4
  question: >-
    למה מקררים על המשטח ל־27-28°C ואז מחממים חזרה ל־31-32°C, במקום לקרר ישר ל־31°C?
  options:
    - >-
      כי ב־27°C השוקולד סמיך מספיק כדי למלא תבנית בלי בועות אוויר, וב־31°C הוא דליל מדי.
    - >-
      כי החימום החוזר מחזיר לשוקולד את הטעם שנעלם כשהוא התקרר על השיש.
    - >-
      כי בקירור לעומק נוצרים מהר הרבה גבישים, והחימום ממיס את אלה שאינם צורה V.
    - >-
      כי במריר צורה V נוצרת רק מתחת ל־28°C, ומעל זה נוצרת רק צורה VI.
  correct: 2
  explanation: >-
    ב־31°C גבישי V נוצרים לאט מאוד, חודשים לפי Smith. קירור מהיר לעומק יוצר הרבה גבישים קטנים, חלקם לא
    יציבים, והחימום החוזר משאיר רק את גבישי V.
