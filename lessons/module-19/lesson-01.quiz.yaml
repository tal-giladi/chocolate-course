- id: q1
  question: >-
    מארז 5 סביבונים לוקח לכם 25 דקות, ואתם רוצים 50 ₪ לשעה. כמה עולה העבודה במארז?
  options:
    - >-
      12.50 ₪, כי מחלקים 25 דקות בשתיים ומכפילים בשכר של חצי שעה עבודה.
    - >-
      50 ₪, כי כל מארז שמתחילים להכין נספר כשעת עבודה שלמה בגיליון.
    - >-
      20.83 ₪, כי 25 דקות חלקי 60 הן 0.417 שעה, כפול 50 ₪ לשעה.
    - >-
      0 ₪, כי בעסק קטן הזמן שלכם הוא לא הוצאה שיוצאת מהכיס בפועל.
  correct: 2
  explanation: >-
    עבודה = דקות ÷ 60 × שכר שעתי: 25 ÷ 60 × 50 = 20.83 ₪. במארז הזה זו השורה הגדולה ביותר, יותר
    מחומרי הגלם והאריזה יחד. גיליון בלי שורת עבודה נותן מחיר שלא משלם לכם על הזמן.
- id: q2
  question: >-
    אתם עוסקים פטורים. קניתם קופסאות ב־15 ₪ לחבילה של 10, כולל מע"מ. איזה מחיר רושמים בגיליון?
  options:
    - >-
      1.50 ₪ לקופסה, כולל המע"מ, כי עוסק פטור לא מקזז את המע"מ ששילם על קניות.
    - >-
      1.27 ₪ לקופסה, אחרי שמורידים את המע"מ, כי מע"מ לעולם לא נחשב חלק מהעלות.
    - >-
      15 ₪ לכל קופסה, כי את האריזה רושמים לפי מחיר החבילה ולא לפי מחיר ליחידה.
    - >-
      1.77 ₪ לקופסה, כי מוסיפים 18% מע"מ על המחיר שבקבלה כדי להגיע למחיר מלא.
  correct: 0
  explanation: >-
    לפי כל זכות (נבדק 2026-11-10), עוסק פטור לא גובה מע"מ וגם לא מקזז את המע"מ ששילם, ולכן המע"מ
    הוא חלק מהעלות שלו: 15 ÷ 10 = 1.50 ₪. עוסק מורשה מקזז, ולכן אצלו העלות לפני מע"מ נמוכה יותר.
- id: q3
  question: >-
    ספק הסליקה גובה 1.7% ועוד 1 ₪ לעסקה, לא כולל מע"מ. איפה העמלה הזאת נכנסת לגיליון?
  options:
    - >-
      בחלק 1, עם חומרי הגלם, כי בלי תשלום מהלקוח אין בכלל חומרי גלם.
    - >-
      בעלות לכל מארז, אחוז קבוע מהעלות, כמו הפחת שמוסיפים על הכול.
    - >-
      בשום מקום, כי את העמלה הלקוח משלם בנפרד לחברת האשראי שלו.
    - >-
      כעלות להזמנה, כי הסכום הקבוע חל פעם אחת על כל עסקה, לא על כל מארז.
  correct: 3
  explanation: >-
    העמלה מחושבת על התשלום, ולכן היא עלות להזמנה. הסכום הקבוע (1 ₪) מכביד בעיקר על הזמנות קטנות:
    כמעט 2% מהזמנה של 58 ₪, ופחות מ־0.2% מהזמנה של 580 ₪. עוסק פטור משלם גם את המע"מ על העמלה.
- id: q4
  question: >-
    הוצאות קבועות של 3,600 ₪ בשנה חולקו ל־900 מארזים צפויים, 4 ₪ למארז. בסוף העונה מכרתם 450. מה
    נכון?
  options:
    - >-
      שום דבר לא השתנה, כי הוצאות קבועות הן תמיד 4 ₪ למארז בכל כמות שמוכרים.
    - >-
      ההוצאות הקבועות לכל מארז היו בפועל 8 ₪, ולכן בודקים שוב את הגיליון ואת המחיר.
    - >-
      ההוצאות הקבועות ירדו לחצי, כי מכרתם חצי מהמארזים שתכננתם בתחילת העונה.
    - >-
      מוחקים את השורה, כי הוצאה שלא תלויה בכמות לא שייכת לעלות של מארז.
  correct: 1
  explanation: >-
    הוצאות קבועות לא משתנות עם הכמות, ולכן כשמוכרים פחות, כל מארז נושא חלק גדול יותר: 3,600 ÷ 450 =
    8 ₪. בגלל זה בודקים את המספר בסוף כל עונה, ומסמנים אותו "הנחה" עד שיש נתונים.
- id: q5
  question: >-
    משלוח בשליח עולה כ־70 ₪ לחבילה, והמארז שלכם עולה פחות מזה. מה הדרך הנכונה לרשום את זה?
  options:
    - >-
      מוסיפים 70 ₪ לעלות של כל מארז, כי כל מארז שיוצא מהבית צריך משלוח משלו.
    - >-
      מתעלמים, כי לקוחות מצפים למשלוח חינם ואין דרך לגבות עליו כסף בכלל.
    - >-
      כשורה נפרדת להזמנה, או איסוף עצמי, כי משלוח אחד יכול לשאת כמה מארזים.
    - >-
      מחלקים 70 ₪ במספר המארזים שתמכרו בשנה, כמו את ההוצאות הקבועות של העסק.
  correct: 2
  explanation: >-
    משלוח הוא עלות להזמנה וליעד. בבדיקה של ice (19.11.2025) משלוח מדלת לדלת של 5 ק"ג עלה כ־70 ₪,
    יותר מהמארז. לכן הוא שורה נפרדת שהלקוח רואה, או איסוף; בהזמנה של 60 מארזים לכתובת אחת הוא
    מתחלק ל־1.17 ₪ למארז.
