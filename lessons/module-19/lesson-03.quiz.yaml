- id: q1
  question: >-
    יש לכם 2 תבניות שנותנות 19 מארזי סביבונים ביום, אבל עם 6 שעות עבודה ו־25 דקות למארז אתם מגיעים
    ל־14. מה יקרה אם תקנו תבנית שלישית?
  options:
    - >-
      הקיבולת תעלה לכ־28 מארזים ביום, כי כל תבנית מוסיפה בערך חצי מהקיבולת.
    - >-
      הקיבולת תעלה ל־19 מארזים ביום, כי התבנית החדשה תשחרר את העבודה הידנית.
    - >-
      הקיבולת תישאר כ־14 מארזים ביום, כי הידיים הן צוואר הבקבוק ולא התבניות.
    - >-
      הקיבולת תרד, כי עוד תבנית דורשת עוד ניקוי ועוד זמן במקרר בכל סבב.
  correct: 2
  explanation: >-
    קיבולת היא המספר הקטן מבין תבניות, ידיים ומקום. כאן הידיים (360 ÷ 25 = 14.4) קטנות מהתבניות
    (19.2), ולכן תבנית נוספת לא מוסיפה מארזים. מקצרים שלב ידני, או מוסיפים שעות.
- id: q2
  question: >-
    הקיבולת שחישבתם היא 14.4 מארזים ביום. כמה מתכננים לייצר ביום בעונה, לפי השיעור?
  options:
    - >-
      כ־11, כ־80% מהקיבולת, כדי להשאיר מרווח לטמפרור שנכשל וליום רע.
    - >-
      14.4 בדיוק, כי כל מארז שלא מייצרים הוא הכנסה שהולכת לאיבוד בעונה.
    - >-
      כ־18, כי בעונה עובדים מהר יותר וכדאי לתכנן קצת מעל הקיבולת שמדדתם.
    - >-
      כ־7, חצי מהקיבולת, כי בעונה עמוסה כל דבר לוקח בדיוק פי שניים זמן.
  correct: 0
  explanation: >-
    14.4 הוא מספר של יום שבו הכול עובד. תכנון ב־80% (כ־11) משאיר מרווח לטמפרור שנכשל, לניקוי חוזר
    וליום חם, והוא ההבדל בין עונה עמוסה לעונה שבה מאחרים ללקוחות.
- id: q3
  question: >-
    חנוכה 2026 מתחיל בערב שישי 4.12. מתי כדאי להזמין את חומרי הגלם לשלושת השבועות העמוסים?
  options:
    - >-
      ביום חמישי 3.12, כדי שהשוקולד יהיה טרי ככל האפשר כשמגיעים הלקוחות.
    - >-
      בתחילת השבוע של 22.11, אחרי שיודעים בדיוק כמה הזמנות פרטיות התקבלו.
    - >-
      רק כשנגמר המלאי בבית, כדי לא לקנות שוקולד שאולי לא יהיה בו שימוש.
    - >-
      עד 12.11, שבועיים לפני השבוע הראשון, מספק ראשי ועם ספק גיבוי רשום.
  correct: 3
  explanation: >-
    השבועות העמוסים הם 15.11 עד 3.12. חנויות מציגות לפעמים "במלאי" כשהמוצר אזל, ולפני חג הביקוש
    גבוה, ולכן מזמינים שבועיים לפני השבוע הראשון ורושמים ספק גיבוי עם אותו אחוז קקאו.
- id: q4
  question: >-
    ייצרתם 60 מארזי סביבונים שבועיים לפני המסירה. איפה ואיך שומרים אותם?
  options:
    - >-
      במקרר, בקופסה פתוחה, כדי שהשוקולד יישאר קשה עד יום המסירה ללקוח.
    - >-
      במקום קבוע של 18-20°C, בקופסאות סגורות, רחוק מחלון ומתנור.
    - >-
      במקפיא, ומוציאים יום לפני המסירה, כדי לעצור כל שינוי בברק ובטעם.
    - >-
      על השיש במטבח, כי שם הכי נוח לארוז אותם בין סבבי הייצור של היום.
  correct: 1
  explanation: >-
    Callebaut ממליצים לאחסן מוצרים מוגמרים בטמפרטורה קבועה של 18-20°C. מקרר ומקפיא מביאים עיבוי
    כשמוציאים, ושיש ליד תנור הוא טמפרטורה משתנה. סביבון מוצק מחזיק כך שבועות.
- id: q5
  question: >-
    בעונה יש גם מארז פרווה שמוכר ללקוחות שמקפידים, וגם מארזי חלב ולבן. איך מסדרים את יום הייצור?
  options:
    - >-
      קודם חלב ולבן, כי הם מהירים יותר, ובסוף היום הפרווה כשיש יותר זמן פנוי.
    - >-
      כל המוצרים יחד באותה קערה, כדי לחסוך טמפרור ולהספיק יותר מארזים ביום.
    - >-
      מוצר הפרווה ראשון, בכלים נקיים, ורק אם כל הרכיבים פרווה לפי האריזה.
    - >-
      לפי סדר ההזמנות שהתקבלו, כי לקוח שהזמין קודם צריך לקבל את המארז קודם.
  correct: 2
  explanation: >-
    סדר יום הוא חלק מהתוכנית: פרווה או בלי אלרגן בבוקר, אחרי ניקוי, ואחר כך חלבי. "פרווה" נקבע לפי
    מה שכתוב על אריזות הרכיבים, ובמקרה של ספק שואלים את הרב.
