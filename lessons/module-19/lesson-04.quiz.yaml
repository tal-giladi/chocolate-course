- id: q1
  question: >-
    עלות ליחידה של מארז היא 37.36 ₪, והעמלה היא 1.7% ועוד 1 ₪, ועוד מע"מ על העמלה. מה מחיר הרצפה,
    שבו המרווח הוא אפס?
  options:
    - >-
      37.36 ₪, כי מחיר רצפה הוא העלות ליחידה בלי שום תוספת של עמלה או רווח.
    - >-
      29.89 ₪, כי מחיר רצפה הוא העלות ליחידה פחות 20%, ההנחה המקסימלית לחברות.
    - >-
      58 ₪, כי מחיר רצפה הוא המחיר לצרכן שנקבע אחרי שבחרנו מרווח של 25%.
    - >-
      כ־39.33 ₪, כי גם במרווח אפס צריך לכסות את העמלה שתלויה במחיר עצמו.
  correct: 3
  explanation: >-
    מחיר רצפה = (37.36 + 1.18) ÷ (1 − 0.02006) = 39.33 ₪. הוא מכסה את כל העלויות, כולל השכר
    ששמתם לעצמכם, ולא משאיר רווח. שום מחיר, גם לא לחברות, לא יורד מתחתיו.
- id: q2
  question: >-
    בבדיקת רגישות יצא: 10 דקות עבודה נוספות מורידות את המרווח מ־31.6% ל־17.2%, ושוקולד יקר ב־20%
    מוריד אותו ל־28.8%. מה המסקנה?
  options:
    - >-
      הדקות הן ההנחה הכי מסוכנת, ולכן מודדים אותן ברצף לפני העונה.
    - >-
      מחיר השוקולד הוא הסיכון הגדול, ולכן קונים כבר עכשיו מלאי לשנה שלמה.
    - >-
      שתי ההנחות זהות בסיכון, ולכן אין טעם לבדוק אף אחת מהן לפני העונה.
    - >-
      בדיקת רגישות לא רלוונטית לעסק קטן, כי המספרים בה הם הנחות בלבד.
  correct: 0
  explanation: >-
    במוצר בעבודת יד העבודה היא השורה הכי גדולה, ולכן שינוי קטן בדקות מזיז את המרווח הכי הרבה.
    מודדים כמה מארזים ברצף, ואם המרווח שביר, מעלים מחיר או מקצרים שלב.
- id: q3
  question: >-
    החלפתם לעונה משקית של 90 ₪ לק"ג לאריזות של 1 ו־2.5 ק"ג, ושמרתם על מחיר של 58 ₪. מה קרה למרווח
    בגיליון?
  options:
    - >-
      ירד, כי אריזה גדולה מגדילה את הפחת וזה מבטל את החיסכון במחיר הקנייה.
    - >-
      לא השתנה, כי המחיר לצרכן לא השתנה, ולכן גם הרווח נשאר אותו רווח.
    - >-
      עלה מ־26.9% ל־31.6%, כי השוקולד במארז ירד מ־9.45 ₪ ל־7.06 ₪.
    - >-
      עלה ליותר מ־60%, כי חומרי הגלם הם השורה הגדולה ביותר בכל מארז.
  correct: 2
  explanation: >-
    השוקולד ירד ב־2.39 ₪, והפחת עליו ירד גם הוא, ולכן הרווח עלה ל־18.30 ₪ והמרווח ל־31.6%. העבודה,
    השורה הגדולה ביותר, לא השתנתה.
- id: q4
  question: >-
    אתם עוסקים מורשים, והעתקתם לחלק 1 של הגיליון את המחירים מהקבלות, כולל מע"מ. מה הבעיה?
  options:
    - >-
      אין בעיה, כי כל עסק רושם את המחיר ששילם בפועל לפי הקבלה שקיבל בחנות.
    - >-
      העלות מנופחת, כי עוסק מורשה מקזז את המע"מ על הקניות, ולכן רושמים לפני מע"מ.
    - >-
      העלות נמוכה מדי, כי עוסק מורשה צריך להוסיף עוד 18% על כל מחיר בקבלה.
    - >-
      הגיליון לא חוקי, כי עוסק מורשה חייב להגיש אותו לרשות המסים בכל עונה.
  correct: 1
  explanation: >-
    עוסק מורשה מקזז את המע"מ ששילם, ולכן העלות שלו היא המחיר לפני מע"מ (המחיר ÷ 1.18) על מה שמקוזז.
    עוסק פטור, לעומת זאת, רושם כולל מע"מ, כי הוא לא מקזז. מעמד המע"מ נכתב בראש הגיליון.
- id: q5
  question: >-
    איזו שורה בגיליון שנשלח לחברה היא בעייתית, אם אין לכם תעודת כשרות?
  options:
    - >-
      "כשרות הרכיבים: כפי שכתובה על אריזות השוקולד", עם רשימת ההכשרים שעל האריזות.
    - >-
      "אלרגנים: סויה, חלב; עלול להכיל אגוזים", כפי שכתוב על אריזות חומרי הגלם.
    - >-
      "המחיר אינו כולל מע"מ, כי העסק הוא עוסק פטור ואינו גובה מע"מ מלקוחות".
    - >-
      "מארז כשר, מתאים לכל העובדים", כי אסור לסמן או לפרסם כשר בלי תעודה.
  correct: 3
  explanation: >-
    לפי חוק איסור הונאה בכשרות אסור לסמן או לפרסם מוצר כ"כשר" בלי תעודת הכשר, וזה כולל הצעה לחברה.
    מותר לכתוב עובדות על הרכיבים כפי שהן על האריזות (17.4). אם יש ספק, שואלים את הרב.
