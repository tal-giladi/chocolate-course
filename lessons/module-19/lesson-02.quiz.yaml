- id: q1
  question: >-
    מארז עולה לכם 40 ₪ ואתם מוכרים אותו ב־60 ₪. מה המרווח ומה התוספת על העלות?
  options:
    - >-
      מרווח 50% ותוספת 33.3%, כי המרווח מחושב תמיד מהעלות ולא מהמחיר.
    - >-
      מרווח 33.3% ותוספת 50%, כי 20 ₪ רווח הם שליש מהמחיר וחצי מהעלות.
    - >-
      מרווח 50% ותוספת 50%, כי שני המונחים מתארים את אותו רווח של 20 ₪.
    - >-
      מרווח 20% ותוספת 20%, כי כך נקרא הרווח בשקלים כשמחלקים אותו במאה.
  correct: 1
  explanation: >-
    מרווח = רווח ÷ מחיר = 20 ÷ 60 = 33.3%. תוספת = רווח ÷ עלות = 20 ÷ 40 = 50%. אותו רווח, שני
    אחוזים. מי שרוצה מרווח של 50% צריך מחיר של 80 ₪, כלומר תוספת של 100%.
- id: q2
  question: >-
    עלות המארז 40.04 ₪ ורציתם "25% רווח", ולכן כתבתם מחיר של 40.04 × 1.25 = 50.05 ₪. העמלה היא
    כ־2.18 ₪. מה המרווח בפועל?
  options:
    - >-
      בדיוק 25%, כי הכפלתם את העלות ב־1.25 וזה האחוז שרציתם מההתחלה.
    - >-
      כ־20%, כי תוספת של 25% היא מרווח של 20%, והעמלה לא משנה את התוצאה.
    - >-
      כ־30%, כי העמלה משולמת על ידי הלקוח ולכן היא מגדילה את הרווח שלכם.
    - >-
      כ־15.6%, כי תוספת של 25% היא רק 20% מרווח, והעמלה מורידה עוד.
  correct: 3
  explanation: >-
    50.05 − 40.04 − 2.18 = 7.83 ₪ רווח, ו־7.83 ÷ 50.05 = 15.6%. הדרך הנכונה: מחיר = (עלות + 1.18) ÷
    (1 − 0.25 − 0.02006) = 56.47 ₪, ואחר כך בדיקה בחזרה.
- id: q3
  question: >-
    אתם עוסקים פטורים ומוכרים מארז ב־58 ₪. חבר שהוא עוסק מורשה מוכר מארז זהה, עם אותן עלויות, גם
    ב־58 ₪ לצרכן. למי נשאר יותר?
  options:
    - >-
      לכם, כי הוא מעביר 18% מע"מ מהמחיר, והקיזוז על הקניות מחזיר לו רק חלק מזה.
    - >-
      לו, כי עוסק מורשה מקזז מע"מ על כל ההוצאות, גם על שעות העבודה שלו עצמו.
    - >-
      לשניכם אותו דבר, כי מע"מ הוא כסף של המדינה ולא משפיע על הרווח של העסק.
    - >-
      לו, כי עוסק מורשה רשאי להציג לצרכן מחיר בלי מע"מ ולהוסיף אותו בקופה.
  correct: 0
  explanation: >-
    בדוגמה בשיעור: לעוסק הפטור נשארים 15.62 ₪, ולעוסק המורשה 9.44 ₪. מתוך 58 ₪ הוא מעביר 8.85 ₪
    מע"מ, ומקזז רק את המע"מ על החומרים והעמלה. ולצרכן מציגים תמיד מחיר כולל מע"מ (סעיפים 17א-17ב).
- id: q4
  question: >-
    חברה מזמינה 60 מארזים. איזו דרך לקבוע לה מחיר מתאימה למה שלמדנו?
  options:
    - >-
      נותנים 10% הנחה מהמחיר לצרכן, כי זה המקובל בהזמנות גדולות בכל ענף.
    - >-
      גובים את המחיר לצרכן, כי ההזמנה הגדולה ממילא דורשת יותר עבודה מכם.
    - >-
      מחשבים עלות למארז במדרגה הזו (עבודה, משלוח, עמלה, מיתוג) ומחיר שמשאיר אותו מרווח.
    - >-
      מורידים את שורת העבודה מהעלות, כי בהזמנה גדולה העבודה מתחלקת על הרבה מארזים.
  correct: 2
  explanation: >-
    בכמות חלק מהעלויות יורדות (עבודה בסדרה, משלוח אחד, העברה בנקאית) וחלק עולות (מיתוג, הון).
    בדוגמה: 38.05 ₪ למארז, מחיר 52 ₪, מרווח 26.8%, ומקדמה של 936 ₪ שמכסה 912.60 ₪ חומרים ואריזה.
- id: q5
  question: >-
    אתם עוסקים מורשים. חברה מזמינה 100 מארזים ב־52 ₪ לפני מע"מ, בדצמבר 2026. מה צריך לבדוק?
  options:
    - >-
      שום דבר מיוחד, כי מספר הקצאה נדרש רק כשהלקוח הוא אדם פרטי ולא חברה.
    - >-
      ש־5,200 ₪ לפני מע"מ עוברים 5,000 ₪, ולכן החשבונית צריכה מספר הקצאה.
    - >-
      לפצל לשתי חשבוניות של 50 מארזים, כדי שכל אחת תהיה מתחת לסף בצורה חוקית.
    - >-
      רק אם הסכום כולל מע"מ עובר 6,000 ₪, כי הסף נמדד תמיד על המחיר הכולל.
  correct: 1
  explanation: >-
    מ־1.6.2026, חשבונית מס מעל 5,000 ₪ לפני מע"מ צריכה מספר הקצאה; בלעדיו הלקוח עלול לא לקזז מע"מ.
    לפי ynetnews, פיצול מלאכותי של עסקה כדי לעקוף את הסף נחשב פסול. מידע כללי, נבדק 2026-11-10.
