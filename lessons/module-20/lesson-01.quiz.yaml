- id: q1
  question: >-
    חבילה בסיסית עולה 39 ₪ בחודש ועוד 5.5% מכל הזמנה. חבילה מתקדמת עולה 189 ₪ בחודש ועוד 0.55%.
    מתי המתקדמת זולה יותר?
  options:
    - >-
      תמיד, כי האחוז שלה נמוך פי עשרה מהאחוז של החבילה הבסיסית.
    - >-
      אף פעם, כי המנוי שלה גבוה פי חמישה מהמנוי של החבילה הבסיסית.
    - >-
      כשהמחזור החודשי עובר כ־3,030 ₪, כלומר 150 ₪ חלקי 4.95%.
    - >-
      כשמספר ההזמנות בחודש עובר 189, בלי קשר למחיר של כל הזמנה.
  correct: 2
  explanation: >-
    הפרש המנויים (150 ₪) מתחלק בהפרש האחוזים (4.95%): 3,030 ₪ בחודש. מתחת לזה הבסיסית זולה, מעל
    זה המתקדמת. הנקודה תלויה במחזור בשקלים, לא במספר ההזמנות.
- id: q2
  question: >-
    אתם בונים חנות ב־Shopify בישראל וחישבתם רק את המנוי ואת עמלת ספק הסליקה. מה חסר בחישוב?
  options:
    - >-
      עמלת פלטפורמה של Shopify (2% בחבילת Basic), כי Shopify Payments לא זמין בישראל.
    - >-
      שום דבר, כי Shopify לא גובים אחוז מהמכירות כשמשלמים מנוי שנתי מראש.
    - >-
      מע"מ על המשלוח, כי Shopify מוסיפים אותו לכל הזמנה בישראל באופן אוטומטי.
    - >-
      דמי הקמה חד־פעמיים, שגובים מכל חנות חדשה בחודש הראשון של המנוי.
  correct: 0
  explanation: >-
    לפי דף המחירים (נבדק 2026-11-10), בשימוש בספק תשלום חיצוני Shopify גובים 2% בחבילת Basic. ישראל
    לא ברשימת המדינות של Shopify Payments, ולכן העמלה חלה בנוסף לעמלת הסליקה.
- id: q3
  question: >-
    לקוחה כותבת באינסטגרם: "למה אין כפתור קנייה על התמונה?". מה המצב לעסק ישראלי, לפי מה שנמצא?
  options:
    - >-
      הכפתור מופיע רק לעסקים שמשלמים על חבילת פרסום חודשית של מטא בישראל.
    - >-
      הכפתור קיים, אבל צריך לאשר אותו מחדש בכל חודש דרך מנהל המסחר.
    - >-
      הכפתור מופיע רק אחרי שהעסק מגיע למספר מסוים של עוקבים בחשבון.
    - >-
      מאז אוגוסט 2023 אין חנות בתוך האפליקציה בישראל; מפנים בקישור לאתר.
  correct: 3
  explanation: >-
    לפי ynetnews (2023), מטא הפסיקו לתמוך בחנויות בלי תשלום בתוך האפליקציה, שמעולם לא אושר בישראל.
    עסקים ישראליים נשארו עם קישור לאתר חיצוני. בודקים שוב אם המצב השתנה.
- id: q4
  question: >-
    מה מהבאים חייב להופיע בדף מוצר לפני שהלקוח משלם, לפי חוק הגנת הצרכן?
  options:
    - >-
      מספר ההזמנות שכבר נמכרו מהמארז, כדי שהלקוח ידע שהוא פופולרי.
    - >-
      המחיר הכולל עם מע"מ, פרטי העסק, מועד ודרך האספקה, ותנאי הביטול.
    - >-
      מחיר לפני מע"מ, כשהמע"מ מתווסף רק בעמוד התשלום בסוף ההזמנה.
    - >-
      שם ספק הסליקה ואחוז העמלה שהוא גובה מהעסק על כל עסקה.
  correct: 1
  explanation: >-
    סעיף 14ג(א) דורש גילוי של פרטי העסק, תכונות המוצר, מחיר, אספקה וביטול; סעיף 17 דורש להציג את
    המחיר הכולל, כולל מע"מ. מידע כללי, לא ייעוץ משפטי.
- id: q5
  question: >-
    Wolt מציעים לכם להצטרף בלי מנוי. מה השאלה הראשונה שכדאי לשאול לפני שמחשבים כדאיות?
  options:
    - >-
      מה אחוז העמלה על כל הזמנה, כי הוא לא מופיע בדף שלהם לעסקים.
    - >-
      כמה עולה המנוי השנתי, כי בתשלום שנתי יש בדרך כלל הנחה של 20%.
    - >-
      איזה ספק סליקה צריך לחבר, כי הלקוחות משלמים לכם ישירות באתר.
    - >-
      מי מצלם את המוצרים, כי Wolt דורשים צלם מטעמם לכל מוצר חדש.
  correct: 0
  explanation: >-
    לפי הדף של Wolt לעסקים בישראל (נבדק 2026-11-10), אין מנוי או דמי הצטרפות, ויש עמלה על כל הזמנה,
    אבל האחוז לא מופיע. בלי האחוז אי אפשר לחשב מרווח (19.2).
