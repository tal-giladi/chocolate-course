- id: q1
  question: >-
    הזמנה של מארז סביבונים לבאר שבע ביולי, בחבילה שמגיעה ביום העסקים הבא. מה אומר כלל הקיץ של הקורס?
  options:
    - >-
      שולחים בקרטון רגיל, כי ביום אחד השוקולד לא מספיק להתחמם עד נקודת ההתכה.
    - >-
      לא שולחים חבילה; מציעים שליח באותו יום בקופסה מבודדת, איסוף, או לחכות לחורף.
    - >-
      שולחים בקופסה מבודדת עם קרחון, וזה מספיק לכל חבילה בכל טמפרטורה בחוץ.
    - >-
      שולחים כרגיל, ומבקשים מהלקוח לשים את המארז במקרר מיד כשהוא מגיע.
  correct: 1
  explanation: >-
    ביולי הממוצע המרבי בבאר שבע 34.5°C, מעל 33.8°C שבו צורה V נמסה. מאפריל עד אוקטובר כל יום הוא
    לפחות "צהוב", ובצהוב לא שולחים חבילות שמחכות לילה במחסן או בלוקר.
- id: q2
  question: >-
    אורזים מארז בקופסה מבודדת עם קרחון ג'ל. מה הסידור הנכון?
  options:
    - >-
      הקרחון ישירות על המארז, כדי שיקרר אותו כמה שיותר מהר בתחילת הדרך.
    - >-
      כמה קרחונים קטנים מפוזרים סביב, והרבה אוויר ריק כדי שהקור יסתובב.
    - >-
      המארז בשקית סגורה, קרטון בינו לבין קרחון גדול, חלל מלא ותפרים מודבקים.
    - >-
      המארז קפוא מראש מהמקפיא, כדי שלא יהיה צורך בקרחון בתוך הקופסה בכלל.
  correct: 2
  explanation: >-
    לפי RCI קרחון גדול אחד עדיף, ממלאים חלל ומדביקים תפרים; לפי Lake Champlain שקית נגד לחות. קרחון
    שנוגע בשוקולד יוצר עיבוי ופריחת סוכר (11.3).
- id: q3
  question: >-
    לקוחה מתל אביב מזמינה מארז טראפלס שמנת ומבקשת שליח שיאסוף בבוקר וימסור "עד הערב". מה עונים?
  options:
    - >-
      טראפלס רק באיסוף או מסירה ביד, בצידנית, עד שעתיים מחוץ למקרר בסך הכול.
    - >-
      מאשרים, בתנאי שהשליח שם את המארז בצידנית שלו ושהלקוחה תכניס למקרר.
    - >-
      מאשרים בחורף בלבד, כי מתחת ל־25°C אין מגבלת זמן על מוצרים עם שמנת.
    - >-
      מאשרים, ומוסיפים לתווית "לשמור בקירור", כי סעיף 156 מעביר את האחריות לשליח.
  correct: 0
  explanation: >-
    טראפלס שמנת הוא קבוצה ג: לפי UF/IFAS עד שעתיים בטמפרטורת החדר (שעה מעל 32°C), כולל הנסיעה. ולא
    אומת אם מותר להוביל אותו בלי רישיון הובלה (סעיף 149); שואלים את לשכת הבריאות.
- id: q4
  question: >-
    בניסוי, הקופסה המבודדת שלכם עברה 25°C אחרי 3 שעות ב־33°C. איך משתמשים במספר?
  options:
    - >-
      מתעלמים ממנו, כי קופסה מבודדת תמיד מחזיקה יומיים לפי הספקים.
    - >-
      כותבים במדיניות שהמארז מחזיק 3 שעות בכל חום, גם באילת באוגוסט.
    - >-
      מוסיפים קרחון שני ושולחים חבילות גם בקיץ, בלי לחזור על הניסוי.
    - >-
      קובעים לפיו את חלון השליח בצהוב: איסוף ומסירה בפחות מ־3 שעות.
  correct: 3
  explanation: >-
    הניסוי נותן מספר שלכם, בחום מסוים. הוא קובע כמה זמן מותר למארז להיות בדרך בימים צהובים. בחום
    אחר או בקופסה אחרת, מודדים שוב.
- id: q5
  question: >-
    לקוח קיבל מארז בקופסה מבודדת ביום חם. מה כתוב בפתק שבתוך הקופסה?
  options:
    - >-
      להכניס מיד למקרר, ולפתוח את השקית רק כשרוצים לאכול מהמארז.
    - >-
      להוציא מהקופסה, לא לפתוח את השקית כשעה, ולשמור ב־18-20°C, לא במקרר.
    - >-
      לפתוח מיד את השקית ולייבש את השוקולד במגבת, כדי שלא יישארו טיפות.
    - >-
      להשאיר את המארז בקופסה המבודדת עם הקרחון עד שאוכלים את כל השוקולד.
  correct: 1
  explanation: >-
    שוקולד שהתקרר בדרך נפתח רק בטמפרטורת החדר, אחרת מתעבים עליו מים (Callebaut). שוקולד מוצק נשמר
    ב־18-20°C ולא במקרר, וזו ההוראה שאתם, כיצרן, כותבים על המארז (סעיף 156).
