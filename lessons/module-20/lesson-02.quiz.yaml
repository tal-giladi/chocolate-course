- id: q1
  question: >-
    עוסקת פטורה מוכרת מארז ב־58 ₪. ספק הסליקה גובה 1.7% ועוד 1 ₪ לעסקה, לא כולל מע"מ. כמה עולה לה
    העמלה על הזמנה אחת?
  options:
    - >-
      0.99 ₪, כי מחשבים רק את האחוז, והסכום הקבוע חל רק על הזמנות גדולות.
    - >-
      1.99 ₪, כי מע"מ על העמלה מקוזז אצל כל עסק, גם אצל עוסק פטור.
    - >-
      2.34 ₪, כי לאחוז ולסכום הקבוע מוסיפים מע"מ שהיא לא מקזזת.
    - >-
      1.70 ₪, כי העמלה היא אחוז אחד קבוע מכל הזמנה ולא תלויה בסכום.
  correct: 2
  explanation: >-
    (58 × 1.7% + 1) = 1.986 ₪ לפני מע"מ. עוסק פטור לא מקזז מע"מ, ולכן כופלים ב־1.18 ומקבלים 2.34 ₪
    (18% מ־1.1.2025, לפי כל זכות).
- id: q2
  question: >-
    חברה מזמינה מכם 120 מארזים, ומבקשת חשבונית מס כדי לקזז מע"מ. אתם עוסק פטור. מה נכון?
  options:
    - >-
      מוציאים חשבונית מס רגילה, כי ההזמנה היא של חברה ולא של לקוח פרטי.
    - >-
      עוסק פטור מוציא קבלה בלבד; מסבירים לחברה, ובודקים עם רואה חשבון לפני.
    - >-
      מוציאים חשבונית מס רק אם מבקשים מספר הקצאה מרשות המסים לפני ההפקה.
    - >-
      מוסיפים 18% למחיר ומוציאים חשבונית מס על הסכום החדש כולל המע"מ.
  correct: 1
  explanation: >-
    לפי כל זכות, עוסק פטור "אינו רשאי להוציא חשבונית מס", ומוציא קבלה כשהוא מקבל תשלום. מה מתאים
    לחברה, ואם כדאי לשנות מעמד, שואלים רואה חשבון.
- id: q3
  question: >-
    עוסק מורשה מוציא לחברה חשבונית מס של 6,000 ₪ לפני מע"מ, ביולי 2026. מה צריך, לפי מה שנמצא?
  options:
    - >-
      מספר הקצאה מרשות המסים, כי מ־1.6.2026 הסף הוא 5,000 ₪ לפני מע"מ.
    - >-
      שום דבר מיוחד, כי מספר הקצאה נדרש רק בחשבוניות ללקוחות פרטיים.
    - >-
      מספר הקצאה רק אם הסכום אחרי מע"מ עובר 10,000 ₪, ולא לפני כן.
    - >-
      אישור של ספק הסליקה, כי הוא זה שמנפיק את מספרי ההקצאה לעסקים.
  correct: 0
  explanation: >-
    לפי ynetnews, מ־1.6.2026 חשבונית מס מעל 5,000 ₪ לפני מע"מ צריכה מספר הקצאה. זה נוגע לעסקאות בין
    עסקים, ומקבלים אותו אונליין או דרך שירות חשבוניות מחובר.
- id: q4
  question: >-
    לקוח שולח בוואטסאפ צילום של כרטיס האשראי שלו ומבקש שתחייבו אותו. מה עושים?
  options:
    - >-
      מקלידים את הפרטים בדף התשלום של האתר בשבילו, ושומרים את התמונה לתיעוד.
    - >-
      רושמים את הפרטים במחברת, ומחייבים רק אחרי שהמארז נמסר ללקוח.
    - >-
      שולחים קישור תשלום של ספק הסליקה, מוחקים את ההודעה ומבקשים שימחק.
    - >-
      מעבירים את התמונה לספק הסליקה במייל, כדי שהוא יחייב את הכרטיס.
  correct: 2
  explanation: >-
    לא שומרים ולא מעבירים פרטי כרטיס. התשלום נעשה בדף של ספק הסליקה או בקישור תשלום שהוא מפיק,
    וההודעה עם הפרטים נמחקת.
- id: q5
  question: >-
    לקוחות משלמים לכם בביט לטלפון, כ־7,000 ₪ בשנה. מה ידוע ומה צריך לעשות?
  options:
    - >-
      ביט גובה 1.2% מכל העברה, ולכן מוסיפים אותו למחיר של כל מארז שנמכר.
    - >-
      לפי ביזפורטל אין עמלה מתחת ל־25,000 ₪ בשנה; ועל כל תשלום יוצאת קבלה.
    - >-
      ביט פטור מקבלה, כי האפליקציה שולחת ללקוח אישור העברה בעצמה.
    - >-
      העברות ביט לא נחשבות הכנסה של העסק, כל עוד הן מתחת לסף העמלה.
  correct: 1
  explanation: >-
    לפי ביזפורטל (16.8.2026), מאז מאי 2026 ביט גובה מהמקבל 0.8% רק מעל 25,000 ₪ בשנה. התשלום הוא
    הכנסה בכל מקרה, ועליו יוצאת קבלה. אם מותר להשתמש בביט פרטי לעסק, שואלים רואה חשבון.
