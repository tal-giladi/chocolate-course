- id: q1
  question: >-
    לקוח קיבל מארז סביבונים שנמסו בדרך, ובמדיניות שלכם כתוב "מוצרי מזון לא מוחזרים". מה נכון?
  options:
    - >-
      המדיניות קובעת, כי שוקולד הוא טובין פסידים ולכן אין לו זכות ביטול בכלל.
    - >-
      מחזירים כסף רק אם הלקוח מחזיר את המארז על חשבונו תוך 14 ימים מהמסירה.
    - >-
      זה פגם: החזר מלא או החלפה, בלי דמי ביטול, והמדיניות צריכה תיקון.
    - >-
      גובים דמי ביטול של 5% מהמחיר, כי הלקוח הוא זה שביקש לבטל את העסקה.
  correct: 2
  explanation: >-
    החריג לטובין פסידים (14ג(ד)) נוגע לביטול מרצון. בביטול בגלל פגם או אי־התאמה, לפי 14ה(א), מחזירים
    את הכסף תוך 14 ימים בלי דמי ביטול. מידע כללי, לא ייעוץ משפטי.
- id: q2
  question: >-
    לקוחה מבטלת מרצון, לפני הייצור, הזמנה של 290 ₪. כמה דמי ביטול מותר לגבות לכל היותר?
  options:
    - >-
      100 ₪, כי זה הסכום הקבוע שהחוק מתיר לגבות בכל ביטול של עסקה מרחוק.
    - >-
      14.50 ₪, כי זה 5% מהמחיר, והוא נמוך מ־100 ₪.
    - >-
      29 ₪, כי זה 10% מהמחיר, שהוא השיעור המקובל בעסקאות של מזון.
    - >-
      שום דבר, כי בהזמנה שלא יוצרה עוד אסור לגבות דמי ביטול בכלל.
  correct: 1
  explanation: >-
    לפי 14ה(ב), בביטול שלא בגלל פגם מותר לגבות עד 5% מהמחיר או 100 ₪, לפי הנמוך: 5% מ־290 ₪ הם
    14.50 ₪. אם המדיניות שלכם נדיבה יותר (בלי דמי ביטול), אתם מחויבים לה.
- id: q3
  question: >-
    הורה כותב בערב: "הילד אכל טראפלס מהמארז שלכם ויש לו נפיחות בשפתיים". מה עונים קודם?
  options:
    - >-
      שבמטבח שלכם אין אגוזים בכלל, ולכן זה לא יכול להיות מהמארז שלכם.
    - >-
      מבקשים מספר הזמנה ותמונה, ומבטיחים לבדוק את האצווה ולחזור מחר.
    - >-
      מציעים החזר כספי מלא מיד, כדי שהפנייה לא תהפוך לתלונה רשמית.
    - >-
      לפנות מיד לטיפול רפואי, ובמקרה דחוף למד"א 101; פרטים ובדיקה אחר כך.
  correct: 3
  explanation: >-
    בפנייה על פגיעה בבריאות, הבריאות קודמת. אחר כך שומרים את המוצר, בודקים מטריצה ואצווה, רושמים
    ביומן (תלונות בריאות נשמרות לפחות שלוש שנים, סעיף 164(ז)) ופותחים את נוהל 16.4.
- id: q4
  question: >-
    לקוחה בת 72 הזמינה בטלפון מארז ממותג עם לוגו של העסק שלה, וחודש אחרי ביקשה לבטל. מה בודקים?
  options:
    - >-
      אם המארז יוצר במיוחד עבורה; אם כן, החריג לזכות הביטול חל גם בתקופה של 4 חודשים.
    - >-
      שום דבר, כי עברו 14 ימים, ואחריהם אף לקוח לא יכול לבטל עסקה מרחוק.
    - >-
      רק את תעודת האזרח הוותיק, כי עם תעודה מבטלים כל עסקה עד 4 חודשים.
    - >-
      אם השיחה הוקלטה, כי בלי הקלטה אין לה זכות לבטל עסקה שנעשתה בטלפון.
  correct: 0
  explanation: >-
    לפי כל זכות, אזרח ותיק שהזמין בשיחה עם נציג יכול לבטל עד 4 חודשים. אבל זה הארכה של זכות הביטול,
    והחריגים של 14ג(ד), כמו מוצר שיוצר במיוחד, הם שאלה נפרדת. אם יש ספק, שואלים עורך דין.
- id: q5
  question: >-
    כתבתם במדיניות: "ביטול חינם עד 48 שעות לפני המסירה". לקוח מבטל 50 שעות לפני. מה עושים?
  options:
    - >-
      גובים 5% דמי ביטול, כי החוק מתיר זאת בכל ביטול מרצון של עסקה מרחוק.
    - >-
      מסרבים, כי שוקולד הוא טובין פסידים והחוק לא מחייב לאפשר ביטול כזה.
    - >-
      מבטלים בלי דמי ביטול ומחזירים תוך 14 ימים, כי המדיניות שלכם מחייבת.
    - >-
      מציעים זיכוי לקנייה הבאה במקום החזר, כי ההזמנה כבר נרשמה במערכת.
  correct: 2
  explanation: >-
    עסק שמציע תנאים טובים מהחוק מחויב להם (כל זכות). ההחזר עצמו, לפי 14ה, תוך 14 ימים. מדיניות
    נדיבה טובה ללקוחות, אבל כותבים רק מה שמוכנים לעמוד בו.
