- id: q1
  question: >-
    קילפתם דף טרנספר מטבלת מריר, והדוגמה עברה, אבל הצבעים מרוחים והקווים מטושטשים. המדחום הראה 35°C
    כשיצקתם. מה קרה?
  options:
    - >-
      הדף היה ישן, וחמאת הקקאו שבו כבר התגבשה בצורה לא נכונה לפני שהשתמשתם בו.
    - >-
      קילפתם את הדף מוקדם מדי, לפני שהשוקולד התקשה, והצבע נמשך עם האצטט.
    - >-
      הנחתם את הדף הפוך, ולכן הצבע עבר דרך האצטט ונמרח בזמן הגירוד.
    - >-
      השוקולד היה חם מדי והמיס את חמאת הקקאו של ההדפס, ולכן הצבעים נמרחו.
  correct: 3
  explanation: >-
    ההדפס עשוי מחמאת קקאו צבעונית. שוקולד חם מטמפרטורת העבודה ממיס אותו, והצבעים זורמים זה לתוך זה. ב־35°C
    גם הטמפר עצמו כבר לא תקין. במריר עובדים ב־31-32°C.
- id: q2
  question: >-
    אחרי הקילוף רוב הדוגמה נשארה על הדף, ועל השוקולד יש רק כתמים של צבע. השוקולד עמום ונשאר רך זמן רב.
    מה הסיבה הסבירה ביותר?
  options:
    - >-
      הדף היה מוצר זול, והדיו שבו לא מתאים לשוקולד מריר אלא רק לשוקולד לבן.
    - >-
      השוקולד לא היה מטומפר, ולכן לא התכווץ מהדף ולא לקח איתו את הדוגמה.
    - >-
      השוקולד היה חם מדי, ולכן הדוגמה נמסה לגמרי ונספגה בתוך השוקולד.
    - >-
      הנחתם משקולת על הדף, והלחץ הדביק את הדוגמה לאצטט במקום לשוקולד.
  correct: 1
  explanation: >-
    הדוגמה עוברת כשהשוקולד מתגבש בצורה V ומשתחרר מהאצטט. שוקולד עמום שנשאר רך הוא סימן לטמפר שנכשל.
    שוקולד חם מדי נותן דוגמה מרוחה, לא דוגמה שנשארת על הדף.
- id: q3
  question: >-
    פרסתם שוקולד מטומפר על דף גיטרה כדי לחתוך ריבועים, ונכנסה שיחת טלפון. אחרי 20 דקות כל ריבוע שחתכתם
    נסדק בפינות. מה היה צריך לעשות?
  options:
    - >-
      לחתוך אחרי 2-5 דקות, כשהשוקולד נהיה עמום אבל עוד רך, כי שוקולד קשה לגמרי שביר.
    - >-
      לחתוך מיד אחרי הפריסה, כשהשוקולד עוד נוזלי, כדי שהסכין תעבור בלי התנגדות.
    - >-
      לחמם את הסכין באש גלויה עד שהיא חמה מאוד, ולחתוך כך גם אחרי 20 דקות.
    - >-
      להכניס את הדף למקרר לחצי שעה לפני החיתוך, כדי שהשוקולד יהיה קשה ואחיד.
  correct: 0
  explanation: >-
    לפי America's Test Kitchen חותכים כשהשוקולד בדיוק נהיה עמום ועוד לא התקשה לגמרי, כי שוקולד שהתקשה שביר
    ונסדק. שוקולד נוזלי נסגר אחרי הסכין, וסכין לוהטת ממיסה את השוליים ושוברת את הטמפר.
- id: q4
  question: >-
    אתם רוצים טבלה בתבנית, עם צד מבריק מהתבנית בחזית ודוגמת טרנספר בגב. מתי ואיך מניחים את הדף?
  options:
    - >-
      לפני היציקה, בתחתית השקע, הצד המחוספס כלפי מטה אל התבנית, ויוצקים מעליו.
    - >-
      אחרי שהטבלה התקשתה, מורחים מעט שוקולד מומס על הגב ומדביקים את הדף בצד החלק.
    - >-
      אחרי היציקה וההקשה, על השוקולד הנוזלי בגב, הצד המחוספס כלפי מטה, ומגרדים דרך הדף.
    - >-
      אחרי היציקה, על השוקולד הנוזלי, הצד החלק כלפי מטה, כדי שההדפס לא יימרח בגירוד.
  correct: 2
  explanation: >-
    לפי הוראות Keylink, בטבלאות ובבונבונים מניחים את הדף בשלב הסגירה, הצד המחוספס על השוקולד, ומעבירים
    שפכטל לאורך התבנית. הצד המחוספס הוא המודפס, והוא חייב לגעת בשוקולד הנוזלי.
- id: q5
  question: >-
    ריבועי שוקולד שהכנתם על דף טרנספר יצאו עם דוגמה יפה, אבל כולם מעוקלים כמו קערות קטנות. מה משנים
    בפעם הבאה?
  options:
    - >-
      פורסים שכבה דקה יותר, כי שכבה עבה מתכווצת יותר ולכן מתעקמת.
    - >-
      מקררים במקפיא מיד אחרי החיתוך, כדי שהשוקולד יתקשה לפני שיספיק להתעקם.
    - >-
      משתמשים בשוקולד שלא טומפר, כי הוא לא מתכווץ ולכן נשאר שטוח לגמרי.
    - >-
      מניחים נייר אפייה ומגש שטוח מעל הריבועים עד שהתקשו, כדי שיישארו ישרים.
  correct: 3
  explanation: >-
    שוקולד דק מתכווץ בעיקר בצד אחד ונוטה להתעקם. משקולת שטוחה מחזיקה אותו ישר עד שהתגבש. שכבה דקה יותר
    מתעקמת עוד יותר, מקפיא גורם לסדקים ולעיבוי, ושוקולד לא מטומפר לא ישתחרר מהדף.
