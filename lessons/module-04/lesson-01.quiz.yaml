- id: q1
  question: >-
    יצקתם טבלה בתבנית פוליקרבונט, חיכיתם 15 דקות בחדר ועוד 15 במקרר, והיא לא יוצאת כשהופכים את
    התבנית. מה הסיבה הסבירה ביותר, ומה עושים?
  options:
    - >-
      התבנית חדשה ועוד לא "התרגלה", ולכן מכופפים אותה חזק עד שהטבלה קופצת החוצה.
    - >-
      השוקולד לא טומפר או טומפר חלקית; נותנים עוד 10 דקות, ואם לא יוצא ממיסים ומטמפרים שוב.
    - >-
      המקרר חם מדי, ולכן מעבירים את התבנית לחצי שעה במקפיא כדי שהשוקולד יתכווץ.
    - >-
      לא משחתם את התבנית בשמן לפני היציקה, ולכן מחממים אותה מבחוץ ומחליקים סכין לאורך הדפנות.
  correct: 1
  explanation: >-
    שוקולד מטומפר מתכווץ ומשתחרר לבד מתבנית קשיחה. לפי טבלת התקלות של Callebaut, שוקולד שלא יוצא בכלל
    הוא שוקולד שלא טומפר, טומפר חלקית או לא התקרר מספיק זמן. מקפיא גורם לכתמים ולסדקים, ושמן בתבנית
    משאיר כתמים.
- id: q2
  question: >-
    חברה יצקה את אותו שוקולד מטומפר בתבנית פוליקרבונט ובתבנית סיליקון. שתי הטבלאות יצאו בקלות, אבל
    רק אחת מבריקה כמו מראה. מה ההסבר?
  options:
    - >-
      פני הפוליקרבונט החלקים והקשיחים מועתקים לשוקולד, והסיליקון נותן בדרך כלל גימור סאטן או עמום.
    - >-
      הסיליקון מוליך חום טוב יותר, ולכן השוקולד שבו התקרר מהר מדי ואיבד את גבישי צורה V.
    - >-
      בתבנית הסיליקון היה יותר שוקולד, וטבלה עבה תמיד יוצאת עמומה גם כשהיא מטומפרת היטב.
    - >-
      הסיליקון סופג חלק מחמאת הקקאו מפני השטח של השוקולד, ולכן נשאר עליו פחות שומן מבריק.
  correct: 0
  explanation: >-
    הצד שנוגע בתבנית מקבל את פני השטח שלה. Callebaut ממליצים על פוליקרבונט כי הוא נותן את הברק הטוב
    ביותר. סיליקון משחרר בקילוף, וגימור הסאטן שלו צפוי ואינו סימן לטמפר שנכשל.
- id: q3
  question: >-
    טבלה מתבנית סיליקון יצאה בלי בעיה, אבל אחרי יום הופיעו עליה פסים אפורים. למה בדיקת השחרור לא
    "תפסה" את הבעיה?
  options:
    - >-
      סיליקון מוסיף לחות לשוקולד, ולכן הפסים הם פריחת סוכר שלא קשורה בכלל לטמפרור.
    - >-
      הפסים נוצרו רק באחסון, ולכן הטמפר היה תקין והבעיה היא המקום שבו הטבלה נשמרה.
    - >-
      בסיליקון מקלפים את התבנית, כך שגם שוקולד שלא טומפר יוצא; בודקים בבדיקת סכין ובסנאפ.
    - >-
      סיליקון לא מתאים לשוקולד מריר, ולכן בתבנית כזו משתמשים רק בשוקולד חלב או לבן.
  correct: 2
  explanation: >-
    בתבנית קשיחה רק שוקולד מטומפר שמתכווץ נופל לבד, ולכן השחרור הוא בדיקת טמפר. בסיליקון זה לא עובד,
    כי מקלפים את התבנית מכל שוקולד. פסים אפורים כבר ביום הראשון אחרי היציקה מצביעים על טמפר חלקי.
- id: q4
  question: >-
    על צד התבנית של טבלה מטומפרת יש כמה כתמים עגולים קטנים ועמומים. השאר מבריק. מה כנראה קרה?
  options:
    - >-
      השוקולד היה חם מדי ביציקה, ולכן נוצרו נקודות שבהן גבישי צורה V נמסו מחדש.
    - >-
      טיפות מים או אבנית נשארו בשקעים אחרי השטיפה, והשוקולד העתיק אותן.
    - >-
      השוקולד היה סמיך מדי, ובועות אוויר גדולות נלכדו בין השוקולד לבין דופן התבנית.
    - >-
      הטבלה יצאה מוקדם מדי מהמקרר, והעיבוי שנוצר בחדר השאיר עליה טיפות קטנות.
  correct: 1
  explanation: >-
    כתמים עגולים ומוגדרים בצד התבנית באים בדרך כלל ממים או מאבנית בתבנית. מייבשים לגמרי, ואם המים
    קשים, שוטפים אחרונה במים מסוננים ומלטשים בצמר גפן לפני יציקה.
- id: q5
  question: >-
    ביום חורף החדר ב־17°C, ואתם רוצים לצקת טבלאות. התבנית עמדה על אדן החלון. מה עושים לפני היציקה?
  options:
    - >-
      מחממים את התבנית במים חמים מהברז, מנגבים ויוצקים מיד, כדי שתהיה חמה מהשוקולד.
    - >-
      מכניסים את התבנית ל־5 דקות לתנור על חום נמוך, כדי שהשוקולד יזרום טוב לפינות.
    - >-
      יוצקים כרגיל, כי תבנית קרה מקררת מהר וזה בדיוק מה שנותן לשוקולד ברק חזק יותר.
    - >-
      מחממים 3-5 שניות במייבש שיער מרחוק, לא יותר מחום השוקולד, ומלטשים בצמר גפן.
  correct: 3
  explanation: >-
    לפי Callebaut מחממים את התבנית לכ־26-27°C ולא מעל טמפרטורת השוקולד, כדי למנוע הלם טמפרטורה שמשאיר
    כתמים אפורים. מים משאירים כתמים, ותנור עלול לחמם את התבנית יותר מדי ולהמיס את הגבישים.
