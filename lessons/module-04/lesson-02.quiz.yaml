- id: q1
  question: >-
    הכנתם מילוי פרלינה, ומיד אחרי הערבוב עם שוקולד מומס הוא ב־36°C. הקליפות בתבנית כבר קשות. מה עושים?
  options:
    - >-
      מזלפים מיד, כי מילוי חם זורם טוב יותר לפינות וממלא את הקליפה בלי בועות.
    - >-
      מכניסים את המילוי למקפיא לחמש דקות, כדי שיגיע מהר לטמפרטורת החדר לפני הזילוף.
    - >-
      מחכים עד שהמילוי יירד ל־26-28°C ורק אז מזלפים, כי מילוי חם ממיס את הקליפה.
    - >-
      מזלפים, ומיד אחר כך מכניסים את התבנית למקרר כדי שהקליפה לא תספיק להימס.
  correct: 2
  explanation: >-
    לפי Callebaut המילוי לא צריך להיות חם מ־28°C, אחרת הוא ממיס את הקליפה ופוגע בטמפר שלה. קירור חד
    במקפיא יכול לגרום לעיבוי במילוי ולגיבוש לא אחיד. מחכים ומודדים.
- id: q2
  question: >-
    יום אחרי שהכנתם טבלה ממולאת יש כתם שמנוני על הנייר מתחתיה, ובגב רואים סדק דק לאורך הקצה. מה
    הסיבה הסבירה ביותר?
  options:
    - >-
      המילוי הגיע עד השפה או נמרח עליה, ולכן שכבת הסגירה לא נדבקה לקליפה.
    - >-
      הטבלה אוחסנה בחדר של 19°C, וזה חם מדי לכל טבלה עם מילוי שומני.
    - >-
      השוקולד של הקליפה היה מריר, ומריר מתכווץ יותר מחלב ולכן נסדק בקצוות.
    - >-
      מילאתם פחות מדי, והאוויר שנשאר בין המילוי לסגירה דחף את השמן החוצה.
  correct: 0
  explanation: >-
    Callebaut מזהירים שמילוי על השפה גורם לדליפות, וממליצים להשאיר 1-1.5 מ"מ. בלי שפה נקייה שכבת
    הסגירה לא מתחברת לקליפה, ונשאר סדק שהשמן עובר דרכו. 18-20°C הוא דווקא טווח האחסון המומלץ.
- id: q3
  question: >-
    כשהוצאתם טבלה ממולאת מהתבנית, פיסות מהקליפה נשארו דבוקות בשקע והמילוי נחשף. הטמפר נבדק ועבר.
    מה משנים בפעם הבאה?
  options:
    - >-
      ממלאים את הקליפה במילוי עד השפה, כדי שהמילוי יחזק את הקליפה מבפנים.
    - >-
      מקררים את התבנית במקפיא לפני היציקה, כדי שהקליפה תתקשה מהר יותר ותהיה חזקה.
    - >-
      משתמשים בתבנית סיליקון, כי היא תמיד נותנת קליפה עבה יותר מאותו שוקולד.
    - >-
      מחזיקים את הקליפה מול האור, ואם רואים אור דרכה יוצקים שכבה שנייה לפני המילוי.
  correct: 3
  explanation: >-
    לפי טבלת התקלות של Callebaut, קליפה דקה מדי לא מתכווצת מספיק ונשברת בהוצאה. הפתרון שלהם הוא שוקולד
    פחות נוזלי או שתיים־שלוש שכבות. מילוי עד השפה גורם לדליפה, ותבנית קפואה גורמת לכתמים.
- id: q4
  question: >-
    שכנה שואלת למה הטבלה עם מילוי הפרלינה שנתתם לה האפירה אחרי שבועיים, והטבלה החלקה מאותו יום עדיין
    מבריקה. מה עונים?
  options:
    - >-
      בפרלינה יש מים, והם יוצאים לאט לפני השטח וממיסים את הסוכר שבשוקולד.
    - >-
      שמן מהאגוזים נודד לקליפה ומאיץ פריחת שומן; מקשים את המילוי ומאחסנים ב־18-20°C.
    - >-
      הטבלה הממולאת עבה יותר, ושוקולד עבה תמיד מאפיר אחרי שבועיים גם בלי מילוי בכלל.
    - >-
      הפרלינה הייתה חמה מדי כשמילאתם, ולכן הקליפה לא טומפרה מלכתחילה והאפירה מיד.
  correct: 1
  explanation: >-
    Callebaut כותבים שמילויים על בסיס שומן, כמו פרלינה, גורמים לפריחת שומן להופיע מהר יותר. מאטים את
    זה במילוי מוקשה (שוקולד או 5-6% חמאת קקאו), בקליפה סגורה ובאחסון קבוע. בפרלינה אין כמעט מים.
- id: q5
  question: >-
    פיזרתם פיסטוקים על גב הטבלה, אבל כשהפכתם אותה אחרי הקירור חצי מהם נפלו. מה כנראה קרה?
  options:
    - >-
      הפיסטוקים היו קלויים, ושמן הקלייה מונע מהשוקולד להידבק אליהם גם כשהוא נוזלי.
    - >-
      השוקולד לא היה מטומפר, ולכן לא התכווץ סביב הפיסטוקים ולא החזיק אותם בזמן ההיפוך.
    - >-
      פיזרתם אותם אחרי שהשוקולד כבר התחיל להתקשות, והם לא שקעו בו מספיק.
    - >-
      פיזרתם אותם מיד אחרי היציקה, והשוקולד הנוזלי עוד היה חם מדי בשביל להחזיק אותם.
  correct: 2
  explanation: >-
    שוקולד מטומפר מתקשה תוך דקות, ולכן מפזרים מיד אחרי הגירוד ולוחצים קלות כל חתיכה גדולה. אגוזים קלויים
    וקרים נדבקים היטב. אם התוספות נפלו, מדביקים אותן בנקודה של שוקולד מומס.
