- id: q1
  question: >-
    הכנתם לוליפופים חופשיים על דף גיטרה. אחרי ההתקשות, כשמרימים אותם במקל, השוקולד מסתובב סביב המקל
    וחלק נופלים. מה שינוי הטכניקה שיפתור את זה?
  options:
    - >-
      להשתמש במקלות פלסטיק במקום נייר, כי שוקולד לא נדבק לנייר דחוס בכלל.
    - >-
      לסובב את המקל בשוקולד הנוזלי ולזלף מעליו עוד שוקולד, כך שהקצה שלו בתוך השוקולד.
    - >-
      לקרר את הלוליפופים במקפיא, כדי שהשוקולד יתכווץ חזק יותר סביב המקל ויתפוס אותו.
    - >-
      להניח את המקל רק אחרי שהשוקולד התחיל להתקשות, כדי שלא ישקע עד דף הגיטרה.
  correct: 1
  explanation: >-
    המקל מחזיק רק אם השוקולד עוטף אותו מכל הצדדים לאורך 2-3 ס"מ. מקל שמונח על שוקולד שהתחיל להתקשות לא
    נכנס לתוכו. מקפיא גורם לסדקים ולעיבוי ולא משפר את האחיזה.
- id: q2
  question: >-
    המטבעות יצאו מהתבנית, אבל בכמה מהם חסרות פינות של התבליט ויש חורים קטנים. השוקולד בקערה היה סמיך
    מאוד כשיצקתם. מה הסיבה ומה עושים בפעם הבאה?
  options:
    - >-
      התבנית חמה מדי; מקררים אותה במקרר לפני היציקה כדי שהשוקולד יתקשה מיד בחריצים.
    - >-
      המטבעות דקים מדי בשביל תבנית פוליקרבונט; עוברים לתבנית סיליקון שתמיד מוציאה את התבליט שלם.
    - >-
      השוקולד לא היה מטומפר מספיק; מוסיפים עוד זרעים עד שהוא סמיך יותר וממלא את החריצים טוב יותר.
    - >-
      שוקולד סמיך לא נכנס לחריצים ואוויר נלכד; מחממים במעלה לפני היציקה ומקישים 15-20 פעמים.
  correct: 3
  explanation: >-
    Callebaut ממליצים על שוקולד נוזלי לתבניות, ומציינים שוקולד לא נוזלי מספיק ובועות שלא הוצאו כסיבות
    לחורים. שוקולד שהתגבש יותר מדי מחממים במעלה, ועדיין נשאר מטומפר.
- id: q3
  question: >-
    לקוחה מבקשת מטבעות שוקולד "זהובים" לגן. במדף יש אבקת ברק זהב שכתוב עליה "non-toxic, for decoration
    only", וריבועי נייר זהב לעטיפת שוקולד. מה עושים?
  options:
    - >-
      עוטפים את המטבעות בנייר הזהב, ולא מורחים על השוקולד את האבקה שכתוב עליה לקישוט בלבד.
    - >-
      מורחים את האבקה רק על הצד העליון של המטבע, כך שהילדים יאכלו ממנה רק כמות זעירה.
    - >-
      מערבבים את האבקה בתוך השוקולד לפני היציקה, כדי שתהיה חלק מהמטבע ולא תתפזר על הידיים.
    - >-
      משתמשים באבקה, כי "non-toxic" אומר שהיא בטוחה לאכילה גם אם היא לא מוגדרת כמאכל.
  correct: 0
  explanation: >-
    "לא רעיל" או "לקישוט בלבד" אינם מאכל, ולכן לא שמים אותם על שוקולד שאוכלים, בשום כמות. עטיפה בנייר
    זהב היא הדרך המסורתית, ולא נאכלת. אבקה מתאימה רק אם כתוב עליה במפורש שהיא מאכל.
- id: q4
  question: >-
    אחרי ההוצאה המטבעות מחוברים זה לזה בשכבה דקה של שוקולד, ורבים נשברו כשהפרדתם אותם. מה היה צריך
    לעשות?
  options:
    - >-
      למלא כל שקע רק עד חצי, כדי שהשוקולד לא יגיע לשפה בין השקעים בכלל.
    - >-
      להוציא את המטבעות מוקדם, כשהשוקולד עוד רך, כדי שהשכבה בין השקעים תיקרע בקלות.
    - >-
      לגרד את התבנית פעמיים, בשני כיוונים, עד שהשפה בין השקעים נקייה לגמרי.
    - >-
      לשמן את השפה בין השקעים לפני היציקה, כדי שהשוקולד לא יוכל להידבק אליה.
  correct: 2
  explanation: >-
    שוקולד שנשאר על השפה מחבר את המטבעות, ומונע מכל אחד להתכווץ ולהשתחרר לבד. גירוד נקי פותר את זה. שמן
    משאיר כתמים, הוצאה מוקדמת שוברת את המטבעות, ומילוי עד חצי נותן מטבעות דקים ושבירים.
