- id: q1
  question: >-
    יצקתם קליפות אחרי 20 דקות של עבודה עם אותה קערת שוקולד מטומפר. השוקולד הסמיך מעט, והקליפות יצאו
    עבות, עם שלולית קרושה בתחתית כל שקע. מה הכי סביר לשנות בסבב הבא?
  options:
    - >-
      לקרר את השוקולד עוד כמה מעלות לפני היציקה, כדי שיתקשה מהר יותר ולא יספיק להצטבר בתחתית.
    - >-
      להכניס את התבנית למקרר מיד אחרי הריקון, בלי לנקז, כדי שהשכבה תיקרש לפני שהיא זורמת למטה.
    - >-
      לחמם את השוקולד במעלה אחת עד 31-32°C לפני היציקה, ולרוקן 20-30 שניות עם הקשות בצד התבנית.
    - >-
      להחליף לשוקולד בעל פחות חמאת קקאו, כי שוקולד שמנוני נדבק לדפנות ובונה שכבה עבה.
  correct: 2
  explanation: >-
    שוקולד שעומד ממשיך להתגבש ומסמיך, וזה נותן קליפה עבה. חימום עדין לטמפרטורת העבודה (בלי לעבור את
    32°C) מחזיר נזילות, וריקון ארוך עם הקשות מוציא את העודף. קירור מיד בלי ניקוז דווקא נועל את השלולית
    בתחתית.
- id: q2
  question: >-
    התבנית עמדה כל הלילה ליד חלון פתוח בחורף, והיא קרה למגע. מה עושים לפני שיוצקים?
  options:
    - >-
      יוצקים כרגיל, כי תבנית קרה מקררת את השוקולד מהר ולכן מחזקת את הטמפר ונותנת יותר ברק.
    - >-
      מחממים אותה כמה שניות במייבש שיער, בתנועה, עד שהיא לא קרה, אבל לא חמה מהשוקולד המטומפר.
    - >-
      מחממים אותה בתנור על 50°C כמה דקות, כדי שהשוקולד יישאר נוזלי בזמן הריקון וייצא דק.
    - >-
      שוטפים אותה במים חמים כדי לחמם אותה מהר, ומנגבים במגבת לפני שיוצקים את השוקולד.
  correct: 1
  explanation: >-
    תבנית קרה גורמת להלם טמפרטורה, לקליפה עבה ולאפרוריות. תבנית חמה מהשוקולד ממיסה את גבישי V והקליפה
    לא משתחררת. מים מסכנים את השוקולד ומשאירים כתמים, ותנור מעוות פוליקרבונט ומחמם יותר מדי.
- id: q3
  question: >-
    למה מגרדים את פני התבנית פעם נוספת אחרי שהיא עמדה הפוכה כ־5 דקות?
  options:
    - >-
      כדי להסיר את הברק העודף מפני השטח, שאחרת יגרום לבונבון להיראות שמנוני אחרי היציאה מהתבנית.
    - >-
      כדי לבדוק שהשוקולד מטומפר: אם הוא נקרע תחת השפכטל, צריך לטמפר שוב לפני שממשיכים.
    - >-
      כדי לדלל את הקליפה בדפנות, כי השפכטל לוחץ את השוקולד כלפי מטה לתוך השקעים.
    - >-
      כדי שלכל שקע תהיה שפה חדה ונקייה, שעליה המכסה ייצמד ויאטום את הבונבון בשיעור הבא.
  correct: 3
  explanation: >-
    בזמן הניקוז נוטף שוקולד ונקרש על השפות. גירוד אחרון משאיר שפה חדה, והמכסה נצמד אליה ואוטם. שפה
    מלוכלכת היא אחת הסיבות לבונבונים שדולפים או שהבסיס שלהם לא נקי.
- id: q4
  question: >-
    בקליפות שיצאו יש חורים זעירים בדפנות, בעיקר בפינות של תבנית ריבועית עם פרטים. השוקולד היה מטומפר.
    מה הסיבה הסבירה?
  options:
    - >-
      בועות אוויר, או שוקולד סמיך שלא זרם לפינות. מקישים יותר ועובדים עם שוקולד נוזלי יותר.
    - >-
      התבנית חוממה יותר מדי לפני היציקה, והשוקולד שנגע בה נמס מחדש ויצר חורים קטנים.
    - >-
      הליטוש בצמר גפן השאיר סיבים בשקעים, והשוקולד לא נצמד לתבנית במקומות שבהם נשארו הסיבים.
    - >-
      השוקולד היה בהתגבשות חסרה, ולכן חלקים מהקליפה נשארו דבוקים בתבנית ויצרו חורים בדפנות.
  correct: 0
  explanation: >-
    לפי Callebaut, חורים נובעים משוקולד לא נוזלי מספיק ומבועות אוויר, ובתבניות עם פינות חדות צריך שוקולד
    נוזלי יותר. הקשות על השיש מעלות את הבועות לפני השטח לפני הריקון.
