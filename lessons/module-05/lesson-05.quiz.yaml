- id: q1
  question: >-
    אחרי הסגירה השארתם את התבנית שעה במקפיא "כדי שיצאו בקלות". הבונבונים נפלו מיד, אבל רבים מהם עם
    סדקים דקים בקליפה. מה הסיבה הסבירה?
  options:
    - >-
      השוקולד לא היה מטומפר, ולכן הקליפה לא הייתה חזקה מספיק כדי להחזיק את המילוי.
    - >-
      המילוי היה חם מדי כשזילפתם, והוא המשיך להתרחב בתוך הבונבון גם במקפיא.
    - >-
      קירור חזק וארוך מדי גרם לשוקולד להתכווץ בבת אחת ולהיסדק.
    - >-
      התבנית לא לוטשה לפני היציקה, והחספוס שלה יצר נקודות חלשות שנסדקו בהוצאה.
  correct: 2
  explanation: >-
    בונבונים שיצאו בקלות מעידים על טמפר טוב. סדקים אחרי מקפיא הם הלם קירור. CakeFlix: מקרר ביתי לזמן
    קצר בלבד, והפרש קטן בין חדר העבודה לבין מקום הקירור.
- id: q2
  question: >-
    שלושה מתוך שמונה בונבונים יצאו, וחמישה נשארו בתבנית. בדיקת הסכין לפני היציקה התקשתה מהר והייתה
    מבריקה. מה עושים קודם?
  options:
    - >-
      מחממים את התבנית ומוציאים את הבונבונים בכוח, כי שוקולד מטומפר כבר לא ייצא לבד.
    - >-
      מחזירים את התבנית ל־5-10 דקות במקרר כדי שהבונבונים יתכווצו, והופכים שוב.
    - >-
      דופקים את התבנית חזק על השיש כמה פעמים, עד שגם הבונבונים התקועים נופלים.
    - >-
      ממיסים את הכול ומטמפרים מחדש, כי חלק שנשאר בתבנית מעיד על טמפר שנכשל.
  correct: 1
  explanation: >-
    הטמפר עבר בדיקה, וחלק כבר יצאו, ולכן הסיבה הסבירה היא זמן קירור קצר מדי (Callebaut). כמה דקות נוספות
    במקרר משלימות את ההתכווצות. דפיקות חזקות שוברות קליפות.
- id: q3
  question: >-
    בסבב הקודם הבונבונים דלפו מהבסיס. בסבב החדש הורדתם את גובה המילוי, החלפתם את המילוי לגנאש, וקיצרתם
    את זמן המנוחה ל־4 שעות. הדליפה נעלמה. מה אפשר להסיק?
  options:
    - >-
      שגנאש לא דולף ופרלינה דולפת, ולכן מעכשיו כדאי להשתמש רק בגנאש לבונבונים.
    - >-
      שזמן מנוחה קצר עדיף, כי המילוי עדיין דביק ונצמד טוב יותר למכסה של השוקולד.
    - >-
      שגובה המילוי היה הבעיה, כי זו הסיבה הנפוצה ביותר לבונבונים שלא נסגרים.
    - >-
      כמעט כלום בוודאות, כי שינו שלושה דברים ואי אפשר לדעת איזה מהם עזר.
  correct: 3
  explanation: >-
    כשמשנים כמה משתנים יחד, אי אפשר לייחס את התוצאה לאחד מהם. גובה המילוי הוא חשוד טוב (Callebaut),
    אבל רק סבב שמשנה אותו לבד יאשר את זה.
- id: q4
  question: >-
    מצאתם בקופסה בונבוני גנאש מלפני עשרה ימים, שעמדו במטבח בקיץ. מאחד מהם נוזל נוזל דביק, ויש ריח
    חמוץ קל. מה עושים?
  options:
    - >-
      לא אוכלים אותו וגם לא את שאר הבונבונים מאותו סבב, כי אלה סימני קלקול של מילוי שיש בו מים.
    - >-
      ממיסים את כל הסבב לשוקו חם, כי החימום בחלב הורג את מה שגרם לריח החמוץ.
    - >-
      זורקים רק את הבונבון שדולף, ואת השאר אוכלים מהר לפני שגם הם יתחילו לדלוף.
    - >-
      מעבירים את כל הקופסה למקפיא, כדי לעצור את התהליך ולשמור את הבונבונים לעוד שבוע.
  correct: 0
  explanation: >-
    נוזל חדש, בעבוע וריח חמוץ הם סימני קלקול. זה המקרה היחיד בקורס שבו זורקים, וכל הסבב נחשד כי
    כולו הוכן ואוחסן באותם תנאים.
- id: q5
  question: >-
    בונבונים שלכם יוצאים מהתבנית, אבל עם נקודות לבנות עמומות בצד העליון. התבנית נשטפה, אבל לא לוטשה,
    והוצאתם אותם 10 דקות אחרי הסגירה. מה שני החשודים העיקריים?
  options:
    - >-
      מילוי חם מדי, ומכסה עבה מדי שלחץ על הקליפה מבפנים בזמן ההתקשות.
    - >-
      תבנית לא מלוטשת, והוצאה מוקדמת מדי לפני שהשוקולד התקשה והתכווץ לגמרי.
    - >-
      צבע מאכל על בסיס מים בתבנית, ולחות מהמקרר שנכנסה לקופסה בזמן האחסון.
    - >-
      שוקולד נוזלי מדי בקליפה, ומילוי שהיה קר מהקליפה בזמן הזילוף.
  correct: 1
  explanation: >-
    Callebaut מונים בין הסיבות לכתמים לבנים ועמימות תבנית לא חלקה ונקייה והוצאה מוקדמת מדי. ליטוש בצמר
    גפן וקירור מלא לפני ההוצאה הם השינויים הראשונים לנסות, אחד בכל פעם.
