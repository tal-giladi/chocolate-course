- id: q1
  question: >-
    בחנות יצירה מצאתם צנצנת זולה של "Gold Luster Dust". על התווית כתוב "Non-toxic" ואין רשימת רכיבים.
    אפשר להבריש ממנה לתוך תבנית הבונבונים?
  options:
    - >-
      כן, כי "לא רעיל" אומר שהחומר בטוח לאכילה בכמויות הקטנות שנכנסות לבונבון אחד.
    - >-
      כן, אם מכסים את האבקה בשכבת חמאת קקאו, כי אז היא לא נוגעת ישירות בפה.
    - >-
      לא. לפי ה־FDA, "לא רעיל" בלי רשימת רכיבים ובלי "אכיל" לא הולך ישירות על מזון.
    - >-
      רק אם יש על הצנצנת הכשר, כי הכשר מעיד שהחומר אושר כמאכל ע"י גוף מפקח.
  correct: 2
  explanation: >-
    "לא רעיל" אינו "אכיל". FDA: אבקות אכילות חייבות לציין רשימת רכיבים ורובן כותבות "edible"; אם כתוב רק
    non-toxic או "לקישוט בלבד" בלי רשימת רכיבים, לא משתמשים בו ישירות על מזון. בבונבון אי אפשר להסיר
    את הקישוט לפני ההגשה.
- id: q2
  question: >-
    על אבקת ברק אמריקאית כתוב "Edible", ויש רשימת רכיבים: mica, titanium dioxide. מה נכון לגביה?
  options:
    - >-
      היא אסורה בכל העולם, כי טיטניום דיאוקסיד הוא חומר שאינו מותר במזון בשום מדינה.
    - >-
      בארה"ב היא יכולה להיות מותרת כפיגמנט פנינה, אבל באיחוד האירופי E171 אסור כתוסף מזון מאז 2022.
    - >-
      היא מותרת בכל מקום, כי הכיתוב "Edible" על האריזה מחייב את כל רשויות המזון בעולם.
    - >-
      היא מותרת באירופה רק אם מערבבים אותה בחמאת קקאו, כי אז היא לא נחשבת תוסף מזון.
  correct: 1
  explanation: >-
    התקנה האמריקאית מתירה פיגמנט פנינה של טיטניום דיאוקסיד על מיקה בממתקים עד 1.25%. באיחוד האירופי,
    אחרי חוות הדעת של EFSA מ־2021, תקנה 2022/63 אסרה את E171 כתוסף, ומ־7 באוגוסט 2022 מזון חדש לא
    יכול להכיל אותו.
- id: q3
  question: >-
    באמצע עיטור גיליתם שהאבקה שבה הברשתם 4 שקעים מסומנת "For decorative purposes only". הקליפות כבר
    יצוקות. מה עושים עם הבונבונים האלה?
  options:
    - >-
      מגרדים את שכבת האבקה מבחוץ בסכין, ואז הבונבונים בסדר לאכילה בבית.
    - >-
      ממיסים אותם מחדש עם שאר השוקולד, כי האבקה מתפזרת ונעשית זניחה בכמות גדולה.
    - >-
      נותנים אותם רק למבוגרים, כי הכמות קטנה וההגבלה נועדה בעיקר לילדים קטנים.
    - >-
      מפרידים אותם ולא אוכלים אותם, ולא ממיסים את השוקולד שלהם חזרה לקערה.
  correct: 3
  explanation: >-
    זה היוצא מן הכלל של "לא זורקים": מה שנגע באבקה שאינה מאכל לא נאכל ולא נמס מחדש למאכל. אפשר להשתמש
    בו לתצוגה או לצילום. שוטפים היטב את התבנית ואת המכחול.
- id: q4
  question: >-
    מישהו מציע לערבב אבקת ברק אכילה עם כמה טיפות מים, כדי "לצבוע" איתה את התבנית. מה התשובה?
  options:
    - >-
      לא כדאי. מים על שוקולד משאירים כתמים; מערבבים בחמאת קקאו או מברישים יבש.
    - >-
      כדאי, כי המים מתאדים בתבנית לפני היציקה ומשאירים שכבת אבקה אחידה ונקייה.
    - >-
      כדאי רק עם מים רותחים, כי הם מתאדים מהר יותר ולא מספיקים להגיע לשוקולד.
    - >-
      לא כדאי, כי מים מבטלים את הצבע של האבקה ומשאירים אותה שקופה לגמרי.
  correct: 0
  explanation: >-
    אבקה נדבקת לשומן. שתי השיטות בשיעור: אבקה יבשה בתבנית נקייה, או אבקה מעורבבת בחמאת קקאו מטומפרת.
    מים ושוקולד לא הולכים יחד.
