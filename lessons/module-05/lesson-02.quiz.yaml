- id: q1
  question: >-
    הכנתם גנאש ומיהרתם לזלף אותו לקליפות כשהמדחום הראה 36°C. למחרת חלק מהבונבונים לא נפלו מהתבנית,
    ועל אחרים יש כתמים אפורים. מה קרה?
  options:
    - >-
      הגנאש החם המיס את גבישי V בקליפה הדקה מבפנים, והקליפה יצאה מטמפר ולא התכווצה.
    - >-
      הגנאש החם אידה מים לתוך התבנית, והלחות גרמה לפריחת סוכר על פני הבונבונים.
    - >-
      הגנאש נפרד בגלל החום, והשומן שיצא ממנו חדר דרך הקליפה ונדבק לדפנות התבנית.
    - >-
      הקליפות היו עבות מדי, ולכן לא התכווצו מספיק, והחום של הגנאש לא קשור לבעיה.
  correct: 0
  explanation: >-
    גבישי V נמסים מעל כ־34°C, והקליפה דקה. לכן Callebaut מגבילים את המילוי ל־28°C ו־Cacao Barry
    ל־25°C. קליפה שיצאה מטמפר נדבקת ומאפירה.
- id: q2
  question: >-
    מילאתם קליפות בפרלינה עד השפה ממש, כי רציתם בונבון "מלא". מה הבעיה שצפויה בסגירה?
  options:
    - >-
      הפרלינה תתייבש בלילה ותתכווץ, ויישאר חלל גדול מדי שהמכסה לא יוכל למלא אחר כך.
    - >-
      לא יישאר מקום למכסה להיצמד לשפה, והוא יהיה שכבה דקה שנסדקת ודולפת.
    - >-
      הפרלינה תמיס את המכסה מלמטה, כי מילוי מלא מחזיק יותר חום מאשר מילוי חלקי.
    - >-
      הבונבון יהיה כבד מדי ולא ייפול מהתבנית בהיפוך, כי המשקל מצמיד אותו לדפנות.
  correct: 1
  explanation: >-
    משאירים 1.5-2 מ"מ (Callebaut: 1-1.5, Cacao Barry: 2) כדי שהמכסה יתמזג עם שפת הקליפה ויאטום.
    מילוי עד השפה הוא הסיבה הנפוצה לבונבונים שלא נסגרים.
- id: q3
  question: >-
    מילאתם בונבונים בערב. בחוץ 30°C ואין מזגן בחדר השינה. איך הכי נכון לתת למילוי לנוח עד הבוקר?
  options:
    - >-
      בתוך המקרר בלי כיסוי, כדי שהמילוי יתקשה מהר ושהקליפות לא יימסו בחום של הלילה.
    - >-
      במקפיא לשעה ואז על השיש, כדי שהמילוי יתייצב מהר ויספיק להתחמם לפני הסגירה.
    - >-
      בקופסה סגורה במקום הכי קריר בבית, ולהאריך את המנוחה עד שהמילוי יציב למגע.
    - >-
      על אדן החלון עם מאוורר מכוון לתבנית, כדי שזרם האוויר יקרר את המילוי בלילה.
  correct: 2
  explanation: >-
    המילוי צריך להתייצב לאט בחדר קריר (Cacao Barry: 12 שעות ב־17°C). במקרר או במקפיא נוצרת לחות
    כשמוציאים, והיא נכלאת מתחת למכסה. בחום מאריכים את המנוחה ובודקים במגע.
- id: q4
  question: >-
    חברה שואלת למה בונבוני הפרלינה שלכם מחזיקים כמה שבועות, ובונבוני הגנאש רק כשבועיים. מה התשובה הנכונה?
  options:
    - >-
      בגנאש יש שוקולד מריר שמתחמצן מהר, ובפרלינה יש שוקולד חלב שמחזיק יותר זמן במדף.
    - >-
      בפרלינה יש סוכר מיוחד ששומר על הבונבון, ובגנאש אין סוכר בכלל ולכן הוא מתקלקל.
    - >-
      הגנאש מכיל אגוזים שמתעפשים מהר, והפרלינה עשויה מאגוזים קלויים שלא מתקלקלים.
    - >-
      בגנאש יש מים מהשמנת שמיקרואורגניזמים יכולים לנצל, ובפרלינה כמעט אין מים.
  correct: 3
  explanation: >-
    הגורם המרכזי הוא פעילות המים. השוקולד והסוכר קושרים חלק מהמים בגנאש, אבל לא את כולם. פרלינה עם
    שוקולד כמעט בלי מים, ומה שמשתנה בה קודם הוא הטעם. Callebaut: רק ניסוי לאורך זמן קובע חיי מדף.
- id: q5
  question: >-
    סגרתם את הבונבונים, ואחרי ההוצאה המכסה מתקלף בקלות מכמה מהם. מה הכי סביר שקרה?
  options:
    - >-
      המכסה היה עבה מדי, ושכבה עבה מתכווצת יותר ולכן נפרדת מהקליפה בזמן הקירור.
    - >-
      השפות היו קרות או מלוכלכות, והמכסה לא התמזג עם שפת הקליפה.
    - >-
      שוקולד הסגירה היה מטומפר מדי, ושוקולד מטומפר לא נצמד לשוקולד מטומפר אחר.
    - >-
      השארתם את התבנית במקרר רק 10 דקות, והמכסה לא הספיק להיצמד לקליפה מבפנים.
  correct: 1
  explanation: >-
    המכסה נצמד כשהוא מתמזג עם שפה נקייה שאינה קרה מדי. Cacao Barry מחממים את פני התבנית לרגע לפני
    הסגירה. שוקולד מטומפר מתמזג היטב עם שוקולד מטומפר.
