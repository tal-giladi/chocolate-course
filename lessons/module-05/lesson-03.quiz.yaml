- id: q1
  question: >-
    חיממתם בקבוק חמאת קקאו צבעונית במיקרוגל עד 45°C, צבעתם מיד את השקעים ויצקתם קליפות. בהוצאה הצבע
    נשאר דבוק בתבנית והבונבונים יצאו חומים. מה היה צריך לעשות?
  options:
    - >-
      לחמם את התבנית במייבש שיער אחרי הצביעה, כדי שהצבע יתמזג טוב יותר עם הקליפה ויצא איתה.
    - >-
      להוסיף לצבע כפית צבע ג'ל, כדי שיהיה נוזלי יותר ויתפשט בשכבה דקה שמשתחררת בקלות.
    - >-
      לקרר את הצבע תוך ערבוב או ניעור עד כ־28°C, לבדוק טיפה על אצטט, ורק אז לצבוע.
    - >-
      לצקת את הקליפה כשהצבע עוד נוזלי, כדי שהשוקולד המטומפר יעביר לו את הגבישים שלו.
  correct: 2
  explanation: >-
    ב־45°C כל גבישי V בחמאה נמסו, וחמאה לא מטומפרת נדבקת לתבנית. Guichon מורידים ל־28°C ומנערים
    ליצירת גבישים יציבים. בדיקת אצטט מראה אם הצבע מתקשה ומשתחרר.
- id: q2
  question: >-
    רציתם בונבון צהוב עם נקודות אדומות, על קליפה מריר. באיזה סדר מכניסים לתבנית?
  options:
    - >-
      נקודות אדומות, אחריהן צהוב על כל השקע, אחריו שכבת לבן דקה, ובסוף קליפת המריר.
    - >-
      צהוב על כל השקע, אחריו נקודות אדומות, אחריהן שכבת לבן דקה, ובסוף קליפת המריר.
    - >-
      שכבת לבן דקה, אחריה צהוב, אחריו נקודות אדומות, ובסוף קליפת המריר.
    - >-
      קליפת המריר קודם, ואחרי שהתקשתה צובעים עליה צהוב ומוסיפים נקודות אדומות.
  correct: 0
  explanation: >-
    מה שנכנס ראשון לתבנית יהיה בחוץ. לכן פרטים קודם, רקע אחריהם, ולבן אחרון (RCI) כדי שהצהוב לא ייעלם
    על המריר. הצבע תמיד בתוך התבנית לפני הקליפה.
- id: q3
  question: >-
    צבעתם שקעים ובצד השני של התבנית התחלתם לצקת קליפות. התבנית הרגישה קרה, אז חיממתם אותה 15 שניות
    במייבש שיער. הצבע יצא עמום ומרוח. מה הסיבה?
  options:
    - >-
      הקליפה הייתה עבה מדי והסתירה את הצבע מאחור, ולכן הוא נראה עמום ולא חד.
    - >-
      החום המיס את שכבת הצבע הדקה והוציא אותה מטמפר, והקליפה מרחה אותה.
    - >-
      מייבש השיער הכניס לחות לתבנית, והלחות גרמה לפריחת סוכר על פני הצבע.
    - >-
      חמאת קקאו צבעונית צריכה תבנית חמה, אבל חיממתם רק 15 שניות במקום דקה שלמה.
  correct: 1
  explanation: >-
    אחרי שמתחילים לצבוע, לא מחממים את התבנית. שכבת הצבע דקה ונמסה מהר מעל כ־34°C, ואז היא מאבדת
    טמפר ומתערבבת עם השוקולד שנוצק עליה.
- id: q4
  question: >-
    בחנות נגמרה חמאת הקקאו הצבעונית. יש לכם חמאת קקאו טבעית וצבע ג'ל רגיל לעוגות. מה עושים?
  options:
    - >-
      מערבבים את הג'ל בחמאת הקקאו החמה עד שהוא מתפזר, ואז מטמפרים כרגיל ב־28°C.
    - >-
      ממיסים את הג'ל בכמה טיפות מים ואז מוסיפים לחמאת הקקאו, כדי שיתפזר באופן אחיד.
    - >-
      מוותרים על חמאת הקקאו ומערבבים את הג'ל ישירות לתוך השוקולד המטומפר של הקליפה.
    - >-
      קונים צבע מסיס שומן לשוקולד, כי צבע ג'ל על בסיס מים לא מתערבב בשומן ועושה נקודות.
  correct: 3
  explanation: >-
    חמאת קקאו ושוקולד הם שומן. צבע על בסיס מים לא מתמוסס בהם, נשאר בנקודות, ובשוקולד גורם להיתפסות.
    צריך צבע שכתוב עליו מסיס שומן או לשוקולד.
