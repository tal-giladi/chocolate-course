- id: q1
  question: >-
    פרסתם שוקולד מריר מטומפר על פס אצטט, העברתם מסרק, ונכנסתם לענות לדלת. אחרי 8 דקות ניסיתם לגלגל את
    הפס לספירלה, והשוקולד נסדק לכל אורכו. מה קרה?
  options:
    - >-
      השוקולד לא היה מטומפר, ולכן הוא לא התגבש בצורה V ונשאר פריך במקום להתכופף.
    - >-
      השוקולד כבר התקשה לגמרי ועבר את השלב היבש למגע, שבו הוא עוד גמיש ומתגלגל.
    - >-
      השכבה הייתה דקה מדי, ושכבה דקה לא מחזיקה שום כיפוף גם כשהיא עוד רכה.
    - >-
      האצטט היה קר מדי מהמקרר, והקור הפתאומי גרם לשוקולד להיסדק ברגע הגלגול.
  correct: 1
  explanation: >-
    שוקולד מטומפר מתקשה תוך כמה דקות. מגלגלים כשהוא עמום ויבש למגע ועוד גמיש; אחרי שהתקשה לגמרי הוא שביר
    ונסדק. שוקולד לא מטומפר דווקא נשאר רך ונמרח, לא נסדק.
- id: q2
  question: >-
    באוגוסט, במטבח של 28°C בלי מזגן, הספירלות לא מחזיקות צורה והשוקולד נמרח על האצטט גם אחרי 10 דקות.
    מה הצעד הנכון?
  options:
    - >-
      לחמם את השוקולד ל־35°C, כדי שיהיה נוזלי יותר ויתפשט בשכבה דקה שמתקשה מהר.
    - >-
      להוסיף לשוקולד כף שמן, כדי שיהיה גמיש יותר ויחזיק את צורת הספירלה בחום.
    - >-
      לעבור לעבוד בבוקר או בחדר ממוזג של 18-22°C, כי בחום כזה השוקולד כמעט לא מתגבש.
    - >-
      להכניס כל פס למקפיא מיד אחרי הפריסה, ולגלגל אותו אחרי חצי שעה כשהוא קשה.
  correct: 2
  explanation: >-
    טמפרטורת החדר קובעת כמה מהר השוקולד מתגבש. ב־28°C החלון כמעט לא נסגר. שוקולד חם יותר הורס את הטמפר,
    שמן מרכך אותו עוד, ופס קפוא כבר שביר ולא יתגלגל.
- id: q3
  question: >-
    ניסיתם להכין תלתלים במקלף מטבלה שיצאה עכשיו מהמקרר, וקיבלתם רק אבקה ושבבים קטנים. מה משנים?
  options:
    - >-
      מחממים את הטבלה מעט, 5 שניות במיקרוגל ב־50% או כמה דקות בכף היד, ומנסים שוב.
    - >-
      ממיסים את הטבלה לגמרי, מטמפרים אותה מחדש, ומקלפים ממנה כשהיא עוד נוזלית.
    - >-
      מחליפים את המקלף בסכין חדה, כי מקלף ירקות לא מתאים לשוקולד קשה וקר.
    - >-
      מכניסים את הטבלה למקפיא לעוד 10 דקות, כדי שתהיה קשה ואחידה לאורך כולה.
  correct: 0
  explanation: >-
    גוש קר מדי מתפורר במקום להתעגל. מרככים אותו רק מעט, כמו שכותבים Williams Sonoma, והפס מהמקלף מתעגל
    לתלתל. גוש חם מדי נותן רצועה רכה, ולכן מחממים בפולסים קצרים.
- id: q4
  question: >-
    אתם רוצים מניפות שוקולד. פרסתם שוקולד מטומפר על גב תבנית ממתכת שקיררתם במקרר, ושכחתם לנגב אותה.
    השוקולד נהיה סמיך ומגורגר תוך שניות. מה הסיבה?
  options:
    - >-
      התבנית הייתה קרה מדי, והקור גרם לשוקולד לעבור לצורה VI בתוך כמה שניות.
    - >-
      השוקולד היה חם מדי, והמגע עם המתכת הקרה יצר בו גבישים לא יציבים.
    - >-
      מתכת מגיבה עם חמאת הקקאו, ולכן מניפות מכינים רק על שיש או על גרניט.
    - >-
      טיפות מים מהעיבוי על התבנית נגעו בשוקולד וגרמו לו להיתפס.
  correct: 3
  explanation: >-
    משטח שיוצא מהמקרר מתכסה בעיבוי. מעט מים גורמים לשוקולד מומס להיתפס ולהיות סמיך ומגורגר, כמו ב־02.1.
    מנגבים את המשטח יבש לגמרי לפני שפורסים.
- id: q5
  question: >-
    ספירלות שהכנתם נראות יפה באצטט, אבל אחרי הקילוף הן אפורות ונמסות מיד כשנוגעים בהן. על מה זה מעיד?
  options:
    - >-
      שקילפתם מוקדם מדי, לפני שהשוקולד הספיק להתקרר במקרר 15 דקות.
    - >-
      שהשוקולד לא היה מטומפר, ולכן לא התגבש בצורה V ולא מחזיק בחום היד.
    - >-
      שהשכבה הייתה עבה מדי, ושכבה עבה נשארת רכה בפנים גם אחרי קירור.
    - >-
      שהאצטט היה מבריק מדי, ומשטח מבריק מונע מהשוקולד להתגבש היטב.
  correct: 1
  explanation: >-
    קישוט אפור שנמס בנגיעה הוא סימן לשוקולד שלא טומפר. מטמפרים מחדש ובודקים בבדיקת סכין לפני כל סבב. אצטט
    מבריק דווקא נותן ברק לשוקולד מטומפר.
