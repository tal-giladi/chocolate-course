- id: q1
  question: >-
    אחרי חמישה לבבות, השוקולד בקורנט יוצא רק בלחץ חזק והקו נקטע. בקערה השוקולד עדיין ב־31°C ועבר בדיקת
    סכין. מה עושים?
  options:
    - >-
      מכניסים את הקורנט למיקרוגל ל־10 שניות, כדי להמיס מחדש את כל מה שהתגבש בתוכו.
    - >-
      מגדילים את הפתח בקצה הקורנט, כדי שהשוקולד הסמיך יוכל לצאת בלי לחץ.
    - >-
      מחממים את הקורנט 2-3 שניות במייבש שיער, או ממלאים קורנט חדש מהקערה.
    - >-
      מטמפרים מחדש את כל הקערה, כי השוקולד בקורנט מעיד שהטמפר כולו נכשל.
  correct: 2
  explanation: >-
    בקורנט יש מסה קטנה שמתקררת ומתגבשת מהר; זו התגבשות רגילה, לא כישלון של הטמפר. חימום קצר או קורנט חדש
    מהקערה מחזירים זרימה. מיקרוגל ישבור את הטמפר, ופתח גדול ייתן קו עבה.
- id: q2
  question: >-
    הרמתם עשרה פרפרים מזולפים מהנייר, ובכל אחד נשארו על הנייר שניים או שלושה קווים מתוך הכנפיים. מה
    הסיבה הסבירה?
  options:
    - >-
      הנייר היה נייר אפייה רגיל, ושוקולד נדבק אליו יותר מאשר לאצטט.
    - >-
      הקווים האלה לא נגעו בקו החיצוני או בקו אחר, ולכן לא היו חלק מהשלד.
    - >-
      הרמתם מוקדם מדי, לפני שהשוקולד התקשה במקרר לפחות שעה שלמה.
    - >-
      השוקולד היה מריר, וקווי מריר דקים נשברים יותר מקווי חלב או לבן.
  correct: 1
  explanation: >-
    פיליגרן מחזיק את עצמו דרך החיבורים. קו שמתחיל ונגמר באוויר נשאר על הנייר או נשבר. מזלפים קודם את הקו
    החיצוני, ואחריו קווים שמתחילים ונגמרים על קו קיים.
- id: q3
  question: >-
    אתם רוצים רצועת תחרה מעוגלת ומבריקה כדי להניח אותה על צד של כוס קינוח. על מה מזלפים, ומתי מעגלים
    אותה?
  options:
    - >-
      על פס אצטט, ומעגלים על מערוך כשהשוקולד עמום, אחרי כדקה.
    - >-
      על נייר אפייה, ומעגלים מיד כשהשוקולד עוד נוזלי לגמרי ומבריק.
    - >-
      על נייר אפייה, ומעגלים אחרי שהשוקולד התקשה לגמרי במקרר.
    - >-
      על פס אצטט, ומעגלים אחרי 20 דקות, כשהשוקולד קשה ויציב.
  correct: 0
  explanation: >-
    אצטט נותן צד מבריק, ונייר אפייה צד סאטן. מעגלים בחלון העמום של 09.1: נוזלי מדי זה זורם ומתעוות, וקשה
    מדי זה נסדק.
- id: q4
  question: >-
    קו הניסיון שלכם יוצא רחב, שטוח ונמרח לכתם, אף שחתכתם פתח קטן. המדחום בקערה מראה 34°C במריר. מה
    לעשות?
  options:
    - >-
      לחתוך פתח קטן עוד יותר בקורנט חדש, ולהמשיך לזלף מאותה קערה בלי לשנות דבר.
    - >-
      להוסיף לקורנט מעט אבקת סוכר, כדי שהשוקולד יסמיך ויחזיק קו עגול וצר.
    - >-
      לזלף מהר יותר, כדי שהקו יספיק להתקרר לפני שהוא מתפשט על הנייר.
    - >-
      להחזיר את השוקולד לטמפרטורת העבודה ולבדוק טמפר, כי 34°C חם מדי.
  correct: 3
  explanation: >-
    שוקולד חם מטמפרטורת העבודה זורם ומתפשט, וב־34°C גם הטמפר כבר לא בטוח. מחזירים ל־31-32°C ובודקים
    בבדיקת סכין. אבקת סוכר תהפוך את השוקולד לגושי.
