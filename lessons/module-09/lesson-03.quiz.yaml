- id: q1
  question: >-
    יש לכם עוגה בקוטר 18 ס"מ ובגובה 7 ס"מ. איזה פס אצטט חותכים לצווארון?
  options:
    - >-
      בערך 20 ס"מ אורך ו־7 ס"מ גובה, כי מודדים לפי הקוטר והגובה המדויק.
    - >-
      בערך 36 ס"מ אורך ו־9 ס"מ גובה, כי מספיק פעמיים הקוטר כדי לעטוף.
    - >-
      בערך 59 ס"מ אורך ו־9-9.5 ס"מ גובה: היקף ועוד 2 ס"מ, וגובה ועוד 2-2.5 ס"מ.
    - >-
      בערך 57 ס"מ אורך ו־7 ס"מ גובה, כדי שהצווארון לא יבלוט מעל הקרם.
  correct: 2
  explanation: >-
    ההיקף הוא הקוטר כפול 3.14, כ־57 ס"מ, ועוד 2 ס"מ חפיפה לתפר. מוסיפים 2-2.5 ס"מ לגובה כדי שהצווארון יבלוט
    מעל העוגה ויחזיק את הקישוטים העליונים.
- id: q2
  question: >-
    קישטתם עוגת קצפת בערב עם פיליגרן ותלתלים והכנסתם למקרר. למחרת, אחרי חצי שעה על השולחן, הקישוטים עמומים
    ומכוסים בכתמים לבנים. מה קרה, ומה עושים בפעם הבאה?
  options:
    - >-
      השוקולד לא היה מטומפר; בפעם הבאה מטמפרים שוב ובודקים בבדיקת סכין.
    - >-
      עיבוי על השוקולד הקר יצר פריחת סוכר; מניחים את הקישוטים העדינים רק לפני ההגשה.
    - >-
      השומן מהקצפת נספג בקישוטים; בפעם הבאה מקשטים רק עוגות עם גנאש מוצק.
    - >-
      המקרר היה חם מדי; בפעם הבאה מכניסים את העוגה המקושטת למקפיא ללילה.
  correct: 1
  explanation: >-
    לפי Callebaut, עיבוי ממיס סוכר על פני השוקולד, והוא מתגבש מחדש לכתמים לבנים. קישוט דק סובל מזה במיוחד.
    הוא עולה אחרון, והצווארון נשאר עטוף באצטט עד ההגשה.
- id: q3
  question: >-
    פרסתם שוקולד על פס האצטט, ומיד עטפתם את העוגה. השוקולד זלג לתחתית ונמרח על הצלחת. מה היה צריך לעשות?
  options:
    - >-
      לפרוס שכבה עבה יותר, כי שכבה דקה זולגת מהר יותר משכבה של 4-5 מ"מ.
    - >-
      לחמם את העוגה מעט לפני העטיפה, כדי שהקרם יהיה רך ויספוג את השוקולד.
    - >-
      לחכות שהשוקולד יתקשה לגמרי על האצטט, ורק אז לכופף אותו סביב העוגה.
    - >-
      לחכות דקה או שתיים, עד שכשמטים את הפס השוקולד כבר לא מחליק אבל עוד גמיש.
  correct: 3
  explanation: >-
    Food Heaven עוטפים כשאפשר להרים את הפס והשוקולד לא מחליק. נוזלי מדי זה זולג, קשה מדי זה נסדק. שכבה עבה
    וחימום העוגה רק מחמירים.
- id: q4
  question: >-
    לקוחה מבקשת עוגה עם נצנצים כסופים. בחנות מצאתם צנצנת שכתוב עליה רק "לא רעיל, לקישוט" בלי רשימת רכיבים.
    מה עושים?
  options:
    - >-
      לא שמים אותם על חלק נאכל; מחפשים נצנצים שכתוב עליהם "אכיל" ויש עליהם רשימת רכיבים.
    - >-
      משתמשים בכמות קטנה, כי "לא רעיל" אומר שאפשר לאכול את זה בלי בעיה.
    - >-
      מפזרים רק על הצווארון, כי צווארון שוקולד בדרך כלל לא נאכל עם העוגה.
    - >-
      מערבבים אותם בחמאת קקאו לפני הפיזור, כדי שיהפכו לחלק מהשוקולד האכיל.
  correct: 0
  explanation: >-
    לפי ה־FDA, מוצר שכתוב עליו רק "לא רעיל" או "לקישוט בלבד" בלי רשימת רכיבים לא שמים ישירות על אוכל. הצווארון
    נאכל, וחמאת קקאו לא הופכת חומר לא אכיל לאכיל.
- id: q5
  question: >-
    עוגת יום הולדת עם קרם שמנת וצווארון שוקולד תוגש בגינה ביוני, ב־33°C. מתי מוציאים אותה מהמקרר?
  options:
    - >-
      שעתיים לפני החיתוך, כדי שהקרם יתרכך ויהיה נעים לאכילה.
    - >-
      בבוקר, כי צווארון שוקולד מטומפר מגן על הקרם מפני החום.
    - >-
      קרוב לחיתוך, ולא יותר משעה בחוץ, כי מעל 32°C החלון מתקצר לשעה אחת.
    - >-
      רק אחרי שהאורחים מגיעים, ומשאירים אותה בחוץ עד סוף האירוע.
  correct: 2
  explanation: >-
    לפי ה־FDA, מזון מתכלה לא נשאר בחוץ יותר משעתיים, ושעה אחת כשחם מ־32°C. בחום כזה גם הצווארון והקישוטים
    מתרככים, ולכן מגישים מהר ומחזירים למקרר.
