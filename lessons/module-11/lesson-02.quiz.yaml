- id: q1
  question: >-
    במארז של 9 יש שלושה סביבונים, שלושה בונבוני פרלינה ושלושה טראפלס של שוקולד ושמנת. איזה תאריך ואיזה
    אחסון כותבים על הפתק?
  options:
    - >-
      את התאריך של הסביבונים, כי הם רוב המשקל של המארז, ואת הטראפלס מבקשים לאכול קודם.
    - >-
      ממוצע של שלושת התאריכים, כדי שהמארז לא ייזרק מוקדם מדי ולא יישמר מאוחר מדי.
    - >-
      את התאריך של הפרלינה, כי פרלינה מתחמצנת והיא הפריט הראשון שמשנה טעם במארז כזה.
    - >-
      את התאריך והאחסון של הטראפלס, כלומר מקרר וזמן קצר, כי הוא הפריט הרגיש ביותר במארז.
  correct: 3
  explanation: >-
    מארז שומר כמו הפריט הכי רגיש בו. טראפלס של שוקולד ושמנת צריך מקרר וזמן קצר (06.4), ולכן כל המארז
    מקבל את התנאים שלו. מי שרוצה מארז שמחזיק זמן בונה אותו מפריטים עם אותם תנאי אחסון.
- id: q2
  question: >-
    חישבתם מארז של 5 סביבונים: 10.45 ₪ חומרי גלם ו־3.13 ₪ אריזה. מה הסכום הנכון לרשום כעלות למארז לפי
    התבנית?
  options:
    - >-
      13.58 ₪, כי פחת מוסיפים רק כשמשהו באמת נשבר בייצור, ואז רושמים אותו בנפרד.
    - >-
      כ־15.2 ₪, כלומר 13.58 ₪ ועוד פחת של כ־12% על חומרי הגלם והאריזה ביחד.
    - >-
      40 ₪, כי זה המחיר של מארז דומה בשוק, וזו העלות שכל מארז כזה צריך לכסות.
    - >-
      כ־11.7 ₪, כלומר חומרי הגלם ועוד פחת של 12%, כי על אריזה לא מחשבים פחת בכלל.
  correct: 1
  explanation: >-
    התבנית מוסיפה פחת של 10-15% על כל הסכום, כי גם פריטים וגם אריזות נפגעים. מחיר בשוק הוא מחיר מכירה של
    עסק שכולל עבודה, משלוח ומע"מ, ולא עלות.
- id: q3
  question: >-
    לפי הדוגמה בשיעור, עלות ליחידה במארז 5 היא כ־3 ₪ ובמארז 16 כ־1.8 ₪. מה ההסבר העיקרי?
  options:
    - >-
      קופסה, מדבקה וסרט מתחלקים על יותר יחידות במארז גדול, ולכן חלק האריזה ליחידה קטן.
    - >-
      במארז 16 משתמשים בשוקולד זול יותר, כי בכמות גדולה אף אחד לא מבחין בהבדל באיכות.
    - >-
      במארז 16 אין פחת, כי כשמכינים הרבה יחידות כל טעות מתקזזת ביחידות הנוספות.
    - >-
      במארז 5 יש סביבונים, ובמארז 16 בונבונים, ובונבון תמיד זול יותר מכל צורה תלת־ממדית.
  correct: 0
  explanation: >-
    העלות של האריזה כמעט קבועה לקופסה, אז היא מתחלקת על יותר יחידות במארז גדול. ההבדל בין סביבון לבונבון
    משפיע קצת, אבל לא הוא הסיבה המרכזית.
- id: q4
  question: >-
    מכינים מארז 9 לחברה עם ילד אלרגי לאגוזים, ושלושה מהבונבונים הם פרלינה לוז. מה עושים?
  options:
    - >-
      שמים את הפרלינה בשורה בקצה וכותבים "מכיל אגוזי לוז" על הבונבונים האלה בלבד.
    - >-
      משאירים את הפרלינה במרכז, כי שם הכי קל לזהות אותה לפי הצבע השונה של הקליפה.
    - >-
      מחליפים את הפרלינה במילוי בלי אגוזים, וכותבים על הפתק אם רכיבים אחרים "עלולים להכיל" אגוזים.
    - >-
      עוטפים את שלושת בונבוני הפרלינה בצלופן בתוך הקופסה, כך שאין מגע עם שאר הבונבונים.
  correct: 2
  explanation: >-
    פריט עם אגוזים באותה קופסה הופך את כל המארז ל"עלול להכיל". למשפחה עם אלרגיה בונים מארז בלי אגוזים
    מההתחלה, ובודקים "עלול להכיל" על אריזות השוקולד והסוכריות.
- id: q5
  question: >-
    המארז שתכננתם יצא ב־17 ₪ עלות, ומארז דומה בשוק נמכר ב־40 ₪. מה המסקנה הנכונה מהשיעור?
  options:
    - >-
      שהמחיר בשוק מנופח, ולכן אפשר למכור מארז ביתי ב־20 ₪ ועדיין להרוויח יפה על כל מארז.
    - >-
      שהעלות שלכם היא רצפה בלבד, ועוד לא כוללת עבודה, משלוח, רישוי ומע"מ, שנלמדים במודול 19.
    - >-
      שחישבתם לא נכון, כי עלות של מארז ביתי צריכה להיות כמחצית ממחיר המכירה בשוק.
    - >-
      שכדאי לבחור קופסה יקרה יותר, כדי שהעלות תתקרב למחיר השוק והמארז ייראה שווה אותו.
  correct: 1
  explanation: >-
    הטבלה בשיעור כוללת רק חומרי גלם, אריזה ופחת. מחיר מכירה צריך לכסות גם שעות עבודה, משלוח, רישוי ומע"מ,
    ולכן לא קובעים מחיר מתוך עלות החומרים לבד.
