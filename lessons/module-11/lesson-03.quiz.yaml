- id: q1
  question: >-
    יוני, 31°C בחוץ. אתם עוצרים לעשר דקות בסופר בדרך למסור מארז סביבונים. איפה המארז?
  options:
    - >-
      בתא המטען, כי הוא מוצל ואין בו שמש ישירה, ולכן לא מתחמם בעשר דקות של עצירה.
    - >-
      על המושב האחורי עם חלון פתוח מעט, כדי שהאוויר יתחלף והרכב לא יתחמם בזמן העצירה.
    - >-
      ברכב עם המזגן כבוי, כי עשר דקות זה פחות מהזמן שלוקח לרכב להגיע ל־34°C.
    - >-
      בשקית איתכם, כי רכב חונה מתחמם בכ־1.8°C כל 5 דקות, ורוב העלייה בחצי השעה הראשונה.
  correct: 3
  explanation: >-
    במחקר של McLaren ועמיתיו הרכב התחמם בכ־1.8°C כל 5 דקות, וחלון פתוח מעט לא עזר. בקיץ ישראלי זה עובר את
    33.8°C מהר. תא המטען לא נמדד, ואין סיבה להניח שהוא קר.
- id: q2
  question: >-
    שמרתם מארז בונבונים במקרר בגלל גל חום. בבוקר המסירה מה עושים?
  options:
    - >-
      פותחים את הקופסה כדי שהבונבונים יתאווררו ויתחממו מהר יותר לפני הנסיעה הארוכה.
    - >-
      מוציאים את הקופסה סגורה ופותחים רק כשהיא בטמפרטורת החדר, כדי שהעיבוי ייווצר עליה.
    - >-
      מייבשים כל בונבון במגבת נייר מיד כשמוציאים, כדי שהטיפות לא יספיקו להמיס סוכר.
    - >-
      מעבירים את הבונבונים לקופסה חדשה ויבשה מיד, כי הקופסה מהמקרר מלאה בלחות.
  correct: 1
  explanation: >-
    שוקולד קר באוויר חם ולח מושך עיבוי, והעיבוי ממיס סוכר ומשאיר פריחת סוכר. Callebaut ממליצים שהמוצרים
    הארוזים יחזרו לטמפרטורת החדר לפני שפותחים. כל פתיחה מוקדמת חושפת את השוקולד.
- id: q3
  question: >-
    במארז יש שלושה טראפלס של שוקולד ושמנת. בחוץ 34°C, והנסיעה לנמען שעה וחצי. מה התוכנית הנכונה?
  options:
    - >-
      צידנית עם קרחון עטוף, ומסירה ביד, כי מעל 32°C מזון רגיש לא נשאר בחוץ יותר משעה.
    - >-
      שקית מבודדת בלי קרחון, כי שעה וחצי פחות מכלל השעתיים שחל על כל מזון רגיש.
    - >-
      שקית רגילה, כי הקליפה של הטראפלס מגינה על הגנאש מחום ומחיידקים בזמן הנסיעה.
    - >-
      להקפיא את המארז לילה לפני, כדי שיפשיר בדרך ויגיע לנמען בדיוק בטמפרטורת הגשה.
  correct: 0
  explanation: >-
    כלל השעתיים יורד לשעה מעל 32°C. נסיעה של שעה וחצי בחום דורשת צידנית עם קרחון עטוף, ומסירה ביד
    ישר למקרר. הקפאה והפשרה בדרך מוסיפות עיבוי.
- id: q4
  question: >-
    בניסוי העיבוי, קופסה B (פתוחה) קיבלה שכבה לבנה ויבשה שלא נעלמת במגע, וקופסה A (סגורה) נשארה מבריקה. מה
    השכבה הלבנה וכיצד מתקנים?
  options:
    - >-
      פריחת שומן מחום, ומתקנים בקירור נוסף במקרר עד שהברק חוזר לפני השוקולד.
    - >-
      עובש שהתפתח מהלחות במקרר, ולכן זורקים את שתי החתיכות ואת הקופסה שלהן.
    - >-
      פריחת סוכר מעיבוי; השוקולד בטוח, וממיסים ומטמפרים מחדש או מכינים ממנו שוקו.
    - >-
      שכבת חמאת קקאו שעלתה מהקור, והיא נעלמת לבד אחרי יום בטמפרטורת החדר.
  correct: 2
  explanation: >-
    שכבה יבשה ומחוספסת אחרי יציאה קרה מהמקרר היא פריחת סוכר: מים המיסו סוכר, והוא התגבש מחדש. השוקולד
    בטוח לאכילה, וחוזר להמסה ולטמפרור או לשוקו.
