- id: q1
  question: >-
    קניתם קופסת קרטון מודפסת ויפה לחמישה בונבונים, בלי תחתית. מה עושים לפני שמסדרים בה את הבונבונים?
  options:
    - >-
      מרפדים אותה בנייר פרגמנט או מכניסים כל בונבון לכוסית נייר שמיועדת למזון, כדי שהשוקולד לא ייגע בקרטון.
    - >-
      מסדרים את הבונבונים ישר על הקרטון, כי קרטון של קופסת מתנה תמיד מיוצר במיוחד למגע במזון.
    - >-
      עוטפים כל בונבון בניילון בועות, כדי שהשוקולד יהיה מוגן גם מהקרטון וגם ממכות בדרך.
    - >-
      מקררים את הקופסה הריקה שעה במקרר, כדי שהדיו של ההדפסה יתייבש ולא יעבור לשוקולד.
  correct: 0
  explanation: >-
    קרטון מודפס או ממוחזר יכול להעביר חומרים למזון, ולכן שוקולד שוכב על תחתית, כוסית או נייר שמיועדים
    למזון. ניילון בועות שנוגע בשוקולד משאיר סימנים, ומקרר רק מוסיף לחות.
- id: q2
  question: >-
    חברה אומרת שהיא תשמור את הבונבונים שתקבל שבועיים "בשקית הצלופן, כי צלופן אוטם לחות". מה נכון?
  options:
    - >-
      היא צודקת, כי כל שקית שנמכרת בשם צלופן היא סרט אטום, ולכן אין צורך בקופסה נוספת לאחסון.
    - >-
      היא צודקת רק אם השקית במקרר, כי בקור הצלופן מתכווץ ונאטם סביב הבונבונים בלי פתחים.
    - >-
      צלופן אמיתי מעביר אדי מים, והרבה "צלופן" הוא פלסטיק דק; לאחסון ארוך עדיף לשים את השקית בקופסה אטומה.
    - >-
      צלופן מתאים רק לשוקולד מריר, כי בשוקולד חלב ולבן החלב מגיב עם השקית ומשנה את הטעם.
  correct: 2
  explanation: >-
    צלופן לא מצופה מעביר אדי מים, ושקיות רבות בשם הזה הן סרטי פלסטיק דקים. שקית שומרת מאבק ומגע לימים
    ספורים; לשבוע ויותר, או למקרר, השקית נכנסת לקופסה אטומה.
- id: q3
  question: >-
    במבחן הניעור הסביבון זז מצד לצד בתא, ופינה של הקובייה נסדקה. מה התיקון הנכון?
  options:
    - >-
      להחליף לקופסה גבוהה יותר, כי הסביבון נסדק מהלחץ של המכסה ולא מהתזוזה בתוך התא.
    - >-
      למלא את החלל בנייר משי או לעבור לתא צר יותר, כך שהתא רחב מהסביבון רק ב־2-5 מ"מ.
    - >-
      להדביק את הסביבון לתחתית בנקודת שוקולד, כי פריט שזז נשבר תמיד גם בתא מתאים.
    - >-
      לנער פחות בבדיקה הבאה, כי בדרך לנמען הקופסה לא תזוז ולא תוטה כמו במבחן הניעור.
  correct: 1
  explanation: >-
    תא רחב מדי הוא הסיבה לתזוזה ולשבר. ממלאים חללים בנייר משי או בוחרים תא שרחב מהפריט ב־2-5 מ"מ, ועושים
    ניעור שוב. הדבקה לתחתית מקשה להוציא את הפריט ומשאירה סימן.
- id: q4
  question: >-
    אתם מוסיפים למארז פרחים יבשים ונצנצים "לקישוט בלבד" כדי שייראה חגיגי. איפה הם יכולים להיות?
  options:
    - >-
      על הבונבונים עצמם, כי כמות קטנה של נצנצים לא נבלעת כשמורידים אותם לפני האכילה.
    - >-
      בתוך התאים, בין הפריטים, כי שם הם ממלאים חללים ומונעים תזוזה בזמן ההובלה.
    - >-
      בתוך שקית הצלופן עם הפריט, כי השקית סגורה ולכן הקישוט לא יכול לזוז ולגעת בו.
    - >-
      מחוץ לקופסה הפנימית או לשקית, על המכסה או על הסרט, בלי מגע בשוקולד.
  correct: 3
  explanation: >-
    מה שלא נועד לאכילה לא נוגע בשוקולד, כמו אבקות "לקישוט בלבד" ב־05.4. קישוט כזה הולך על המכסה או על הסרט,
    ואת החללים בפנים ממלאים בנייר משי לבן.
