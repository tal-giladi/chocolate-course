- id: q1
  question: >-
    שלושה שבועות לפני חנוכה אתם רוצים להכין 6 מארזים של 5 סביבונים לחברים. בחנויות בישראל לא מצאתם
    תבנית סביבון. מה הבחירה הסבירה?
  options:
    - >-
      להזמין עכשיו תבנית פוליקרבונט תלת־ממד מחו"ל, כי היא תגיע תוך שבוע ותחסוך את כל העבודה הידנית.
    - >-
      לבנות את הסביבונים מחלקים שנמכרים בישראל, ולהזמין תבנית מחו"ל לשנה הבאה אם רוצים כמויות.
    - >-
      לצקת סביבונים בתבנית לביצי הפתעה, כי הצורה דומה מספיק ואין צורך בחוד או בידית נפרדים.
    - >-
      לוותר על המארזים השנה, כי סביבון שלא נוצק בתבנית אחת נשבר תמיד בחיבורים בזמן המשלוח.
  correct: 1
  explanation: >-
    הזמנה מחו"ל לוקחת שבועות (חלק מהתבניות מיוצרות לפי הזמנה, ויש משלוח ומכס), ולכן מזמינים כחודשיים
    מראש. ל־30 סביבונים בשלושה שבועות, הרכבה מחלקים עובדת, וחיבורים בשוקולד מטומפר מחזיקים.
- id: q2
  question: >-
    הדבקתם ידית בשוקולד שהמסתם במיקרוגל, בלי לטמפר. אחרי שעה הידית עדיין זזה, והסביבון "שוקע". למה?
  options:
    - >-
      הידית הייתה כבדה מדי ביחס לגוף, ולכן כל דבק מתעייף ונמתח אחרי שעה של עמידה.
    - >-
      במיקרוגל נכנסה לשוקולד לחות, והמים גרמו לדבק להיתפס ולאבד את כוח ההדבקה שלו.
    - >-
      שוקולד מומס שלא טומפר מתקשה לאט ונשאר רך בחיבור, ושוקולד מטומפר מתגבש תוך דקות ונועל.
    - >-
      החדר היה קר מדי, ולכן הדבק התקשה מהר מדי מבחוץ ונשאר נוזלי מבפנים לאורך זמן.
  correct: 2
  explanation: >-
    דבק מטומפר מתגבש בצורה V תוך דקות בחדר ומתכווץ יחד עם החלקים. שוקולד בלי גבישי זרע מתקשה לאט, נשאר
    רך שעות ומלבין, ולכן כל חיבור בסביבון נעשה בשוקולד מטומפר.
- id: q3
  question: >-
    אתם בודקים תבנית סביבון באתר בינלאומי. כתוב בה "thermoformed plastic, closed bottom, clips sold
    separately". מה זה אומר לכם?
  options:
    - >-
      זו תבנית פלסטיק דקה בשני חצאים שנסגרים בקליפסים, ואת הקליפסים צריך להזמין בנפרד.
    - >-
      זו תבנית סיליקון שטוחה שנותנת חצי סביבון, ואת החצי השני יוצקים בתבנית אחרת.
    - >-
      זו תבנית פוליקרבונט קשיחה שמגיעה מורכבת, וכל מה שצריך הוא לצקת דרך התחתית הפתוחה.
    - >-
      זו תבנית חד־פעמית שנחתכת אחרי היציקה, ולכן הקליפסים נשלחים רק למי שמזמין כמות.
  correct: 0
  explanation: >-
    "thermoformed" הוא פלסטיק דק ולא פוליקרבונט קשיח, "closed bottom" אומר שני חצאים שנסגרים ויוצקים
    דרך פתח, כמו התבניות הכפולות של Callebaut, והקליפסים במקרה הזה לא כלולים.
- id: q4
  question: >-
    הסביבונים עם הסוכריות היו במקרר, והוצאתם אותם ישר לשולחן ביום חם. אחרי חצי שעה הסוכריות זלגו צבע
    והופיעו כתמים לבנים. מה קרה?
  options:
    - >-
      השוקולד לא טומפר, וכתמים לבנים אחרי מקרר הם תמיד פריחת שומן שמגיעה מטמפר חלקי.
    - >-
      הסוכריות היו טבעוניות, ולכן הצבעים שלהן טבעיים ונמסים בכל שינוי של טמפרטורה.
    - >-
      הקור במקרר הקפיא את הסוכר שבסוכריות, וכשהוא הפשיר הוא נמס יחד עם הצבע לתוך השוקולד.
    - >-
      על השוקולד הקר נוצר עיבוי, המים המיסו צבע וסוכר, וכשהתאדו נשארו כתמים של פריחת סוכר.
  correct: 3
  explanation: >-
    מעבר מקר לחם יוצר עיבוי על פני השוקולד: הצבע זולג והסוכר מתגבש מחדש ככתם לבן. לכן לא מקררים אחרי
    הקישוט, ואם חייבים, מוציאים את הקופסה סגורה ומחכים שתגיע לטמפרטורת החדר (03.5).
- id: q5
  question: >-
    שקלתם סביבון אחד: 21 גרם. קוברטורה עולה לכם כ־90 ₪ לק"ג. כמה עולה בערך השוקולד במארז של 5?
  options:
    - >-
      כ־2 ₪, כי 21 גרם הם כמעט כלום ממחיר הקילו, והשאר נשאר בקערה לסבב הבא.
    - >-
      כ־9.5 ₪, כי 5 סביבונים הם כ־105 גרם, ו־105 גרם של קוברטורה ב־90 ₪ לק"ג עולים כ־9.5 ₪.
    - >-
      כ־27 ₪, כי צריך לטמפר 300 גרם לכל סוג שוקולד, וכל הכמות הזאת נחשבת עלות של המארז.
    - >-
      כ־40 ₪, כמו המחיר של מארז דומה בחנות, כי המחיר בחנות משקף את עלות השוקולד בלבד.
  correct: 1
  explanation: >-
    5 × 21 = 105 גרם, ו־0.105 × 90 ≈ 9.5 ₪. השוקולד העודף מהטמפרור חוזר לקערה ולא נכנס לעלות המארז. מחיר
    בחנות כולל גם עבודה, אריזה ושאר העלויות, ולכן לא משווים אותו לעלות השוקולד בלבד.
