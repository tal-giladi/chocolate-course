- id: q1
  question: >-
    יצקתם חצאי כדור של 6 ס"מ בשכבה אחת. בהוצאה שניים מהם נשברו, וחתיכות נשארו דבוקות בתבנית. בדיקת
    הסכין עברה. מה הכי סביר לשנות?
  options:
    - >-
      לצקת שכבה שנייה אחרי שהראשונה התקשתה, כי קליפה דקה לא מתכווצת מספיק ונשברת בהוצאה.
    - >-
      לחמם את התבנית ל־35°C לפני היציקה, כדי שהשוקולד יישאר נוזלי יותר ויתפזר דק ואחיד.
    - >-
      להכניס את התבנית למקפיא לחצי שעה, כי קור חזק מכווץ את השוקולד ומשחרר גם קליפה דקה.
    - >-
      להוסיף לשוקולד מעט חמאת קקאו, כדי שיהיה נוזלי יותר ויזרום לכל השקע בשכבה אחת.
  correct: 0
  explanation: >-
    לפי Callebaut קליפה דקה מדי לא מתכווצת מספיק, נשברת ונדבקת, והפתרון הוא שתיים־שלוש שכבות לפני
    ההוצאה. שוקולד נוזלי יותר נותן קליפה דקה עוד יותר, ותבנית חמה מהשוקולד ממיסה את גבישי V.
- id: q2
  question: >-
    בכל החצאים מופיע כתם עמום באותו מקום, בתחתית הכיפה. קיררתם את התבנית כשהיא הפוכה על מדף המקרר.
    מה ההסבר הסביר?
  options:
    - >-
      השוקולד לא טומפר, כי כתם עמום הוא תמיד סימן לטמפר חסר ולא קשור לאופן הקירור.
    - >-
      החום נלכד בתוך השקעים ולא יצא, ולכן Callebaut מקררים כשהצד הפתוח פונה הצידה או למעלה.
    - >-
      המקרר היה חם מדי, ולכן השוקולד התקשה לאט ויצר גבישים גדולים בתחתית הכיפה בלבד.
    - >-
      התבנית לוטשה יותר מדי בצמר גפן, והליטוש משאיר שכבה דקה שיוצרת כתם עמום בתחתית.
  correct: 1
  explanation: >-
    Callebaut מציינים שחום כלוא בתבנית משאיר כתמים עמומים, ולכן מקררים עם הפתחים הצידה או למעלה. כתם
    שחוזר באותו מקום בכל השקעים מצביע על בעיה בקירור ולא על שוקולד שלא טומפר.
- id: q3
  question: >-
    אתם מחברים שני חצאים על מחבת. החצי הראשון עמד על המחבת כחמש שניות, והוא נעשה נמוך בכמה מילימטרים
    מהשני. מה עושים בפעם הבאה?
  options:
    - >-
      משאירים את שני החצאים על המחבת אותו זמן ארוך, כדי שהקוטר של שניהם יתקצר באותה מידה.
    - >-
      מחממים את המחבת יותר, כדי שהשפה תימס מהר ואפשר יהיה להרים את החצי אחרי שנייה אחת.
    - >-
      משתמשים במחבת חמימה בלבד, ונוגעים בה שנייה־שתיים לכל חצי, רק עד שהשפה מתחילה להימס.
    - >-
      מורחים על השפה שוקולד מומס שלא טומפר, כי הוא נשאר נוזלי זמן רב ונותן זמן ליישר.
  correct: 2
  explanation: >-
    בשיטת הצלחת החמה ממיסים רק את קצה השפה: Callebaut משפשפים כמה שניות, ו־Food Network מניחים "רק
    לשנייה" על מחבת באש נמוכה מאוד. מחבת חמה ממיסה יותר, ושוקולד לא מטומפר נשאר רך בתפר ומלבין.
- id: q4
  question: >-
    למה Callebaut ממליצים לתת לתבנית לנקז בסוף על נייר ולא רק על רשת, לפני הגירוד האחרון?
  options:
    - >-
      כדי שהשוקולד שנוטף יתקרר מהר יותר על הנייר, וכך הקליפה בתוך השקעים תתקשה מוקדם יותר.
    - >-
      כדי לחסוך בשוקולד, כי מה שנוטף על הנייר נאסף בקלות ומוחזר ישר לקערה בלי לטמפר שוב.
    - >-
      כדי שהצד המבריק של הקליפה לא ייגע ברשת המתכת ויקבל ממנה פסים וסימנים של המוטות.
    - >-
      כדי שהשפה תצא עבה ורחבה יותר, ושפה רחבה נותנת שטח הדבקה ותפר חזק יותר בחיבור.
  correct: 3
  explanation: >-
    ניקוז על נייר משאיר יותר שוקולד על השפה, ו־Callebaut כותבים ששפה עבה יותר יוצרת תפר חזק יותר. התבנית
    הפוכה בכל מקרה, כך שהצד המבריק לא נוגע ברשת.
