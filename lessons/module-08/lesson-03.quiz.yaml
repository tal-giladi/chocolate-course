- id: q1
  question: >-
    שפכתם חלב חם על פצצת שוקו, ואחרי דקה הכדור עדיין שלם בכוס. יצקתם אותו בשלוש שכבות כדי שלא יישבר.
    מה הסיבה הסבירה, ומה משנים?
  options:
    - >-
      הקליפה עבה מדי ולא מספיקה להתרכך; בכדור של 6 ס"מ יוצקים שתי שכבות ומרוקנים היטב.
    - >-
      השוקולד היה מטומפר, ולכן הוא עמיד לחום; בפעם הבאה יוצקים פצצות משוקולד לא מטומפר.
    - >-
      החלב היה חם מדי והקריש את השוקולד מבחוץ; בפעם הבאה שופכים חלב פושר בלבד.
    - >-
      המרשמלו בפנים מבודד את הקליפה מהחום; בפעם הבאה מכניסים רק אבקת שוקו בלי מרשמלו.
  correct: 0
  explanation: >-
    הקליפה נפתחת כשהחלב מחמם אותה מעל נקודת ההתכה של חמאת הקקאו. קליפה עבה צריכה הרבה יותר חום ולא
    נפתחת. טמפרור לא מונע התכה בחלב חם, הוא רק נותן שחרור, ברק ויציבות בחדר.
- id: q2
  question: >-
    ילד בן 4 רוצה "לפוצץ" בעצמו את הפצצה. מה הדרך הבטוחה לעשות את זה?
  options:
    - >-
      הילד מחזיק את הספל בשתי ידיים כדי שיהיה יציב, ומבוגר שופך את החלב מעל בזהירות.
    - >-
      מבוגר שופך לאט מקנקן לספל של 300 מ"ל שעומד על שולחן, והילד צופה ממרחק בלי לגעת.
    - >-
      הילד שופך בעצמו חלב שחומם עד רתיחה וקורר שתי דקות, כי אחרי שתי דקות אין סכנת כוויה.
    - >-
      מכינים את השוקו בספל קטן של 200 מ"ל, כדי שהילד יקבל כמות קטנה ולא ישפוך הרבה.
  correct: 1
  explanation: >-
    רוב הכוויות אצל פעוטות נגרמות מנוזלים חמים. מבוגר שופך, הספל על שולחן, והילד לא בטווח יד. ספל
    שמלא עד הסוף עם כדור ומרשמלו גולש, ולכן ספל של 300 מ"ל לפחות ל־200 מ"ל חלב.
- id: q3
  question: >-
    חלב חם נשפך על היד של מישהו בזמן ההדגמה. מה עושים מיד?
  options:
    - >-
      מורחים חמאה או משחה שמנונית על הכוויה, כדי לאטום את העור ולמנוע שלפוחיות.
    - >-
      מניחים קרח ישירות על הכוויה כמה דקות, ואז עוטפים אותה היטב בתחבושת דביקה.
    - >-
      מחזיקים את הכוויה מתחת למים זורמים קרירים 20 דקות, ומורידים טבעות ושעון שליד הכוויה.
    - >-
      מחכים כמה דקות כדי לראות אם מופיעה שלפוחית, ורק אז מחליטים אם צריך לקרר את האזור.
  correct: 2
  explanation: >-
    לפי NHS: 20 דקות מים זורמים קרירים כמה שיותר מהר, להוריד בגדים ותכשיטים שליד הכוויה (לא מה שנדבק),
    בלי חמאה, שמנים או משחות, ואחר כך ניילון נצמד ברפיון. כוויה גדולה או בילד קטן: טיפול רפואי.
- id: q4
  question: >-
    מילאתם את חצי הכדור באבקת שוקו עד השפה, סגרתם על מחבת, ולמחרת מצאתם אבקה בקופסה וסדק בתפר. מה
    הסיבה?
  options:
    - >-
      אבקת שוקו סופגת לחות מהאוויר ומתנפחת בלילה, ולכן היא דחפה את החצאים זה מזה.
    - >-
      המחבת לא הייתה חמה מספיק, ולכן אף פעם לא כדאי לסגור פצצות בשיטת הצלחת החמה.
    - >-
      השוקולד של הקליפה איבד טמפר בלילה בקופסה, ותפר של שוקולד לא מטומפר נפתח מעצמו.
    - >-
      גרגרי אבקה על השפה מנעו מהחצאים להידבק; ממלאים עד שני שליש ומנקים את השפה לפני הסגירה.
  correct: 3
  explanation: >-
    התפר נדבק רק כששוקולד נוגע בשוקולד. אבקה על השפה יוצרת שכבה שמפרידה, והתפר נפתח בתנועה הראשונה.
    מילוי עד שני שליש וניקוי השפה במכחול יבש פותרים את זה.
