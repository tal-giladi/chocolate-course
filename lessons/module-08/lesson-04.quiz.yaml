- id: q1
  question: >-
    חבר הדפיס לכם במדפסת ביתית תבנית סביבון מ־PLA צבוע, ומציע ליצוק בה שוקולד ישר כל חנוכה. מה התשובה
    הנכונה?
  options:
    - >-
      אפשר, בתנאי שמדיחים אותה במדיח כלים בטמפרטורה גבוהה אחרי כל שימוש, כדי להרוג חיידקים.
    - >-
      אפשר, כי PLA הוא חומר צמחי, ולכן כל הדפסה ממנו בטוחה למזון בכל צבע ובכל מדפסת.
    - >-
      משתמשים בהדפסה כמאסטר, ויוצקים מעליה סיליקון או יריעת ואקום שהיצרן מציין שמתאימים למזון.
    - >-
      אפשר, אם מורחים אותה בשמן לפני כל יציקה, כי השמן סוגר את החריצים בין השכבות.
  correct: 2
  explanation: >-
    בין שכבות ההדפסה יש חריצים שאוגרים חיידקים וסופגים סבון (Prusa, Formlabs), וצבעים ודיזת פליז מוסיפים
    שאלות. PLA גם מתרכך ב־60-70°C, כך שמדיח מעוות אותו. ההדפסה משמשת כמאסטר בלבד.
- id: q2
  question: >-
    עיצבתם סביבון שלם, עם גוף רחב מהחוד ומהידית, ויצקתם מעליו סיליקון. המאסטר לא יוצא מהתבנית. מה הייתה
    הטעות בעיצוב?
  options:
    - >-
      ההדפסה הייתה בשכבה דקה מדי, ולכן פני המאסטר חלקים מדי ונצמדים לסיליקון בוואקום.
    - >-
      הצורה כוללת חתך חוזר; מעצבים חצי סביבון שטוח בגב, עם זווית שחרור, ומחברים שני חצאים.
    - >-
      הסיליקון לא התקשה מספיק זמן, ולכן הוא עדיין דביק ומחזיק את המאסטר בכוח.
    - >-
      המאסטר לא חומם לפני היציקה, ולכן הסיליקון התכווץ עליו מהר מדי והידק אותו.
  correct: 1
  explanation: >-
    חתך חוזר (undercut) הוא חלק רחב שנמצא "מתחת" לחלק צר, והוא נועל את המאסטר בתבנית. Formlabs ממליצים
    על עיצוב בלי חתכים חוזרים, ו־Mayku על זווית שחרור של 5-10°. חצי סביבון שטוח פותר את שתי הבעיות.
- id: q3
  question: >-
    בדמויות חנוכייה קטנות יצאו להבות חסרות, עם חורים קטנים בקצוות. השוקולד היה מטומפר. מה משנים?
  options:
    - >-
      מורחים שכבה דקה בקיסם לתוך הלהבות לפני המילוי, ומקישים על השיש עד שהבועות עולות.
    - >-
      מקררים את התבנית במקפיא לפני היציקה, כדי שהשוקולד ייקרש מיד בפינות ולא יברח מהן.
    - >-
      ממלאים רק עד חצי השקע ומרוקנים, כמו בקליפה, כדי שהשוקולד יזרום טוב יותר לפינות.
    - >-
      מוסיפים לשוקולד טיפה של חלב חם, כדי שיהיה נוזלי יותר ויגיע לכל הפרטים הקטנים.
  correct: 0
  explanation: >-
    בפינות צרות נלכד אוויר. שכבת פרטים ממלאת אותן לפני שהמסה הגדולה נכנסת, והקשה מעלה בועות. תבנית קרה
    מסמיכה את השוקולד בפינות, ונוזל על בסיס מים גורם לשוקולד להיתפס.
- id: q4
  question: >-
    בחנות כתוב על סיליקון ליציקת תבניות "food grade, compliant". מה עושים לפני שיוצקים בו שוקולד?
  options:
    - >-
      סומכים על התיאור, כי המילה compliant פירושה שהחומר עבר את כל הבדיקות למגע במזון.
    - >-
      מרתיחים את התבנית המוכנה 10 דקות, כי רתיחה הופכת כל סיליקון לבטוח למזון.
    - >-
      בודקים רק שהסיליקון שקוף, כי סיליקון צבעוני הוא היחיד שאינו מתאים למזון.
    - >-
      בודקים בדף הנתונים של היצרן שכתוב בו מגע במזון, ועובדים לפי היחס והזמן שבו.
  correct: 3
  explanation: >-
    Formlabs ממליצים לחפש בדף הנתונים אישור או תעודה למגע במזון, ולא להסתפק ב־"compliant". יחס ערבוב
    וזמן התקשות משתנים בין מוצרים, וסיליקון שלא התקשה כראוי לא נוגע במזון.
