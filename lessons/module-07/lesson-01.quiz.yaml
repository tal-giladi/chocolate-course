- id: q1
  question: >-
    בישלתם סוכר, מים וגלוקוזה. כשהסירופ רתח ערבבתם אותו "כדי שלא יישרף", ואחרי דקה כל הסיר הפך
    לחול לבן. מה קרה, ומה עושים עכשיו?
  options:
    - >-
      הסוכר נשרף בתחתית, ולכן צריך לזרוק את הסיר ולהתחיל מחדש עם סיר עבה יותר ואש נמוכה.
    - >-
      הגלוקוזה הגיבה עם הסוכר והתקשתה, ולכן צריך להוסיף שמנת קרה כדי לפרק את הגוש מיד.
    - >-
      הערבוב יצר גבישים בתמיסה הרוויה; מוסיפים מעט מים, ממיסים עד שקוף ומבשלים שוב בלי לערבב.
    - >-
      המים התאדו מהר מדי, ולכן צריך להמשיך לבשל על אש חזקה עד שהחול יימס מעצמו לקרמל.
  correct: 2
  explanation: >-
    סירופ סוכר הוא תמיסה רוויה־על, וערבוב או גביש מהדופן מתחילים התגבשות. ממיסים מחדש עם מעט מים,
    ומכאן רק מסובבים את הסיר. הגלוקוזה מקטינה את הסיכון אבל לא מבטלת אותו.
- id: q2
  question: >-
    חברה שואלת למה קרמל עם שמנת טועם כמו טופי וחמאה, וסוכר שקורמל עם מים בלבד טועם רק "קרמל מר".
    מה ההסבר הנכון?
  options:
    - >-
      בשמנת יש חלבונים ולקטוז, והם מגיבים עם הסוכר בתגובת מייאר בזמן הבישול השני.
    - >-
      השמנת מורידה את הטמפרטורה מתחת ל־100°C, ולכן הקרמליזציה נעצרת והקרמל נשאר מתוק.
    - >-
      השומן בשמנת עוטף את מולקולות הסוכר ומונע מהן להתפרק, ולכן אין בקרמל טעם מר בכלל.
    - >-
      בשמנת יש מלח טבעי שמשנה את הטעם, ולכן גם בלי חמאה הקרמל טועם כמו טופי מלוח.
  correct: 0
  explanation: >-
    קרמליזציה היא פירוק של סוכר לבד בחום גבוה. מייאר דורשת סוכר מחזר וחלבון או חומצת אמינו, ולכן
    היא מתחילה רק אחרי שהשמנת נכנסת, בזמן שמבשלים ל־104-106°C. זה טעם הטופי.
- id: q3
  question: >-
    המילוי שלכם נוזלי, ושני בונבונים דלפו מהבסיס יום אחרי הסגירה. ביומן כתוב: קרמל 178°C, מילוי
    סופי 101°C, זילוף ב־27°C. מה הכי סביר שגרם לבעיה?
  options:
    - >-
      הקרמל לפני השמנת היה בהיר מדי, ולכן לא נוצרה מספיק "קליפה" של סוכר שמחזיקה את המילוי.
    - >-
      הזילוף ב־27°C היה חם מדי, והמילוי החם המיס את המכסה מבפנים והוציא אותו מטמפר.
    - >-
      המלח משך לחות מהאוויר בזמן הלילה, והמים הנוספים הפכו את המילוי לנוזלי ודולף.
    - >-
      המילוי בושל רק ל־101°C, ונשארו בו יותר מדי מים, ולכן הוא דליל מדי בטמפרטורת החדר.
  correct: 3
  explanation: >-
    אחרי השמנת, הטמפרטורה הסופית היא "מד מרקם": כל מעלה מעל 100°C אומרת פחות מים. 104-106°C נותנים
    מילוי שזורם לאט. 27°C הוא בדיוק טווח הזילוף הנכון.
- id: q4
  question: >-
    אתם מוסיפים את השמנת לקרמל של 178°C. מה הדרך הבטוחה ביותר לעשות את זה?
  options:
    - >-
      לשפוך את כל השמנת הקרה בבת אחת, כדי לקרר את הקרמל מהר ולעצור את הבישול לפני שיישרף.
    - >-
      לחמם את השמנת ל־60-70°C, להוריד את הסיר מהאש ולשפוך רבע בכל פעם, רחוק מהגוף.
    - >-
      להשאיר את הסיר על אש חזקה ולשפוך את השמנת החמה לאט, כדי שהקיטור יתאדה מהר יותר.
    - >-
      לשפוך את הקרמל החם לתוך קערה עם השמנת, כי כך הקיטור נשאר בקערה ולא עולה לפנים.
  correct: 1
  explanation: >-
    המים שבשמנת הופכים לקיטור כשהם פוגשים סוכר של כמעט 180°C. שמנת חמה ובמנות מקטינה את הקיטור ואת
    הגוש שנוצר. מזיגת קרמל רותח לקערה מוסיפה עוד שלב מסוכן עם סוכר חם.
- id: q5
  question: >-
    לקוחה רוצה להזמין בונבוני קרמל מלוח שיחזיקו חודשיים, "כמו סוכריות טופי". מה התשובה הנכונה?
  options:
    - >-
      אפשר, אם שומרים אותם במקרר, כי בקור פעילות המים יורדת והקרמל נעשה יציב כמו טופי.
    - >-
      אפשר, אם מוסיפים עוד מלח, כי מלח הוא חומר משמר ומספיק לבדו כדי למנוע עובש.
    - >-
      מילוי רך מכיל יותר מים זמינים מטופי, ולכן בבית מבטיחים עד כשבועיים, ולמכירה צריך מדידה ומבחן.
    - >-
      אין הבדל בין המילויים, כי בשניהם יש אותה כמות סוכר, ולכן חיי המדף זהים לטופי.
  correct: 2
  explanation: >-
    טופי וקרמלים קשים נמצאים ב־aw של 0.45-0.60 (Fontana), מתחת לגבול של רוב העובשים. מילוי רך
    שבושל ל־105°C מכיל יותר מים. Callebaut: בלי מדידה ומבחן אי אפשר לדעת.
