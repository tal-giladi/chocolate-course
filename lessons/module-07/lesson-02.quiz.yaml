- id: q1
  question: >-
    טחנתם קרמל ואגוזי לוז במעבד המזון. אחרי 2 דקות יש אבקה יבשה, ואתם חושבים להוסיף מים או שמנת
    כדי שתהפוך למחית. מה נכון לעשות?
  options:
    - >-
      להוסיף כף שמנת חמה, כי בלי נוזל הסוכר לא יתמוסס והאבקה תישאר יבשה גם אחרי עשר דקות.
    - >-
      להמשיך לטחון בהפסקות, כי השמן שבאגוזים משתחרר מהתאים והופך את האבקה למחית בעצמו.
    - >-
      להעביר לבלנדר עם מעט מים, כי מעבד מזון לא מסוגל לטחון פרלינה ובלנדר מהיר יותר.
    - >-
      להוסיף חמאת קקאו מומסת לאבקה, כי היא הנוזל שמחבר אגוזים וסוכר למחית בפרלינה.
  correct: 1
  explanation: >-
    כשני שלישים מאגוז הלוז הם שומן (בפרלינה 60% של Valrhona יש 38% שומן). טחינה ארוכה, 8-12 דקות,
    משחררת אותו. מים או שמנת היו מוסיפים מים לפרלינה ומקצרים את חייה.
- id: q2
  question: >-
    מילאתם קליפות בפרלינה קנויה בלבד, בלי שוקולד ובלי חמאת קקאו. למחרת המילוי עדיין רך מאוד,
    והמכסה נדחף החוצה בסגירה. מה הסיבה העיקרית?
  options:
    - >-
      בפרלינה יש יותר מדי מים, והם לא התאדו בלילה, ולכן המילוי נשאר רך ודוחף את המכסה.
    - >-
      הפרלינה לא הייתה קרה מספיק, ולכן צריך לקרר את התבנית לילה במקרר לפני כל סגירה.
    - >-
      השמן מהאגוזים נוזלי בטמפרטורת החדר, ואין בתערובת חמאת קקאו שמתגבשת ומקשה אותה.
    - >-
      הקליפות היו דקות מדי ולא החזיקו את משקל הפרלינה, ולכן המילוי התפשט כלפי מעלה.
  correct: 2
  explanation: >-
    פרלינה לבד היא ממרח. Valrhona מוסיפים שוקולד וחמאת קקאו, ו־Callebaut 5%-6% חמאת קקאו, ומגבשים
    ל־25-26°C. כך המילוי מתקשה ומחזיק צורה.
- id: q3
  question: >-
    אחרי שבועיים, בונבוני הפרלינה שלכם אפורים ושמנוניים, אבל הטעם בסדר. בונבוני הגנאש מאותה תבנית
    עדיין מבריקים. מה ההסבר הכי סביר?
  options:
    - >-
      שמן האגוזים נדד לקליפה ודחף חמאת קקאו החוצה, כי מילוי שומני מאיץ פריחת שומן.
    - >-
      בפרלינה יש סוכר שמשך לחות מהאוויר, והסוכר שהתמוסס התגבש על פני הבונבונים כאבקה אפורה.
    - >-
      הקליפות של בונבוני הפרלינה לא היו מטומפרות, אחרת הן היו נשארות מבריקות בדיוק כמו הגנאש.
    - >-
      הפרלינה התחמצנה, ושכבה של שמן מחומצן עולה תמיד לפני השטח ונראית כמו כתם אפור.
  correct: 0
  explanation: >-
    Callebaut כותבים שמילויים שומניים כמו פרלינה גורמים לפריחת שומן להופיע מהר יותר. מאטים אותה
    בחמאת קקאו במילוי, במילוי מגובש ובאחסון קבוע ב־18-20°C.
- id: q4
  question: >-
    יצקתם ג'יאנדוז'ה למסגרת ב־38°C, כי מיהרתם. למחרת היא רכה, נמרחת בחיתוך ויש בה פסים אפורים.
    מה הצעד הנכון?
  options:
    - >-
      להכניס אותה למקפיא לשעה, כדי שתתקשה מספיק לחיתוך, ואז לחתוך מהר לפני שתתרכך שוב.
    - >-
      להוסיף עוד פרלינה ולערבב, כי ג'יאנדוז'ה רכה היא סימן שיש בה מעט מדי אגוזים.
    - >-
      לחתוך בסכין חמה מאוד, כי ג'יאנדוז'ה תמיד רכה ביום הראשון ומתקשה רק אחרי שבוע במדף.
    - >-
      להמיס אותה שוב ל־45°C, לגבש ל־25-26°C תוך ערבוב, ולצקת שוב למסגרת.
  correct: 3
  explanation: >-
    ג'יאנדוז'ה מתקשה כי חמאת הקקאו שבה מתגבשת. Valrhona: ממיסים ב־45-50°C ומקררים ל־25-26°C לפני
    היציקה. יציקה חמה נותנת מבנה לא יציב, רך ומפוספס.
- id: q5
  question: >-
    שכנה שואלת אם הפרלינה הביתית שלכם, שעומדת בצנצנת פתוחה על השיש חודשיים, "עלולה להתעפש". מה
    עונים?
  options:
    - >-
      כן, כי פרלינה היא מזון רטוב, ולכן היא מתעפשת אחרי שבועיים כמו גנאש עם שמנת.
    - >-
      עובש לא סביר כי כמעט אין בה מים, אבל אגוזים מתחמצנים ומקבלים טעם ישן; מריחים וטועמים.
    - >-
      לא, פרלינה לא משתנה בכלל, כי סוכר ושומן שומרים עליה לפחות שנה גם בצנצנת פתוחה.
    - >-
      כן, כי שמן האגוזים מתפרק במגע עם אוויר למים, והמים האלה מאפשרים לעובש לגדול.
  correct: 1
  explanation: >-
    בפרלינה כמעט אין מים, ולכן עובש הוא לא הבעיה. Fontana: חמצון שומנים מהיר דווקא בפעילות מים
    נמוכה מאוד. ה־12 חודשים של Valrhona הם לאריזה סגורה במפעל, לא לצנצנת פתוחה.
