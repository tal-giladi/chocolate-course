- id: q1
  question: >-
    בניתם חטיף מנוגט ומהקרמל הרך של 07.1, כמו שהוא מהצנצנת, בלי לבשל שוב. אחרי שלושה ימים הנוגט דביק
    והבוטנים רכים. מה ההסבר?
  options:
    - >-
      הנוגט לא בושל ל־140°C, ולכן הוא התפרק מעצמו, והקרמל לא קשור לשינוי במרקם.
    - >-
      הבוטנים שחררו שמן לתוך הנוגט, והשמן הוא מה שהפך את הנוגט לדביק ואת הבוטנים לרכים.
    - >-
      בקרמל הרך יש יותר מים זמינים מבנוגט, והמים נדדו מהקרמל לנוגט ולבוטנים.
    - >-
      הקרמל הרך התגבש בתוך החטיף, והגבישים משכו סוכר מהנוגט והשאירו אותו רטוב ודביק.
  correct: 2
  explanation: >-
    Fontana: מים נודדים מה־aw הגבוה לנמוך, ושכבות באותו aw לא מחליפות מים. לכן מבשלים את הקרמל שוב
    ל־118-120°C, כך שיהיה קרוב לנוגט, ומצפים הכול בשוקולד.
- id: q2
  question: >-
    במרציפן ערבבתם את הסירופ של 116°C במרץ עוד על האש, והמרציפן יצא גרגרי ושביר. מה היה צריך לעשות?
  options:
    - >-
      לבשל את הסירופ לטמפרטורה גבוהה יותר, 130°C, כדי שכל הסוכר יימס ולא יישארו גבישים בכלל.
    - >-
      להוסיף את קמח השקדים כבר בתחילת הבישול, כדי שהשקדים יספגו את הסוכר לפני שיתגבש.
    - >-
      לוותר על הקירור בקערת מים, כי קירור מהיר הוא מה שיוצר גבישים גדולים בסירופ.
    - >-
      לבשל בלי לערבב, לקרר את הסיר בקערת מים, ורק אז לערבב עד שהסירופ אטום ושמנתי.
  correct: 3
  explanation: >-
    במרציפן רוצים גבישים זעירים, ו־King Arthur מקררים את הסיר ורק אז מערבבים עד "אטום ושמנתי".
    ערבוב של סירופ חם מאוד יוצר גבישים גדולים, ואלה מרגישים גרגרי ושביר.
- id: q3
  question: >-
    לקוחה שואלת למה המרציפן המצופה שלכם מחזיק פחות זמן מהנוגט, "הרי בשניהם יש הרבה סוכר". מה עונים?
  options:
    - >-
      במרציפן יש יותר שקדים ופחות סוכר שקושר מים, ולכן פעילות המים בו גבוהה מגבול רוב העובשים.
    - >-
      במרציפן יש חלבון ביצה גולמי, ולכן הוא מתקלקל מהר, בלי קשר לסוכר או לפעילות המים.
    - >-
      הנוגט מכיל דבש, ודבש הוא חומר משמר חזק שמגן על כל ממתק שמוסיפים אותו לתוכו.
    - >-
      השקדים מתחמצנים מהר יותר מבוטנים, וזו הסיבה היחידה לחיי המדף הקצרים של מרציפן.
  correct: 0
  explanation: >-
    Fontana: מרציפן ב־0.75-0.80, נוגט ב־0.40-0.65, ורוב העובשים לא גדלים מתחת לכ־0.70. גם Valrhona
    נותנים לפסטת שקדים 70% פחות זמן מאשר ל־55%. החלבון במרציפן מבושל ל־72°C.
- id: q4
  question: >-
    אתם שופכים סירופ של 140°C לתוך חלבון במיקסר שעובד. מה הדרך הנכונה?
  options:
    - >-
      לשפוך את כל הסירופ בבת אחת ישירות על המטרפות, כדי שיתפזר מהר לפני שיתקשה.
    - >-
      בזרם דק לאורך דופן הקערה, במהירות בינונית, עם הפנים רחוק מהקערה.
    - >-
      לכבות את המיקסר, לשפוך את הסירופ, ורק אחר כך להפעיל אותו שוב במהירות מקסימלית.
    - >-
      לקרר את הסירופ ל־80°C לפני השפיכה, כדי שלא יתיז ולא יבשל את החלבון בכלל.
  correct: 1
  explanation: >-
    סירופ על המטרפות מותז לכל עבר ומתקשה לחוטים. זרם דק לאורך הדופן נכנס לקצף בהדרגה. הסירופ צריך
    להיות חם: הוא מבשל ומייצב את החלבון.
- id: q5
  question: >-
    שכנה רוצה לתת מהחטיפים לבן שלה בן 3 ולתינוקת בת 10 חודשים "רק טעימה". מה אומרים לה?
  options:
    - >-
      לבן 3 אפשר חטיף שלם, ולתינוקת אפשר אם מורידים את הבוטנים ומשאירים רק את הנוגט.
    - >-
      אפשר לשניהם, כי הדבש והבוטנים עברו בישול ב־140°C, ולכן הם בטוחים לכל גיל.
    - >-
      לשניהם אפשר כמות קטנה, כי הבעיה בבוטנים ובדבש היא רק אלרגיה, ואין להם אלרגיה ידועה.
    - >-
      לא: יש בהם בוטנים שלמים (סכנת חנק מתחת לגיל 5) ודבש (לא לתינוקות מתחת לשנה), וגם אלרגנים.
  correct: 3
  explanation: >-
    NHS: לא נותנים אגוזים ובוטנים שלמים לילדים מתחת לגיל 5, ולא דבש מתחת לגיל שנה. בנוסף יש בחטיף
    בוטנים, שקדים, ביצים, חלב וסויה, שכותבים על הקופסה.
