- id: q1
  question: >-
    רציתם להיות יעילים, ושפכתם את החומצה לסיר יחד עם המחית בהתחלה. הג'לי שיצא גרגרי, חלש ונקרע.
    מה קרה?
  options:
    - >-
      החומצה פירקה את הסוכר לגלוקוזה ופרוקטוזה, ובלי סוכרוז הפקטין לא יכול ליצור ג'לי בכלל.
    - >-
      החומצה הורידה את נקודת הרתיחה, ולכן התערובת לא הגיעה ל־106°C ונשארו בה יותר מדי מים.
    - >-
      החומצה השמידה את הפקטין בבישול הארוך, ולכן צריך פי שניים פקטין כשיש חומצה במתכון.
    - >-
      עם חומצה וסוכר הפקטין התחיל להתקשות בתוך הסיר, והערבוב קרע את הרשת שנוצרה.
  correct: 3
  explanation: >-
    פקטין HM מתקשה כשיש סוכר וחומציות נמוכה. לכן החומצה נכנסת רק בסוף, מחוץ לאש, כמו במתכון של
    Perfect Purée, ויוצקים מיד.
- id: q2
  question: >-
    חברה מציעה לחתוך את הסוכר בג'לי לחצי "כי זה מתוק מדי", ולהשאיר את אותו פקטין צהוב. מה יקרה?
  options:
    - >-
      הג'לי לא יתקשה, כי פקטין HM צריך לפחות 60% מוצקים מומסים, ובלי מספיק סוכר אין ג'לי.
    - >-
      הג'לי יתקשה מהר יותר, כי פחות סוכר אומר יותר מים שהפקטין יכול לקשור לעצמו.
    - >-
      הג'לי יתקשה כרגיל, אבל יהיה חמוץ יותר, ולכן צריך להוריד גם את החומצה בחצי.
    - >-
      הג'לי יתקשה רק במקרר, ושם הוא יחזיק אותו זמן כמו ג'לי עם כל הסוכר.
  correct: 0
  explanation: >-
    Sosa: פקטין HM צריך 60%-80% מוצקים. סוכר "לוקח" את המים מהסיבים. לפחות סוכר צריך פקטין LM עם
    סידן, ואז הג'לי מחזיק הרבה פחות זמן ונשמר במקרר.
- id: q3
  question: >-
    לקוח מבקש בונבונים עם מילוי של פטל טרי טחון ושוקולד לבן, למסיבה בעוד שבוע. מה עונים?
  options:
    - >-
      אפשר, אם מכינים אותם יום לפני ושומרים במקרר, כי הקור מוריד את פעילות המים של הפטל.
    - >-
      אפשר, אם מוסיפים יותר שוקולד לבן, כי השוקולד קושר את כל המים של הפרי ומונע עובש.
    - >-
      פרי טרי הוא כמעט רק מים, ומילוי כזה עלול לא להיות בטוח אחרי שעות; מציעים ג'לי פטל מבושל.
    - >-
      אפשר, אם סוגרים את הבונבונים היטב, כי קליפה אטומה מספיקה כדי שהמילוי יחזיק שבוע.
  correct: 2
  explanation: >-
    Callebaut: מחית פירות או שמנת עם שוקולד עלולה לא להיות בטוחה לאכילה אחרי יום או כמה שעות. ג'לי
    שבושל ל־106°C יושב ב־aw של ג'לי (0.50-0.75 לפי Fontana) ומחזיק שבועות.
- id: q4
  question: >-
    גלגלתם קוביות ג'לי בסוכר ביום ראשון. ביום רביעי הסוכר נמס והקוביות נראות רטובות ודביקות. מה
    ההסבר?
  options:
    - >-
      הג'לי לא בושל מספיק, ולכן הוא מתפרק לאט ומשחרר את כל המים שלו החוצה תוך כמה ימים.
    - >-
      מים נודדים מהג'לי ומהאוויר אל הסוכר היבש, והסוכר מתמוסס; מצפים ביום ההגשה.
    - >-
      הסוכר הלבן הגיב עם החומצה של הפרי והפך לסוכר אינוורטי נוזלי על פני הקוביות.
    - >-
      הקוביות עמדו בקופסה סגורה, ובקופסה סגורה תמיד נוצרת לחות שמזיקה לג'לי פירות.
  correct: 1
  explanation: >-
    Fontana: מים נודדים מהאזור שבו פעילות המים גבוהה לאזור שבו היא נמוכה. סוכר יבש מושך מים מהג'לי
    ומהאוויר. מצפים ביום ההגשה ושומרים בקופסה סגורה.
- id: q5
  question: >-
    המדחום הראה 102°C אחרי 8 דקות, ונמאס לכם לחכות, אז יצקתם. למחרת הג'לי עדיין כמו ריבה. מה עושים?
  options:
    - >-
      מחזירים לסיר עם כף מים, מביאים ל־106°C ומוסיפים שוב מעט חומצה בסוף, ויוצקים שוב.
    - >-
      מכניסים את התבנית למקפיא ללילה, כי ג'לי שלא התקשה בחדר מתקשה תמיד בקור ונשאר כך.
    - >-
      מוסיפים ג'לטין מומס לג'לי הקר ומערבבים, כי ג'לטין משלים את מה שחסר לפקטין.
    - >-
      משאירים עוד יומיים בחדר, כי פקטין מתקשה לאט, והמרקם הסופי מגיע רק אחרי שבוע.
  correct: 0
  explanation: >-
    ב־102°C יש עדיין יותר מדי מים, והסוכר לא הגיע ל־60% ומעלה. מבשלים שוב עד 106°C. ג'לטין משנה את
    המוצר, את הכשרות ואת המרקם, ומקפיא לא מתקן ריכוז סוכר.
