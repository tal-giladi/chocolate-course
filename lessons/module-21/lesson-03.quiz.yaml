- id: q1
  question: >-
    אחרי חנוכה רוצים יותר ביקורות בגוגל. איזו דרך עומדת במדיניות של Google Maps שתוארה בשיעור?
  options:
    - >-
      להציע 10% הנחה על ההזמנה הבאה לכל מי שמשאיר ביקורת, טובה או רעה.
    - >-
      לשלוח בקשה רק ללקוחות שכתבו תודה, כדי לא להזמין ביקורות שליליות.
    - >-
      לשלוח לכל הלקוחות אותה הודעה עם קישור, בלי הנחה, מתנה או הגרלה.
    - >-
      לבקש מבני משפחה ומחברים שטעמו את הסביבונים לכתוב ביקורת מפורטת.
  correct: 2
  explanation: >-
    לפי המדיניות, ביקורות בתמורה (הנחה, מוצר חינם) אסורות, אסור לבקש ביקורות באופן סלקטיבי רק
    ממרוצים, ואסור תוכן מתוך ניגוד עניינים. מותר לבקש מכולם בלי תמריץ.
- id: q2
  question: >-
    לקוחה קנתה ממכם מארז בפורים ומסרה טלפון לצורך המשלוח בלבד, בלי שאמרתם לה שישמש לפרסומת. מותר
    לשלוח לה בוואטסאפ הצעה למארזי פסח?
  options:
    - >-
      לא, כי בלי הסכמה מפורשת, וכשלא נאמר לה בקנייה שהפרטים ישמשו לפרסומת, החריג לא חל.
    - >-
      כן, כי היא כבר לקוחה קיימת, ומארז פסח הוא מוצר דומה למה שקנתה בפורים.
    - >-
      כן, כי החוק חל רק על SMS ומייל, ולא על הודעות וואטסאפ שנשלחות מהטלפון.
    - >-
      כן, אם ההודעה נפתחת במילה "פרסומת", כי זה מה שהופך אותה להודעה חוקית.
  correct: 0
  explanation: >-
    החריג ללקוח קיים בסעיף 30א(ג) דורש שלושה תנאים יחד, ואחד מהם הוא שנאמר לה בקנייה שהפרטים ישמשו
    לפרסומת וניתנה לה הזדמנות לסרב. בלי זה צריך הסכמה מפורשת. המילה "פרסומת" חובה, אבל לא מחליפה
    הסכמה.
- id: q3
  question: >-
    מה חייב להופיע בהודעת מייל שיווקית לרשימת הלקוחות, לפי סעיף 30א(ה)?
  options:
    - >-
      רק שם העסק בתחתית, כי המילה "פרסומת" נדרשת רק בהודעות טלפוניות מוקלטות.
    - >-
      המחיר לפני מע"מ ומספר העוסק, כי אלה פרטי החובה בכל הודעה מסחרית שנשלחת.
    - >-
      תמונה של המוצר והתווית המלאה, כי בלעדיהן אסור לפרסם מוצר מזון במייל.
    - >-
      "פרסומת" בשורת הנושא, שם העסק ופרטי קשר, והודעה על זכות סירוב עם קישור תקף להסרה.
  correct: 3
  explanation: >-
    לפי 30א(ה): סימון "פרסומת" בתחילת ההודעה או בשורת הנושא במייל, שם העסק, כתובת ודרכי קשר, והודעה
    שאפשר לסרב בכל עת בדרך פשוטה, ובמייל כתובת אינטרנט תקפה לסירוב.
- id: q4
  question: >-
    מנויה למארז חודשי שולחת ב־3 בחודש מייל: "אני מבטלת". לפי סעיף 13ד(ג), מה נכון?
  options:
    - >-
      היא חייבת להמשיך עד סוף השנה, כי המנוי נמכר כחבילה של עשרה חודשים.
    - >-
      החוזה מסתיים בתוך שלושה ימי עסקים, ואחרי זה לא מחייבים אותה.
    - >-
      הביטול תקף רק אם נשלח בדואר רשום, כי מייל לא נחשב הודעה בכתב.
    - >-
      מותר לגבות ממנה דמי ביטול של חודש מלא, כי שוקולד הוא טובין פסידים.
  correct: 1
  explanation: >-
    לפי 13ד(ג), חוזה בעסקה מתמשכת מסתיים בתוך שלושה ימי עסקים מיום הודעת הביטול (שישה בדואר רשום).
    לפי 14ט, מייל הוא אחת הדרכים שהעסק חייב לאפשר.
- id: q5
  question: >-
    ביקורת בגוגל: "הילד אכל סביבון וקיבל פריחה בפה". מה הצעד הראשון?
  options:
    - >-
      למחוק את הביקורת או לבקש מגוגל להסיר אותה, כי היא פוגעת בדירוג.
    - >-
      לענות בפומבי שכל האלרגנים כתובים בתווית, ולכן האחריות על ההורים.
    - >-
      לרשום כתלונה על נזק אפשרי לבריאות, לענות בקצרה ולהמשיך בפרטי, לפי 16.4.
    - >-
      להציע לה מארז חינם בתמורה לשינוי הביקורת, כדי לסגור את העניין בשקט.
  correct: 2
  explanation: >-
    תלונה על נזק לבריאות נרשמת ביומן התלונות ונשמרת לפחות שלוש שנים, ופועלים לפי תהליך 16.4. בפומבי
    עונים קצר ובלי האשמה; מתנה בתמורה לשינוי ביקורת היא תמריץ אסור.
