- id: q1
  question: >-
    מנהלת משרד מבקשת הצעה ל־60 מארזים. אתם עוסקת פטורה. מתי אומרים לה איזה מסמך חיוב תקבל?
  options:
    - >-
      במסירה, יחד עם המארזים, כי רק אז ברור מה הסכום הסופי שצריך לחייב.
    - >-
      לא צריך להגיד, כי כל עסק בישראל מוציא חשבונית מס על כל עסקה עם חברה.
    - >-
      בשיחה הראשונה, לפני ההצעה, כי היא לא תוכל לקזז מע"מ על חשבון עסקה וקבלה.
    - >-
      רק אם היא שואלת, כי זה עניין של הנהלת החשבונות שלה ולא של העסק שלכם.
  correct: 2
  explanation: >-
    לפי כל זכות, עוסק פטור אינו רשאי להוציא חשבונית מס; הוא מוציא חשבון עסקה וקבלה. חברה שרוצה לקזז
    מע"מ צריכה לדעת את זה לפני שהיא מאשרת, ולכן זו שאלה בשיחה הראשונה.
- id: q2
  question: >-
    הזמנה של 60 מארזים ב־52 ₪ (3,120 ₪). חומרים, אריזה ופחת: 912.60 ₪. איזו מקדמה מגינה עליכם
    אם החברה מבטלת אחרי שקניתם חומרים?
  options:
    - >-
      936 ₪ (30%), כי היא גדולה ממה שתוציאו על חומרים ואריזה לפני התשלום.
    - >-
      312 ₪ (10%), כי מקדמה גבוהה יותר תרחיק חברות שרגילות לשלם בשוטף.
    - >-
      בלי מקדמה, כי עם חברה רשומה אפשר תמיד לגבות את הנזק אחרי הביטול.
    - >-
      624 ₪ (20%), כי מקדמה צריכה לכסות רק את הקוברטורה ולא את האריזה.
  correct: 0
  explanation: >-
    הכלל: המקדמה גדולה מעלות החומרים והאריזה שקונים לפני התשלום. 30% הם 936 ₪, מעל 912.60 ₪. 10% או
    20% משאירים אתכם עם הוצאה שלא כוסתה.
- id: q3
  question: >-
    חברה רוצה מדבקה עם הלוגו שלה על כל מארז, ושואלת אם אפשר להוריד את התווית הלבנה עם הרכיבים כי
    היא "לא יפה". מה עונים?
  options:
    - >-
      אפשר, כי במתנה לעובדים המארז לא נמכר בחנות, ולכן חובת התווית לא חלה עליו.
    - >-
      אפשר, אם שולחים לחברה במייל קובץ עם הרכיבים והאלרגנים של כל המארזים.
    - >-
      אפשר להוריד רק את הטבלה התזונתית, ולהשאיר את האלרגנים בתוך המדבקה עם הלוגו.
    - >-
      המדבקה מצטרפת לתווית ולא מחליפה אותה; העובד שאוכל צריך את הרכיבים והאלרגנים.
  correct: 3
  explanation: >-
    התווית המלאה (18.1) נשארת על כל מארז: רכיבים, אלרגנים, תאריך, אחסון ויצרן. מי שאוכל הוא עובד
    שלא פגשתם ולא קרא את המייל (16.2). המיתוג הוא תוספת.
- id: q4
  question: >-
    אתם עוסק מורשה. חברה מזמינה 100 מארזים ב־52 ₪ לפני מע"מ. מה צריך לבדוק לפני שמוציאים חשבונית
    מס, לפי המידע מ־2026?
  options:
    - >-
      כלום, כי מספר הקצאה נדרש רק על עסקאות של יותר מ־25,000 ₪ כולל מע"מ.
    - >-
      שהעסקה, 5,200 ₪ לפני מע"מ, עוברת את 5,000 ₪, ולכן צריך מספר הקצאה.
    - >-
      לפצל לשתי חשבוניות של 50 מארזים, כדי שכל אחת תהיה מתחת לסף ההקצאה.
    - >-
      רק שהמחיר כולל מע"מ, כי חברה היא צרכן כמו כל לקוח פרטי באתר.
  correct: 1
  explanation: >-
    לפי ynetnews, מ־1.6.2026 חשבונית מס על יותר מ־5,000 ₪ לפני מע"מ צריכה מספר הקצאה, ובלעדיו הלקוח
    עלול לא לקזז מע"מ. פיצול מלאכותי כדי לעקוף את הסף נחשב פסול.
- id: q5
  question: >-
    שבוע לפני חנוכה, חברה מבקשת להגדיל הזמנה מ־60 ל־120 מארזים. לפי תכנון הייצור שלכם נכנסים
    כ־11 מארזים ביום. מה הצעד הראשון?
  options:
    - >-
      לאשר מיד, כי הזמנה גדולה מחברה שווה כל מאמץ ואפשר לעבוד גם בלילות.
    - >-
      לאשר ולהוריד את מחיר המארז, כי בכמות כפולה מגיעה לחברה הנחה אוטומטית.
    - >-
      לבדוק בתכנון הייצור כמה שעות זה ומה נדחק, ורק אז להציע כמות או מועד.
    - >-
      לסרב, כי אסור לשנות הזמנה של חברה אחרי שהתקבלה עליה מקדמה.
  correct: 2
  explanation: >-
    60 מארזים נוספים של 20 דקות הם 20 שעות, כמעט שבוע עבודה בשבוע הכי עמוס. כל הזמנה עוברת דרך תכנון
    הייצור (19.3), ואם אין מקום מציעים את מה שנכנס או מועד אחר.
