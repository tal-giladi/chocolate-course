- id: q1
  question: >-
    מועד סגירת ההזמנות שלכם לחנוכה הוא שני 30.11, לפי הקיבולת. מתי כדאי לפרסם את הפוסט הראשון שמוכר
    את מארז החג?
  options:
    - >-
      ביום הסגירה עצמו, כדי שכל ההזמנות יגיעו בבת אחת ואפשר יהיה לתכנן ייצור.
    - >-
      כמה שבועות לפני מועד הסגירה, בלוח שנבנה אחורה ממנו, עם המועד האחרון בפוסט.
    - >-
      בשבוע של החג, כשאנשים כבר מחפשים מתנות ולכן הפוסט יקבל הכי הרבה צפיות.
    - >-
      רק אחרי שיש מספיק עוקבים, כי פוסט מכירה בחשבון קטן לא מביא הזמנות בכלל.
  correct: 1
  explanation: >-
    לוח התוכן נבנה אחורה מהיום האחרון להזמנה. פוסט מכירה אחרי מועד הסגירה מביא רק שאלות שעונים
    עליהן "לא". המועד האחרון נכתב בכל פוסט כבר מהשבוע הראשון.
- id: q2
  question: >-
    ברילס של סביבוני מריר רוצים לכתוב בכיתוב על הווידאו "70% קקאו, טוב ללב". מה הבעיה?
  options:
    - >-
      אין בעיה, כי כיתוב על וידאו הוא לא סימון על אריזה ולכן החוק לא חל עליו.
    - >-
      הבעיה היא רק באחוז הקקאו, שאסור לכתוב בלי בדיקת מעבדה מוסמכת של המוצר.
    - >-
      אין בעיה כל עוד מוסיפים כוכבית ומקור למחקר על קקאו ובריאות הלב בתיאור.
    - >-
      "טוב ללב" מייחס למזון השפעה על הגוף, וסעיף 13 אוסר זאת גם בפרסום.
  correct: 3
  explanation: >-
    סעיף 13 לחוק המזון אוסר לייחס למזון סגולה של חיזוק או ריפוי "בדרך של סימון, או פרסום". רילס הוא
    פרסום. "70% קקאו" הוא עובדה שאפשר לכתוב; "טוב ללב" לא.
- id: q3
  question: >-
    משפיענית מקבלת מכם מארז ומעלה פוסט עם תיוג של העסק בסוף הטקסט, בלי שום מילה נוספת. לפי עמדת
    היועמ"ש שתוארה בשיעור, מה חסר?
  options:
    - >-
      הבהרה בפתח הפוסט שמדובר בפרסומת או בפרסום ממומן, שרואים בלי לחיצה נוספת.
    - >-
      שום דבר, כי התיוג של העסק כבר מראה לכל קורא סביר מי עומד מאחורי הפוסט.
    - >-
      רק האשטאג #פרסומת בסוף הטקסט, ליד התיוג של העסק שכבר מופיע שם בפוסט.
    - >-
      שום דבר, כי היא קיבלה מארז במתנה ולא כסף, ולכן זה לא נחשב פרסומת בכלל.
  correct: 0
  explanation: >-
    לפי סעיף 7(ג)(1) לחוק הגנת הצרכן, פרסומת שאדם סביר עלול לחשוב שאינה פרסומת היא פרסומת מטעה. לפי
    עמדת היועמ"ש (וואלה, 2021), צריך הבהרה בפתח הפוסט, והאשטאג או שם המממן לבד לא מספיקים.
- id: q4
  question: >-
    לעסק אין תעודת כשרות. מה מותר לכתוב בפוסט כשלקוחות שואלים על כשרות?
  options:
    - >-
      "#כשר", כי האשטאג הוא רק כלי חיפוש ולא הצהרה על המוצר עצמו.
    - >-
      "כשר, כל הרכיבים בהכשר בד"ץ", כי זה מה שכתוב על האריזות של הספק.
    - >-
      "אין לנו תעודת כשרות", ולצידו הרכיבים והאלרגנים של המארז.
    - >-
      "פרווה", כי במארז יש רק שוקולד מריר ואין בו רכיב חלב מוסף.
  correct: 2
  explanation: >-
    בלי תעודה אסור לסמן או לפרסם מוצר ככשר, וזה כולל האשטאג וסמל. "פרווה" נכתב רק לפי תעודה (17.4).
    אמירה כנה שאין תעודה, עם רכיבים ואלרגנים, מותרת.
- id: q5
  question: >-
    המחיר בגיליון עלה מ־58 ל־62 ₪, אבל פוסט ישן עדיין מראה 58 ₪, ולקוח מזמין לפיו. מה עושים?
  options:
    - >-
      גובים 62 ₪, כי המחיר בגיליון הוא המחיר האמיתי והפוסט היה רק טעות טכנית.
    - >-
      מכבדים את 58 ₪ להזמנה הזאת, ומתקנים את הפוסט כדי שלא יקרה שוב.
    - >-
      מבטלים את ההזמנה, כי מותר לבטל כל הזמנה שמחירה השתנה לפני המסירה.
    - >-
      גובים 58 ₪ ועוד דמי טיפול של 4 ₪ בשורה נפרדת, כדי להשלים את ההפרש.
  correct: 1
  explanation: >-
    לפי סעיף 17ב(ד) לחוק הגנת הצרכן (מקורות, סעיף 6), המחיר שמוצג מחייב את העסק. מחיר בפוסט לוקחים רק
    מהגיליון של העונה, ומעדכנים פוסטים כשהמחיר משתנה.
