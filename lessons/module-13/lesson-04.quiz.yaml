- id: q1
  question: >-
    שקלתם חטיף של 25 גרם עם 10 גרם אגוזים, וחטיף של 25 גרם ממריר בלבד. לפי החישוב בשיעור, מה ההבדל
    העיקרי ביניהם?
  options:
    - >-
      בחטיף עם האגוזים כשליש פחות סוכר ושומן רווי, אבל כמעט אותן קלוריות.
    - >-
      בחטיף עם האגוזים חצי מהקלוריות, כי באגוזים יש הרבה פחות אנרגיה מבשוקולד.
    - >-
      בחטיף עם האגוזים יותר סוכר, כי האגוזים מוסיפים סוכר טבעי משלהם לשוקולד.
    - >-
      אין הבדל בכלל, כי אגוזים ושוקולד מריר מכילים כמעט אותו הרכב של סוכר ושומן.
  correct: 0
  explanation: >-
    בשקדים 4.4 גרם סוכר ו־3.8 גרם שומן רווי ל־100 גרם, במריר 70-85% כ־24 גרם מכל אחד, אבל האנרגיה
    דומה (579 מול 598 קק"ל). לכן התוספות מורידות סוכר ושומן רווי, לא קלוריות.
- id: q2
  question: >-
    קליתם שקדים, ואחרי 5 דקות על השיש ערבבתם אותם לשוקולד מטומפר ב־31°C. החטיפים יצאו מטים ורכים.
    מה קרה?
  options:
    - >-
      השמן של השקדים הקלויים מנע מהשוקולד להתגבש, ולכן אסור לשלב אגוזים קלויים עם שוקולד.
    - >-
      השקדים היו עדיין חמים, חיממו את השוקולד מעל הטווח והמיסו את גבישי V שבו.
    - >-
      השקדים ספגו את חמאת הקקאו מהשוקולד, ולכן לא נשאר בו מספיק שומן כדי להבריק.
    - >-
      הקלייה הוציאה מהשקדים מים שעברו לשוקולד וגרמו לו להיתפס חלקית בתבנית.
  correct: 1
  explanation: >-
    אגוז חם ממיס את השוקולד המטומפר סביבו. מקררים אגוזים לגמרי, לפחות 20 דקות, ובודקים טמפר אחרי
    הערבוב. השוקולד שנפגע נאכל או נמס מחדש.
- id: q3
  question: >-
    לקוחה שואלת למה כדאי לקנות לחטיף שלה אגוזים קלויים מיצרן מוכר ולא "שקדים גולמיים טבעיים" מהשוק.
    מה התשובה?
  options:
    - >-
      כי שקדים גולמיים מרים מדי לשוקולד, ואין לזה קשר לבטיחות המזון של המוצר.
    - >-
      כי לפי החוק בישראל אסור למכור שקדים גולמיים לשימוש בממתקים בלי אישור מיוחד.
    - >-
      כי במזון יבש סלמונלה יכולה לשרוד, ובקליפורניה מחייבים מאז 2007 טיפול שמפחית אותה פי 10,000.
    - >-
      כי באגוזים גולמיים יש יותר מים, והם גורמים לשוקולד להיתפס כשמערבבים אותם פנימה.
  correct: 2
  explanation: >-
    אחרי התפרצויות סלמונלה משקדים גולמיים, קליפורניה חייבה מ־2007 טיפול של 4 log לפחות לשקדים
    שנמכרים לצרכנים בצפון אמריקה. חטיף שלא נאפה צריך אגוזים קלויים או מטופלים ממקור מזוהה.
- id: q4
  question: >-
    אחרי שבועיים במטבח חם החטיפים עם האגוזים קיבלו כתמים לבנים, אף שהטמפר היה מושלם. מה עושים בפעם
    הבאה?
  options:
    - >-
      שומרים במקרר ב־4°C, כי קור קבוע מונע לגמרי כל סוג של פריחה בשוקולד עם אגוזים.
    - >-
      מוותרים על טמפרור בחטיפים עם אגוזים, כי ממילא הם מלבינים אחרי כמה ימים בכל מקרה.
    - >-
      מוסיפים יותר אגוזים, כי השמן שלהם מגן על פני השוקולד מפני שינויי טמפרטורה.
    - >-
      שומרים בקופסה אטומה ב־18-20°C קבוע, ומתכננים שהחטיפים ייאכלו תוך 2-4 שבועות.
  correct: 3
  explanation: >-
    Callebaut כותבים שמילויים על בסיס שומן, כמו תערובות אגוזים, מקדימים פריחת שומן, וממליצים על
    18-20°C קבוע. מקרר יוצר עיבוי ופריחת סוכר, ובלי טמפרור החטיף מלבין מיד.
