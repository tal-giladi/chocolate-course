- id: q1
  question: >-
    הכנתם מגש דיסקיות ממריר ללא תוספת סוכר עם מלטיטול לאירוע משפחתי, ושני ילדים מבקשים לקחת "כמה
    שבא להם". מה עושים?
  options:
    - >-
      נותנים להם בחופשיות, כי ללא תוספת סוכר פירושו שאין בדיסקיות שום דבר שיכול להזיק לילדים.
    - >-
      נותנים לכל אחד דיסקית אחת ואומרים להורים שיש בהן מלטיטול, שבכמות גורם לגזים ולשלשול.
    - >-
      נותנים להם רק אחרי ארוחה, כי במחקרים התסמינים של מלטיטול הופיעו רק כשאכלו על בטן ריקה.
    - >-
      מחליפים להם בשוקולד חלב רגיל, כי מלטיטול אסור לגמרי לילדים לפי התקנות בישראל.
  correct: 1
  explanation: >-
    מלטיטול גורם לגזים ולשלשול בכמות, ולא מתאים לילדים בכמויות. אצל Storey ושות' צום לא שינה את
    התסמינים, וגם לא מצאנו איסור בתקנות; לכן מגבילים מנה ואומרים מה יש בשוקולד.
- id: q2
  question: >-
    בטעימה עיוורת אחת הדגימות מרגישה "קרירה" בפה, כמו מנטה, אף שאין בה מנטה. איזה ממתיק כנראה יש
    בה?
  options:
    - >-
      מלטיטול, כי הוא קרוב לסוכר ונמס על הלשון לאט יותר מכל ממתיק אחר.
    - >-
      אלולוזה, כי היא קושרת לחות מהפה ולכן משאירה תחושה יבשה וקרה.
    - >-
      סטיביה, כי המתיקות החזקה שלה מורגשת על הלשון כמו קור מיד בהתחלה.
    - >-
      אריתריטול, כי כשהגבישים שלו מתמוססים בפה הם סופגים חום.
  correct: 3
  explanation: >-
    לאריתריטול יש חום המסה שלילי: כשהוא מתמוסס הוא סופג חום, וזה מורגש כקור, בעיקר במוצרים שבהם
    הוא לא מומס מראש, כמו טבלת שוקולד. מסחרית מאזנים אותו עם אינולין או פולידקסטרוז.
- id: q3
  question: >-
    קניתם שק של מריר 54% עם מלטיטול לבונבונים, ואין עליו עקומת טמפרור. איך מטמפרים אותו?
  options:
    - >-
      כמו מריר רגיל: המסה ל־45-50°C ועבודה ב־31-32°C, כי היצרן כותב שהוא מתנהג באותה דרך.
    - >-
      בטמפרטורת עבודה של 27-28°C, כי מלטיטול נמס בחום נמוך מסוכר ולכן צריך לעבוד קר יותר.
    - >-
      לא מטמפרים אותו בכלל, כי בשוקולד בלי סוכר חמאת הקקאו לא יוצרת גבישים מצורה V.
    - >-
      בטמפרטורת עבודה של 35-36°C, כי בלי גבישי הסוכר צריך יותר חום כדי שהשוקולד יזרום.
  correct: 0
  explanation: >-
    הטמפרור תלוי בחמאת הקקאו, והממתיק הוא רק אבקה שמפוזרת בה. Callebaut כותבים על MALCHOC שההמסה
    והטמפרור עובדים בדיוק כמו בשוקולד רגיל, ולכן משתמשים בטווח של מריר כשאין עקומה.
- id: q4
  question: >-
    אתם רוצים להכין ג'לי פירות למילוי בונבון, עם הרבה פחות סוכר מהמתכון של 07.3. מה צריך לשנות
    כדי שהג'לי עדיין יתקשה?
  options:
    - >-
      להחליף את הסוכר באריתריטול באותה כמות, כי פקטין רגיל מגיב לכל אבקה מתוקה באותה צורה.
    - >-
      להגדיל את כמות הפקטין הרגיל פי שלושה, כי יותר פקטין מחליף את התפקיד של הסוכר בג'ל.
    - >-
      לעבור לפקטין LM עם סידן, כי פקטין רגיל (HM) מתקשה רק עם כ־60% סוכר ומעלה.
    - >-
      לבשל את התערובת לטמפרטורה גבוהה יותר, כי בחום גבוה הג'לי מתקשה גם כשאין בו סוכר.
  correct: 2
  explanation: >-
    פקטין HM צריך ריכוז סוכר גבוה וחומציות כדי ליצור ג'ל. פקטין LM יוצר ג'ל עם סידן גם עם מעט
    סוכר. ממתיק במקום סוכר לא מחליף את התפקיד המבני, ולכן בודקים בניסוי קטן.
- id: q5
  question: >-
    לקוחה שואלת אם שוקולד עם אריתריטול "בלי שום הגבלה", כי "אין בו קלוריות". מה נכון לענות?
  options:
    - >-
      שאין שום הגבלה, כי אריתריטול נספג ויוצא בשתן ולכן לא מגיע בכלל למעי הגס.
    - >-
      שההגבלה היא רק לסוכרתיים, כי אריתריטול מעלה סוכר בדם כמו סוכר רגיל.
    - >-
      שההגבלה היא רק בהריון, כי ב־EFSA בדקו אותו רק על נשים בהריון ומצאו בעיה.
    - >-
      שגם הוא משלשל בכמות, ו־EFSA קבעה לו צריכה יומית מותרת של 0.5 גרם לק"ג משקל גוף.
  correct: 3
  explanation: >-
    ב־2023 קבעה EFSA לאריתריטול ADI של 0.5 גרם לק"ג ליום על בסיס השלשול, ודחתה פטור מאזהרת
    האפקט המשלשל. למבוגר של 60 ק"ג זה כ־30 גרם ביום, ולילד הרבה פחות.
