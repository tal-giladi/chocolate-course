- id: q1
  question: >-
    לקוחה מבקשת "שוקולד עם פחות קלוריות" ומציעים לה להחליף טבלת חלב בטבלת מריר 80% באותו משקל.
    לפי הממוצעים של USDA, מה באמת משתנה?
  options:
    - >-
      הסוכר יורד בערך בחצי, אבל השומן והקלוריות עולים מעט, כי חמאת קקאו נכנסת במקום הסוכר.
    - >-
      הסוכר והקלוריות יורדים שניהם בערך בחצי, כי רוב הקלוריות בשוקולד מגיעות מהסוכר שבו.
    - >-
      הסוכר נשאר כמעט זהה, כי ההבדל בין חלב למריר הוא רק אבקת החלב ולא כמות הסוכר.
    - >-
      הקלוריות יורדות בערך ברבע, והסוכר נשאר דומה, כי במריר יש פחות שומן חלב מבשוקולד חלב.
  correct: 0
  explanation: >-
    לפי USDA, בחלב כ־51.5 גרם סוכר ו־535 קק"ל ל־100 גרם, ובמריר 70-85% כ־24 גרם סוכר ו־598 קק"ל.
    אחוז הקקאו מחליף סוכר בשומן, ולכן הקלוריות לא יורדות. מה שמוריד קלוריות הוא מנה קטנה יותר.
- id: q2
  question: >-
    על טבלת מריר כתוב 37 גרם סוכרים ל־100 גרם. יצקתם ממנו דיסקיות של 12 גרם. כמה סוכר יש בדיסקית
    אחת?
  options:
    - >-
      כ־3.1 גרם, כי מחלקים 37 במספר הדיסקיות שיוצאות מ־100 גרם.
    - >-
      כ־12 גרם, כי בשוקולד מריר כל משקל החתיכה כמעט נחשב כסוכר.
    - >-
      כ־4.4 גרם, כי מכפילים 37 ב־12 ומחלקים ב־100.
    - >-
      כ־37 גרם, כי הערך שבתווית מתייחס תמיד למנה אחת ולא ל־100 גרם.
  correct: 2
  explanation: >-
    הנוסחה היא ערך ל־100 גרם × משקל החתיכה ÷ 100: ‏37 × 12 ÷ 100 = 4.4 גרם. הטבלה התזונתית בישראל
    מוצגת ל־100 גרם, ולכן תמיד מחשבים לפי משקל החתיכה האמיתי.
- id: q3
  question: >-
    חבר שואל למה שוקולד מריר 85% שקנה מקבל סמל אדום, הרי "יש בו מעט סוכר". מה עונים לו?
  options:
    - >-
      שהסמל ניתן לכל שוקולד באופן אוטומטי, בלי קשר לטבלה התזונתית שעל האריזה.
    - >-
      שגם 85% עובר את סף השומן הרווי (4 גרם), ובדרך כלל גם את סף הסוכר (10 גרם) ל־100 גרם.
    - >-
      שהסמל ניתן רק בגלל הקלוריות, ובמריר 85% יש יותר קלוריות מבשוקולד חלב.
    - >-
      שהסמל ניתן בגלל הנתרן, כי מוסיפים מלח לשוקולד מריר כדי לאזן את המרירות שבו.
  correct: 1
  explanation: >-
    לפי תקנות הסימון התזונתי, מזון מוצק מקבל סמל מעל 10 גרם סוכרים, 4 גרם שומן רווי או 400 מ"ג
    נתרן ל־100 גרם. במריר 70-85% יש כ־24 גרם סוכר וכ־24.5 גרם שומן רווי, ולכן שני סמלים.
- id: q4
  question: >-
    אתם רוצים להוריד בבת אחת סוכר, שומן רווי וקלוריות בחתיכת שוקולד שאתם מגישים. איזה שינוי עושה
    את שלושתם?
  options:
    - >-
      לעבור ממריר 60% למריר 85% באותו גודל חתיכה, כי מריר חזק יותר מוריד את כל הערכים יחד.
    - >-
      להחליף את הסוכר במלטיטול באותו מתכון, כי ממתיק במקום סוכר מוריד גם את השומן בשוקולד.
    - >-
      להוסיף לשוקולד אגוזים קלויים, כי הם תופסים מקום ולכן כל חתיכה מכילה פחות שוקולד.
    - >-
      לחלק את אותו שוקולד לחתיכות של 10 גרם במקום 20, כי כל הערכים יורדים בחצי לחתיכה.
  correct: 3
  explanation: >-
    מנה קטנה מורידה את כל הערכים באותו יחס. אחוז קקאו גבוה מוריד סוכר אבל מעלה שומן, ממתיק לא
    משנה את השומן, ואגוזים מוסיפים שומן ואלרגנים משלהם.
