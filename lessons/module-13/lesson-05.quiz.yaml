- id: q1
  question: >-
    שותפה בעסק כתבה פוסט לאינסטגרם: "הדיסקיות החדשות שלנו מחזקות את הלב ומתאימות לסוכרתיים". היא
    טוענת שזה לא על האריזה ולכן מותר. מה נכון?
  options:
    - >-
      מותר, כי סעיף 13 לחוק המזון חל רק על סימון המוצר עצמו ולא על רשתות חברתיות.
    - >-
      מותר אם מוסיפים בסוף הפוסט "אין לראות בזה המלצה רפואית", כי ההסתייגות מבטלת את הטענה.
    - >-
      אסור, כי סעיף 13 חל על סימון ועל פרסום, ושני המשפטים מייחסים למזון השפעה על הגוף ועל מחלה.
    - >-
      אסור רק את "מחזקות את הלב", כי "מתאימות לסוכרתיים" הוא תיאור של קהל יעד ולא טענה.
  correct: 2
  explanation: >-
    סעיף 13 אוסר לייחס למזון חיזוק או ריפוי, או מניעה וטיפול במחלה, "בדרך של סימון או פרסום".
    "מתאים לסוכרתיים" רומז על השפעה על מחלה. במקום זה כותבים עובדות: הממתיק, משקל, סוכר ביחידה.
- id: q2
  question: >-
    אתם בונים טבלה תזונתית לדיסקיות מריר עם מלטיטול. באיזו שורה נכנס המלטיטול?
  options:
    - >-
      בשורת הסוכרים, כי הוא ממתיק ולכן נספר יחד עם כל מה שנותן מתיקות למוצר.
    - >-
      בשורה נפרדת "רב כהליים (גרם)", שנכללת בפחמימות אבל לא בסוכרים.
    - >-
      לא נכנס לטבלה בכלל, כי תוספי מזון מופיעים רק ברשימת הרכיבים ולא בערכים התזונתיים.
    - >-
      בשורת הסיבים התזונתיים, כי רובו לא נספג ולכן הוא מתנהג כמו סיב במעי.
  correct: 1
  explanation: >-
    לפי תקנות הסימון התזונתי, "סוכרים" לא כוללים רב־כוהלים, אבל "פחמימות" כן. רב־כוהלים מופיעים
    בשורה נפרדת כשיש מהם 0.5 גרם ל־100 גרם ומעלה, ונספרים כ־2.4 קק"ל לגרם (אריתריטול כאפס).
- id: q3
  question: >-
    על כדורי תמרים, קקאו וטחינה רוצים לכתוב "ללא תוספת סוכר", כי לא הוסיפו סוכר לבן. לפי ההגדרה
    האירופית שבשיעור, מה התשובה?
  options:
    - >-
      מותר, כי תמרים הם פרי שלם, וסוכר של פרי שלם אף פעם לא נחשב תוספת סוכר.
    - >-
      מותר אם כתוב גם "מכיל סוכרים טבעיים", כי המשפט הזה פותר כל מוצר עם פירות.
    - >-
      מותר רק אם יש בכדורים פחות מ־5 גרם סוכרים ל־100 גרם, כמו בטענת "דל סוכרים".
    - >-
      אסור, כי התמרים הוכנסו בגלל המתיקות שלהם, וזה בדיוק "מזון שמשמש למתיקות".
  correct: 3
  explanation: >-
    לפי 1924/2006, "ללא תוספת סוכרים" דורש שלא הוסיפו סוכרים או כל מזון אחר שמשמש בגלל המתיקות
    שלו. תמרים, סילאן ודבש נכנסים להגדרה. כותבים "ממותק בתמרים" ומפרטים את הסוכר בטבלה.
- id: q4
  question: >-
    מוכרים טבלאות מריר עם מלטיטול, ובבדיקה שלכם לא מצאתם תקנה ישראלית שמחייבת אזהרה על שוקולד. מה
    עושים?
  options:
    - >-
      כותבים אזהרת אפקט משלשל בכל מקרה, ובודקים את הכלל הנוכחי מול לשכת הבריאות.
    - >-
      לא כותבים אזהרה, כי כל מה שלא נאמר במפורש בתקנות אסור לכתוב על התווית.
    - >-
      כותבים "מתאים לכל המשפחה" כדי לאזן, כי אזהרה לבדה מרתיעה לקוחות מהמוצר.
    - >-
      מחליפים את המלטיטול בסוכר ומשאירים "ללא תוספת סוכר" על האריזות הקיימות.
  correct: 0
  explanation: >-
    באיחוד האירופי מזון עם יותר מ־10% רב־כוהלים מוספים חייב באזהרה, וישראל צפויה לאמץ את הכללים
    האלה. מלטיטול גורם לגזים ולשלשול בכמות ולא מתאים לילדים בכמויות, ולכן כותבים ובודקים.
