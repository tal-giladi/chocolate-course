- id: q1
  question: >-
    חברה קנתה שק פולי קקאו גולמיים ורוצה להכין מהם "שוקולד גולמי" בבית, בלי לעבור 42°C, ולחלק
    במסיבה. מה אומרים לה?
  options:
    - >-
      שזה בסדר אם שוטפים את הפולים היטב במים חמים לפני הטחינה, כי הסלמונלה נמצאת רק על הקליפה.
    - >-
      שזה בסדר כל עוד מגישים מיד ולא שומרים, כי סלמונלה בשוקולד מתרבה רק אחרי כמה ימים בחדר.
    - >-
      שלא כדאי: בלי קלייה אין שלב שמשמיד סלמונלה, והיא שורדת בשוקולד חודשים ובמעט תאים מספיקה.
    - >-
      שזה בסדר אם מחממים ל־50°C במקום 42°C, כי בחום הזה כבר אין חיידקים שיכולים לשרוד בשוקולד.
  correct: 2
  explanation: >-
    לפי ה־NCA, קלייה היא הדרך העיקרית להשמיד חיידקים בקקאו, וקקאו גולמי נחשב מזוהם בפוטנציה. לפי
    Finn ושות', סלמונלה שורדת בשוקולד עד 19 חודשים, עמידה יותר לחום בשומן, ומעט תאים מספיקים.
    גם התסיסה בחווה מגיעה ל־51.7°C בלי להשמיד פתוגנים.
- id: q2
  question: >-
    לקוח שואל אם כדורי תמרים וקקאו של 15 גרם "בלי סוכר" במקום דיסקית מריר 70% של 10 גרם. לפי
    החישוב בשיעור, מה נכון?
  options:
    - >-
      בכדור כ־6 גרם סוכר מהתמרים, יותר מכ־2.4 גרם בדיסקית, כי תמרים הם בערך שני שלישים סוכר.
    - >-
      בכדור אין סוכר בכלל, כי סוכר של פרי לא נספר בטבלה התזונתית כסוכר אלא כסיבים תזונתיים.
    - >-
      בכדור ובדיסקית יש בערך אותה כמות, כי הקקאו בכדור מנטרל חלק מהסוכר שבתמרים.
    - >-
      בכדור כ־1 גרם סוכר בלבד, כי רוב המשקל של התמר הוא מים ולא סוכר.
  correct: 0
  explanation: >-
    לפי USDA, בתמרי דגלת נור 63 גרם סוכרים ו־20.5 גרם מים ל־100 גרם. ב־150 גרם עיסה יש כ־63 גרם
    סוכר, כלומר כ־6.3 גרם בכדור של 15 גרם. "ממותק בתמרים" הוא לא "בלי סוכר".
- id: q3
  question: >-
    המסתם 100 גרם מריר והוספתם שתי כפות סילאן כדי להמתיק. השוקולד הפך לגוש סמיך ומט. מה עושים?
  options:
    - >-
      מחממים חזק במיקרוגל עד שהגוש נמס שוב, ואז השוקולד חוזר למצבו ואפשר לטמפר אותו.
    - >-
      מוסיפים עוד שוקולד מומס בהדרגה, עד שהסילאן מתפזר בו ואפשר לטמפר אותו כרגיל.
    - >-
      זורקים, כי שוקולד שנתפס ממים לא חוזר לשום שימוש ועדיף לא לבזבז עליו עוד חומרים.
    - >-
      מוסיפים שמנת חמה או קרם קוקוס חם בכמה מנות, והופכים את התערובת לרוטב או לגנאש.
  correct: 3
  explanation: >-
    הסילאן הביא מעט מים, ומעט מים תופסים שוקולד (02.1). הרבה נוזל מציל אותו כאמולסיה: רוטב או
    גנאש. חימום לא מוציא את המים, ושוקולד שנתפס כבר לא מתאים לטמפרור.
- id: q4
  question: >-
    הכנתם כדורי תמרים וטחינה לסדנה ביום שישי, ושואלים אתכם כמה זמן הם מחזיקים. מה התשובה שאפשר
    לעמוד מאחוריה בלי מדידה?
  options:
    - >-
      חודש בחדר, כי בתמרים יש כל כך הרבה סוכר שאף חיידק או עובש לא יכול לגדול בהם.
    - >-
      קופסה סגורה במקרר ותוך שבוע, כי פירות יבשים יושבים קרוב לגבול שבו עובשים עוד גדלים.
    - >-
      יומיים בלבד במקרר, כי טחינה מתקלקלת מהר בכל מצב ולכן היא קובעת את התאריך.
    - >-
      שנה במקפיא בלי לסמן, כי במקפיא אין צורך בתאריך או ברשימת אלרגנים על הקופסה.
  correct: 1
  explanation: >-
    לפי Kansas State, פירות יבשים יושבים בכ־0.60-0.65 פעילות מים, ועובשים ושמרים מסוימים גדלים עד
    כ־0.61. בלי מדידה בוחרים כלל שמרני: מקרר, קופסה סגורה ושבוע, ומסמנים תאריך ואלרגנים.
