- id: q1
  question: >-
    בצילום של סביבון מריר יש נקודת בוהק לבנה ושרופה. מה הכי סביר לעשות?
  options:
    - >-
      להפעיל את הפלאש של הטלפון, כדי למלא את הצד הכהה של הסביבון.
    - >-
      לפזר את אור החלון בנייר אפייה, ולשנות מעט את הזווית.
    - >-
      להעביר את המארז לשמש ישירה, כדי שיהיה יותר אור בסך הכול.
    - >-
      להוריד את החשיפה עד שהרקע הלבן נראה אפור, ולהשאיר כך.
  correct: 1
  explanation: >-
    שוקולד מטומפר מבריק כמו מראה. אור קטן וחזק נותן בוהק שרוף, ואור גדול ומפוזר נותן ברק רך. Shopify
    ממליצים לרכך שמש במפזר ולכבות את הפלאש.
- id: q2
  question: >-
    הסביבונים חיכו במקרר לצילום. מה עושים לפני שמצלמים אותם?
  options:
    - >-
      פותחים את הקופסה מיד ומצלמים מהר, לפני שהשוקולד מתרכך.
    - >-
      מנגבים אותם במגבת נייר אחרי שהוצאו, כדי להסיר את הלחות.
    - >-
      מחכים שהקופסה הסגורה תגיע לטמפרטורת החדר, ורק אז פותחים.
    - >-
      מחממים אותם רגע במייבש שיער, כדי להחזיר את הברק לפני הצילום.
  correct: 2
  explanation: >-
    Callebaut ממליצים לפתוח רק אחרי שהאריזה חזרה לטמפרטורת החדר. פתיחה קרה גורמת לעיבוי ולפריחת סוכר,
    שנראים בתמונה ככתמים לבנים מחוספסים.
- id: q3
  question: >-
    איזה מהמארזים הבאים מתאים לצילום הראשי בדף המוצר?
  options:
    - >-
      מארז מאצווה רגילה, כמו שהלקוח יקבל, אחרי בדיקת ברק וטביעות.
    - >-
      המארז הכי יפה שיצא פעם, גם אם רוב המארזים פחות מדויקים.
    - >-
      מארז של מתחרה שנראה דומה, כי הצילום שלו כבר מקצועי.
    - >-
      מארז שצולם עם פריחה ותוקן בעריכה, כדי לא לבזבז אצווה.
  correct: 0
  explanation: >-
    התמונה היא הבטחה. חוק המזון אוסר תיאור "בהצגה אחרת של מידע" שלא תואם את המזון, וחוק הגנת הצרכן
    אוסר מצג מטעה. מצלמים מה שהלקוח יקבל, ומתקנים בעריכה רק אור וצבע.
- id: q4
  question: >-
    למה ברשימת הצילומים יש צילום נפרד של התווית?
  options:
    - >-
      כי בלי צילום של התווית הפלטפורמה לא מאשרת מוצרי מזון.
    - >-
      כדי שיהיה תיעוד לביטוח אם המארז נשבר במשלוח.
    - >-
      כי התווית היא החלק המעוצב ביותר במארז, והיא מוכרת.
    - >-
      כדי שלקוח עם אלרגיה יראה רכיבים ואלרגנים לפני הקנייה.
  correct: 3
  explanation: >-
    בקנייה אונליין הלקוח לא מחזיק את הקופסה. מידע על אלרגנים צריך להיות זמין לפני הקנייה, לא רק
    בקופסה שהגיעה (16.2).
- id: q5
  question: >-
    כל תמונה בחנות נראית בצבע אחר ובגודל אחר, למרות שכולן צולמו ליד אותו חלון. מה עוזר הכי הרבה?
  options:
    - >-
      לצלם כל מוצר בשעה אחרת, כדי לקבל מגוון של אור.
    - >-
      להשתמש בזום דיגיטלי כדי שכל המוצרים ייראו באותו גודל.
    - >-
      חצובה קבועה, הגדרות נעולות, ואותן הגדרות עריכה לכל התמונות.
    - >-
      לבחור פילטר צבעוני חזק שמסתיר את ההבדלים בין התמונות.
  correct: 2
  explanation: >-
    Shopify ממליצים על טלפון קבוע וחצובה, נעילת איזון לבן וחשיפה, ושמירת הגדרות עריכה כתבנית. זום
    דיגיטלי מוריד איכות, ופילטר חזק מרחיק את התמונה מהמוצר האמיתי.
