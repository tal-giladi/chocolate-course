- id: q1
  question: >-
    אתם רוצים לכתוב על מארז טראפלס שמנת "3 שבועות מחוץ למקרר". מה הצעד הנכון לפני שכותבים את זה?
  options:
    - >-
      לשמור מארז אחד שבועיים על השיש, ואם לא נראה עובש, לכתוב 3 שבועות.
    - >-
      להעתיק את התאריך מאריזת השוקולד, כי הוא הרכיב העיקרי בטראפלס.
    - >-
      לכתוב את התאריך, כי לפי החוק רק מוצר תעשייתי צריך לעמוד מאחוריו.
    - >-
      למדוד aw במעבדה, ואז לעשות ניסוי באורך מלא לפני שכותבים תאריך.
  correct: 3
  explanation: >-
    בטראפלס שמנת יש מים חופשיים (aw כ־0.88), ולכן השאלה היא קודם כול בטיחות. Callebaut כותבים שאף
    מדידה אחת לא מנבאת לבד, ושמבטיחים חיי מדף רק אחרי ניסוי באורך מלא. סעיף 12 חל על כל יצרן.
- id: q2
  question: >-
    מה מסיים בדרך כלל את חיי המדף של מארז סביבוני שוקולד מוצק בלי מילוי?
  options:
    - >-
      פריחה, ספיגת ריחות ואיבוד ברק, כלומר איכות ולא בטיחות.
    - >-
      סלמונלה שגדלה בשוקולד אחרי חודש בטמפרטורת החדר.
    - >-
      עובש שמתחיל לגדול אחרי שבועיים, כמו בטראפלס שמנת.
    - >-
      התייבשות של המילוי, שמשנה את המרקם והופך אותו לחולי.
  correct: 0
  explanation: >-
    בשוקולד מוצק כמעט אין מים חופשיים (מתחת ל־0.60 כמעט שום דבר לא גדל), ולכן מה שנגמר הוא איכות:
    ברק, סנאפ, ריח וטעם. בסביבונים אין מילוי.
- id: q3
  question: >-
    בניסוי חיי מדף פתחתם ביום 30 את אותו סביבון שבדקתם ביום 0, ועטפתם אותו שוב. מה הבעיה?
  options:
    - >-
      אין בעיה, כל עוד הסביבון חזר לאותה קופסה ולאותו מקום אחסון.
    - >-
      היחידה נחשפה לאוויר ולידיים; בכל נקודה פותחים יחידה חדשה.
    - >-
      סביבון שנפתח פעם אחת חייב לעבור למקרר עד סוף הניסוי.
    - >-
      הבעיה רק בתמונה: צריך לצלם את הסביבון מאותה זווית בכל פעם.
  correct: 1
  explanation: >-
    הניסוי בודק מה יקבל לקוח שפותח מארז סגור. יחידה שנפתחה כבר לא מייצגת את זה, ולכן מכינים מראש
    יחידה סגורה לכל נקודה ולכל תנאי.
- id: q4
  question: >-
    המדחום במחסן רשם מקסימום של 27°C אחר הצהריים, למרות שהמזגן מכוון ל־18°C. מה המשמעות לניסוי?
  options:
    - >-
      אין משמעות: מה שקובע הוא הטמפרטורה שהמזגן מכוון אליה.
    - >-
      צריך להעביר את הדגימות למקרר עד שהמזגן יתוקן, ולהמשיך שם.
    - >-
      מתייחסים לניסוי כאילו נעשה בחום, ומעבירים את המחסן למקום קבוע יותר.
    - >-
      מוסיפים יום לכל נקודת בדיקה, כדי לפצות על השעות החמות.
  correct: 2
  explanation: >-
    Callebaut ממליצים על טמפרטורה קבועה (18-20°C למוצרים מוגמרים); תנודות מאיצות פריחה. מקרר לא
    מומלץ לממתקים בגלל הלחות. התוצאה צריכה לשקף את התנאים שבאמת היו.
- id: q5
  question: >-
    גנאש בסיס נמדד במעבדה ב־aw 0.800 והחזיק 60 יום בניסוי. אתם רוצים ממנו שלושה טעמים. מה סביר?
  options:
    - >-
      כל טעם חדש מחייב מתכון בסיס חדש, כי טעם משנה את חיי המדף לגמרי.
    - >-
      אפשר להוסיף פרי טרי לטעם, כי aw של הבסיס כבר נמדד ונמוך מספיק.
    - >-
      אפשר להאריך ל־90 יום, כי שלושה טעמים הם שלוש אצוות קטנות יותר.
    - >-
      שינויי טעם קטנים על אותו בסיס, שנשקל בדיוק, צפויים להתנהג דומה.
  correct: 3
  explanation: >-
    Callebaut מתארים שגנאשים עם אותו aw החזיקו דומה, ולכן הרבה שוקולטיירים עובדים עם שניים-שלושה
    מתכוני בסיס. פרי טרי מוסיף מים ומשנה את ה־aw, וזה כבר מוצר חדש.
