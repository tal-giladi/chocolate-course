- id: q1
  question: >-
    אתם עומדים להזמין 500 קופסאות מודפסות. מה מהרשימה הכי נכון להדפיס ישירות על הקרטון?
  options:
    - >-
      רשימת הרכיבים והאלרגנים, כי הם לא משתנים בין מארז למארז.
    - >-
      את הלוגו ואת שם העסק, שכמעט אף פעם לא משתנים.
    - >-
      את התאריך ואת מספר האצווה, כדי לחסוך מדבקה בכל מארז.
    - >-
      את הטבלה התזונתית, כי היא מחושבת פעם אחת לכל מוצר.
  correct: 1
  explanation: >-
    מה שמודפס על הקופסה ננעל עד שהמלאי נגמר. רכיבים וטבלה משתנים כשמשתנה ספק או מתכון, ותאריך משתנה
    בכל אצווה. לכן על הקרטון רק המיתוג הקבוע, והשאר במדבקות.
- id: q2
  question: >-
    המכסה של המארז 101 סמ"ר. מה הקוטר המזערי של כל סמל אדום?
  options:
    - >-
      15 מ"מ, כי זה הקוטר הקטן ביותר שמופיע בתקנות.
    - >-
      20 מ"מ, כי המכסה הוא בערך 100 סמ"ר ואפשר לעגל.
    - >-
      25 מ"מ, כי השטח מעל 100 ועד 200 סמ"ר.
    - >-
      35 מ"מ, כי בקופסת מתנה תמיד משתמשים בגודל הגדול.
  correct: 2
  explanation: >-
    לפי תקנות הסימון התזונתי: מעל 60 ועד 100 סמ"ר, 20 מ"מ; מעל 100 ועד 200, 25 מ"מ. 101 סמ"ר נמצא
    בטווח השני. לכן מודדים את המכסה לפני שמעצבים.
- id: q3
  question: >-
    בהדפסת ניסיון ביתית הסמל יצא 18 מ"מ, למרות שבקובץ הוא 21 מ"מ. מה הסיבה הסבירה?
  options:
    - >-
      ההדפסה נעשתה עם "התאמה לעמוד" ולא ב־100%.
    - >-
      המדפסת הביתית לא מדפיסה צבע אדום בגודל מלא.
    - >-
      דפי מדבקות מתכווצים תמיד בכ־15% אחרי ההדפסה.
    - >-
      הסרגל לא מדויק, ולכן מודדים רק בתוכנת העיצוב.
  correct: 0
  explanation: >-
    "התאמה לעמוד" מקטינה את כל ההדפסה. מדפיסים ב־100% ומודדים את ההדפסה עצמה, עם קו של 100 מ"מ
    בשוליים לבדיקת קנה מידה.
- id: q4
  question: >-
    איזו מדפסת תוויות מתאימה פחות לתאריך על מוצר שיושב חצי שנה במחסן ונשלח בקיץ?
  options:
    - >-
      מדפסת העברה תרמית, שמעבירה צבע מסרט לתווית.
    - >-
      בית דפוס דיגיטלי שמדפיס מדבקות בגליל לפי קובץ.
    - >-
      מדפסת לייזר ביתית על דפי מדבקות A4 שמתאימים לה.
    - >-
      מדפסת תרמית ישירה, על נייר רגיש לחום ובלי דיו.
  correct: 3
  explanation: >-
    הדפוס התרמי הישיר דוהה בחום ובאור; לפי Barcodes Australia הוא מחזיק כ־6-9 חודשים, לפי הסביבה.
    לתאריך שצריך להחזיק זמן רב ובחום, העברה תרמית או מדבקה מודפסת עמידות יותר.
- id: q5
  question: >-
    המעצבת מציעה עלה ירוק גדול ואת המילה "טבעי" על מארז שיש עליו שני סמלים אדומים. מה הבעיה?
  options:
    - >-
      אין בעיה, כל עוד המילה "טבעי" לא מופיעה ברשימת הרכיבים.
    - >-
      ירוק אסור על אריזות שוקולד, כי הוא שמור לסמל הירוק הרשמי.
    - >-
      העיצוב רומז שהמוצר בריא, וחוק המזון אוסר הטעיה גם בהצגה.
    - >-
      הבעיה רק בגודל: עלה גדול יכול להסתיר את הסמלים האדומים.
  correct: 2
  explanation: >-
    סעיף 17 לחוק המזון אוסר הטעיה גם בהצגה ולא רק במילים. אם יש קו עם פחות סוכר, מראים את זה במספרים
    בטבלה ובאחוז הקקאו, לא בסמלים שרומזים לבריאות.
