- id: q1
  question: >-
    במארז סביבונים יש שוקולד חלב שבמפרט שלו כתוב "תמצית לתת שעורה" (0.3%). מה כותבים על התווית?
  options:
    - >-
      לא כותבים כלום, כי 0.3% היא כמות קטנה מדי כדי להיחשב אלרגן.
    - >-
      כותבים "ללא גלוטן", כי שוקולד בדרך כלל לא מכיל דגנים בכלל.
    - >-
      מדגישים את המילה "שעורה" בתוך רשימת הרכיבים של שוקולד החלב.
    - >-
      מוסיפים "עלול להכיל גלוטן" בסוף, כי זה רק רכיב של רכיב.
  correct: 2
  explanation: >-
    שעורה היא דגן עם גלוטן, והיא רכיב במוצר, לא שארית אפשרית. לפי שיטת 2028 מדגישים את שם הדגן בתוך
    רשימת הרכיבים. "עלול להכיל" מיועד לשאריות לא מכוונות, ו"ללא גלוטן" כאן הוא טעות מסוכנת.
- id: q2
  question: >-
    ל־100 גרם במארז: 40.9 גרם סוכרים, 25 גרם שומן רווי, 37 מ"ג נתרן. המכסה 20×5 ס"מ. מה מופיע בחזית?
  options:
    - >-
      שני סמלים אדומים, סוכר ושומן רווי, בקוטר 20 מ"מ לפחות.
    - >-
      שלושה סמלים אדומים, סוכר, שומן רווי ונתרן, בקוטר 15 מ"מ.
    - >-
      סמל אחד לסוכר בלבד, כי שומן מקקאו הוא שומן טבעי ופטור.
    - >-
      אין סמלים, כי מוצר בעבודת יד פטור מהם בתקנות הישראליות.
  correct: 0
  explanation: >-
    הספים למזון מוצק הם 10 גרם סוכרים, 4 גרם שומן רווי ו־400 מ"ג נתרן ל־100 גרם. שניים עוברים. המכסה
    100 סמ"ר, בטווח "מעל 60 ועד 100", ולכן הקוטר 20 מ"מ לפחות. לא נמצא בתקנות פטור ליצרן קטן.
- id: q3
  question: >-
    קופסה לטראפלס אחד, עם חזית של 4×4 ס"מ. מה נכון לגבי הסימון התזונתי שלה?
  options:
    - >-
      היא פטורה גם מהסמלים וגם מהטבלה, כי היא קטנה מ־25 סמ"ר.
    - >-
      היא צריכה סמלים בקוטר 15 מ"מ, אבל לא טבלה תזונתית.
    - >-
      היא צריכה רק את כפיות הסוכר, בלי שאר שורות הטבלה.
    - >-
      היא פטורה מהסמלים האדומים, אבל לא מהטבלה התזונתית.
  correct: 3
  explanation: >-
    16 סמ"ר הם פחות מ־25 סמ"ר, ולכן הסמלים לא חלים (תקנה 6). הפטור הזה הוא רק מהסמלים, לא מהטבלה
    התזונתית.
- id: q4
  question: >-
    על מה בונים את רשימת הרכיבים ואת "עלול להכיל" לשוקולד שבמארז?
  options:
    - >-
      על מה שבדרך כלל יש בקוברטורה, למשל לציטין סויה, כדי לחסוך זמן.
    - >-
      על המפרט או האריזה של השקית שנכנסה למוצר, וכל שקית חדשה נבדקת מחדש.
    - >-
      על התווית שהדפסתם בעונה הקודמת, כל עוד הספק נשאר אותו ספק.
    - >-
      על אתר החנות שבה קניתם, כי החנות אחראית על הרכיבים שהיא מוכרת.
  correct: 1
  explanation: >-
    שלוש הקוברטורות בשיעור משתמשות בלציטין חמניות, לא סויה. מותג או גרסה אחרים יכולים להיות שונים,
    ולכן כותבים מהמפרט של השקית שבאמת נכנסה למוצר.
- id: q5
  question: >-
    מה המצב של כללי הסימון האירופיים (תקנה 1169/2011) בישראל, לפי מה שנבדק ב־10.11.2026?
  options:
    - >-
      הם חובה מאז 1.1.2025, ותווית לפי ת"י 1145 כבר אסורה בשיווק.
    - >-
      ישראל דחתה אותם, ות"י 1145 יישאר הכלל היחיד גם אחרי 2028.
    - >-
      טיוטה: וולונטרי מ־1.1.2025 וחובה מ־1.1.2028; לא אומת שאושרה.
    - >-
      הם חלים רק על יבואנים, ויצרן מקומי ממשיך לפי ת"י 1145 לתמיד.
  correct: 2
  explanation: >-
    לפי Freyr (22.7.2026), טיוטת צו מחליפה את ההפניות לת"י 1145 בתקנה האירופית: וולונטרי מ־2025, חובה
    מ־2028, ומוצרים שיוצרו לפני כן נמכרים עד תום חיי המדף. זו טיוטה, ולכן בודקים שוב לפני הדפסה.
